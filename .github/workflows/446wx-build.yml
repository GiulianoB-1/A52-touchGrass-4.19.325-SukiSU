name: Phase 452 workflow syntax validation
on:
  push:
    branches:
      - agent/a52-phase447-big-merge-off-v1
jobs:
  validate:
    name: actionlint candidate only
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate full Phase452 workflow definition
        run: |
          set -Eeuo pipefail
          curl -fLsS --retry 3 -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tgz actionlint
          chmod +x actionlint
          ./actionlint -shellcheck= ci/phase452-workflow-candidate.yml
