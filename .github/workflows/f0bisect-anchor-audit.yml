name: F0-BISECT standalone patch anchor audit
on:
  push:
    branches: [agent/a52-f0bisect-gki-p6-v1]
    paths: [.github/workflows/f0bisect-anchor-audit.yml, scripts/f0_bisect_stage_guard.py.z64, scripts/f0_bisect_stage_guard.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch-test on actual failed GKI source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/f0-art /tmp/f0-sandbox/drivers/a52_display/msm/dsi
          gh run download 38068442691 --repo "$GITHUB_REPOSITORY" \
            --name A52XQ-F0BISECT-GKI-P6-FAIL-DIAG-3 \
            --dir /tmp/f0-art
          src="$(find /tmp/f0-art -path '*/drivers/a52_display/msm/dsi/dsi_display.c' | head -1)"
          test -n "$src" && test -s "$src"
          cp "$src" /tmp/f0-sandbox/drivers/a52_display/msm/dsi/dsi_display.c
          python3 scripts/f0_bisect_stage_guard.py --root /tmp/f0-sandbox --mode gki --active-stage 6
          python3 scripts/f0_bisect_stage_guard.py --root /tmp/f0-sandbox --mode gki --active-stage 6 --check-only
          echo "PASS: all P1-P6 hooks applied on exact failed GKI effective display source"
      - name: Reveal compiled probe anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib,base64
          t=zlib.decompress(base64.b64decode(Path('scripts/f0_bisect_stage_guard.py.z64').read_text().strip())).decode()
          a=t.splitlines()
          print('EXPANDED SOURCE TOTAL LINES',len(a))
          for i,x in enumerate(a):
              if any(n in x for n in ('static int f0b_', 'static void f0b_', 'F0B ACTIVE', 'CLK_STATUS', 'fail_mask', '0x2343', 'BIT(23)', 'f0b_probe(', 'def patch_display','def once(')):
                  print('--- window at',i+1,'---')
                  for j in range(max(0,i-8), min(len(a),i+60)):
                      print(f'{j+1}: {a[j]}')
          PY
