name: 272 - A52 DRM vendor mode-flag parity

run-name: Phase 272 - DRM vendor mode-flag parity fix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase272-drm-vendor-mode-flag-parity-v1
    paths:
      - .github/workflows/272-a52-drm-vendor-mode-flag-parity.yml
      - scripts/272_ci_build.sh
      - scripts/272_probe_drm_flag_parity.py
      - scripts/272_drm_vendor_mode_flag_parity.py
      - scripts/271_ci_build.sh
      - scripts/271_drm_mode_validation_observer.py
      - scripts/271b_broad_zero_state_observer.py
      - scripts/270_ci_build.sh
      - scripts/270_phase269_msm_legacy_force_probe.py
      - scripts/269_ci_build.sh
      - scripts/269_phase268_composer_drm_uapi.py
      - scripts/269b_exact_composer_tgid.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-phase272-drm-vendor-mode-flag-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE266_BASE_SHA: b279c8beb1ae4f032a7dfe0c22cd69dbb1756398
  PHASE267_HW_SHA: f1c2f2b7f4430b0bfbc0f4acd7f43adf637edf27

jobs:
  build:
    name: Reconstruct Phase271 and build Phase272 DRM flag parity candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out Phase272 branch
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves

      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Reconstruct, patch, compile and repack Phase272
        run: bash scripts/272_ci_build.sh

      - name: Upload Phase272 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase272-DRM-VENDOR-MODE-FLAG-PARITY-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase272-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase272 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase272-FAILURE-DIAGNOSTICS-${{ github.run_number }}
          path: |
            phase272-failure/
            phase271-failure/
            phase270-failure/
            phase269-failure/
            phase268-failure/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
