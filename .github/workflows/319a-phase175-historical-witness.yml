name: 319a - Phase175 historical blob witness

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase319-gki-dsi-sixpoint-temporal-observer-v1
    paths:
      - .github/workflows/319a-phase175-historical-witness.yml

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode retained historical patches
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p177
          for f in scripts/177_patch_payload_chunks/*.txt; do
            tr -d '\r\n' < "$f" > "/tmp/p177/$(basename "$f")"
          done
          cat /tmp/p177/*.txt | base64 --decode | gzip -dc > /tmp/phase177.patch
          printf '%s  %s\n' 9412b28da19c71e7bc97e767e83ce717e146313d32321c7429e6d4050a4f0d00 /tmp/phase177.patch | sha256sum -c -
          tr -d '\r\n' < scripts/179_payloads/patch.gz.b64 | base64 --decode | gzip -dc > /tmp/phase179.patch
          printf '%s  %s\n' 81bc17510b643274dba9652baa5edf52e9c2127af02a77eb1597637be0c3c59f /tmp/phase179.patch | sha256sum -c -
      - name: Print historical preimage witnesses and drift hunks
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def blocks(path):
              text = Path(path).read_text(errors='replace')
              for block in re.split(r'(?=^diff --git )', text, flags=re.M):
                  m = re.match(r'diff --git a/(.*?) b/(.*?)\n', block)
                  if not m:
                      continue
                  idx = re.search(r'^index ([0-9a-f]+)\.\.([0-9a-f]+)(?: \d+)?$', block, re.M)
                  yield m.group(2), idx.groups() if idx else None, block

          for phase, path in ((177, '/tmp/phase177.patch'), (179, '/tmp/phase179.patch')):
              print(f'PHASE{phase}_WITNESS_BEGIN')
              for name, idx, block in blocks(path):
                  if idx:
                      print(f'{name}\t{idx[0]}\t{idx[1]}')
              print(f'PHASE{phase}_WITNESS_END')

          targets = {
              'drivers/a52_display/msm/sde/sde_crtc.c',
              'drivers/a52_display/msm/sde/sde_encoder.c',
          }
          for name, idx, block in blocks('/tmp/phase179.patch'):
              if name in targets:
                  print(f'HISTORICAL_DRIFT_BLOCK_BEGIN {name}')
                  print(block, end='' if block.endswith('\n') else '\n')
                  print(f'HISTORICAL_DRIFT_BLOCK_END {name}')
          PY
      - name: Decode exact Run32 secondary SDE transforms
        run: |
          set -Eeuo pipefail
          git fetch --depth=1 origin a51d9b5107821176950cb9a235ba953b95cd6e7c
          git show FETCH_HEAD:scripts/115_apply_a52xq_secondary_compat.py > /tmp/115-secondary.py
          git show FETCH_HEAD:scripts/123_apply_a52xq_legacy_ion_free_compat.py > /tmp/123.py
          python3 - <<'PY'
          import ast, base64, re, zlib
          from pathlib import Path
          src = Path('/tmp/115-secondary.py').read_text()
          tree = ast.parse(src)
          payload = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '_PAYLOAD' for t in node.targets):
                  payload = ast.literal_eval(node.value)
                  break
          if payload is None:
              raise SystemExit('secondary payload literal not found')
          decoded = zlib.decompress(base64.b85decode(payload)).decode()
          print('RUN32_115_SECONDARY_SDE_BEGIN')
          lines = decoded.splitlines()
          for i, line in enumerate(lines):
              if 'sde_crtc' in line or 'sde_encoder' in line:
                  lo=max(0,i-8); hi=min(len(lines),i+28)
                  print(f'--- lines {lo+1}-{hi} ---')
                  print('\n'.join(lines[lo:hi]))
          print('RUN32_115_SECONDARY_SDE_END')
          text123 = Path('/tmp/123.py').read_text()
          print('RUN32_123_SDE_BEGIN')
          for i, line in enumerate(text123.splitlines()):
              if 'sde_crtc' in line or 'sde_encoder' in line:
                  lines123=text123.splitlines(); lo=max(0,i-8); hi=min(len(lines123),i+28)
                  print(f'--- lines {lo+1}-{hi} ---')
                  print('\n'.join(lines123[lo:hi]))
          print('RUN32_123_SDE_END')
          PY
