name: Phase427 - CB2 handoff + road-to-memory probe
run-name: Phase427 - CB2 handoff + road-to-memory probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase378-gki-ufs-completion-flight-recorder-v1
    paths:
      - .github/workflows/414-a52-sequential-3m-recorder.yml
      - .github/workflows/415-a52-mdss-gdsc-hwctrl-parity.yml
      - .github/workflows/416-a52-sequential-3m-disk-persist-v2.yml
      - .github/workflows/417-a52-postbind-frontier.yml
      - .github/workflows/418-a52-atomic-present-discriminator.yml
      - .github/workflows/419-a52-umode-vrefresh-parity.yml
      - .github/workflows/420-a52-umode-roundtrip-vrefresh-parity.yml
      - .github/workflows/421-a52-fetch-memory-survival.yml
      - .github/workflows/422-a52-display-smmu-fault-probe.yml
      - .github/workflows/423-a52-rpmh-solver-mode-compat.yml
      - .github/workflows/424-a52-paired-hw-snapshot.yml
      - .github/workflows/425-a52-reboot-origin-recorder.yml
      - .github/workflows/426-a52-smmu-stream-handoff-probe.yml
      - .github/workflows/427-a52-cb2-handoff-road-probe.yml
      - .github/workflows/411-a52-fifo-panic-smmu.yml
      - .github/workflows/409-a52-ram1m-debug2m-dsi.yml
      - .github/workflows/408-a52-direct-bio-samsung-dsi.yml
      - .github/workflows/407-a52-samsung-debug-dsi.yml
      - .github/workflows/406-a52-persistent-memory-dma.yml
      - .github/workflows/405-a52-stable-memory-dma.yml
      - .github/workflows/403-a52-dsi-nohlt-retire-ufs-sampler.yml
      - .github/workflows/402-a52-dsi-nohlt-clean.yml
      - scripts/402_apply_dsi_nohlt_cleanup.py
      - scripts/403_apply_retire_phase380_ufs_sampler.py
      - scripts/405_apply_dma_done_direct.py
      - scripts/406_apply_p392_cache_persist.py
      - scripts/407_apply_samsung_debug_dsi.py
      - scripts/408_apply_direct_bio_debug_dsi.py
      - scripts/409_apply_ram1m_debug2m_dsi.py
      - scripts/411_apply_fifo_panic_smmu_experiment.py
      - scripts/413_apply_concurrent_debug2m_mirror.py
      - scripts/414_apply_sequential_3m_recorder.py
      - scripts/415_apply_mdss_gdsc_hwctrl_parity.py
      - scripts/416_apply_sequential_3m_disk_persistence_v2.py
      - scripts/417_apply_postbind_frontier.py
      - scripts/418_apply_atomic_present_discriminator.py
      - scripts/419_apply_umode_vrefresh_parity.py
      - scripts/420_apply_umode_roundtrip_vrefresh_parity.py
      - scripts/421_apply_fetch_memory_survival.py
      - scripts/422_apply_display_smmu_fault_probe.py
      - scripts/423_apply_rpmh_solver_mode_compat.py
      - scripts/424_apply_gki_paired_hw_snapshot.py
      - scripts/425_apply_reboot_origin_recorder.py
      - scripts/426_apply_smmu_stream_handoff_probe.py
      - scripts/427_apply_cb2_handoff_road_probe.py
      - scripts/427_parts/**
      - scripts/decode_phase422_smmu_fault.py
      - scripts/decode_phase421_survival.py
      - scripts/decode_phase414_sequential_3m.py
      - scripts/decode_phase416_sequential_3m.py
      - scripts/decode_phase409_ram1m_debug2m.py
      - scripts/decode_phase408_samsung_debug_dsi.py
      - scripts/decode_phase407_samsung_debug_dsi.py
      - scripts/decode_phase405_dma_done.py
      - scripts/397_apply_downstream_bus_votes.py
      - scripts/38_repack_a52_p1_boot.py
      - .github/workflows/394-a52-mode-fixup-fifo-early.yml

# Phase416 binary-audit correction rebuild
# Phase424 runner restart after hosted-runner package stall
permissions:
  contents: read
  actions: read

env:
  GKI_MANIFEST_BRANCH: common-android12-5.10-2026-04
  GKI_COMMON_TAG: android12-5.10-2026-04_r1
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git

concurrency:
  group: a52-phase427-cb2-handoff-road-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase427 CB2 handoff + road-to-memory probe
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            repo git curl ca-certificates make gcc g++ python3 bc bison flex clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves
          python3 -m py_compile \
            scripts/397_apply_downstream_bus_votes.py \
            scripts/402_apply_dsi_nohlt_cleanup.py \
            scripts/403_apply_retire_phase380_ufs_sampler.py \
            scripts/405_apply_dma_done_direct.py \
            scripts/406_apply_p392_cache_persist.py \
            scripts/407_apply_samsung_debug_dsi.py \
            scripts/408_apply_direct_bio_debug_dsi.py \
            scripts/409_apply_ram1m_debug2m_dsi.py \
            scripts/411_apply_fifo_panic_smmu_experiment.py \
            scripts/413_apply_concurrent_debug2m_mirror.py \
            scripts/414_apply_sequential_3m_recorder.py \
            scripts/415_apply_mdss_gdsc_hwctrl_parity.py \
            scripts/416_apply_sequential_3m_disk_persistence_v2.py \
            scripts/417_apply_postbind_frontier.py \
            scripts/418_apply_atomic_present_discriminator.py \
            scripts/419_apply_umode_vrefresh_parity.py \
            scripts/420_apply_umode_roundtrip_vrefresh_parity.py \
            scripts/421_apply_fetch_memory_survival.py \
            scripts/422_apply_display_smmu_fault_probe.py \
            scripts/423_apply_rpmh_solver_mode_compat.py \
            scripts/424_apply_gki_paired_hw_snapshot.py \
            scripts/425_apply_reboot_origin_recorder.py \
            scripts/426_apply_smmu_stream_handoff_probe.py \
            scripts/427_apply_cb2_handoff_road_probe.py \
            scripts/decode_phase421_survival.py \
            scripts/decode_phase422_smmu_fault.py \
            scripts/decode_phase414_sequential_3m.py \
            scripts/decode_phase416_sequential_3m.py \
            scripts/decode_phase409_ram1m_debug2m.py \
            scripts/decode_phase408_samsung_debug_dsi.py \
            scripts/decode_phase407_samsung_debug_dsi.py \
            scripts/decode_phase405_dma_done.py \
            scripts/38_repack_a52_p1_boot.py
          python3 scripts/427_apply_cb2_handoff_road_probe.py --help >/dev/null

      - name: Restore exact Phase357 baseline
        id: phase357-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase357-gki-out
          key: a52xq-phase357-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/357_ci_build_gki.sh', 'scripts/357_apply_init_exit_cause.py') }}

      - name: Restore Phase346 baseline cache v2 on Phase357 miss
        if: steps.phase357-cache.outputs.cache-hit != 'true'
        id: phase346-v2
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
            phase346-gki-out
          key: a52xq-phase346-baseline-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-445fe739

      - name: Restore Phase346 baseline cache v1 on Phase357 miss
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true'
        id: phase346-v1
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
            phase346-gki-out
          key: a52xq-phase346-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-445fe739

      - name: Restore Phase345 baseline cache on Phase357 miss
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true'
        id: phase345-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
          key: a52xq-phase345-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-d7f4426

      - name: Restore pinned GKI source on baseline-cache miss
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true' && steps.phase345-cache.outputs.cache-hit != 'true'
        id: gki-source-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_TAG }}-${{ env.GKI_COMMON_SHA }}

      - name: Sync official pinned GKI source on complete cache miss
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true' && steps.phase345-cache.outputs.cache-hit != 'true' && steps.gki-source-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf gki
          mkdir -p gki
          cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b "$GKI_MANIFEST_BRANCH" --depth=1
          repo sync -c -j4 --no-tags --fail-fast
          git -C common fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/$GKI_COMMON_TAG"
          git -C common checkout --detach FETCH_HEAD
          test "$(git -C common rev-parse HEAD)" = "$GKI_COMMON_SHA"

      - name: Restore exact TouchGrass source on baseline-cache miss
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true' && steps.phase345-cache.outputs.cache-hit != 'true'
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone TouchGrass on complete baseline-cache miss
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true' && steps.phase345-cache.outputs.cache-hit != 'true' && steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Build Phase345 fallback
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true' && steps.phase345-cache.outputs.cache-hit != 'true'
        run: bash scripts/345_ci_build_gki.sh

      - name: Build Phase346 fallback
        if: steps.phase357-cache.outputs.cache-hit != 'true' && steps.phase346-v2.outputs.cache-hit != 'true' && steps.phase346-v1.outputs.cache-hit != 'true'
        env:
          PHASE346_PREWARMED_PHASE345: '1'
        run: bash scripts/346_ci_build_gki.sh

      - name: Build Phase357 fallback
        if: steps.phase357-cache.outputs.cache-hit != 'true'
        env:
          PHASE357_PREWARMED_PHASE346: '1'
        run: bash scripts/357_ci_build_gki.sh

      - name: Validate Phase357 baseline
        run: |
          set -Eeuo pipefail
          echo "Phase357 cache hit: ${{ steps.phase357-cache.outputs.cache-hit }}"
          test -d gki/common || { echo "missing gki/common"; exit 1; }
          test -s workspace/gki-phase199-out/arch/arm64/boot/Image || { echo "missing cached Image"; exit 1; }
          test -s phase357-gki-out/package/boot.img || { echo "missing cached Phase357 boot.img"; exit 1; }
          test -s phase357-gki-out/config/final.config || { echo "missing cached Phase357 final.config"; exit 1; }
          bytes="$(stat -c '%s' phase357-gki-out/package/boot.img)"
          echo "Phase357 boot.img bytes=$bytes"
          test "$bytes" -eq 100663296
          test "$(make -s -C gki/common kernelversion)" = "5.10.252" || {
            echo "unexpected cached kernel version"; exit 1;
          }
          grep -Fq 'A52_PHASE357_INIT_EXIT_CAUSE_V1' gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c || {
            echo "missing Phase357 source marker"; exit 1;
          }
          echo "Phase357 cached baseline validation: PASS"

      - name: Save exact Phase357 baseline
        if: steps.phase357-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase357-gki-out
          key: a52xq-phase357-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/357_ci_build_gki.sh', 'scripts/357_apply_init_exit_cause.py') }}

      - name: Reapply Phase358 and Phase359
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT" --check-only
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT"
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT" --check-only

      - name: Build Phase427 lineage plus contracts
        run: |
          set -Eeuo pipefail

          ROOT="$PWD/gki/common"
          {
            echo "=== inherited UFS compatibility audit ==="
            for spec in \
              "PINCTRL_BYPASS|$ROOT/drivers/base/dd.c|A52_UFS_PINCTRL_DEFER_BYPASS" \
              "RPMH_MODE_ABI|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|A52RPMHABI copy=1" \
              "RPMH_DOWNSTREAM_PROVIDER|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|qcom,rpmh-vrm-regulator" \
              "UFS_ICE_SAFE|$ROOT/drivers/scsi/ufs/ufs-qcom-ice.c|A52_UFS_ICE_SAFE_BRINGUP" \
              "LEGACY_UFS_GDSC|$ROOT/drivers/regulator/a52-legacy-gdsc-regulator.c|gcc_ufs_phy_gdsc"; do
              IFS='|' read -r name file marker <<< "$spec"
              if [ -f "$file" ] && grep -Fq "$marker" "$file"; then
                echo "$name=present"
              else
                echo "$name=absent"
              fi
            done
          } | tee phase377-inherited-ufs-audit.txt

          python3 - <<'PY'
          from pathlib import Path

          src = Path(".github/workflows/394-a52-mode-fixup-fifo-early.yml").read_text().splitlines()
          start = next(i for i,l in enumerate(src)
                       if l.strip() == "- name: Apply Phase360 through Phase394 and compile")
          runline = next(i for i in range(start + 1, len(src))
                         if src[i].strip() == "run: |")
          end = next(i for i in range(runline + 1, len(src))
                     if src[i].startswith("      - name:"))
          body = [
              line[10:] if line.startswith("          ") else line
              for line in src[runline + 1:end]
          ]
          script = "\n".join(body) + "\n"

          needle = 'python3 scripts/394_apply_mode_fixup_fifo_early.py --root "$ROOT" --check-only\n'
          insert = needle + (
              'python3 scripts/402_apply_dsi_nohlt_cleanup.py --root "$ROOT"\n'
              'python3 scripts/402_apply_dsi_nohlt_cleanup.py --root "$ROOT" --check-only\n'
              'python3 scripts/403_apply_retire_phase380_ufs_sampler.py --root "$ROOT"\n'
              'python3 scripts/403_apply_retire_phase380_ufs_sampler.py --root "$ROOT" --check-only\n'
              'python3 scripts/405_apply_dma_done_direct.py --root "$ROOT"\n'
              'python3 scripts/405_apply_dma_done_direct.py --root "$ROOT" --check-only\n'
              'python3 scripts/406_apply_p392_cache_persist.py --root "$ROOT"\n'
              'python3 scripts/406_apply_p392_cache_persist.py --root "$ROOT" --check-only\n'
              'python3 scripts/407_apply_samsung_debug_dsi.py --root "$ROOT"\n'
              'python3 scripts/407_apply_samsung_debug_dsi.py --root "$ROOT" --check-only\n'
              'python3 scripts/408_apply_direct_bio_debug_dsi.py --root "$ROOT"\n'
              'python3 scripts/408_apply_direct_bio_debug_dsi.py --root "$ROOT" --check-only\n'
              'python3 scripts/409_apply_ram1m_debug2m_dsi.py --root "$ROOT"\n'
              'python3 scripts/409_apply_ram1m_debug2m_dsi.py --root "$ROOT" --check-only\n'
              'python3 scripts/411_apply_fifo_panic_smmu_experiment.py --root "$ROOT"\n'
              'python3 scripts/411_apply_fifo_panic_smmu_experiment.py --root "$ROOT" --check-only\n'
              'python3 scripts/413_apply_concurrent_debug2m_mirror.py --root "$ROOT"\n'
              'python3 scripts/413_apply_concurrent_debug2m_mirror.py --root "$ROOT" --check-only\n'
              'python3 scripts/414_apply_sequential_3m_recorder.py --root "$ROOT"\n'
              'python3 scripts/414_apply_sequential_3m_recorder.py --root "$ROOT" --check-only\n'
              'python3 scripts/415_apply_mdss_gdsc_hwctrl_parity.py --root "$ROOT"\n'
              'python3 scripts/415_apply_mdss_gdsc_hwctrl_parity.py --root "$ROOT" --check-only\n'
              'python3 scripts/416_apply_sequential_3m_disk_persistence_v2.py --root "$ROOT"\n'
              'python3 scripts/416_apply_sequential_3m_disk_persistence_v2.py --root "$ROOT" --check-only\n'
              'python3 scripts/417_apply_postbind_frontier.py --root "$ROOT"\n'
              'python3 scripts/417_apply_postbind_frontier.py --root "$ROOT" --check-only\n'
              'python3 scripts/418_apply_atomic_present_discriminator.py --root "$ROOT"\n'
              'python3 scripts/418_apply_atomic_present_discriminator.py --root "$ROOT" --check-only\n'
              'python3 scripts/419_apply_umode_vrefresh_parity.py --root "$ROOT"\n'
              'python3 scripts/419_apply_umode_vrefresh_parity.py --root "$ROOT" --check-only\n'
              'python3 scripts/420_apply_umode_roundtrip_vrefresh_parity.py --root "$ROOT"\n'
              'python3 scripts/420_apply_umode_roundtrip_vrefresh_parity.py --root "$ROOT" --check-only\n'
              'python3 scripts/421_apply_fetch_memory_survival.py --root "$ROOT"\n'
              'python3 scripts/421_apply_fetch_memory_survival.py --root "$ROOT" --check-only\n'
              'python3 scripts/422_apply_display_smmu_fault_probe.py --root "$ROOT"\n'
              'python3 scripts/422_apply_display_smmu_fault_probe.py --root "$ROOT" --check-only\n'
              'python3 scripts/423_apply_rpmh_solver_mode_compat.py --root "$ROOT"\n'
              'python3 scripts/423_apply_rpmh_solver_mode_compat.py --root "$ROOT" --check-only\n'
              'python3 scripts/424_apply_gki_paired_hw_snapshot.py --root "$ROOT"\n'
              'python3 scripts/424_apply_gki_paired_hw_snapshot.py --root "$ROOT" --check-only\n'
              'python3 scripts/425_apply_reboot_origin_recorder.py --root "$ROOT"\n'
              'python3 scripts/425_apply_reboot_origin_recorder.py --root "$ROOT" --check-only\n'
              'python3 scripts/426_apply_smmu_stream_handoff_probe.py --root "$ROOT"\n'
              'python3 scripts/426_apply_smmu_stream_handoff_probe.py --root "$ROOT" --check-only\n'
              'python3 scripts/427_apply_cb2_handoff_road_probe.py --root "$ROOT"\n'
              'python3 scripts/427_apply_cb2_handoff_road_probe.py --root "$ROOT" --check-only\n'
          )
          if needle not in script:
              raise SystemExit("Phase402 Phase394 insertion anchor missing")
          script = script.replace(needle, insert, 1)

          cfg = '"$ROOT/scripts/config" --file "$BUILD/.config" --set-val LOG_BUF_SHIFT 19\n'
          if cfg not in script:
              raise SystemExit("Phase402 config anchor missing")
          script = script.replace(
              cfg,
              cfg + '"$ROOT/scripts/config" --file "$BUILD/.config" --enable GENERIC_IDLE_POLL_SETUP\n',
              1)

          script = script.replace("phase394-gki-out", "phase427-gki-out")
          script = script.replace("PHASE394-SCHEMA.txt", "PHASE427-SCHEMA.txt")
          script = script.replace("'phase':'394'", "'phase':'427'")
          script = script.replace(
              "'name':'MODE-FIXUP-FIFO-EARLY-V1'",
              "'name':'CB2-HANDOFF-ROAD-PROBE-V1'")
          script = script.replace(
              "'392','393','394']",
              "'392','393','394','397','402','403','405','406','407','408','409','411','413','414','415','416','417','418','419','420','421','422','423','424','425','426','427']")

          # Phase394's inherited audits intentionally require every old observer
          # to remain linked. Phase402 retires those observers. Keep only Image
          # existence here; dedicated Phase402 audits follow after the generated
          # build script.
          pre_start = 'IMAGE="$BUILD/arch/arm64/boot/Image"\ntest -s "$IMAGE"\n'
          package_start = 'rm -rf "$OUT"\n'
          ps = script.find(pre_start)
          pe = script.find(package_start, ps + len(pre_start))
          if ps < 0 or pe < 0:
              raise SystemExit("Phase402 legacy audit boundaries missing")
          script = (
              script[:ps + len(pre_start)] +
              'echo "Phase402: legacy broad-probe compiled audits retired"\n' +
              script[pe:]
          )

          Path("phase427-generated-build.sh").write_text("set -Eeuo pipefail\n" + script)
          PY

          bash phase427-generated-build.sh

          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          OUT="$PWD/phase427-gki-out"
          IMAGE="$BUILD/arch/arm64/boot/Image"
          REC="$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          DSI="$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c"
          DSIHW="$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c"
          DSIDISPLAY="$ROOT/drivers/a52_display/msm/dsi/dsi_display.c"
          DSIPANEL="$ROOT/drivers/a52_display/msm/dsi/dsi_panel.c"
          SSPANEL="$ROOT/drivers/a52_display/msm/samsung/ss_dsi_panel_common.c"
          MSMSMMU="$ROOT/drivers/a52_display/msm/msm_smmu.c"
          ARMSMMU="$ROOT/drivers/iommu/arm/arm-smmu/arm-smmu.c"
          ARMSMMUH="$ROOT/drivers/iommu/arm/arm-smmu/arm-smmu.h"
          IRQH="$ROOT/kernel/irq/handle.c"
          UFS="$ROOT/drivers/scsi/ufs/ufs-qcom.c"
