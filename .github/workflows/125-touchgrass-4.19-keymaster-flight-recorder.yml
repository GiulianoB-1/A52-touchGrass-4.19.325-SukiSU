name: 125 - TouchGrass 4.19 Keymaster flight recorder

run-name: Build working TouchGrass baseline with a bounded Keymaster/QSEECOM recorder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/125-touchgrass-4.19-keymaster-flight-recorder.yml
      - scripts/125_apply_touchgrass_keymaster_flight_recorder.py
      - scripts/126_apply_touchgrass_audio_sysfs_boot_guard.py
      - scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py
      - scripts/128_apply_touchgrass_reserve_keymaster_ramoops_console.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-touchgrass-keymaster-flight-recorder-${{ github.ref }}
  cancel-in-progress: true

env:
  TOUCHGRASS_SHA: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  ANYKERNEL_SHA: 1c9a500dd4aa8081952523126e97eb155aed941b
  DEFCONFIG: a52xq_defconfig

jobs:
  build:
    name: Build one TouchGrass flight-recorder candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates make gcc g++ python3 bc bison flex \
            clang-14 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip zip unzip file \
            dwarves device-tree-compiler
          python3 -m py_compile \
            scripts/125_apply_touchgrass_keymaster_flight_recorder.py \
            scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py \
            scripts/128_apply_touchgrass_reserve_keymaster_ramoops_console.py

      - name: Fetch exact TouchGrass source baseline
        run: |
          set -Eeuo pipefail
          rm -rf touchgrass
          git init touchgrass
          git -C touchgrass remote add origin \
            https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
          git -C touchgrass fetch --depth=1 origin "${TOUCHGRASS_SHA}"
          git -C touchgrass checkout --detach FETCH_HEAD
          test "$(git -C touchgrass rev-parse HEAD)" = "${TOUCHGRASS_SHA}"
          test "$(sed -n 's/^VERSION = //p' touchgrass/Makefile)" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' touchgrass/Makefile)" = 19
          test -f "touchgrass/arch/arm64/configs/${DEFCONFIG}"
          test -f touchgrass/tools/dtc
          chmod 755 touchgrass/tools/dtc

      - name: Stage control-flow-safe persistent secure flight recorder
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/touchgrass-keymaster-flight-recorder"
          mkdir -p "$OUT/logs" "$OUT/stage" "$OUT/config" "$OUT/package"

          # Match the release reported by the working handset baseline.
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 200/' touchgrass/Makefile

          python3 scripts/125_apply_touchgrass_keymaster_flight_recorder.py \
            --kernel touchgrass --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/stage.log"

          git -C touchgrass diff --check
          git -C touchgrass diff --binary --no-ext-diff \
            > "$OUT/stage/touchgrass-keymaster-flight-recorder.patch"
          test -s "$OUT/stage/touchgrass-keymaster-flight-recorder.patch"

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(
              'artifacts/touchgrass-keymaster-flight-recorder/stage/'
              'touchgrass-keymaster-flight-recorder-report.json'
          ).read_text())
          assert report['status'] == 'touchgrass-keymaster-flight-recorder-staged'
          assert report['control_flow_safe_return_wrapping'] is True
          assert report['recorder']['capacity'] == 8192
          assert report['recorder']['capture_mode'] == 'first-events-preserved'
          assert report['qseecom']['safe_exit_count'] > 0
          assert report['ion']['safe_exit_count'] > 0
          persistence = report['failed_boot_persistence']
          assert persistence['status'] == 'touchgrass-keymaster-ramoops-persistence-staged'
          assert persistence['survives_incomplete_android_boot'] is True
          assert persistence['requires_adb_before_reboot'] is False
          assert persistence['persistent_capacity'] == 768
          assert persistence['payload_policy'] == (
              'metadata-only-no-command-or-response-buffers'
          )
          assert persistence['console_frontend_reserved'] is True
          assert persistence['pmsg_capture_retained'] is True
          assert persistence['panic_dmesg_capture_retained'] is True
          PY

          grep -Fq 'A52_TOUCHGRASS_KEYMASTER_FLIGHT_RECORDER' \
            touchgrass/drivers/misc/qseecom.c
          grep -Fq 'A52_KMFR_CAPACITY 8192U' \
            touchgrass/drivers/misc/a52_keymaster_flight_recorder.c
          grep -Fq 'A52_KMFR_PERSIST_CAPACITY 768U' \
            touchgrass/drivers/misc/a52_keymaster_flight_recorder.c
          grep -Fq 'A52KMFR-PERSIST seq=%llu' \
            touchgrass/drivers/misc/a52_keymaster_flight_recorder.c
          grep -Fq 'A52_KMFR_CONSOLE_RESERVED' touchgrass/fs/pstore/ram.c
          grep -Fq 'mode=first-events' \
            touchgrass/drivers/misc/a52_keymaster_flight_recorder.c

      - name: Configure matching TouchGrass kernel
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/touchgrass-keymaster-flight-recorder"
          BUILD="$PWD/workspace/touchgrass-kmfr-out"
          mkdir -p "$BUILD"

          common_make=(
            -C touchgrass O="$BUILD" ARCH=arm64
            CC=clang-14
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            DTC_EXT="$PWD/touchgrass/tools/dtc"
            CONFIG_BUILD_ARM64_DT_OVERLAY=y
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
            CONFIG_DRV_BUILD_IN=Y
          )

          make "${common_make[@]}" "${DEFCONFIG}" \
            2>&1 | tee "$OUT/logs/defconfig.log"

          touchgrass/scripts/config --file "$BUILD/.config" \
            --set-str LOCALVERSION '-touchGrassKernel+' \
            --disable LOCALVERSION_AUTO \
            --enable PRINTK_TIME \
            --enable PROC_FS \
            --set-val LOG_BUF_SHIFT 22 \
            --set-val LOG_CPU_MAX_BUF_SHIFT 16

          make "${common_make[@]}" olddefconfig \
            2>&1 | tee "$OUT/logs/olddefconfig.log"
          cp "$BUILD/.config" "$OUT/config/final.config"

          release="$(make -s "${common_make[@]}" kernelrelease)"
          printf '%s\n' "$release" | tee "$OUT/config/kernelrelease.txt"
          test "$release" = '4.19.200-touchGrassKernel+'
          grep -Fxq 'CONFIG_PRINTK_TIME=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_PROC_FS=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_LOG_BUF_SHIFT=22' "$BUILD/.config"
          grep -Fxq 'CONFIG_PSTORE=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_PSTORE_RAM=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_PSTORE_PMSG=y' "$BUILD/.config"

      - name: Compile TouchGrass Image
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/touchgrass-keymaster-flight-recorder"
          BUILD="$PWD/workspace/touchgrass-kmfr-out"
          common_make=(
            -C touchgrass O="$BUILD" ARCH=arm64
            CC=clang-14
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            DTC_EXT="$PWD/touchgrass/tools/dtc"
            CONFIG_BUILD_ARM64_DT_OVERLAY=y
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
            CONFIG_DRV_BUILD_IN=Y
          )

          clang-14 --version | tee "$OUT/logs/toolchain.log"
          make "${common_make[@]}" -j4 KCFLAGS=-w Image \
            2>&1 | tee "$OUT/logs/build.log"

          IMAGE="$BUILD/arch/arm64/boot/Image"
          test -s "$IMAGE"
          cp "$IMAGE" "$OUT/package/Image"
          grep -aFq 'A52 TouchGrass Keymaster flight recorder' "$IMAGE"
          grep -aFq 'QSEE enter fn=qseecom_ioctl' "$IMAGE"
          grep -aFq 'ION enter fn=ion_ioctl' "$IMAGE"
          grep -aFq 'A52KMFR-PERSIST seq=%llu' "$IMAGE"
          grep -aFq 'BOOT BEGIN release=%s backend=ramoops-console' "$IMAGE"
          grep -aFq 'mode=first-events' "$IMAGE"
          grep -aFq 'a52_keymaster_flight_recorder' "$IMAGE"

      - name: Package one pinned AnyKernel flashable ZIP
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/touchgrass-keymaster-flight-recorder"
          rm -rf anykernel
          git init anykernel
          git -C anykernel remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C anykernel fetch --depth=1 origin "${ANYKERNEL_SHA}"
          git -C anykernel checkout --detach FETCH_HEAD
          test "$(git -C anykernel rev-parse HEAD)" = "${ANYKERNEL_SHA}"
          printf '%s\n' "${ANYKERNEL_SHA}" > "$OUT/package/anykernel-commit.txt"

          rm -rf anykernel/.git anykernel/.github
          rm -f anykernel/README.md anykernel/Image anykernel/Image.gz \
            anykernel/Image.gz-dtb anykernel/dtb anykernel/dtbo.img
          cp "$OUT/package/Image" anykernel/Image

          cat > anykernel/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # TouchGrass A52 5G persistent Keymaster flight recorder

          properties() { '
          kernel.string=TouchGrass 4.19.200 Persistent Keymaster Flight Recorder
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print "  TouchGrass persistent Keymaster flight recorder";
          ui_print "  Target: /dev/block/by-name/boot (non-A/B)";
          ui_print "  Preserving the installed ramdisk and separate DTB";
          dump_boot;
          write_boot;
          EOF

          cat > anykernel/README-FIRST.txt <<'EOF'
          A52 TOUCHGRASS PERSISTENT KEYMASTER FLIGHT RECORDER

          Diagnostic build of the known-working TouchGrass 4.19 path.
          It keeps the first 8192 selected ION and QSEECOM events in RAM and
          mirrors the first 768 metadata-only events into console RAMOOPS.

          After a failed Android boot, force-reboot directly into recovery and
          collect /sys/fs/pstore before attempting another Android boot.
          Look for A52KMFR-PERSIST in console-ramoops-0.

          If Android boots, the full volatile trace is also available at:
            /proc/a52_keymaster_flight_recorder

          This artifact is not hardware validated until tested on the phone.
          EOF

          cat > "$OUT/package/COLLECT-WINDOWS-POWERSHELL.ps1" <<'EOF'
          $ErrorActionPreference = 'Stop'
          adb wait-for-device

          for ($i = 0; $i -lt 180; $i++) {
            $completed = (adb shell getprop sys.boot_completed).Trim()
            if ($completed -eq '1') { break }
            Start-Sleep -Seconds 1
          }

          adb shell su 0 cat /proc/a52_keymaster_flight_recorder |
            Out-File -Encoding utf8 touchgrass-keymaster-flight-recorder.txt
          adb shell su 0 dmesg |
            Out-File -Encoding utf8 touchgrass-flight-recorder-dmesg.txt
          adb logcat -b all -d -v threadtime |
            Out-File -Encoding utf8 touchgrass-flight-recorder-logcat.txt
          adb shell getprop |
            Out-File -Encoding utf8 touchgrass-flight-recorder-getprop.txt
          adb shell cat /proc/cmdline |
            Out-File -Encoding utf8 touchgrass-flight-recorder-cmdline.txt
          adb shell cat /proc/version |
            Out-File -Encoding utf8 touchgrass-flight-recorder-version.txt
          adb shell su 0 sh -c 'ps -A -Z | grep -Ei "keymaster|keymint|keystore|qsee"' |
            Out-File -Encoding utf8 touchgrass-flight-recorder-secure-processes.txt

          Compress-Archive -Force -Path @(
            'touchgrass-keymaster-flight-recorder.txt',
            'touchgrass-flight-recorder-dmesg.txt',
            'touchgrass-flight-recorder-logcat.txt',
            'touchgrass-flight-recorder-getprop.txt',
            'touchgrass-flight-recorder-cmdline.txt',
            'touchgrass-flight-recorder-version.txt',
            'touchgrass-flight-recorder-secure-processes.txt'
          ) -DestinationPath 'TouchGrass-Keymaster-Flight-Recorder-Capture.zip'
          EOF

          chmod 755 anykernel/anykernel.sh
          bash -n anykernel/anykernel.sh
          grep -Fxq 'BLOCK=/dev/block/by-name/boot;' anykernel/anykernel.sh
          grep -Fxq 'IS_SLOT_DEVICE=0;' anykernel/anykernel.sh
          grep -Fxq 'RAMDISK_COMPRESSION=auto;' anykernel/anykernel.sh
          test -s anykernel/Image

          (
            cd anykernel
            zip -qr9 "$OUT/package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip" .
          )
          test -s "$OUT/package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip"
          unzip -l "$OUT/package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip" \
            | tee "$OUT/package/flashable-contents.txt"
          unzip -l "$OUT/package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip" \
            | grep -Eq '[[:space:]]Image$'
          unzip -l "$OUT/package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip" \
            | grep -Eq '[[:space:]]anykernel.sh$'

      - name: Audit and finalize persistent artifact
        run: |
          set -Eeuo pipefail
          OUT=artifacts/touchgrass-keymaster-flight-recorder
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('artifacts/touchgrass-keymaster-flight-recorder')
          image = root / 'package/Image'
          flashable = root / 'package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip'
          release = (root / 'config/kernelrelease.txt').read_text().strip()
          stage = json.loads((
              root / 'stage/touchgrass-keymaster-flight-recorder-report.json'
          ).read_text())
          persistence = stage['failed_boot_persistence']
          anykernel_commit = (root / 'package/anykernel-commit.txt').read_text().strip()
          report = {
              'status': 'touchgrass-persistent-keymaster-flight-recorder-built-audited',
              'hardware_validated': False,
              'touchgrass_source_sha': '6bf351bdf18bdb228db79e66f14a7a9c0178e5d7',
              'kernelrelease': release,
              'kernel_payload': 'Image',
              'boot_partition': '/dev/block/by-name/boot',
              'slot_layout': 'non-A/B',
              'separate_dtb_preserved_by_anykernel': True,
              'anykernel_commit': anykernel_commit,
              'proc_endpoint': '/proc/a52_keymaster_flight_recorder',
              'event_capacity': stage['recorder']['capacity'],
              'capture_mode': stage['recorder']['capture_mode'],
              'control_flow_safe_return_wrapping': stage[
                  'control_flow_safe_return_wrapping'
              ],
              'persistent_backend': persistence['backend'],
              'persistent_capacity': persistence['persistent_capacity'],
              'persistent_line_length': persistence['persistent_line_length'],
              'persistent_payload_policy': persistence['payload_policy'],
              'survives_incomplete_android_boot': persistence[
                  'survives_incomplete_android_boot'
              ],
              'requires_adb_before_reboot': persistence[
                  'requires_adb_before_reboot'
              ],
              'console_frontend_reserved': persistence[
                  'console_frontend_reserved'
              ],
              'pmsg_capture_retained': persistence['pmsg_capture_retained'],
              'panic_dmesg_capture_retained': persistence[
                  'panic_dmesg_capture_retained'
              ],
              'image_bytes': image.stat().st_size,
              'image_sha256': hashlib.sha256(image.read_bytes()).hexdigest(),
              'flashable_sha256': hashlib.sha256(flashable.read_bytes()).hexdigest(),
              'critical_observation': (
                  'The working TouchGrass ion-ioctl implementation also returns '
                  '-ENOTTY for unsupported legacy commands; ION_IOC_FREE alone is '
                  'not a sufficient explanation for the ACK Keymaster death.'
              ),
          }
          assert report['event_capacity'] == 8192
          assert report['capture_mode'] == 'first-events-preserved'
          assert report['control_flow_safe_return_wrapping'] is True
          assert report['persistent_backend'] == 'existing-ramoops-console-zone'
          assert report['persistent_capacity'] == 768
          assert report['persistent_payload_policy'] == (
              'metadata-only-no-command-or-response-buffers'
          )
          assert report['survives_incomplete_android_boot'] is True
          assert report['requires_adb_before_reboot'] is False
          assert report['console_frontend_reserved'] is True
          assert report['pmsg_capture_retained'] is True
          assert report['panic_dmesg_capture_retained'] is True
          (root / 'final-audit.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 TOUCHGRASS 4.19 PERSISTENT KEYMASTER FLIGHT RECORDER

          This build mirrors the first 768 metadata-only Keymaster/QSEECOM/ION
          events into the existing RAMOOPS console zone. It does not record
          command buffers, response buffers, key blobs, or private key material.

          After a failed boot, enter recovery immediately and collect pstore
          before another Android boot. Search console-ramoops-0 for:
            A52KMFR-PERSIST

          Flashable package:
            package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip

          Windows successful-boot collector:
            package/COLLECT-WINDOWS-POWERSHELL.ps1

          Not hardware validated until tested on the phone.
          EOF

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload single persistent TouchGrass recorder artifact
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-touchgrass-persistent-keymaster-flight-recorder-NOT-HARDWARE-VALIDATED
          path: artifacts/touchgrass-keymaster-flight-recorder
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Require final persistent output
        run: |
          set -Eeuo pipefail
          test -s artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
          test -s artifacts/touchgrass-keymaster-flight-recorder/package/A52XQ-TouchGrass-Keymaster-Flight-Recorder-Flashable.zip
          grep -Fq 'touchgrass-persistent-keymaster-flight-recorder-built-audited' \
            artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
          grep -Fq '"event_capacity": 8192' \
            artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
          grep -Fq '"persistent_capacity": 768' \
            artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
          grep -Fq '"console_frontend_reserved": true' \
            artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
          grep -Fq '"pmsg_capture_retained": true' \
            artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
          grep -Fq '"panic_dmesg_capture_retained": true' \
            artifacts/touchgrass-keymaster-flight-recorder/final-audit.json
