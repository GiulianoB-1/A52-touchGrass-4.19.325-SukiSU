name: 252 - A52 legacy MSM-bus RPMh correction

run-name: Build Phase 252 legacy MSM-bus RPMh correction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase252-legacy-msm-bus-rpmh-v1
    paths:
      - .github/workflows/252-a52-legacy-msm-bus-rpmh.yml
      - scripts/218_payload.py
      - scripts/227_phase226_retention_wrapper.py
      - scripts/252_config_retention_gate.py
      - scripts/252_phase251_legacy_msm_bus_rpmh_overlay.py
      - scripts/252_msm_bus_510_compat.py
      - scripts/252_msm_bus_510_format_guard.py
      - scripts/252_package.py

permissions:
  actions: write
  contents: read

concurrency:
  group: a52-phase252-msm-bus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build and package Phase 252
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out Phase 252 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore cumulative layout and self-test
        run: |
          set -Eeuo pipefail
          python3 scripts/234_repair_phase230_layout.py
          python3 scripts/233_payload.py
          python3 scripts/239_phase233_fb_msm_audit_repair.py --self-test
          python3 scripts/239_phase233_fb_msm_audit_repair.py
          python3 -m py_compile \
            scripts/218_payload.py \
            scripts/227_phase226_retention_wrapper.py \
            scripts/252_config_retention_gate.py \
            scripts/252_phase251_legacy_msm_bus_rpmh_overlay.py \
            scripts/252_msm_bus_510_compat.py \
            scripts/252_msm_bus_510_format_guard.py \
            scripts/252_package.py
          python3 scripts/252_phase251_legacy_msm_bus_rpmh_overlay.py --self-test
          python3 scripts/252_msm_bus_510_compat.py --self-test
          python3 scripts/252_msm_bus_510_format_guard.py --self-test
          python3 scripts/227_phase226_retention_wrapper.py --self-test
          git diff --check

      - name: Verify Phase 252 executable scope
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wrapper = Path('scripts/227_phase226_retention_wrapper.py').read_text()
          overlay = Path('scripts/252_phase251_legacy_msm_bus_rpmh_overlay.py').read_text()
          compat = Path('scripts/252_msm_bus_510_compat.py').read_text()
          fmt = Path('scripts/252_msm_bus_510_format_guard.py').read_text()
          package = Path('scripts/252_package.py').read_text()
          payload = Path('scripts/218_payload.py').read_text()
          gate = Path('scripts/252_config_retention_gate.py').read_text()

          p251 = wrapper.index('251_phase250_gmu_post_mmio_tail_diag_overlay.py')
          p252 = wrapper.index('252_phase251_legacy_msm_bus_rpmh_overlay.py')
          pcompat = wrapper.index('252_msm_bus_510_compat.py')
          pfmt = wrapper.index('252_msm_bus_510_format_guard.py')
          assert p251 < p252 < pcompat < pfmt

          for token in (
              'A52_PHASE252_LEGACY_MSM_BUS_RPMH_V1',
              '6bf351bdf18bdb228db79e66f14a7a9c0178e5d7',
              'CONFIG_QCOM_BUS_SCALING',
              'CONFIG_QCOM_BUS_CONFIG_RPMH',
              'msm_bus_core.o msm_bus_client_api.o',
              'msm_bus_fabric_rpmh.o',
              'msm_bus_of_rpmh.o',
              'K251 B gpu tbl=%d',
          ):
              assert token in overlay, token

          for token in (
              'A52_PHASE252_MSM_BUS_GKI510_COMPAT_V1',
              'const void *id',
              'ktime_to_timespec64',
              'cmd_db_read_aux_data(bcmdev->name, &aux_len)',
              'IS_ERR(aux)',
              'PTR_ERR(aux)',
              'rpmh_invalidate() is void',
              'cur_fal = pdata->usecase_lat[cur_idx].fal_ns',
              'BCM_TCS_CMD_* is provided by <soc/qcom/tcs.h>',
          ):
              assert token in compat, token

          for token in (
              'A52_PHASE252_MSM_BUS_GKI510_FORMAT_GUARD_V1',
              '%lld.%09ld',
              '(long long)ts.tv_sec, (long)ts.tv_nsec',
              '#include <linux/ktime.h>',
              'stale unsigned tv_nsec format',
          ):
              assert token in fmt, token

          assert 'scripts/252_config_retention_gate.py' in payload
          assert 'CONFIG_QCOM_BUS_SCALING' in gate
          assert 'CONFIG_QCOM_BUS_CONFIG_RPMH' in gate
          for name in (
              '252_msm_bus_510_compat.py',
              '252_msm_bus_510_format_guard.py',
          ):
              assert name in package, name
          assert 'agent/a52-phase252-legacy-msm-bus-rpmh-v1' in package
          PY

      - name: Dispatch inherited builder and package Phase 252
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/252_package.py

      - name: Verify Phase 252 candidate
        run: |
          set -Eeuo pipefail
          OUT=phase252-out
          test -s "$OUT/package/boot.img"
          test -s "$OUT/compile/Image"
          test -s "$OUT/config/final.config"
          test -s "$OUT/final-audit.json"
          test -s "$OUT/BUILD-IDENTITY.json"
          test -s "$OUT/SHA256SUMS"
          test -s "$OUT/audit/phase252/252_phase251_legacy_msm_bus_rpmh_overlay.py"
          test -s "$OUT/audit/phase252/252_msm_bus_510_compat.py"
          test -s "$OUT/audit/phase252/252_msm_bus_510_format_guard.py"
          test -s "$OUT/audit/phase252/252_config_retention_gate.py"
          grep -Fxq 'CONFIG_QCOM_BUS_SCALING=y' "$OUT/config/final.config"
          grep -Fxq 'CONFIG_QCOM_BUS_CONFIG_RPMH=y' "$OUT/config/final.config"
          for marker in \
            'A52_PHASE250_GPU_SMMU_POWER_CONTRACT_V1' \
            'K250 S regon rc=%d n=%d' \
            'K251 G hfiirq rc=%d' \
            'K251 G gmuirq rc=%d' \
            'K251 B gpu tbl=%d' \
            'K251 B gpu pcl=%u' \
            'K251 B cnoc tbl=%d' \
            'K251 G gpubw rc=%d' \
            'K251 G cnoc rc=%d'; do
            grep -aFq "$marker" "$OUT/compile/Image"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path('phase252-out')
          audit = json.loads((out / 'final-audit.json').read_text())
          assert audit['phase'] == 252
          assert audit['base_phase'] == 251
          assert audit['hardware_validated'] is False
          assert audit['phase252_corrective'] is True
          assert audit['phase252_qcom_bus_scaling_enabled'] is True
          assert audit['phase252_qcom_bus_config_rpmh_enabled'] is True
          assert audit['phase252_gki510_api_compatibility_applied'] is True
          assert audit['phase252_gki510_format_guard_applied'] is True
          assert audit['phase252_phase251_diagnostics_retained'] is True
          assert audit['phase252_return_values_forced'] is False
          assert len(audit['phase252_gki510_adaptations']) >= 6
          repack = json.loads((out / 'package/repack-report.json').read_text())
          for key in ('board_preserved','cmdline_preserved','dtb_preserved','ramdisk_preserved','header_version_preserved','partition_size_preserved','replacement_kernel_used'):
              assert repack['invariants'][key] is True, key
          PY
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          sha256sum "$OUT/package/boot.img"

      - name: Recover failed inherited builder logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p phase252-failure
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow 325785868 \
            --branch agent/a52-phase252-legacy-msm-bus-rpmh-v1 \
            --event workflow_dispatch --limit 3 \
            --json databaseId,status,conclusion,createdAt,url \
            > phase252-failure/inherited-runs.json
          RUN_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('phase252-failure/inherited-runs.json')
          rows=json.loads(p.read_text()) if p.is_file() else []
          print(rows[0]['databaseId'] if rows else '')
          PY
          )
          if test -n "$RUN_ID"; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
              > phase252-failure/inherited-failed.log 2>&1 || true
            mkdir -p phase252-failure/inner-artifact
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --pattern '*FAILED-DIAGNOSTICS*' \
              --dir phase252-failure/inner-artifact || true

            COMPILE_LOG=$(find phase252-failure/inner-artifact -type f \
              -name 'phase217-compile.log' -print -quit)
            if test -n "$COMPILE_LOG"; then
              grep -nE 'error:|undefined reference|ld\.lld: error|collect2: error' \
                "$COMPILE_LOG" > phase252-failure/compiler-errors.txt || true
              tail -n 300 "$COMPILE_LOG" > phase252-failure/phase217-compile-tail.txt || true
            fi

            APPLY_LOG=$(find phase252-failure/inner-artifact -type f \
              -name 'phase217-apply.log' -print -quit)
            if test -n "$APPLY_LOG"; then
              grep -nE 'Phase 252|A52_PHASE252|P252|compat|guard|failed|error' \
                "$APPLY_LOG" > phase252-failure/phase252-apply-summary.txt || true
              tail -n 220 "$APPLY_LOG" > phase252-failure/phase217-apply-tail.txt || true
            fi

            CI_FAIL=$(find phase252-failure/inner-artifact -type f \
              -name 'ci-failure.txt' -print -quit)
            if test -n "$CI_FAIL"; then
              cp "$CI_FAIL" phase252-failure/ci-failure.txt
            fi
          fi

      - name: Upload Phase 252 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase252-FAILURE-${{ github.run_number }}
          path: phase252-failure/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Phase 252 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase252-LEGACY-MSM-BUS-RPMH-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase252-out
          if-no-files-found: error
          retention-days: 30
