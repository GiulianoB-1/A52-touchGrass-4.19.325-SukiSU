name: Phase445 rail-vote inspect
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-refgen-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect refgen patch
        run: |
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          s=zlib.decompress(base64.b64decode(Path("scripts/445_apply_recovery_ladder.py.z64").read_text().strip())).decode()
          lines=s.splitlines()
          for needle in ("last_sent","last_level","L22","l22","MX","rpmh","RPMH","refgen_pwrdwn","p445_power"):
              for i,l in enumerate(lines):
                  if needle in l:
                      print("\n###",needle,"line",i+1)
                      for j in range(max(0,i-30),min(len(lines),i+100)):
                          print(f"{j+1:04d}: {lines[j]}")
                      break
          PY
