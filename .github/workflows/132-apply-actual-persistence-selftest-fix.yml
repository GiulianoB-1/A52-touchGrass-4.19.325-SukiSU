name: 132 - Apply actual persistence self-test fix

on:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/132-apply-actual-persistence-selftest-fix.yml

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  fix-and-observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Check out current diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/a52-keymaster-real-ion
          fetch-depth: 0

      - name: Revert competing wrapper workaround and fix self-test fixture
        run: |
          set -Eeuo pipefail
          git revert --no-commit b7c3a039edb56425746f6b6aef8e9a7c4b5e89f8
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py')
          text = path.read_text(encoding='utf-8')
          marker = 'recorder_sample = recorder_sample.replace(r"\\t", "\t")'
          if marker not in text:
              anchor = '    with tempfile.TemporaryDirectory() as tmp:\n'
              if text.count(anchor) != 1:
                  raise SystemExit(
                      f'expected one self-test temporary-directory anchor, found {text.count(anchor)}'
                  )
              insertion = (
                  '    # Keep C \\n escapes literal, but convert raw indentation escapes '
                  'to real tabs before exercising production anchors.\n'
                  '    recorder_sample = recorder_sample.replace(r"\\t", "\t")\n'
                  '    if r"\\t" in recorder_sample:\n'
                  '        raise SystemExit("recorder fixture still contains literal tab escapes")\n\n'
              )
              text = text.replace(anchor, insertion + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile \
            scripts/125_apply_touchgrass_keymaster_flight_recorder.py \
            scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path(
              'scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py',
              run_name='a52_persistence_selftest',
          )
          namespace['self_test']()
          print('persistence self-test: PASS')
          PY
          grep -Fq 'recorder_sample = recorder_sample.replace(r"\t", "' \
            scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py
          ! grep -Fq 'normalize_generated_recorder_locals' \
            scripts/125_apply_touchgrass_keymaster_flight_recorder.py

      - name: Commit focused correction
        id: commit
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/125_apply_touchgrass_keymaster_flight_recorder.py \
            scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py
          git commit -m 'Fix persistent recorder raw-tab self-test fixture'
          fix_sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/a52-keymaster-real-ion
          printf 'fix_sha=%s\n' "$fix_sha" >> "$GITHUB_OUTPUT"

      - name: Publish pending Workflow 125 status
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.commit.outputs.fix_sha }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FIX_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"workflow-125-persistent\",\"description\":\"Persistent Workflow 125 rebuild is queued\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions\"}"

      - name: Discover and wait for Workflow 125
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.commit.outputs.fix_sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['FIX_SHA']
          token = os.environ['GH_TOKEN']
          output = os.environ['GITHUB_OUTPUT']
          workflow = '125-touchgrass-4.19-keymaster-flight-recorder.yml'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'workflow-132-observer',
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe='')
          list_url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs'
              f'?branch={encoded_branch}&event=push&per_page=30'
          )
          selected = None
          for _ in range(90):
              data = get_json(list_url)
              candidates = [
                  run for run in data.get('workflow_runs', [])
                  if run.get('head_sha') == sha and run.get('event') == 'push'
              ]
              if candidates:
                  selected = max(candidates, key=lambda run: run['id'])
                  break
              time.sleep(5)

          if selected is None:
              with open(output, 'a', encoding='utf-8') as handle:
                  handle.write('conclusion=not_found\n')
                  handle.write(
                      f'run_url=https://github.com/{repo}/actions/workflows/{workflow}\n'
                  )
              raise SystemExit(0)

          run_id = selected['id']
          run_url = selected['html_url']
          conclusion = 'timeout'
          for _ in range(360):
              run = get_json(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              )
              if run.get('status') == 'completed':
                  conclusion = run.get('conclusion') or 'unknown'
                  break
              time.sleep(10)

          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f'run_id={run_id}\n')
              handle.write(f'run_url={run_url}\n')
              handle.write(f'conclusion={conclusion}\n')
          print(f'Workflow 125 run {run_id}: {conclusion} - {run_url}')
          PY

      - name: Publish final Workflow 125 status
        if: always() && steps.commit.outputs.fix_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.commit.outputs.fix_sha }}
          OBSERVED_CONCLUSION: ${{ steps.observe.outputs.conclusion }}
          OBSERVED_RUN_URL: ${{ steps.observe.outputs.run_url }}
        run: |
          set -Eeuo pipefail
          conclusion="${OBSERVED_CONCLUSION:-observer_failed}"
          run_url="${OBSERVED_RUN_URL:-https://github.com/${GITHUB_REPOSITORY}/actions}"
          if [ "$conclusion" = success ]; then
            state=success
            description='Persistent Workflow 125 passed'
          else
            state=failure
            description="Persistent Workflow 125: ${conclusion}"
          fi
          payload="$(python3 - "$state" "$description" "$run_url" <<'PY'
          import json
          import sys
          print(json.dumps({
              'state': sys.argv[1],
              'context': 'workflow-125-persistent',
              'description': sys.argv[2][:140],
              'target_url': sys.argv[3],
          }))
          PY
          )"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FIX_SHA}" \
            --data "$payload"
          test "$state" = success
