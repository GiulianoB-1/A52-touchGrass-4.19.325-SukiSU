name: 250 - A52 GPU SMMU power contract

run-name: Build Phase 250 GPU-SMMU regulator-before-clock correction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase250-gpu-smmu-power-contract-v1
    paths:
      - .github/workflows/250-a52-gpu-smmu-power-contract.yml
      - scripts/227_phase226_retention_wrapper.py
      - scripts/250_phase249_gpu_smmu_power_contract_overlay.py
      - scripts/250_package.py
      - scripts/250_gpu_component_audit.md

permissions:
  actions: write
  contents: read

concurrency:
  group: a52-phase250-gpu-smmu-power-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build and package Phase 250
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out Phase 250 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore cumulative layout and self-test
        run: |
          set -Eeuo pipefail
          python3 scripts/234_repair_phase230_layout.py
          python3 scripts/233_payload.py
          python3 scripts/239_phase233_fb_msm_audit_repair.py --self-test
          python3 scripts/239_phase233_fb_msm_audit_repair.py
          python3 -m py_compile \
            scripts/227_phase226_retention_wrapper.py \
            scripts/249_phase248_gpu_smmu_enodev_root_overlay.py \
            scripts/250_phase249_gpu_smmu_power_contract_overlay.py \
            scripts/249_package.py \
            scripts/250_package.py
          python3 scripts/250_phase249_gpu_smmu_power_contract_overlay.py --self-test
          python3 scripts/227_phase226_retention_wrapper.py --self-test
          git diff --check

      - name: Verify Phase 250 executable scope
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wrapper = Path('scripts/227_phase226_retention_wrapper.py').read_text()
          overlay = Path('scripts/250_phase249_gpu_smmu_power_contract_overlay.py').read_text()
          package = Path('scripts/250_package.py').read_text()
          assert wrapper.index('249_phase248_gpu_smmu_enodev_root_overlay.py') < wrapper.index('250_phase249_gpu_smmu_power_contract_overlay.py')
          for token in (
              'A52_PHASE250_GPU_SMMU_POWER_CONTRACT_V1',
              'qcom,regulator-names',
              'devm_regulator_bulk_get',
              'regulator_bulk_enable',
              'regulator_bulk_disable',
              'K250 S gdscget rc=%d n=%d',
              'K250 S regon rc=%d n=%d',
              'K250 S clkon rc=%d',
          ):
              assert token in overlay, token
          assert 'agent/a52-phase250-gpu-smmu-power-contract-v1' in package
          assert 'phase250_stream_ids_changed' in package
          assert 'phase250_iommu_group_behavior_forced' in package
          assert 'phase250_kgsl_gmu_semantics_changed' in package
          PY

      - name: Dispatch inherited builder and package Phase 250
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/250_package.py

      - name: Verify Phase 250 candidate
        run: |
          set -Eeuo pipefail
          OUT=phase250-out
          test -s "$OUT/package/boot.img"
          test -s "$OUT/compile/Image"
          test -s "$OUT/final-audit.json"
          test -s "$OUT/BUILD-IDENTITY.json"
          test -s "$OUT/SHA256SUMS"
          test -s "$OUT/PHASE250-GPU-COMPONENT-AUDIT.md"
          test -s "$OUT/audit/phase250/250_phase249_gpu_smmu_power_contract_overlay.py"
          test -s "$OUT/audit/phase250/250_package.py"

          for marker in \
            'BOOT rs=ready phase=243 focus=cx-gdsc-own-suppliers' \
            'cam_cc_pll2_out_early' \
            'K248 M iommu in' \
            'K249 S clkon rc=%d' \
            'K249 I grp ok=%d' \
            'A52_PHASE250_GPU_SMMU_POWER_CONTRACT_V1' \
            'K250 S gdscget rc=%d n=%d' \
            'K250 S regon rc=%d n=%d' \
            'K250 S clkon rc=%d' \
            'qcom,regulator-names' \
            '3d40000'; do
            grep -aFq "$marker" "$OUT/compile/Image"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path('phase250-out')
          audit = json.loads((out / 'final-audit.json').read_text())
          assert audit['phase'] == 250
          assert audit['base_phase'] == 249
          assert audit['hardware_validated'] is False
          assert audit['phase250_corrective'] is True
          assert audit['phase250_arm_smmu_regulator_contract_changed'] is True
          assert audit['phase250_arm_smmu_runtime_pm_supply_symmetry_changed'] is True
          assert audit['phase250_clock_topology_changed'] is False
          assert audit['phase250_gdsc_provider_implementation_changed'] is False
          assert audit['phase250_dt_changed'] is False
          assert audit['phase250_stream_ids_changed'] is False
          assert audit['phase250_iommu_group_behavior_forced'] is False
          assert audit['phase250_iommu_attach_return_forced'] is False
          assert audit['phase250_kgsl_gmu_semantics_changed'] is False
          assert audit['phase250_hfi_semantics_changed'] is False
          assert audit['phase250_adreno_a6xx_semantics_changed'] is False
          assert audit['phase250_probe_order_changed'] is False
          assert audit['phase250_boot_cmdline_changed'] is False

          repack = json.loads((out / 'package/repack-report.json').read_text())
          inv = repack['invariants']
          for key in ('board_preserved', 'cmdline_preserved', 'dtb_preserved',
                      'ramdisk_preserved', 'header_version_preserved',
                      'partition_size_preserved', 'replacement_kernel_used'):
              assert inv[key] is True, key
          PY

          (cd "$OUT" && sha256sum -c SHA256SUMS)
          sha256sum "$OUT/package/boot.img"

      - name: Upload Phase 250 candidate
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase250-GPU-SMMU-POWER-CONTRACT-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase250-out
          if-no-files-found: error
          retention-days: 30
