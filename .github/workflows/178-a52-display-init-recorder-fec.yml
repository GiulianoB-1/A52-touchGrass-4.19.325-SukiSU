name: 178 - A52 protected display initialization recorder

run-name: Build triple-copy Reed-Solomon display initialization recorder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-display-init-recorder-fec-v1
    paths:
      - .github/workflows/178-a52-display-init-recorder-fec.yml
      - scripts/178_ci_display_init_fec.sh
      - scripts/178_apply_a52_display_init_recorder_fec.py
      - patches/177-a52-display-init-recorder-plain.patch
      - scripts/38_repack_a52_p1_boot.py
  pull_request:
    branches:
      - agent/a52-display-init-recorder-v1
    paths:
      - .github/workflows/178-a52-display-init-recorder-fec.yml
      - scripts/178_ci_display_init_fec.sh
      - scripts/178_apply_a52_display_init_recorder_fec.py
      - patches/177-a52-display-init-recorder-plain.patch
      - scripts/38_repack_a52_p1_boot.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-display-init-recorder-fec-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  SOURCE_ARTIFACT_ID: '8681171875'
  SOURCE_ARTIFACT_SHA256: c9f6b0041abd5c9305d05534b1afcdf5ebee6de607ad08784721e364a2bf4c11

jobs:
  build-package:
    name: Compile and package protected display recorder
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out protected recorder branch
        uses: actions/checkout@v4

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Enable recorder compile preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/178_ci_display_init_fec.sh')
          text = path.read_text()
          text = text.replace(
              'make -k -C gki/common O="$BUILD"',
              'make -C gki/common O="$BUILD"',
              1,
          )
          marker = "grep -Fxq 'CONFIG_REED_SOLOMON_DEC8=y' \"$BUILD/.config\"\n\nset +e\n"
          preflight = """grep -Fxq 'CONFIG_REED_SOLOMON_DEC8=y' "$BUILD/.config"

          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \\
            KCFLAGS=-Wno-error=frame-larger-than \\
            fs/pstore/ram.o \\
            drivers/a52_secure/a52_ack_secure_flight_recorder.o \\
            > "$OUT/logs/recorder-object-preflight.log" 2>&1
          grep -Fq 'CC      fs/pstore/ram.o' \\
            "$OUT/logs/recorder-object-preflight.log"
          grep -Fq 'CC      drivers/a52_secure/a52_ack_secure_flight_recorder.o' \\
            "$OUT/logs/recorder-object-preflight.log"

          set +e
          """
          if text.count(marker) != 1:
              raise SystemExit(f'expected one preflight insertion marker, found {text.count(marker)}')
          text = text.replace(marker, preflight, 1)

          audit_old = '  grep -Fq "$object" "$OUT/logs/compile.log"\ndone\n'
          audit_new = '''  if ! grep -Fq "$object" "$OUT/logs/compile.log"; then
            grep -Fq "$object" "$OUT/logs/recorder-object-preflight.log"
          fi
          done
          '''
          if text.count(audit_old) != 1:
              raise SystemExit(f'expected one object audit block, found {text.count(audit_old)}')
          text = text.replace(audit_old, audit_new, 1)

          if 'make -k -C gki/common' in text:
              raise SystemExit('make -k remains after fail-fast rewrite')
          path.write_text(text)

          patcher_path = Path('scripts/178_apply_a52_display_init_recorder_fec.py')
          patcher = patcher_path.read_text()
          start_marker = (
              '    declaration = """extern unsigned int '
              'a52_ackfr_ramoops_write_record(const void *data,'
          )
          start = patcher.find(start_marker)
          end = patcher.find('    core = r"""', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('fragile deferred RS declaration block not found')
          robust = (
              '    declaration_start = text.find(\n'
              '        "extern unsigned int a52_ackfr_ramoops_write_record(const void *data,"\n'
              '    )\n'
              '    if declaration_start < 0:\n'
              '        raise SystemExit("deferred RS declaration start missing")\n'
              '    declaration_end = text.find(";", declaration_start)\n'
              '    if declaration_end < 0:\n'
              '        raise SystemExit("deferred RS declaration terminator missing")\n'
              '    declaration_end += 1\n'
              '    text = (\n'
              '        text[:declaration_end]\n'
              '        + "\\nextern int __init a52_ackfr_ramoops_enable_rs(void);"\n'
              '        + "\\nextern void a52_ackfr_ramoops_mark_status(u32 bits);"\n'
              '        + text[declaration_end:]\n'
              '    )\n'
          )
          patcher = patcher[:start] + robust + patcher[end:]

          writer_old = (
              '        text, "unsigned int a52_ackfr_ramoops_write_record", '
              'write_source\n'
          )
          writer_new = (
              '        text, "unsigned int a52_ackfr_ramoops_write_record'
              '(const void *data, size_t len,", write_source\n'
          )
          if patcher.count(writer_old) != 1:
              raise SystemExit(
                  f'expected one broad writer matcher, found {patcher.count(writer_old)}'
              )
          patcher = patcher.replace(writer_old, writer_new, 1)

          status_old = '''#define A52_DIAG_STATUS_MAP_OK BIT(0)
          #define A52_DIAG_STATUS_FIRST_WRITE_ENTER BIT(1)
          #define A52_DIAG_STATUS_FIRST_WRITE_OK BIT(2)
          #define A52_DIAG_STATUS_RS_INIT_ENTER BIT(3)
          #define A52_DIAG_STATUS_RS_READY BIT(4)
          #define A52_DIAG_STATUS_RS_FAILED BIT(5)
          #define A52_DIAG_STATUS_RS_ENCODE_FAILED BIT(6)
          '''
          status_new = '''#define A52_DIAG_STATUS_MAP_OK BIT(0)
          #define A52_DIAG_STATUS_INIT_AFTER_MAP BIT(1)
          #define A52_DIAG_STATUS_INIT_AFTER_PRINT1 BIT(2)
          #define A52_DIAG_STATUS_INIT_AFTER_PRINT2 BIT(3)
          #define A52_DIAG_STATUS_INIT_RETURN BIT(4)
          #define A52_DIAG_STATUS_RECORD_ENTER BIT(5)
          #define A52_DIAG_STATUS_RECORD_CLASSIFIED BIT(6)
          #define A52_DIAG_STATUS_RECORD_BEFORE_WRITER BIT(7)
          #define A52_DIAG_STATUS_FIRST_WRITE_ENTER BIT(8)
          #define A52_DIAG_STATUS_FIRST_WRITE_OK BIT(9)
          #define A52_DIAG_STATUS_RS_INIT_ENTER BIT(10)
          #define A52_DIAG_STATUS_RS_READY BIT(11)
          #define A52_DIAG_STATUS_RS_FAILED BIT(12)
          #define A52_DIAG_STATUS_RS_ENCODE_FAILED BIT(13)
          '''
          status_old = ''.join(line.lstrip() for line in status_old.splitlines(True))
          status_new = ''.join(line.lstrip() for line in status_new.splitlines(True))
          if patcher.count(status_old) != 1:
              raise SystemExit(f'expected one status block, found {patcher.count(status_old)}')
          patcher = patcher.replace(status_old, status_new, 1)

          map_marker = 'static int a52_diag_map_all_banks(void)\n'
          mark_function = r'''void a52_ackfr_ramoops_mark_status(u32 bits)
          {
          \tif (!a52_diag_preserve_recovery)
          \t\ta52_diag_status_set(bits);
          }

          '''
          mark_function = ''.join(line.lstrip() for line in mark_function.splitlines(True))
          if patcher.count(map_marker) != 1:
              raise SystemExit(f'expected one map marker, found {patcher.count(map_marker)}')
          patcher = patcher.replace(map_marker, mark_function + map_marker, 1)

          init_old = r'''\tpr_info("A52 recorder v3 single-mapped %u banks, slots=%u, RS parity=%u\n",
          \t\tA52_DIAG_BANK_COUNT, A52_DIAG_SLOT_COUNT,
          \t\tA52_ACKFR_PARITY_BYTES);
          \tpr_info("A52 recorder v3 RS initialization deferred; zero-parity fallback active\n");
          \treturn 0;
          '''
          init_new = r'''\ta52_diag_status_set(A52_DIAG_STATUS_INIT_AFTER_MAP);
          \tpr_info("A52 recorder v3 single-mapped %u banks, slots=%u, RS parity=%u\n",
          \t\tA52_DIAG_BANK_COUNT, A52_DIAG_SLOT_COUNT,
          \t\tA52_ACKFR_PARITY_BYTES);
          \ta52_diag_status_set(A52_DIAG_STATUS_INIT_AFTER_PRINT1);
          \tpr_info("A52 recorder v3 RS initialization deferred; zero-parity fallback active\n");
          \ta52_diag_status_set(A52_DIAG_STATUS_INIT_AFTER_PRINT2);
          \ta52_diag_status_set(A52_DIAG_STATUS_INIT_RETURN);
          \treturn 0;
          '''
          init_old = ''.join(line.lstrip() for line in init_old.splitlines(True))
          init_new = ''.join(line.lstrip() for line in init_new.splitlines(True))
          if patcher.count(init_old) != 1:
              raise SystemExit(f'expected one normal init block, found {patcher.count(init_old)}')
          patcher = patcher.replace(init_old, init_new, 1)

          guard_old = r'''\tif (a52_diag_preserve_recovery || !data ||
          \t    len != A52_ACKFR_DATA_BYTES || !seq || !a52_diag_banks[0])
          \t\treturn 0;

          \tfirst_write = !a52_diag_first_write_done;
          \tif (first_write)
          \t\ta52_diag_status_set(A52_DIAG_STATUS_FIRST_WRITE_ENTER);
          '''
          guard_new = r'''\tif (!a52_diag_preserve_recovery)
          \t\ta52_diag_status_set(A52_DIAG_STATUS_FIRST_WRITE_ENTER);
          \tif (a52_diag_preserve_recovery || !data ||
          \t    len != A52_ACKFR_DATA_BYTES || !seq || !a52_diag_banks[0])
          \t\treturn 0;

          \tfirst_write = !a52_diag_first_write_done;
          '''
          guard_old = ''.join(line.lstrip() for line in guard_old.splitlines(True))
          guard_new = ''.join(line.lstrip() for line in guard_new.splitlines(True))
          if patcher.count(guard_old) != 1:
              raise SystemExit(f'expected one writer guard block, found {patcher.count(guard_old)}')
          patcher = patcher.replace(guard_old, guard_new, 1)

          core_marker = '    core = r"""static int __init a52_rec3_core(void)\n'
          recorder_instrument = '''    text = replace_once(
              text,
              "#define A52_REC3_FLAG_CRITICAL BIT(0)\\n",
              "#define A52_REC3_FLAG_CRITICAL BIT(0)\\n"
              "#define A52_REC3_STATUS_RECORD_ENTER BIT(5)\\n"
              "#define A52_REC3_STATUS_RECORD_CLASSIFIED BIT(6)\\n"
              "#define A52_REC3_STATUS_RECORD_BEFORE_WRITER BIT(7)\\n",
              "recorder checkpoint definitions",
          )
          text = replace_once(
              text,
              "\\tBUILD_BUG_ON(sizeof(struct a52_rec3_data) != 208);\\n",
              "\\tBUILD_BUG_ON(sizeof(struct a52_rec3_data) != 208);\\n"
              "\\ta52_ackfr_ramoops_mark_status(A52_REC3_STATUS_RECORD_ENTER);\\n",
              "recorder entry checkpoint",
          )
          classified_old = (
              "\\tevent_id = a52_rec3_event_id(message);\\n"
              "\\tif (!event_id)\\n"
              "\\t\\treturn;\\n"
          )
          classified_new = classified_old + (
              "\\ta52_ackfr_ramoops_mark_status("
              "A52_REC3_STATUS_RECORD_CLASSIFIED);\\n"
          )
          text = replace_once(
              text, classified_old, classified_new,
              "recorder classification checkpoint",
          )
          writer_call = (
              "\\twritten = a52_ackfr_ramoops_write_record("
              "&record, sizeof(record), seq);\\n"
          )
          writer_call_new = (
              "\\ta52_ackfr_ramoops_mark_status("
              "A52_REC3_STATUS_RECORD_BEFORE_WRITER);\\n"
              + writer_call
          )
          text = replace_once(
              text, writer_call, writer_call_new,
              "recorder writer-call checkpoint",
          )

          '''
          if patcher.count(core_marker) != 1:
              raise SystemExit(f'expected one core marker, found {patcher.count(core_marker)}')
          patcher = patcher.replace(core_marker, recorder_instrument + core_marker, 1)
          patcher_path.write_text(patcher)
          PY

      - name: Build and audit protected display recorder candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GKI_CACHE_HIT: ${{ steps.gki-cache.outputs.cache-hit }}
        run: bash scripts/178_ci_display_init_fec.sh

      - name: Upload failed diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-display-init-recorder-fec-${{ github.run_number }}-FAILED-DIAGNOSTICS
          path: artifacts/a52xq-display-init-recorder-fec
          if-no-files-found: warn
          retention-days: 7

      - name: Upload protected display recorder candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-display-init-recorder-fec-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-display-init-recorder-fec
          if-no-files-found: error
          retention-days: 30
