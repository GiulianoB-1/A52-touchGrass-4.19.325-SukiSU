name: 167 - Repair heap-19 validation gate

on:
  push:
    branches:
      - agent/a52-qseecom-ta-heap19
    paths:
      - .github/workflows/167-repair-heap19-validation-gate.yml

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out heap-19 branch
        uses: actions/checkout@v4
        with:
          ref: agent/a52-qseecom-ta-heap19
          fetch-depth: 0

      - name: Replace false source marker assertion
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/166-a52-qseecom-ta-heap19.yml')
          text = path.read_text()
          old = """          grep -Fq 'A52_ACTIVE_DISPLAY_SCOPES_V1' \\
            active/extracted/stage/refgen-active-display-scopes-source.patch
"""
          new = """          grep -Fq 'A52_ACKFR_SCOPE(\"DISP\", \"a52.dsi_bridge_pre_enable\")' \\
            active/extracted/stage/refgen-active-display-scopes-source.patch
"""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one false active-scope marker assertion')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          grep -Fq 'A52_ACKFR_SCOPE("DISP", "a52.dsi_bridge_pre_enable")' \
            .github/workflows/166-a52-qseecom-ta-heap19.yml
          ! grep -Fq 'A52_ACTIVE_DISPLAY_SCOPES_V1' \
            .github/workflows/166-a52-qseecom-ta-heap19.yml

      - name: Commit workflow-only repair
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/166-a52-qseecom-ta-heap19.yml
          git commit -m 'Fix heap-19 active-scope artifact assertion'
          git push origin HEAD:agent/a52-qseecom-ta-heap19

      - name: Dispatch corrected heap-19 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/321483222/dispatches" \
            --data '{"ref":"agent/a52-qseecom-ta-heap19"}'
