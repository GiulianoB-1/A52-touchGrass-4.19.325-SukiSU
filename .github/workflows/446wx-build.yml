          python3 scripts/u1_port_legacy_qusb2_phy.py --root "$ROOT" --touchgrass "$PWD/workspace/touchgrass-a52xq" --check-only
          ! grep -aFq "A52U2 UDC handover: g_serial released" "$IMAGE"
          ! grep -aFq "A52U2 ConfigFS UDC bind result=" "$IMAGE"
          grep -aFq 'U446 UNBIND free_port before_close_wait' "$IMAGE"
          grep -aFq 'U446 HANDOVER_DISABLED' "$IMAGE"
          echo "P446U USB source/binary console-first audit PASS"
          ! grep -aFq 'A52_PHASE446F_SKIP_LATE_SMMU_COMPONENT_MATCH_V1' "$IMAGE"
          ! grep -aFq 'A52_PHASE446E_GKI_KEEP_EARLYMAP_BUILTIN_V1' "$IMAGE"
          grep -aFq 'A52_PHASE446D_POWER_CLOCK_MICROSCOPE_V1:GKI' "$IMAGE"
          grep -Fq ' a52_p446_read_cb2' "$MAP"
          grep -Fq ' a52_p446_mark' "$MAP"
          grep -Fq ' a52_p446_note_smmu' "$MAP"
          grep -Fq ' a52_p446_note_iova' "$MAP"
          grep -Fq ' a52_p446_register_dsi' "$MAP"
          grep -aFq 'R0_HOT_0_75US' "$IMAGE"
          grep -aFq 'DSI_KONA_BUS' "$IMAGE"
          grep -aFq 'MMC_MAJOR179' "$IMAGE"
          grep -Fq ' a52_p445_try_arm' "$MAP"
          grep -Fq ' a52_p445_store_section' "$MAP"
          grep -Fq ' a52_p445_gate_check' "$MAP"
          grep -Fq ' a52_p445_run_r2' "$MAP"
          ! grep -aFq 'A52_PHASE442_FIFO_FETCH_DISCRIMINATOR_V1' "$IMAGE"
          ccache -s
      - name: Preserve Phase446AF vmlinux for crash decoding
        if: success()
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          test -s "$BUILD/vmlinux"
          test -s "$BUILD/System.map"
          test -s "$ROOT/scripts/faddr2line"
          mkdir -p phase446af-debug
          cp "$BUILD/vmlinux" phase446af-debug/vmlinux
          cp "$BUILD/System.map" phase446af-debug/System.map
          cp "$ROOT/scripts/faddr2line" phase446af-debug/faddr2line
          cp "$BUILD/.config" phase446af-debug/final.config
          readelf -SW phase446af-debug/vmlinux | grep -F '.debug_info'
          printf '%s\n' "P446AF DWARF vmlinux retained for exact offset decoding" >> "$GITHUB_STEP_SUMMARY"
      - name: Save Phase445 object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: workspace/gki-phase199-out
          key: a52xq-phase441-vrr-state-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/441_apply_vrr_state_compat.py', 'scripts/440_apply_early_f0_cleanup_forensics.py', 'scripts/439_apply_dsi_autopsy.py', 'scripts/438_apply_devbw_semantic_parity.py') }}
      - name: Save rolling clang ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-phase440-${{ github.run_id }}
      - name: Package Phase446W-B/X retained splash, touchscreen built-in and RTC
        if: success()
        run: bash scripts/446z_package_preserved.sh
      - name: Upload Phase446i GKI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE446WX-GKI-FAIL-DIAG-${{ github.run_number }}
          path: |
            scripts/446m_apply_gdsc_irq_ab.py
