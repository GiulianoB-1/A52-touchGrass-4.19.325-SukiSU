name: Temporary Phase263 dispatch bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-262-temp-bridge.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Phase263 provider parity builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run 257-fast-a52-kgsl-publication-rebuild.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/a52-phase259-kgsl-node-lifetime-v1
          echo "Phase263 GKI 5.10 compatibility build dispatched: 8c12a6a295a49b936257dab6f15ab963fb1a4260"
