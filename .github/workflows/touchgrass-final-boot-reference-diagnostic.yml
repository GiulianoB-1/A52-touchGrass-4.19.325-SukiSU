name: TouchGrass final boot reference diagnostic

run-name: Diagnose TouchGrass final boot reference build

on:
  push:
    branches:
      - agent/touchgrass-final-boot-reference-recorder-v1
    paths:
      - .github/workflows/touchgrass-final-boot-reference-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: touchgrass-final-boot-reference-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  TOUCHGRASS_COMMIT: '6bf351bdf18bdb228db79e66f14a7a9c0178e5d7'
  TOUCHGRASS_CACHE_KEY: 'a52xq-touchgrass-linux-4.19.200-main-v2-Linux-6bf351bdf18bdb228db79e66f14a7a9c0178e5d7'
  RECORDER_CCACHE_KEY: 'touchgrass-final-boot-reference-resukisu-safe-ccache-v1-Linux'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out recorder branch
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils gzip zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ env.RECORDER_CCACHE_KEY }}
          restore-keys: |
            touchgrass-final-boot-reference-resukisu-safe-ccache-v1-${{ runner.os }}-
            touchgrass-gpu-reference-resukisu-safe-ccache-v1-${{ runner.os }}-
            a52xq-linux-4.19.200-ccache-${{ runner.os }}-

      - name: Restore exact TouchGrass Linux 4.19.200 source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: ${{ env.TOUCHGRASS_CACHE_KEY }}

      - name: Require cached source from failing run
        run: |
          set -Eeuo pipefail
          test '${{ steps.touchgrass-cache.outputs.cache-hit }}' = 'true'
          test -d workspace/touchgrass-a52xq/.git
          test "$(git -C workspace/touchgrass-a52xq rev-parse HEAD)" = "$TOUCHGRASS_COMMIT"
          test "$(make -s -C workspace/touchgrass-a52xq kernelversion)" = 4.19.200

      - name: Prepare exact ReSukiSU-safe dual-recorder integration
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/07_patch_resukisu_exec_hook.sh
          python3 scripts/touchgrass_final_boot_reference_resukisu_wrapper.py \
            scripts/08_build_linux_4.19.153_resukisu_safe.sh
          bash -n scripts/08_build_linux_4.19.153_resukisu_safe.sh

      - name: Build and preserve exact failure
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts
          ./scripts/08_build_resukisu_safe_checkpoint.sh 4.19.200 safe \
            2>&1 | tee artifacts/touchgrass-final-diagnostic-build.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > artifacts/touchgrass-final-diagnostic-exit-code.txt
          echo "BUILD_EXIT_CODE=$rc"
          echo '===== ERROR SUMMARY ====='
          grep -nE -C 4 '(^|[[:space:]])(error:|fatal error:|undefined reference|ld\.lld: error:|make(\[[0-9]+\])?: \*\*\*)' \
            artifacts/touchgrass-final-diagnostic-build.log | tail -n 500 || true
          echo '===== LAST 300 BUILD LINES ====='
          tail -n 300 artifacts/touchgrass-final-diagnostic-build.log || true
          exit "$rc"

      - name: Collect diagnostic source snapshots
        if: always()
        run: |
          set +e
          mkdir -p artifacts/final-recorder-diagnostic
          cp artifacts/touchgrass-final-diagnostic-build.log artifacts/final-recorder-diagnostic/ 2>/dev/null || true
          cp artifacts/touchgrass-final-diagnostic-exit-code.txt artifacts/final-recorder-diagnostic/ 2>/dev/null || true
          cp workspace/touchgrass-a52xq/kernel/tg_boot_reference.c artifacts/final-recorder-diagnostic/ 2>/dev/null || true
          cp workspace/touchgrass-a52xq/include/linux/tg_boot_reference.h artifacts/final-recorder-diagnostic/ 2>/dev/null || true
          cp workspace/touchgrass-a52xq/init/main.c artifacts/final-recorder-diagnostic/init-main.c 2>/dev/null || true
          cp workspace/touchgrass-a52xq/drivers/base/dd.c artifacts/final-recorder-diagnostic/drivers-base-dd.c 2>/dev/null || true
          cp workspace/touchgrass-a52xq/drivers/iommu/iommu.c artifacts/final-recorder-diagnostic/drivers-iommu-iommu.c 2>/dev/null || true
          cp workspace/touchgrass-a52xq/out/.config artifacts/final-recorder-diagnostic/final.config 2>/dev/null || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TouchGrass-Final-Recorder-Diagnostic-${{ github.run_number }}
          path: artifacts/final-recorder-diagnostic/
          if-no-files-found: warn
          retention-days: 7
