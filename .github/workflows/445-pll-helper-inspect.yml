name: Phase446 decoder inspect
run-name: Phase446 decoder composition audit
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit decoder fields
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          s=zlib.decompress(base64.b64decode(Path("scripts/decode_phase446.py.z64").read_text().strip())).decode()
          print("bytes",len(s))
          for k in ["sspp","ctl","lm","frame","event","S2CR","cb2","bus"]:
            print("\n###",k)
            p=0;n=0
            while True:
              i=s.lower().find(k.lower(),p)
              if i<0 or n>=8:break
              print(s[max(0,i-1000):min(len(s),i+2600)])
              p=i+len(k);n+=1
          PY
