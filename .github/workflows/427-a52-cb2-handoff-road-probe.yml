      - name: Build Phase427 CB2 handoff + road-probe boot image
        run: |
          set -Eeuo pipefail
          OUT="$PWD/phase427-gki-out"
          BASE="$OUT/package/boot.img"
          FINAL="$OUT/package/boot-phase427-cb2-handoff-road-probe-v1.img"
          test -s "$BASE"
          cp "$BASE" "$FINAL"

          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "a52_boot_repack", "scripts/38_repack_a52_p1_boot.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          base_path = Path("phase427-gki-out/package/boot.img")
          final = Path("phase427-gki-out/package/boot-phase427-cb2-handoff-road-probe-v1.img")
          base = module.parse_boot(base_path.read_bytes())
          data = bytearray(final.read_bytes())
          tokens = base["cmdline"].split()
          for tok in ("nohlt", "cpuidle.off=1", "panic=1"):
              key = tok.split("=", 1)[0]
              tokens = [x for x in tokens if x != tok and x.split("=", 1)[0] != key]
              tokens.append(tok)
          cmdline = " ".join(tokens)
          encoded = cmdline.encode("ascii")
          if len(encoded) > 1534:
              raise SystemExit(f"Phase411 command line too long: {len(encoded)}")
          data[64:576] = b"\0" * 512
          data[608:1632] = b"\0" * 1024
          first = encoded[:511]
          second = encoded[511:]
          data[64:64 + len(first)] = first
          data[608:608 + len(second)] = second
          final.write_bytes(data)

          out = module.parse_boot(final.read_bytes())
          assert "nohlt" in out["cmdline"].split()
          assert "cpuidle.off=1" in out["cmdline"].split()
          assert "panic=1" in out["cmdline"].split()
          assert "ignore_loglevel" in out["cmdline"].split()
          for key in ("header_version","page_size","board","kernel_addr",
                      "ramdisk_addr","tags_addr","kernel","ramdisk","second","dtb"):
              assert out[key] == base[key], key
          assert final.stat().st_size == base_path.stat().st_size
          Path("phase427-gki-out/PHASE427-BOOT.json").write_text(
              json.dumps({
                  "cmdline": out["cmdline"],
                  "treatment": "Phase427 reuses the exact firmware CB2 for non-secure display SID 0x800 using the existing earlymap context programming path; Phase422 follows CB2; added bus/TCS/HF0/IOVA diagnostics are read-only; nohlt cpuidle.off=1 panic=1",
                  "kernel_payload_unchanged_by_cmdline_patch": True,
              }, indent=2, sort_keys=True) + "\n")
          PY

          sha256sum "$FINAL"
          echo "Phase427 CB2 handoff + road-probe boot image: PASS"

