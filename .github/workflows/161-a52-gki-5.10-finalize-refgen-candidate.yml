name: 161 - Finalize successful A52 REFGEN build

run-name: Audit and package the successful ACK 5.10 REFGEN kernel

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/161-a52-gki-5.10-finalize-refgen-candidate.yml
      - scripts/38_repack_a52_p1_boot.py
  pull_request:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - diagnostics/refgen-finalize-trigger.txt
      - .github/workflows/161-a52-gki-5.10-finalize-refgen-candidate.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-finalize-refgen-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  RUN32_ARTIFACT_ID: '8635093061'
  REFGEN_BUILD_ARTIFACT_ID: '8646194609'

jobs:
  finalize-package:
    name: Verify successful REFGEN Image and package boot candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates unzip python3 gzip file
          python3 -m py_compile scripts/38_repack_a52_p1_boot.py

      - name: Download successful REFGEN build and verified Run 32 boot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p refgen/extracted run32/extracted
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFGEN_BUILD_ARTIFACT_ID}/zip" \
            --output refgen/artifact.zip
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN32_ARTIFACT_ID}/zip" \
            --output run32/artifact.zip
          unzip -q refgen/artifact.zip -d refgen/extracted
          unzip -q run32/artifact.zip -d run32/extracted
          (cd run32/extracted && sha256sum -c SHA256SUMS)
          test -s run32/extracted/package/boot.img
          test -s run32/extracted/tools/decode-a52-unified-secure-recorder.py

      - name: Audit the successful REFGEN kernel build
        run: |
          set -Eeuo pipefail
          ROOT=refgen/extracted
          test -s "$ROOT/compile/Image"
          test -s "$ROOT/package/Image.gz"
          test -s "$ROOT/logs/compile.log"
          test -s "$ROOT/config/final.config"
          test -s "$ROOT/stage/phase25-a52-failure-window-probe-report.json"
          test -s "$ROOT/stage/phase26-a52-refgen-regulator-report.json"
          test "$(tr -d '\r\n' < "$ROOT/compile/make-return-code.txt")" = 0
          gzip -t "$ROOT/package/Image.gz"
          gzip -n -9 -c "$ROOT/compile/Image" > refgen/rebuilt-Image.gz
          cmp -s refgen/rebuilt-Image.gz "$ROOT/package/Image.gz"
          grep -Fxq 'CONFIG_REGULATOR_REFGEN=y' "$ROOT/config/final.config"
          grep -Fxq 'CONFIG_QCOM_WDT=y' "$ROOT/config/final.config"
          grep -Fxq 'CONFIG_WATCHDOG=y' "$ROOT/config/final.config"

          if grep -nE '(^|: )(fatal error|error): |undefined reference to' \
              "$ROOT/logs/compile.log" > refgen/compiler-errors.txt; then
            cat refgen/compiler-errors.txt
            exit 1
          fi
          grep -Fq 'OBJCOPY arch/arm64/boot/Image' "$ROOT/logs/compile.log"

          while IFS= read -r marker; do
            test -n "$marker"
            if ! grep -aFq "$marker" "$ROOT/compile/Image"; then
              printf 'Missing compiled marker: %s\n' "$marker" >&2
              exit 1
            fi
          done <<'EOF'
          qcom,refgen-kona-regulator
          REFGEN driver_register rc=%d
          REFGEN probe enter compat=%s
          REFGEN mapped start=0x%llx size=%llu raw=0x%x
          REFGEN probe ready initial_enabled=%d
          REFGEN kona_state raw=0x%x enabled=%d
          REFGEN kona_enable raw=0x%x->0x%x enabled=%u
          REFGEN kona_disable raw=0x%x->0x%x enabled=%u
          A52 REFGEN regulator registered, initial state=%d
          HB tick=%u online=%u run=%lu j=%lu
          WDT disarm before=%u after=%u
          A52USR2 BOOT_EARLY stage=mm_init backend=early-mirrored
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('refgen/extracted/stage')
          recorder = json.loads((root / 'phase25-a52-failure-window-probe-report.json').read_text())
          refgen = json.loads((root / 'phase26-a52-refgen-regulator-report.json').read_text())
          assert recorder['status'] == 'a52-failure-window-probe-v1-staged'
          assert recorder['recorder']['heartbeat_interval_ms'] == 500
          assert recorder['recorder']['continuous_persistence_after_capacity'] is True
          assert recorder['watchdog']['firmware_watchdog_disarmed'] is True
          assert recorder['watchdog']['registration_bypassed'] is True
          assert refgen['status'] == 'a52-refgen-display-supply-v1-staged'
          assert refgen['config'] == 'CONFIG_REGULATOR_REFGEN=y'
          assert refgen['stock_dtb_compatible'] == 'qcom,refgen-kona-regulator'
          assert refgen['instrumentation']['payload_capture'] is False
          for key in ('register', 'probe', 'is_enabled', 'enable', 'disable'):
              assert refgen['instrumentation'][key] is True
          PY

      - name: Repack and audit the REFGEN boot image
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-refgen-display-fix
          mkdir -p "$OUT"
          cp -a refgen/extracted/. "$OUT/"

          python3 scripts/38_repack_a52_p1_boot.py \
            --source run32/extracted/package/boot.img \
            --kernel "$OUT/package/Image.gz" \
            --output "$OUT/package/boot.img" \
            --report "$OUT/package/repack-report.json"
          test -s "$OUT/package/boot.img"
          mkdir -p "$OUT/tools"
          cp run32/extracted/tools/decode-a52-unified-secure-recorder.py \
            "$OUT/tools/decode-a52-unified-secure-recorder.py"

          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-refgen-display-fix')
          recorder = json.loads((root / 'stage/phase25-a52-failure-window-probe-report.json').read_text())
          refgen = json.loads((root / 'stage/phase26-a52-refgen-regulator-report.json').read_text())
          repack = json.loads((root / 'package/repack-report.json').read_text())
          compile_log = (root / 'logs/compile.log').read_text(errors='replace')
          errors = re.findall(
              r'^[^:\s][^:]*:\d+:\d+: (?:fatal error|error): ',
              compile_log,
              re.M,
          )
          image = root / 'compile/Image'
          image_gz = root / 'package/Image.gz'
          boot = root / 'package/boot.img'
          final = {
              'status': 'a52-refgen-display-fix-boot-audited',
              'flashable_candidate': True,
              'hardware_validated': False,
              'root_cause_status': 'leading-hypothesis-requires-device-test',
              'source_build_run_id': 30247714317,
              'source_build_artifact_id': 8646194609,
              'source_make_return_code': 0,
              'stock_dtb_provider': refgen['stock_dtb_compatible'],
              'refgen_built_in': True,
              'refgen_instrumented': True,
              'payload_capture': False,
              'compiler_error_count': len(errors),
              'heartbeat_interval_ms': recorder['recorder']['heartbeat_interval_ms'],
              'watchdog_disarmed_in_probe': recorder['watchdog']['firmware_watchdog_disarmed'],
              'watchdog_registration_bypassed': recorder['watchdog']['registration_bypassed'],
              'image_sha256': hashlib.sha256(image.read_bytes()).hexdigest(),
              'image_gz_sha256': hashlib.sha256(image_gz.read_bytes()).hexdigest(),
              'boot_sha256': hashlib.sha256(boot.read_bytes()).hexdigest(),
              'boot_bytes': boot.stat().st_size,
              'dtb_preserved': repack['invariants']['dtb_preserved'],
              'ramdisk_preserved': repack['invariants']['ramdisk_preserved'],
              'recovery_dtbo_preserved': repack['invariants']['recovery_dtbo_preserved'],
          }
          if errors:
              raise SystemExit(f'compiler errors survived audit: {len(errors)}')
          if not all((
              final['dtb_preserved'],
              final['ramdisk_preserved'],
              final['recovery_dtbo_preserved'],
          )):
              raise SystemExit('boot-container preservation audit failed')
          (root / 'final-audit.json').write_text(
              json.dumps(final, indent=2, sort_keys=True) + '\n'
          )
          PY

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 GKI 5.10 REFGEN DISPLAY-SUPPLY CANDIDATE

          This package finalizes the successful Workflow 160 kernel build. The
          original workflow reported failure only because a MODULE_DESCRIPTION
          string was not retained in the built-in Image. The compiler returned 0,
          the final Image was linked, and all runtime REFGEN and recorder markers
          were verified before this boot image was repacked.

          Test procedure:
          1. Back up the currently working boot partition.
          2. Flash only package/boot.img using the same proven method as Run 32.
          3. Observe whether Android reaches and retains the lock screen.
          4. If the screen still goes black, leave it for at least 15 seconds.
          5. Reboot directly into recovery and collect the untouched raw 1 MiB RAMOOPS image.

          This image is not hardware validated. Keep the known-working rollback image available.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload audited REFGEN candidate
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-refgen-display-fix-final-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-gki-refgen-display-fix
          if-no-files-found: error
          retention-days: 14

      - name: Require final audited output
        run: |
          set -Eeuo pipefail
          test -s artifacts/a52xq-gki-refgen-display-fix/package/boot.img
          grep -Fq '"status": "a52-refgen-display-fix-boot-audited"' \
            artifacts/a52xq-gki-refgen-display-fix/final-audit.json
          grep -Fq '"source_make_return_code": 0' \
            artifacts/a52xq-gki-refgen-display-fix/final-audit.json
          grep -Fq '"refgen_built_in": true' \
            artifacts/a52xq-gki-refgen-display-fix/final-audit.json
