name: 132 - A52 RNDIS IPA PM P1

on:
  push:
    branches:
      - agent/a52-rndis-ipa-pm-p1
    paths:
      - .github/workflows/132-a52-rndis-ipa-pm-p1.yml
      - scripts/129_apply_bpf_bootfix_p1.py
      - scripts/132_apply_rndis_ipa_pm_p1.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-rndis-ipa-pm-p1-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  IMAGE: artifacts/Image-touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b

jobs:
  build:
    name: Build exact 35633887441 baseline + RNDIS IPA PM P1
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-f2fs325-p1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52xq-effp1-recorder-${{ runner.os }}-
            a52xq-f2fs325-p1-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Restore exact 35633887441 pre-RNDIS source cache
        id: prerndis_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base35633887441-prerndis-${{ runner.os }}-v1

      - name: Restore baseline pre-build source cache
        if: steps.prerndis_source.outputs.cache-hit != 'true'
        id: prebuild_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-effp1-recorder-prebuild-${{ runner.os }}-${{ hashFiles('scripts/104_apply_fuse_740_upstream_passthrough.py', 'scripts/106_apply_mglru_modern_p1.py', 'scripts/106_apply_mglru_modern_p1_core.py', 'scripts/107_apply_mglru_modern_p2.py', 'scripts/108_apply_mglru_modern_p3.py', 'scripts/109_apply_eevdf_efficiency_p1.py', 'scripts/109b_finalize_eevdf_efficiency_p1.py', 'scripts/110_apply_uclamp_efficiency_p1.py', 'scripts/110b_finalize_uclamp_efficiency_p1.py', 'scripts/111_apply_mglru_power_diag_p1.py', 'scripts/112_apply_mglru_power_recorder_p2.py', 'scripts/115_apply_a52_efficiency_p1.py', 'scripts/116_apply_a52_scheduler_recorder.py', 'scripts/117_migrate_mglru_trace_to_proc.py') }}

      - name: Restore exact 35196552336 prepared source cache
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        id: base351_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base352494-clean-nobt-recorder-pre-fuse104-${{ runner.os }}-v4

      - name: Restore Linux stable object cache
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true' && steps.base351_source.outputs.cache-hit != 'true'
        id: stable_cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/linux-stable-checkpoint-cache
          key: a52xq-linux-stable-4.19.200-${{ runner.os }}-v2

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts release workspace
          chmod +x scripts/*.sh scripts/*.py

      - name: Reconstruct exact 35196552336 pre-FUSE104 baseline
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true' && steps.base351_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          ./scripts/01_prepare_source.sh
          ./scripts/03_apply_linux_4.19.153.sh
          ./scripts/04_apply_linux_4.19.154.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.154 4.19.159
          ./scripts/checkpoint_resolve_linux_4.19.159.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.159 4.19.164
          ./scripts/checkpoint_resolve_linux_4.19.164.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.164 4.19.180
          ./scripts/checkpoint_resolve_linux_4.19.180.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.180 4.19.200
          ./scripts/checkpoint_resolve_linux_4.19.200.sh
          ./scripts/57_update_linux_4.19.200_to_4.19.206.sh
          ./scripts/58_backport_bpf_ringbuf.sh
          ./scripts/58_apply_ringbuf_overrun_fix.sh
          ./scripts/07_patch_resukisu_exec_hook.sh

          python3 scripts/59_apply_eevdf_phase1_scaffold.py workspace/touchgrass-a52xq
          python3 scripts/60_apply_eevdf_phase2_accounting.py workspace/touchgrass-a52xq
          python3 scripts/61_apply_eevdf_phase3_deadline_lag.py workspace/touchgrass-a52xq
          python3 scripts/62_apply_eevdf_phase4_tree_picker.py workspace/touchgrass-a52xq
          python3 scripts/63_apply_eevdf_phase5_picker_integration.py workspace/touchgrass-a52xq
          python3 scripts/64_apply_eevdf_phase6_wakeup_preempt.py workspace/touchgrass-a52xq
          python3 scripts/65_apply_eevdf_phase7_placement_consistency.py workspace/touchgrass-a52xq
          python3 scripts/74_apply_eevdf_multitask_correctness.py workspace/touchgrass-a52xq
          python3 scripts/77_apply_eevdf_lifecycle_correctness.py workspace/touchgrass-a52xq
          python3 scripts/78_apply_eevdf77_cass_hybrid.py workspace/touchgrass-a52xq

          ./scripts/79_apply_mglru_phase1.sh
          python3 scripts/80_apply_mglru_android_hardening.py workspace/touchgrass-a52xq

          ./scripts/81_apply_android17_binder_core_probe.sh
          python3 scripts/82_enable_retained_binderfs.py workspace/touchgrass-a52xq
          ./scripts/84_apply_android17_binder_alloc.sh
          python3 scripts/84_apply_fuse_passthrough_android.py workspace/touchgrass-a52xq

          python3 scripts/85_apply_android17_uclamp_phase1.py workspace/touchgrass-a52xq
          python3 scripts/86_apply_uclamp_cass_p2.py workspace/touchgrass-a52xq

          python3 scripts/85_apply_a619_gpu_modernization.py workspace/touchgrass-a52xq
          python3 scripts/87_apply_a619_gpu_modernization_p2.py workspace/touchgrass-a52xq
          python3 scripts/90_apply_a619_gpu_modernization_p3.py workspace/touchgrass-a52xq
          python3 scripts/91_apply_a619_gpu_modernization_p4.py workspace/touchgrass-a52xq
          python3 scripts/94_apply_a619_gpu_modernization_p5.py workspace/touchgrass-a52xq

          ./scripts/87_apply_bbr3_net.sh workspace/touchgrass-a52xq


          python3 scripts/98_apply_fuse_passthrough_modern_p1.py workspace/touchgrass-a52xq
          python3 scripts/99_apply_fuse_passthrough_modern_p2.py workspace/touchgrass-a52xq
          python3 scripts/101_apply_fuse_passthrough_modern_p3.py workspace/touchgrass-a52xq
          python3 scripts/102_apply_fuse_negotiation_probe.py workspace/touchgrass-a52xq
          python3 scripts/103_apply_fuse_740_init_compat.py workspace/touchgrass-a52xq

          python3 scripts/104_apply_a619_gpu_undervolt_p1.py workspace/touchgrass-a52xq
          python3 scripts/105_apply_a619_gpu_undervolt_p1_diag.py workspace/touchgrass-a52xq
          python3 scripts/106_apply_mglru_modern_p1.py workspace/touchgrass-a52xq

          git -C workspace/touchgrass-a52xq diff --check

      - name: Audit inherited EEVDF UCLAMP and 35196552336 state
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          test -d "$KERNEL/.git"
          grep -Fq 'ENQUEUE_INITIAL' "$KERNEL/kernel/sched/sched.h"
          grep -Fq 'eevdf_status_init' "$KERNEL/kernel/sched/fair.c"
          grep -Fq 'sched_eevdf_enabled' "$KERNEL/kernel/sched/fair.c"
          grep -Fq 'U17 uclamp + WALT schedutil compatibility path active' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          grep -Fq 'unsigned long p_util = uclamp_task(p);' "$KERNEL/kernel/sched/cass.c"
          grep -Fq 'CASS uclamp-aware task demand path is active' "$KERNEL/kernel/sched/cass.c"
          grep -Fq 'sched_util_clamp_min_rt_default' "$KERNEL/kernel/sysctl.c"
          grep -Fq 'uclamp_sync_util_min_rt_default();' "$KERNEL/kernel/sched/core.c"
          grep -Fq '#define FUSE_KERNEL_MINOR_VERSION 40' "$KERNEL/include/uapi/linux/fuse.h"
          grep -Fq 'arg->flags2 = 0;' "$KERNEL/fs/fuse/inode.c"
          grep -Fq 'A52 MGLRU Modern P1: Android17 9eff4247' "$KERNEL/mm/vmscan.c"
          grep -Fq 'A52 MGLRU Modern P1: Android a7adb988 per-zone forward progress' "$KERNEL/mm/vmscan.c"
          grep -Fq 'ptep_clear_young_notify(pvmw->vma, addr, pte + i)' "$KERNEL/mm/vmscan.c"
          grep -Fq 'A52 MGLRU Modern P3: upstream c28ac3c7 skip special VMAs' "$KERNEL/mm/vmscan.c"
          grep -Fq 'sysctl_sched_uclamp_util_min_rt_default = 0;' "$KERNEL/kernel/sched/core.c"
          grep -Fq 'A52 uclamp efficiency P1' "$KERNEL/kernel/sched/core.c"
          grep -Fq 'unsigned long p_util = uclamp_task(p);' "$KERNEL/kernel/sched/cass.c"
          grep -Fq 'A52 A619 GPU UV P1 diagnostics: persistent sysfs status' "$KERNEL/drivers/gpu/msm/kgsl_gmu.c"
          grep -Fq 'A52 A619 GPU UV P2: 650 MHz one ARC corner' "$KERNEL/drivers/gpu/msm/kgsl_gmu.c"
          grep -Fq 'A52 A619 GPU UV P3: 565 MHz one ARC corner' "$KERNEL/drivers/gpu/msm/kgsl_gmu.c"
          ! grep -Fq 'A52 BT-P2A:' "$KERNEL/drivers/tty/serial/msm_geni_serial.c"
          ! grep -Fq 'A52 BT-P2B:' "$KERNEL/drivers/tty/serial/msm_geni_serial.c"
          ! grep -Fq 'A52 BT-P2C:' "$KERNEL/drivers/tty/serial/msm_geni_serial.c"
          git -C "$KERNEL" diff --check

      - name: Save exact 35196552336 prepared source cache
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true' && steps.base351_source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base352494-clean-nobt-recorder-pre-fuse104-${{ runner.os }}-v4

      - name: Save Linux stable object cache
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true' && steps.base351_source.outputs.cache-hit != 'true' && steps.stable_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/linux-stable-checkpoint-cache
          key: a52xq-linux-stable-4.19.200-${{ runner.os }}-v2

      - name: Restore inherited MGLRU diagnostics and recorder
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq

          if grep -Fq '/* A52 MGLRU power diagnostics P1 */' "$KERNEL/mm/vmscan.c"; then
            echo "CACHE/STATE: MGLRU diagnostics P1 already present"
          else
            python3 -m py_compile scripts/111_apply_mglru_power_diag_p1.py
            python3 scripts/111_apply_mglru_power_diag_p1.py "$KERNEL" \
              2>&1 | tee artifacts/mglru-power-diag-p1-apply.txt
          fi

          if grep -Fq '/* A52 MGLRU power recorder P2 */' "$KERNEL/mm/vmscan.c"; then
            echo "CACHE/STATE: MGLRU recorder P2 already present"
          else
            python3 -m py_compile scripts/112_apply_mglru_power_recorder_p2.py
            python3 scripts/112_apply_mglru_power_recorder_p2.py "$KERNEL" \
              2>&1 | tee artifacts/mglru-power-recorder-p2-apply.txt
          fi

          grep -Fq '/* A52 MGLRU power diagnostics P1 */' "$KERNEL/mm/vmscan.c"
          grep -Fq '/* A52 MGLRU power recorder P2 */' "$KERNEL/mm/vmscan.c"
          grep -Fq 'static int mglru_record_level;' "$KERNEL/mm/vmscan.c"
          grep -Fq 'static const struct file_operations mglru_rec_trace_fops' "$KERNEL/mm/vmscan.c"
          grep -Fq 'debugfs_create_file("lru_gen_trace", 0444, NULL, NULL, &mglru_rec_trace_fops);' "$KERNEL/mm/vmscan.c"
          git -C "$KERNEL" diff --check

      - name: Apply A52 MGLRU CASS UCLAMP WALT efficiency P1
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          must_grep() {
            local needle="$1" file="$2" label="$3"
            if grep -Fq "$needle" "$file"; then
              echo "AUDIT PASS: $label"
            else
              echo "::error::AUDIT MISSING: $label"
              echo "needle=$needle"
              echo "file=$file"
              return 1
            fi
          }
          python3 -m py_compile scripts/115_apply_a52_efficiency_p1.py
          python3 scripts/115_apply_a52_efficiency_p1.py workspace/touchgrass-a52xq \
            2>&1 | tee artifacts/a52-efficiency-p1-apply.txt
          python3 -m py_compile scripts/117_migrate_mglru_trace_to_proc.py
          python3 scripts/117_migrate_mglru_trace_to_proc.py workspace/touchgrass-a52xq \
            2>&1 | tee artifacts/mglru-procfs-migration-apply.txt
          KERNEL=workspace/touchgrass-a52xq
          must_grep 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts' "$KERNEL/mm/vmscan.c" 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts'
          must_grep 'A52 MGLRU power diagnostics P1' "$KERNEL/mm/vmscan.c" 'A52 MGLRU power diagnostics P1'
          must_grep 'A52 MGLRU power recorder P2' "$KERNEL/mm/vmscan.c" 'A52 MGLRU power recorder P2'
          must_grep '__ATTR(record, 0644, mglru_record_show, mglru_record_store)' "$KERNEL/mm/vmscan.c" '__ATTR(record, 0644, mglru_record_show, mglru_record_store)'
          must_grep '__ATTR(stats, 0644, mglru_rec_stats_show, mglru_rec_stats_store)' "$KERNEL/mm/vmscan.c" '__ATTR(stats, 0644, mglru_rec_stats_show, mglru_rec_stats_store)'
          must_grep 'proc_create("lru_gen_trace", 0444, NULL, &mglru_rec_trace_fops)' "$KERNEL/mm/vmscan.c" 'proc_create("lru_gen_trace", 0444, NULL, &mglru_rec_trace_fops)'
          must_grep 'static int mglru_record_level;' "$KERNEL/mm/vmscan.c" 'static int mglru_record_level;'
          must_grep 'if (unlikely(READ_ONCE(mglru_record_level) >= 1))' "$KERNEL/mm/vmscan.c" 'if (unlikely(READ_ONCE(mglru_record_level) >= 1))'
          must_grep 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active' "$KERNEL/kernel/sched/cass.c" 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active'
          must_grep 'if (likely(!uclamp_is_used()))' "$KERNEL/kernel/sched/sched.h" 'if (likely(!uclamp_is_used()))'
          must_grep 'A52 WALT schedutil P2: expire stale sibling demand by wall time.' "$KERNEL/kernel/sched/cpufreq_schedutil.c" 'A52 WALT schedutil P2: expire stale sibling demand by wall time.'
          must_grep 'A52 A619 GPU UV P3: 565 MHz one ARC corner' "$KERNEL/drivers/gpu/msm/kgsl_gmu.c" 'A52 A619 GPU UV P3: 565 MHz one ARC corner'
          must_grep 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts' "$KERNEL/mm/vmscan.c" 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts'
          must_grep 'A52 MGLRU power recorder P2' "$KERNEL/mm/vmscan.c" 'A52 MGLRU power recorder P2'
          must_grep '__ATTR(record, 0644, mglru_record_show, mglru_record_store)' "$KERNEL/mm/vmscan.c" '__ATTR(record, 0644, mglru_record_show, mglru_record_store)'
          must_grep 'proc_create("lru_gen_trace", 0444, NULL, &mglru_rec_trace_fops)' "$KERNEL/mm/vmscan.c" 'proc_create("lru_gen_trace", 0444, NULL, &mglru_rec_trace_fops)'
          must_grep 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active' "$KERNEL/kernel/sched/cass.c" 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active'
          must_grep 'A52 WALT schedutil P2: expire stale sibling demand by wall time.' "$KERNEL/kernel/sched/cpufreq_schedutil.c" 'A52 WALT schedutil P2: expire stale sibling demand by wall time.'
          if grep -Fq 'A52 BT-P2C:' "$KERNEL/drivers/tty/serial/msm_geni_serial.c"; then
            echo "::error::AUDIT UNEXPECTED: custom BT P2C marker present"
            exit 1
          fi
          echo "AUDIT PASS: custom BT P2C absent"
          git -C "$KERNEL" diff --check
          echo "AUDIT PASS: git diff --check"

      - name: Apply CASS UCLAMP WALT schedutil recorder
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/116_apply_a52_scheduler_recorder.py
          python3 scripts/116_apply_a52_scheduler_recorder.py workspace/touchgrass-a52xq \
            2>&1 | tee artifacts/a52-scheduler-recorder-apply.txt
          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'A52 scheduler efficiency recorder' "$KERNEL/kernel/sched/core.c"
          grep -Fq 'int a52_sched_diag_level;' "$KERNEL/kernel/sched/core.c"
          grep -Fq 'kobject_create_and_add("a52_sched_diag", kernel_kobj)' "$KERNEL/kernel/sched/core.c"
          grep -Fq 'proc_create("a52_sched_diag_events", 0444, NULL' "$KERNEL/kernel/sched/core.c"
          grep -Fq 'a52_sched_diag_cass(best->cpu' "$KERNEL/kernel/sched/cass.c"
          grep -Fq 'a52_sched_diag_sugov_stale(j, delta_ns);' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          grep -Fq 'a52_sched_diag_sugov_freq(policy->cpu, util, max' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          git -C "$KERNEL" diff --check

      - name: Apply runtime-proven native FUSE 7.40 Phase104
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/104_apply_fuse_740_upstream_passthrough.py
          python3 scripts/104_apply_fuse_740_upstream_passthrough.py workspace/touchgrass-a52xq \
            2>&1 | tee artifacts/fuse-740-native-apply.txt
          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'arg->flags2 = (u32)(FUSE_PASSTHROUGH_UPSTREAM >> 32);' "$KERNEL/fs/fuse/inode.c"
          grep -Fq 'FUSE_740_PASSTHROUGH_NEGOTIATED' "$KERNEL/fs/fuse/inode.c"
          grep -Fq 'FUSE_740_LEGACY_STACK_COMPAT' "$KERNEL/fs/fuse/backing.c"
          grep -Fq 'FUSE_740_BACKING_OPEN' "$KERNEL/fs/fuse/backing.c"
          grep -Fq 'FUSE_740_PASSTHROUGH_SETUP' "$KERNEL/fs/fuse/passthrough.c"
          git -C "$KERNEL" diff --check

      - name: Save reconstructed baseline pre-build source cache
        if: steps.prerndis_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-effp1-recorder-prebuild-${{ runner.os }}-${{ hashFiles('scripts/104_apply_fuse_740_upstream_passthrough.py', 'scripts/106_apply_mglru_modern_p1.py', 'scripts/106_apply_mglru_modern_p1_core.py', 'scripts/107_apply_mglru_modern_p2.py', 'scripts/108_apply_mglru_modern_p3.py', 'scripts/109_apply_eevdf_efficiency_p1.py', 'scripts/109b_finalize_eevdf_efficiency_p1.py', 'scripts/110_apply_uclamp_efficiency_p1.py', 'scripts/110b_finalize_uclamp_efficiency_p1.py', 'scripts/111_apply_mglru_power_diag_p1.py', 'scripts/112_apply_mglru_power_recorder_p2.py', 'scripts/115_apply_a52_efficiency_p1.py', 'scripts/116_apply_a52_scheduler_recorder.py', 'scripts/117_migrate_mglru_trace_to_proc.py') }}

      - name: Apply compatible F2FS stable fixes through 4.19.325
        if: steps.prerndis_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          ./scripts/118_apply_f2fs_stable_325_p1.sh \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-stable325-p1.txt \
            artifacts/f2fs-stable325-patches
          cat artifacts/f2fs-stable325-p1.txt
          git -C workspace/touchgrass-a52xq diff --stat | tee artifacts/f2fs-stable325-diffstat.txt
          git -C workspace/touchgrass-a52xq diff -- fs/f2fs include/linux/f2fs_fs.h \
            > artifacts/f2fs-stable325-p1.diff || true

      - name: Apply F2FS gc_merge P2
        if: steps.prerndis_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          python3 scripts/119_apply_f2fs_gc_merge_p2.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff --check
          git -C workspace/touchgrass-a52xq diff --stat | tee artifacts/f2fs-gcmerge-p2-diffstat.txt
          git -C workspace/touchgrass-a52xq diff -- fs/f2fs > artifacts/f2fs-gcmerge-p2.diff
          grep -Fq 'F2FS_MOUNT_GC_MERGE' workspace/touchgrass-a52xq/fs/f2fs/f2fs.h
          grep -Fq 'waitqueue_active(fggc_wq)' workspace/touchgrass-a52xq/fs/f2fs/gc.c
          grep -Fq 'prepare_to_wait(&sbi->gc_thread->fggc_wq' workspace/touchgrass-a52xq/fs/f2fs/segment.c
          grep -Fq 'f2fs_submit_merged_write(sbi, DATA)' workspace/touchgrass-a52xq/fs/f2fs/segment.c
          grep -Fq '"gc_merge"' workspace/touchgrass-a52xq/fs/f2fs/super.c

      - name: Apply F2FS inmem curseg P3A
        if: steps.prerndis_source.outputs.cache-hit != 'true'
        run: |
