name: 116 - A52 GKI 5.10 final residual closure

run-name: Close the final nine compile errors after Workflow 115

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/116-a52-gki-5.10-final-residuals.yml'
      - 'scripts/116_apply_a52xq_final_residuals.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-gki-5.10-active-port-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_SHA: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  WORKFLOW99_ARTIFACT_ID: '8590238316'
  WORKFLOW100_ARTIFACT_ID: '8591698036'
  WORKFLOW115_ARTIFACT_ID: '8611526403'

jobs:
  final-residual-closure:
    name: Close final residual compile errors
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves device-tree-compiler
          python3 -m py_compile \
            scripts/a52xq_downstream_port_probe_v3.py \
            scripts/103_apply_a52xq_phase1_compat.py \
            scripts/104_apply_a52xq_phase2_kernel_api.py \
            scripts/105_apply_a52xq_display_contract.py \
            scripts/106_apply_a52xq_prfmt_pm_qos.py \
            scripts/107_apply_a52xq_clk_div_debugfs.py \
            scripts/108_apply_a52xq_v4l2_format_abi.py \
            scripts/109_apply_a52xq_mmio_drm_helpers.py \
            scripts/110_apply_a52xq_cache_fallbacks.py \
            scripts/111_apply_a52xq_secure_ion_highmem.py \
            scripts/112_apply_a52xq_ddr_topology.py \
            scripts/113_apply_a52xq_clk_set_flags.py \
            scripts/114_apply_a52xq_drm_legacy_fields.py \
            scripts/115_apply_a52xq_all_known_compat.py \
            scripts/115_apply_a52xq_all_known_compat_base.py \
            scripts/115_apply_a52xq_secondary_compat.py \
            scripts/116_apply_a52xq_final_residuals.py

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Download verified baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          download() {
            local name="$1" id="$2"
            mkdir -p "${name}/extracted"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "${name}/artifact.zip"
            unzip -q "${name}/artifact.zip" -d "${name}/extracted"
            (cd "${name}/extracted" && sha256sum -c SHA256SUMS)
          }
          download workflow99 "${WORKFLOW99_ARTIFACT_ID}"
          download workflow100 "${WORKFLOW100_ARTIFACT_ID}"
          download workflow115 "${WORKFLOW115_ARTIFACT_ID}"
          test -s workflow99/extracted/full-integrated-rpmh-mode-abi-fix.patch
          test -s workflow100/extracted/preserved.dts
          test -s workflow115/extracted/config/final.config
          test -s workflow115/extracted/compile/compile-incompatibilities.json
          grep -Fq '"compiler_error_count": 9' workflow115/extracted/final-state.json
          grep -Fq '"workflow99_baseline_preserved": true' workflow115/extracted/final-state.json

      - name: Replay hardware-tested Workflow 99 source
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          git -C gki/common reset --hard "${GKI_COMMON_SHA}"
          git -C gki/common clean -fd
          PATCH="$PWD/workflow99/extracted/full-integrated-rpmh-mode-abi-fix.patch"
          git -C gki/common apply --check "$PATCH"
          git -C gki/common apply "$PATCH"

      - name: Fetch exact working TouchGrass source
        run: |
          set -Eeuo pipefail
          rm -rf touchgrass
          git init touchgrass
          git -C touchgrass remote add origin \
            https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
          git -C touchgrass fetch --depth=1 origin "${TOUCHGRASS_SHA}"
          git -C touchgrass checkout --detach FETCH_HEAD
          test "$(git -C touchgrass rev-parse HEAD)" = "${TOUCHGRASS_SHA}"

      - name: Recreate Workflow 115 source state
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-final-residuals
          mkdir -p "$OUT/logs" "$OUT/stage" "$OUT/config" "$OUT/compile"
          python3 scripts/a52xq_downstream_port_probe_v3.py \
            --touchgrass touchgrass --gki gki/common \
            --dts workflow100/extracted/preserved.dts --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/stage-port.log"
          python3 scripts/103_apply_a52xq_phase1_compat.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/phase1-stage.log"
          python3 scripts/104_apply_a52xq_phase2_kernel_api.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/phase2-stage.log"
          python3 scripts/105_apply_a52xq_display_contract.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/display-contract-stage.log"
          python3 scripts/106_apply_a52xq_prfmt_pm_qos.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/prfmt-pm-qos-stage.log"
          python3 scripts/107_apply_a52xq_clk_div_debugfs.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/clk-div-debugfs-stage.log"
          python3 scripts/108_apply_a52xq_v4l2_format_abi.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/v4l2-format-abi-stage.log"
          python3 scripts/109_apply_a52xq_mmio_drm_helpers.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/mmio-drm-helper-stage.log"
          python3 scripts/110_apply_a52xq_cache_fallbacks.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/cache-fallback-stage.log"
          python3 scripts/111_apply_a52xq_secure_ion_highmem.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/secure-highmem-stage.log"
          python3 scripts/112_apply_a52xq_ddr_topology.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/ddr-topology-stage.log"
          python3 scripts/113_apply_a52xq_clk_set_flags.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/clk-set-flags-stage.log"
          python3 scripts/114_apply_a52xq_drm_legacy_fields.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/drm-legacy-fields-stage.log"
          python3 scripts/115_apply_a52xq_all_known_compat.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/all-known-compat-stage.log"
          test -s "$OUT/stage/phase13-all-known-compat-report.json"

      - name: Apply final residual fixes
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-final-residuals
          python3 scripts/116_apply_a52xq_final_residuals.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/final-residual-stage.log"
          test -s "$OUT/stage/phase14-final-residuals-report.json"
          grep -Fq 'phase14-final-residuals-staged' \
            "$OUT/stage/phase14-final-residuals-report.json"

      - name: Resolve migrated configuration
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-5.10-final-residuals"
          BUILD="$PWD/workspace/gki-final-residuals-out"
          mkdir -p "$BUILD"
          cp workflow115/extracted/config/final.config "$BUILD/.config"
          cp "$BUILD/.config" "$OUT/config/before.config"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            olddefconfig 2>&1 | tee "$OUT/logs/olddefconfig.log"
          cp "$BUILD/.config" "$OUT/config/final.config"

      - name: Compile final residual candidate
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-5.10-final-residuals"
          BUILD="$PWD/workspace/gki-final-residuals-out"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          "$CLANG" --version | tee "$OUT/logs/toolchain.log"
          set +e
          make -k -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
            KCFLAGS=-Wno-error=frame-larger-than Image \
            > "$OUT/logs/port-compile.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/compile/make-return-code.txt"
          if test -s "$BUILD/arch/arm64/boot/Image"; then
            cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image-NON-FLASHABLE"
          fi

      - name: Measure final closure
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import collections
          import json
          import re
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-5.10-final-residuals')
          baseline = json.loads(Path(
              'workflow115/extracted/compile/compile-incompatibilities.json'
          ).read_text())
          log = root / 'logs/port-compile.log'
          compiler = re.compile(
              r'^(?P<file>[^:\s][^:]*):(?P<line>\d+):(?P<column>\d+): '
              r'(?P<kind>fatal error|error): (?P<message>.*)$'
          )

          def norm(path):
              path = path.replace('\\', '/')
              marker = '/gki/common/'
              if marker in path:
                  return path.split(marker, 1)[1]
              for prefix in ('gki/common/', './gki/common/'):
                  if path.startswith(prefix):
                      return path[len(prefix):]
              return path

          entries = []
          if log.is_file():
              for line in log.read_text(errors='replace').splitlines():
                  match = compiler.match(line)
                  if not match:
                      continue
                  item = match.groupdict()
                  item['file'] = norm(item['file'])
                  entries.append(item)

          signatures = collections.Counter(
              (item['file'], item['message']) for item in entries
          )
          image = root / 'compile/Image-NON-FLASHABLE'
          make_rc_file = root / 'compile/make-return-code.txt'
          make_rc = int(make_rc_file.read_text()) if make_rc_file.is_file() else -1
          result = {
              'status': 'final-residual-compile-complete',
              'flashable': False,
              'hardware_validated': False,
              'baseline_compiler_error_count': baseline['compiler_error_count'],
              'compiler_error_count': len(entries),
              'net_error_reduction': baseline['compiler_error_count'] - len(entries),
              'make_return_code': make_rc,
              'image_built': image.is_file() and image.stat().st_size > 0,
              'unique_signatures': [
                  {'file': key[0], 'message': key[1], 'count': value}
                  for key, value in signatures.most_common()
              ],
              'entries': entries[:500],
          }
          (root / 'compile/compile-incompatibilities.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          lines = [
              '# A52 Workflow 116 final residual result',
              '',
              f"- Workflow 115 errors: **{baseline['compiler_error_count']}**",
              f"- Remaining compiler errors: **{len(entries)}**",
              f"- Net error reduction: **{result['net_error_reduction']}**",
              f"- Make return code: **{make_rc}**",
              f"- Kernel Image produced: **{result['image_built']}**",
              '',
              '## Remaining incompatibilities',
              '',
          ]
          if signatures:
              lines += [
                  f"- x{value}: `{key[0]}`: {key[1]}"
                  for key, value in signatures.most_common()
              ]
          else:
              lines.append('- None')
          (root / 'compile/WORKFLOW-116-RESULT.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Finalize Workflow 116 artifact
        if: always()
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-final-residuals
          mkdir -p "$OUT"
          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 5G GKI 5.10 FINAL RESIDUAL CLOSURE

          This artifact is non-flashable and not hardware validated.
          Workflow 99 remains the hardware-tested storage baseline.

          Workflow 116 targets only the nine compiler errors left by Workflow 115:
          the duplicate ION flag, two copied-header redirects, and two exact SDE
          uninitialized-variable sites. Existing Workflow 115 diagnostic fallbacks
          and provider semantics are still not validated on hardware.

          Do not flash this artifact.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/a52xq-gki-5.10-final-residuals')
          report = root / 'compile/compile-incompatibilities.json'
          if report.is_file():
              result = json.loads(report.read_text())
              final = {
                  'status': 'final-residual-pass-complete',
                  'flashable': False,
                  'hardware_validated': False,
                  'workflow99_baseline_preserved': True,
                  'compiler_error_count': result['compiler_error_count'],
                  'make_return_code': result['make_return_code'],
                  'image_built': result['image_built'],
                  'compile_closed': (
                      result['compiler_error_count'] == 0
                      and result['make_return_code'] == 0
                      and result['image_built']
                  ),
              }
          else:
              final = {
                  'status': 'final-residual-staging-failed',
                  'flashable': False,
                  'hardware_validated': False,
                  'workflow99_baseline_preserved': True,
                  'compile_closed': False,
              }
          (root / 'final-state.json').write_text(
              json.dumps(final, indent=2, sort_keys=True) + '\n'
          )
          PY
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload Workflow 116 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-gki-5.10-final-residuals-${{ github.run_number }}-NON-FLASHABLE
          path: artifacts/a52xq-gki-5.10-final-residuals
          if-no-files-found: error
          retention-days: 14

      - name: Require complete compile closure
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(
              'artifacts/a52xq-gki-5.10-final-residuals/final-state.json'
          ).read_text())
          if not state.get('compile_closed'):
              raise SystemExit(
                  'Workflow 116 did not close the compile: '
                  f"errors={state.get('compiler_error_count', 'unknown')}, "
                  f"make_rc={state.get('make_return_code', 'unknown')}, "
                  f"image_built={state.get('image_built', False)}"
              )
          PY
