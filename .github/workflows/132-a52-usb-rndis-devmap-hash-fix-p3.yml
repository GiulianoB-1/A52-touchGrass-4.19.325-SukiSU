        if: always()
        run: |
          mkdir -p artifacts
          if [ -d workspace/touchgrass-a52xq/.git ]; then
            git -C workspace/touchgrass-a52xq status --short > artifacts/kernel-status.txt || true
            git -C workspace/touchgrass-a52xq diff --check > artifacts/diff-check.txt 2>&1 || true
          fi
          ccache --show-stats > artifacts/ccache.txt 2>&1 || true

      - name: Upload USB RNDIS DEVMAP HASH fix P3 flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-BASE35633887441-USB-RNDIS-DEVMAP-HASH-FIX-P3-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14

