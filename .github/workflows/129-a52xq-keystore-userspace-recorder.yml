name: 129 - A52XQ KernelSU Keystore userspace recorder

run-name: Build KernelSU-only Keystore and boot-failure recorder v2.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/129-a52xq-keystore-userspace-recorder.yml
      - scripts/129_build_a52xq_keystore_userspace_recorder.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52xq-keystore-userspace-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build audited KernelSU-only recorder v2.1
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Build KernelSU module
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder-v2
          mkdir -p "$OUT/package"

          python3 -m py_compile \
            scripts/129_build_a52xq_keystore_userspace_recorder.py

          python3 scripts/129_build_a52xq_keystore_userspace_recorder.py \
            --output "$OUT/package/A52XQ-Keystore-Userspace-Recorder-KSU-v2.zip" \
            --report "$OUT/a52xq-keystore-userspace-recorder-v2-report.json"

      - name: Audit module format and collection policy
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder-v2
          ZIP="$OUT/package/A52XQ-Keystore-Userspace-Recorder-KSU-v2.zip"

          unzip -t "$ZIP"
          unzip -l "$ZIP" | tee "$OUT/package/module-contents.txt"

          for SCRIPT in \
            customize.sh post-fs-data.sh service.sh boot-completed.sh \
            collector.sh export.sh action.sh uninstall.sh; do
            unzip -p "$ZIP" "$SCRIPT" | bash -n
          done

          unzip -p "$ZIP" module.prop | grep -Fxq 'id=a52_keystore_recorder'
          unzip -p "$ZIP" module.prop | grep -Fxq 'version=2.1.0'
          unzip -p "$ZIP" collector.sh | grep -Fq 'custom_kernel_recorder_required=false'
          unzip -p "$ZIP" collector.sh | grep -Fq 'pid-events.log'
          unzip -p "$ZIP" collector.sh | grep -Fq 'logcat -b crash'
          unzip -p "$ZIP" collector.sh | grep -Fq 'logcat -b events'
          unzip -p "$ZIP" collector.sh | grep -Fq 'boot-failures.log'
          unzip -p "$ZIP" collector.sh | grep -Fq '/proc/uptime'
          unzip -p "$ZIP" collector.sh | grep -Fq 'COMPLETE.txt'
          unzip -p "$ZIP" collector.sh | grep -Fq 'INTERRUPTED-BY-REBOOT.txt'
          unzip -p "$ZIP" action.sh | grep -Fq 'stop-request'
          unzip -p "$ZIP" export.sh | grep -Fq 'pending-interrupted-run'

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(
              'artifacts/a52xq-keystore-userspace-recorder-v2/'
              'a52xq-keystore-userspace-recorder-v2-report.json'
          ).read_text())
          assert report['status'] == 'a52xq-keystore-userspace-recorder-v2-built-audited'
          assert report['hardware_validated'] is False
          assert report['module_version'] == '2.1.0'
          assert report['kernel_changes'] is False
          assert report['custom_kernel_recorder_required'] is False
          assert report['action_stops_and_finalizes_before_archive'] is True
          assert report['interrupted_runs_exported_after_next_boot'] is True
          assert report['starts_from_post_fs_data'] is True
          assert report['uses_real_kernel_uptime'] is True
          assert report['automatic_internal_storage_export'] is True
          assert report['internal_storage_root'] == '/sdcard/A52-Keystore-Recorder'
          assert 'keystore-databases' in report['privacy_exclusions']
          assert 'command-response-buffers' in report['privacy_exclusions']
          assert 'process-memory' in report['privacy_exclusions']
          PY

      - name: Finalize standalone module artifact
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder-v2

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52XQ KERNELSU KEYSTORE USERSPACE RECORDER V2.1

          Install through KernelSU Manager and reboot. Do not flash from recovery.

          This package collects Keystore, Keymaster, QSEECOM, Binder,
          crash, service-lifecycle and boot-failure diagnostics using KernelSU alone.
          A custom kernel recorder is not required.

          Automatic folder:
            Internal storage/A52-Keystore-Recorder/<boot-id>/

          Interrupted captures remain under /data/adb and are exported after the
          next successful boot with INTERRUPTED in the archive filename.

          After reproducing the problem, press the module Action button. It stops
          and finalizes the current run, then creates a tar.gz under:
            Internal storage/A52-Keystore-Recorder/Exports/

          Module package:
            package/A52XQ-Keystore-Userspace-Recorder-KSU-v2.zip

          Hardware validation is still required on the Galaxy A52 5G.
          EOF

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload standalone KernelSU recorder artifact
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-kernelsu-keystore-userspace-recorder-v2-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-keystore-userspace-recorder-v2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Require final module output
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder-v2
          test -s "$OUT/package/A52XQ-Keystore-Userspace-Recorder-KSU-v2.zip"
          test -s "$OUT/a52xq-keystore-userspace-recorder-v2-report.json"
          test -s "$OUT/SHA256SUMS"
          grep -Fq 'a52xq-keystore-userspace-recorder-v2-built-audited' \
            "$OUT/a52xq-keystore-userspace-recorder-v2-report.json"
          grep -Fq '"custom_kernel_recorder_required": false' \
            "$OUT/a52xq-keystore-userspace-recorder-v2-report.json"
          grep -Fq '"interrupted_runs_exported_after_next_boot": true' \
            "$OUT/a52xq-keystore-userspace-recorder-v2-report.json"
