name: 148 - A52 Qualcomm LPM + WALT Battery Fix Pack

on:
  push:
    branches:
      - agent/a52-opt-p1-mglru-cass-uclamp-sugov
    paths:
      - .github/workflows/148-a52-qcom-lpm-fixpack-p1.yml
      - scripts/148_apply_qcom_lpm_fixpack_p1.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-qcom-lpm-p148-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  IMAGE: artifacts/Image-touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b
  P146_BASELINE_SHA: 24f87ad8b02aff34804464daa5e6c11f40c592ac
  P146_BASELINE_RUN: '35960921027'

jobs:
  build:
    name: Build P146 + Qualcomm LPM/WALT/schedutil fix pack
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out exact boot-tested P146 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P146_BASELINE_SHA }}

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-p148-qcom-battery-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52xq-p146-teo-active-${{ runner.os }}-
            a52xq-p148-qcom-lpm-${{ runner.os }}-
            a52xq-p145-teo-baseline-${{ runner.os }}-
            a52xq-p143-uclamp-rq-idle-${{ runner.os }}-
            a52xq-f2fs325-p1-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Restore exact prepared P134 feature source cache
        id: p134_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base35633887441-p134-src-v1-${{ runner.os }}-${{ hashFiles('scripts/118_apply_f2fs_stable_325_p1.sh', 'scripts/119_apply_f2fs_gc_merge_p2.py', 'scripts/121_apply_f2fs_inmem_curseg_p3a.py', 'scripts/122_apply_f2fs_atgc_p3b.py', 'scripts/123_enable_f2fs_atgc_p3c.py', 'scripts/124_apply_f2fs_atgc_p4.py', 'scripts/125_apply_f2fs_block_age_p5a.py', 'scripts/126_enable_f2fs_block_age_p5b.py', 'scripts/127_apply_f2fs_gc_cp_p6.py', 'scripts/128_apply_f2fs_correctness_p7.py', 'scripts/129_apply_bpf_bootfix_p1.py', 'scripts/134_apply_bpf_devmap_rndis_clean_fix.py') }}

      - name: Require exact prepared source boundary
        run: |
          set -Eeuo pipefail
          echo "P134 cache hit: ${{ steps.p134_source.outputs.cache-hit }}"
          test "${{ steps.p134_source.outputs.cache-hit }}" = "true"
          test -d workspace/touchgrass-a52xq/.git

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts release
          chmod +x scripts/*.sh scripts/*.py

      - name: Replay production chain P135 through P143
        run: |
          set -Eeuo pipefail
          python3 scripts/135_remove_project_diagnostics.py workspace/touchgrass-a52xq artifacts/production-nodiag-p135
          python3 scripts/136_apply_a619_kgsl_p6_pm.py workspace/touchgrass-a52xq
          python3 scripts/137_apply_a52_boot_rescue.py workspace/touchgrass-a52xq
          python3 scripts/138_apply_a619_kgsl_p7_cp_init.py workspace/touchgrass-a52xq
          python3 scripts/139_apply_mglru_modern_p4_pagecache.py workspace/touchgrass-a52xq
          python3 scripts/140_apply_schedutil_iowait_android17_p1.py workspace/touchgrass-a52xq
          python3 scripts/141_apply_schedutil_android17_limits_sync_p2.py workspace/touchgrass-a52xq
          python3 scripts/142_apply_uclamp_android17_reinc_idle_p3.py workspace/touchgrass-a52xq
          python3 scripts/143_apply_uclamp_android17_rq_idle_p4.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff --check

      - name: Replay P145/P146 boot-tested cpuidle baseline
        run: |
          set -Eeuo pipefail
          python3 scripts/145_apply_teo_baseline_p1.py \
            workspace/touchgrass-a52xq backports/145_teo_4.19.c \
            | tee artifacts/cpuidle-teo-baseline-p145.txt
          python3 scripts/146_apply_teo_active_recentfix_p2.py workspace/touchgrass-a52xq \
            | tee artifacts/cpuidle-teo-active-p146.txt

          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'A52 TEO P2: upstream 449914 remove broken recent-intercepts + active' "$KERNEL/drivers/cpuidle/governors/teo.c"
          grep -Fq '.rating =	21,' "$KERNEL/drivers/cpuidle/governors/teo.c"

          # Runtime observation on P146 showed vendor qcom remains the actual
          # governor because its rating is 30.
          grep -Fq '.name =		"qcom",' "$KERNEL/drivers/cpuidle/lpm-levels.c"
          grep -Fq '.rating =	30,' "$KERNEL/drivers/cpuidle/lpm-levels.c"
          grep -Fq 'lpm_cpu->drv->name = "msm_idle";' "$KERNEL/drivers/cpuidle/lpm-levels.c"

      - name: Apply P148 Qualcomm LPM + WALT/schedutil fix pack
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/148_apply_qcom_lpm_fixpack_p1.py" \
            -o /tmp/148_apply_qcom_lpm_fixpack_p1.py

          python3 -m py_compile /tmp/148_apply_qcom_lpm_fixpack_p1.py
          python3 /tmp/148_apply_qcom_lpm_fixpack_p1.py workspace/touchgrass-a52xq \
            | tee artifacts/qcom-lpm-fixpack-p148.txt

          KERNEL=workspace/touchgrass-a52xq
          LPM="$KERNEL/drivers/cpuidle/lpm-levels.c"
          SUGOV="$KERNEL/kernel/sched/cpufreq_schedutil.c"
          FAIR="$KERNEL/kernel/sched/fair.c"
          WALT="$KERNEL/kernel/sched/walt.c"

          grep -Fq 'A52 QCOM LPM P1: raw idle locks + short-idle tick + hotpath cleanup' "$LPM"
          grep -Fq 'raw_spin_lock(&cluster->sync_lock);' "$LPM"
          grep -Fq 'raw_spinlock_t sync_lock;' "$KERNEL/drivers/cpuidle/lpm-levels.h"
          grep -Fq 'raw_spin_lock_init(&c->sync_lock);' "$KERNEL/drivers/cpuidle/lpm-levels-of.c"
          grep -Fq 'cpu_power_select(dev, cpu, stop_tick)' "$LPM"
          grep -Fq 'sleep_us <= (s64)(TICK_NSEC / NSEC_PER_USEC)' "$LPM"
          grep -Fq 'IS_ENABLED(CONFIG_MSM_IDLE_STATS)' "$LPM"

          ! grep -Fq 'update_debug_pc_event(' "$LPM"
          ! grep -Fq 'KLPMDEBUG' "$LPM"
          ! grep -Fq 'struct lpm_debug' "$LPM"

          grep -Fq '.name =		"qcom",' "$LPM"
          grep -Fq '.rating =	30,' "$LPM"
          grep -Fq 'lpm_cpu->drv->name = "msm_idle";' "$LPM"
          grep -Fq 'predicted = lpm_cpuidle_predict(dev, cpu,' "$LPM"
          grep -Fq 'pred_mode = cluster_predict(cluster, &pred_us);' "$LPM"
          grep -Fq 'is_IPI_pending(cpumask_of(dev->cpu))' "$LPM"

          grep -Fq 'A52 P148 BATTERY: Qualcomm LPM + WALT/schedutil correctness' "$SUGOV"
          grep -Fq 'a52_sugov_irq_work_queue(&sg_policy->irq_work);' "$SUGOV"
          grep -Fq 'irq_work_queue_on(work, cpu)' "$SUGOV"
          grep -Fq 'sg_policy->cached_raw_freq = sg_policy->prev_cached_raw_freq;' "$SUGOV"
          grep -Fq 'if (sg_policy->next_freq == next_freq)' "$SUGOV"

          grep -Fq 'queued = stop_one_cpu_nowait(cpu_of(busiest)' "$FAIR"
          grep -Fq 'clear_reserved(this_cpu);' "$FAIR"
          grep -Fq 'clear_reserved(rq->push_cpu);' "$WALT"

          git -C "$KERNEL" diff --check
          git -C "$KERNEL" diff -- \
            drivers/cpuidle/lpm-levels.c \
            drivers/cpuidle/lpm-levels-of.c \
            drivers/cpuidle/lpm-levels.h \
            > artifacts/qcom-lpm-walt-fixpack-p148.diff

      - name: Build integrated kernel
        run: |
          set -o pipefail
          echo '=== CCACHE BEFORE ==='
          ccache --show-stats || true
          START=$(date +%s)
          ./scripts/57_build_resukisu_susfs_manual_detection.sh \
            2>&1 | tee artifacts/qcom-lpm-fixpack-p148-build.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "kernel_build_seconds=$((END-START))"
          echo '=== CCACHE AFTER ==='
          ccache --show-stats || true
          exit "$RC"

      - name: Audit P148 image and source
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          LPM="$KERNEL/drivers/cpuidle/lpm-levels.c"
          TEO="$KERNEL/drivers/cpuidle/governors/teo.c"
          SUGOV="$KERNEL/kernel/sched/cpufreq_schedutil.c"

          test -s "$IMAGE"
          test -s "$KERNEL/out/vmlinux"

          grep -Fxq 'CONFIG_CPU_IDLE=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_NO_HZ_IDLE=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_CPU_IDLE_GOV_TEO=y' "$KERNEL/out/.config"
          grep -Fxq '# CONFIG_MSM_IDLE_STATS is not set' "$KERNEL/out/.config"

          grep -Fq 'A52 QCOM LPM P1: raw idle locks + short-idle tick + hotpath cleanup' "$LPM"
          grep -Fq '.name =		"qcom",' "$LPM"
          grep -Fq '.rating =	30,' "$LPM"
          grep -Fq 'lpm_cpu->drv->name = "msm_idle";' "$LPM"
          grep -Fq 'raw_spin_lock(&cluster->sync_lock);' "$LPM"
          grep -Fq 'sleep_us <= (s64)(TICK_NSEC / NSEC_PER_USEC)' "$LPM"
          grep -Fq 'is_IPI_pending(cpumask_of(dev->cpu))' "$LPM"
          ! grep -Fq 'update_debug_pc_event(' "$LPM"
          ! grep -Fq 'KLPMDEBUG' "$LPM"

          # Qualcomm prediction is intentionally retained.
          grep -Fq 'static bool lpm_prediction = true;' "$LPM"
          grep -Fq 'static bool lpm_ipi_prediction = true;' "$LPM"
          grep -Fq 'predicted = lpm_cpuidle_predict(dev, cpu,' "$LPM"
          grep -Fq 'pred_mode = cluster_predict(cluster, &pred_us);' "$LPM"

          # Dormant TEO remains available but lower rated than qcom.
          grep -Fq '.rating =	21,' "$TEO"

          # Existing boot-tested scheduler/rescue stack remains intact.
          grep -Fq 'A52 UCLAMP P4: Android17 rq access helpers + idle-rq semantics' "$KERNEL/kernel/sched/sched.h"
          grep -Fq 'A52 SCHEDUTIL IOWAIT P1: Android17 6.18 fixed boost floor + uclamp-safe boost' "$SUGOV"
          grep -Fq 'A52 SCHEDUTIL P2: Android17 79443a7e limits_changed synchronization' "$SUGOV"
          grep -Fq 'A52 P148 BATTERY: Qualcomm LPM + WALT/schedutil correctness' "$SUGOV"
          grep -Fq 'a52_sugov_irq_work_queue(&sg_policy->irq_work);' "$SUGOV"
          grep -Fq 'irq_work_queue_on(work, cpu)' "$SUGOV"
          grep -Fq 'sg_policy->cached_raw_freq = sg_policy->prev_cached_raw_freq;' "$SUGOV"
          grep -Fq 'queued = stop_one_cpu_nowait(cpu_of(busiest)' "$KERNEL/kernel/sched/fair.c"
          grep -Fq 'clear_reserved(rq->push_cpu);' "$KERNEL/kernel/sched/walt.c"
          grep -Fq 'A52 BOOT RESCUE P137' "$KERNEL/drivers/input/input.c"
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"

          git -C "$KERNEL" diff --check

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: packaging/AnyKernel3
          fetch-depth: 1

      - name: Package P148 flashable ZIP
        run: |
          set -Eeuo pipefail
          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-p148.sh
          sed -i "s/grep -Fxq '# CONFIG_KSU_SUSFS is not set'/grep -Fxq 'CONFIG_KSU_SUSFS=y'/" scripts/.package-p148.sh
          sed -i 's/SUSFS must remain disabled for this package/Kernel config does not enable SUSFS core/' scripts/.package-p148.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/.package-p148.sh')
          s = p.read_text()
          anchor = 'dump_boot;\nwrite_boot;'
          if s.count(anchor) != 1:
              raise SystemExit(f'unexpected boot-write anchor count: {s.count(anchor)}')
          s = s.replace(
              anchor,
              'dump_boot;\n'
              'patch_cmdline "sched_eevdf" "sched_eevdf=1";\n'
              'patch_cmdline "sched_cass" "sched_cass=1";\n'
              'write_boot;',
              1,
          )
          p.write_text(s)
          PY

          python3 scripts/88_patch_anykernel_vulkan_renderengine.py scripts/.package-p148.sh
          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + P146-BASE35960921027 + QCOM-LPM-WALT-P148/' scripts/.package-p148.sh
          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/A52-P148-QCOM-LPM-WALT-SCHEDUTIL-FIXPACK-P1.zip/' scripts/.package-p148.sh
          chmod +x scripts/.package-p148.sh
          ./scripts/.package-p148.sh 4.19.206 "$IMAGE" packaging/AnyKernel3 release
          rm -f scripts/.package-p148.sh

      - name: Verify package
        run: |
          set -Eeuo pipefail
          ZIP="$(find release -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -s "$ZIP"
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'install_vulkan_re_module;'
          sha256sum "$ZIP" | tee artifacts/package-sha256.txt

      - name: Save compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-p148-qcom-battery-${{ runner.os }}-${{ github.sha }}

      - name: Upload P148 flashable ZIP and audit
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-BASE35960921027-QCOM-BATTERY-P148-${{ github.run_number }}
          path: |
            release/
            artifacts/qcom-lpm-fixpack-p148.txt
            artifacts/qcom-lpm-fixpack-p148.diff
            artifacts/package-sha256.txt
          if-no-files-found: error
          retention-days: 14

# Exact boot-tested base: P146 run 35960921027 / 24f87ad...
# P147 is intentionally not replayed: it only changes dormant generic TEO.
# P148 modifies the actually active Qualcomm qcom/msm_idle path and folds in compatible WALT/schedutil correctness fixes.
# No frequency tables, rate-limit values, hispeed, RTG, PL, voltage, or boost policy tuning is changed.
