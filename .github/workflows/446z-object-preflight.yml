name: 446Z isolated GKI object preflight
on:
  push:
    branches:
      - agent/a52-phase446w-handoff-b-default-v1
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: a52-phase446z-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            zstd clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev
      - name: Compile Phase446Z objects on pinned Phase446Y successful source
        run: bash scripts/446z_ci_preflight.sh
