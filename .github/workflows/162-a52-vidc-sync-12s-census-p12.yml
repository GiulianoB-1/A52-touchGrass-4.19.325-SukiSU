# P162 VIDC ordering + extended census:
# - retains P153 global async, P158 QSMMUv500 fix, P159 provider exceptions, P160 DWC3 fix
# - retains P161 2048-entry full census with overflow=0 coverage
# - restores only msm_vidc_v4l2 to synchronous probing after P161 exposed it as the sole FAIL
# - leaves kona-asoc-snd asynchronous and extends observation from 8s to 12s
# - checkpoints: 2/4/6/8/10/12s, then intentional recovery reboot
# - target: fail=0, overflow=0, and determine whether the sound-card probe naturally completes
