             scripts/420_apply_umode_roundtrip_vrefresh_parity.py \
             scripts/421_apply_fetch_memory_survival.py \
             scripts/422_apply_display_smmu_fault_probe.py \
             scripts/423_apply_rpmh_solver_mode_compat.py \
             scripts/424_apply_gki_paired_hw_snapshot.py \
             scripts/425_apply_reboot_origin_recorder.py \
             scripts/426_apply_smmu_stream_handoff_probe.py \
             scripts/decode_phase421_survival.py \
             scripts/decode_phase422_smmu_fault.py \
             scripts/decode_phase414_sequential_3m.py \
             scripts/decode_phase416_sequential_3m.py \
             scripts/decode_phase409_ram1m_debug2m.py \
             scripts/decode_phase408_samsung_debug_dsi.py \
             scripts/decode_phase407_samsung_debug_dsi.py \
             scripts/decode_phase405_dma_done.py "$OUT/audit/"
          cp "$REC" "$DSI" "$DSIHW" "$DSIDISPLAY" "$DSIPANEL" "$SSPANEL" "$MSMSMMU" "$ARMSMMU" "$ARMSMMUH" "$IRQH" "$UFS" "$UFSCORE" "$USB" "$DRM" "$DRMATOMIC" "$DRMMODES" "$MSM" "$ENCODER" "$RPMHRSC" "$RPMH" "$RPMHINT" "$COMPAT" "$REBOOT" "$OUT/source/"
          cp phase426-generated-build.sh "$OUT/audit/phase426-generated-build.sh"

          cat > "$OUT/PHASE421-NOTES.txt" <<'EOF'
          Phase414 sequential 3 MiB recorder
          ==================================
          Logical order is fixed and non-wrapping:

            tier 1: Samsung debug +0x800000, 2 MiB
            tier 2: persistent RAM 0xB1A00000, 1 MiB
            then:   STOP

          The first records therefore remain on the Samsung partition. The RAM
          tier is used only after the Samsung 2 MiB logical capacity is full.

          Hot-path behavior
          -----------------
          - Fixed 128-byte records with global monotonic sequence numbers.
          - No Phase414 whole-image CRC.
          - Samsung-bound records are copied to a vmalloc staging image only;
            block I/O occurs on system_unbound_wq.
          - Completed 4 KiB pages are immutable and written directly.
          - The current partial page is copied under the recorder spinlock to a
            bounce page, then written without holding the lock.
          - If the debug block device is not ready, writes retry in background.
          - Reserved-RAM continuation uses B1A00000..B1AFFFFF and explicit cache
            cleaning so it survives the recovery reboot.
          - Existing Phase392 is restricted to B1900000..B19FFFFF.

          Identity and stale-record rejection
          -----------------------------------
          - Header magic + phase=414 + boot_id + global_seq + counts + commit.
          - boot_id is incremented from the persistent B1A header every boot.
          - P414 BOOT carries the same boot_id into R48/RS48.
          - R48/RS48 and its three ramoops transports remain untouched.

          Display frontier
          ----------------
          - Lifecycle entry breadcrumbs cover display registration/probe/bind,
            panel acquisition/driver init, and Samsung early/panel init.
          - First 128 generic DSI transfers record controller, type, length,
            software flags, MIPI flags, and first 8 payload bytes.
          - Exact F0 records flags before and after mode selection.
          - Phase411 FIFO<=64 treatment, timeout panic, SMMU diagnostics, nohlt,
            and cpuidle.off=1 remain unchanged.
          - Phase415 changes only MDSS GDSC ownership semantics: disable preserves
            HW_CONTROL and software enable refuses to steal an active HW-controlled
            domain. The missing TouchGrass proxy-consumer is deliberately NOT added.

          Phase416 Samsung persistence hardening
          --------------------------------------
          Phase415 recovery showed a valid current B1A Phase414 header and current
          recorder traffic in B190, while Samsung debug +0x800000 still contained
          a CRC-valid stale Phase413 image. Phase416 therefore keeps Phase415's
          functional GDSC treatment unchanged and changes only recorder transport.

          - Earliest events are still staged from core_init into the 2 MiB image.
          - Raw sda8 writes are armed from late_initcall, after device init.
          - Failed opens/BIOs/flushes still retry for up to 60 seconds.
          - B1A now mirrors disk_count/global_seq during the Samsung tier.
          - Three 128-byte B1A status copies preserve armed/worker/open/BIO/flush
            results, retry count, generation counters, last page, and recorder state.
          - decode_phase416_sequential_3m.py majority-fuses those status copies.
          Phase417 post-bind frontier
          ---------------------------
          - Phase416 Samsung persistence is unchanged.
          - Re-arms only the low-rate P273 userspace task frontier.
          - Adds lifecycle scopes to DRM atomic modeset checking, DSI bridge
            mode_fixup/mode_set/pre_enable/enable, plus dsi_display_set_mode.
          - Records pre_enable set-mode rc/flags and seamless early-return flags.
          - Re-admits only selected post-bind markers (P267/P268/P269/P273,
            DRMPOST 212, KMSPOST) through the Phase402 second gate.
          - Does not re-enable the retired UFS sampler, NoC observers, generic
            IRQ witnesses, or cpuidle probes.

          Phase418 atomic present discriminator
          -------------------------------------
          - Removes the high-rate per-check DRM atomic and bridge-mode-fixup scopes.
          - Retires broad P269 property/UAPI admission after Phase417 proved resource
            enumeration and mode visibility are healthy.
          - Logs exact Composer DRM_MODE_ATOMIC ioctl flags, distinguishing TEST_ONLY
            and real presents, and always preserves non-test atomics and errors.
          - Samples successful modeset checks sparsely while retaining all failures.
          - Samples apexd task presence every 10 seconds through the pre-zygote gap.
          - Adds P276 positive controls plus explicit Phase280 retention-latch diagnostics.
          - Instruments sde_encoder_virt_atomic_check sub-steps, with full detail for
            the first 16 calls and sparse failure counters thereafter.
          - Functional DSI, SMMU, GDSC, UFS and DRM behavior is unchanged.

          Phase419 UAPI vrefresh parity
          -----------------------------
          Phase418 hardware showed every sampled TEST_ONLY atomic check failing at
          encoder step 3, sde_connector_get_mode_info(), before RM reservation.

          - Confirms A52 convert_to_dsi_mode consumes drm_mode->vrefresh directly.
          - Restores vrefresh lost by Android 5.10 drm_mode_convert_umode using:
              out->vrefresh = in->vrefresh ? in->vrefresh : drm_mode_vrefresh(out)
          - This is the only functional Phase419 change.
          - P419 U records input, pre-fix output, timing-derived fallback and final value once.
          - P419 F records the first dsi_display_find_mode compare tuple and rc once.
          - P419 E3 records the first encoder step-3 rc, adjusted vrefresh and private-info presence once.
          - P419 is admitted through the Samsung sequential recorder even after the old retention latch.
          - Phase418 AT/E/MS counters remain unchanged to reveal whether validation now advances,
            and if it does not, which later encoder step becomes the new failure frontier.

          Phase420 vrefresh round-trip parity
          -----------------------------------
          Phase419 proved the inbound copy executes but Composer sends 57 Hz back.
          The compiled 5.10 kernel exports vrefresh with drm_mode_vrefresh(in),
          while TouchGrass 4.19 preserves the DSI driver's stored in->vrefresh.

          - Functional change: drm_mode_convert_to_umode now preserves stored
            in->vrefresh when nonzero, with drm_mode_vrefresh(in) only as fallback.
          - P420 TO records stored refresh, timing-derived refresh, exported refresh
            and pixel clock for the first 1080x2400 mode.
          - P420 Q/C record the first Composer lookup and up to eight cached panel
            candidates, including Samsung HS/PHS fields.
          - Phase419 inbound parity, Phase418 AT/E/MS, GDSC, DSI, SMMU and UFS
            behavior are otherwise unchanged.
          - The legacy bool return-rc masking path is deliberately not fixed.

          Phase421 FETCH_MEMORY survival A/B
          ==================================
          - Removes only Phase411's <=64-byte FIFO reroute from DSI mode selection.
          - Exact F0 5A 5A therefore remains on the stock FETCH_MEMORY path.
          - Legacy deep-active P276/278/279 observers are suppressed only while
            this exact target transaction is active.
          - Eleven S00..S10 fixed slots are written to B190+0x500, B190+0xA80,
            and B1A+0x800. The third copy is exactly 1 MiB away and remains in
            Phase414's excluded 4 KiB header page.
          - Each slot contains 64 repeated encoded stage bytes, 5x flags/rc/irq/ret,
            and a 5x per-boot random nonce. CRC/commit are optional evidence only.
          - Each physical copy is memcpy_toio + wmb + dcache clean + dsb(sy) before
            execution advances to the next critical DSI operation.
          - Watchdog behavior is intentionally unchanged and deferred to Phase422.
          EOF
          sed -i 's/^          //' "$OUT/PHASE421-NOTES.txt"


          cat > "$OUT/PHASE422-NOTES.txt" <<'EOF'
          Phase422 display SMMU fault probe
          =================================
          Phase421 behavior is retained. Phase422 changes diagnostics only.

          - M00 caches the SID 0x800 context-bank IRQ registration at SMMU setup,
            then publishes it at the exact F0 S00 together with cmd_buffer_iova.
          - M01 is written inside arm_smmu_context_fault before the existing FSR
            clear, filtered by exact SID 0x800 domain + context bank and by the
            Phase421 target-active window. It records FSR, FSYNR0, FAR, SCTLR,
            cbndx, IRQ, CBFRSYNRA, fault count and boottime timestamp.
          - M02 performs one powered post-timeout read of FSR, FAR and SCTLR at
            S10. No SMMU state is changed.
          - M03 timestamps the accepted Phase421 S08 immediately after SW_TRIGGER
            returned, before the S08 survival-copy latency.
          - M00..M03 are 64-byte records with three physical copies at
            B190+0x200, B190+0x300 and B1A+0xD80.
          - No RESUME/TERMINATE, ATOS, iova_to_phys, page-table walk, or legacy
            P278/P279 target observer is added.
          - Decoder classifies command-buffer faults and the 0xA0000000..A2300000
            splash/logo range separately, and reports M01 timestamp minus S08.
          EOF
          sed -i 's/^          //' "$OUT/PHASE422-NOTES.txt"


          cat > "$OUT/PHASE423-NOTES.txt" <<'EOF'
          Phase423 RPMh solver-mode compatibility
          ========================================
          Functional delta relative to Phase422:
          - Replace the legacy no-op rpmh_mode_solver_set() shim with one narrow
            compatibility bridge for Display RSC software state.
          - On enable, wait until the ACTIVE group (borrowed WAKE on disp_rsc)
            is no longer in use, restoring TouchGrass's pre-solver exclusion.
          - Track solver mode in both rpmh_ctrlr and rsc_drv. The setter nests
            cache_lock after drv->lock as required by pinned 5.10 lock ordering.
          - ACTIVE_ONLY requests are refused with exactly -EBUSY in all three
            public RPMh write APIs (async, sync, batch) before allocation/cache
            work, plus a DRV-level race guard before TCS claim.
          - Disable/CLK_STATE clears the flag through the same bridge.

          Diagnostic-only records:
          - P423 SOL: every solver true/false transition, upper and lower old/new
            flags, wait-loop count, cumulative refused and borrow-violation counts.
          - P423 REF: Display-RSC ACTIVE_ONLY requests refused with -EBUSY.
          - P423 BORROW: invariant violation if a borrowed-WAKE ACTIVE trigger
            reaches rpmh-rsc while the solver flag is still set. Expected zero.
          - P423 is admitted to the existing sequential recorder only.
          - Phase421 S00-S10 and Phase422 M00-M03 are unchanged.

          Deliberately NOT changed:
          - no invalidate-before-borrow port in get_tcs_for_msg()
          - no HF0 TBU/GDSC/provider work
          - no DSI, SMMU, bus-vote, clock or GDSC behavior
          EOF
          sed -i 's/^          //' "$OUT/PHASE423-NOTES.txt"


          echo "Phase425 reboot-origin recorder audit"
          grep -Fq 'A52_PHASE425_REBOOT_ORIGIN_RECORDER_V1' "$REBOOT"
          grep -Fq 'P425 SR c=%s p=%d cmd=%x' "$REBOOT"
          grep -Fq 'P425 S2 c=%s p=%d s=%.40s' "$REBOOT"
          grep -Fq 'P425 KR c=%s p=%d s=%.40s' "$REBOOT"
          grep -Fq 'P425 PO c=%s p=%d s=poweroff' "$REBOOT"
          grep -Fq 'strncmp(fmt, "P425", 4)' "$REC"
          grep -Fq '!strncmp(message, "P425 ", 5)' "$REC"

          echo "Phase426 authoritative source audit"
          python3 scripts/426_apply_smmu_stream_handoff_probe.py \
            --root "$ROOT" --check-only
          echo "Phase426 authoritative source audit: PASS"

          cat > "$OUT/PHASE424-NOTES.txt" <<'EOF'
          Phase424 paired pre-trigger hardware snapshot
          =============================================
          Phase423 behavior is retained. The exact F0 snapshot is taken after
          S07 and immediately before SW_TRIGGER. Reads are buffered in normal RAM
          and emitted to the sequential recorder only after S10.

          Paired Golden/GKI register list:
          - compact DSI alignment anchor
          - DISP_CC branches + active RCG command/config
          - GCC DISP AHB/AXI branch registers
          - mdss_core_gdsc + RSCC branch clocks
          - VBIF status/config reference
          - Display RSC sequencer/solver/wrapper/power status

          No functional MMIO writes, no delays, no retries, no new clock/bus/
          regulator/RSC behavior, and no HF0 fix.
          EOF
          sed -i 's/^          //' "$OUT/PHASE424-NOTES.txt"

          cat > "$OUT/PHASE425-NOTES.txt" <<'EOF'
          Phase425 reboot-origin recorder
          ===============================
          Phase424 display instrumentation is unchanged.

          P425 SR: validated sys_reboot request (comm/pid/numeric command).
          P425 S2: sys_reboot RESTART2 command string after safe user copy.
          P425 KR: kernel_restart caller + command string, including direct
                   in-kernel restarts that bypass sys_reboot.
          P425 PO: kernel_power_off caller.

          P425 is admitted to the sequential Samsung tier and the immediate
          persistent critical lane. No reboot command, shutdown sequencing,
          display state, clock, power, bus, SMMU or DSI behavior is changed.
          EOF
          sed -i 's/^          //' "$OUT/PHASE425-NOTES.txt"

          cat > "$OUT/PHASE426-NOTES.txt" <<'EOF'
          Phase426 read-only SMMU stream handoff probe
          ============================================
          Phase424/425 behavior is retained.

          Motivation:
          qcom,skip-init preserves the bootloader SMR/S2CR/CB hardware, while
          the current GKI port does not import that state into Linux smrs[],
          s2crs[] or context_map. TouchGrass arm_smmu_handoff_cbs() does.

          Evidence captured without applying the fix:
          - all firmware-valid SMR/S2CR entries cached before reset/test writes;
          - the SMR chosen by arm_smmu_test_smr_masks(), raw before/after;
          - exact-F0 S00 HW + Linux SW route snapshot, reads/stores only;
          - every global-fault IRQ latched before sGFSR clear;
          - timeout HW table, SID 0x800 matches, GFSR/GFSYNR and SW route;
          - full cached bootloader-valid table emitted only after timeout.

          No SMR, S2CR, context-bank, SMMU global-status, DSI, clock, bus, power
          or RSC behavior is changed by Phase426.
          EOF
          sed -i 's/^          //' "$OUT/PHASE426-NOTES.txt"

          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload Phase426 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE426-FAIL-DIAG-${{ github.run_number }}
          path: |
            gki/common/drivers/iommu/arm/arm-smmu/arm-smmu.c
            gki/common/drivers/iommu/arm/arm-smmu/arm-smmu.h
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl.c
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c
            gki/common/kernel/reboot.c
            phase426-generated-build.sh
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7

      - name: Build Phase426 SMMU handoff-probe boot image
        run: |
          set -Eeuo pipefail
          OUT="$PWD/phase426-gki-out"
          BASE="$OUT/package/boot.img"
          FINAL="$OUT/package/boot-phase426-smmu-stream-handoff-probe-v1.img"
          test -s "$BASE"
          cp "$BASE" "$FINAL"

          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "a52_boot_repack", "scripts/38_repack_a52_p1_boot.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          base_path = Path("phase426-gki-out/package/boot.img")
          final = Path("phase426-gki-out/package/boot-phase426-smmu-stream-handoff-probe-v1.img")
          base = module.parse_boot(base_path.read_bytes())
          data = bytearray(final.read_bytes())
          tokens = base["cmdline"].split()
          for tok in ("nohlt", "cpuidle.off=1", "panic=1"):
              key = tok.split("=", 1)[0]
              tokens = [x for x in tokens if x != tok and x.split("=", 1)[0] != key]
              tokens.append(tok)
          cmdline = " ".join(tokens)
          encoded = cmdline.encode("ascii")
          if len(encoded) > 1534:
              raise SystemExit(f"Phase411 command line too long: {len(encoded)}")
          data[64:576] = b"\0" * 512
          data[608:1632] = b"\0" * 1024
          first = encoded[:511]
          second = encoded[511:]
          data[64:64 + len(first)] = first
          data[608:608 + len(second)] = second
          final.write_bytes(data)

          out = module.parse_boot(final.read_bytes())
          assert "nohlt" in out["cmdline"].split()
          assert "cpuidle.off=1" in out["cmdline"].split()
          assert "panic=1" in out["cmdline"].split()
          assert "ignore_loglevel" in out["cmdline"].split()
          for key in ("header_version","page_size","board","kernel_addr",
                      "ramdisk_addr","tags_addr","kernel","ramdisk","second","dtb"):
              assert out[key] == base[key], key
          assert final.stat().st_size == base_path.stat().st_size
          Path("phase426-gki-out/PHASE426-BOOT.json").write_text(
              json.dumps({
                  "cmdline": out["cmdline"],
                  "treatment": "Phase424/425 retained; Phase426 adds read-only apps-SMMU firmware SMR/S2CR cache, exact-F0 route snapshot and deferred global-fault/route dump; no SMMU routing fix or functional writes; nohlt cpuidle.off=1 panic=1",
                  "kernel_payload_unchanged_by_cmdline_patch": True,
              }, indent=2, sort_keys=True) + "\n")
          PY

          sha256sum "$FINAL"
          echo "Phase426 SMMU handoff-probe boot image: PASS"

      - name: Upload Phase426
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE426-SMMU-HANDOFF-PROBE-${{ github.run_number }}
          path: phase426-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase426 boot.img
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE426-SMMU-HANDOFF-PROBE-${{ github.run_number }}-BOOT-IMG
          path: phase426-gki-out/package/boot-phase426-smmu-stream-handoff-probe-v1.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
