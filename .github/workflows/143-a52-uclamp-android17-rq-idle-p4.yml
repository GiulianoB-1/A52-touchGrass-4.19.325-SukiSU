name: 143 - A52 Android17 Uclamp RQ Idle P4

on:
  push:
    branches:
      - agent/a52-opt-p1-mglru-cass-uclamp-sugov
    paths:
      - .github/workflows/143-a52-uclamp-android17-rq-idle-p4.yml
      - scripts/143_apply_uclamp_android17_rq_idle_p4.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-uclamp-p143-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  IMAGE: artifacts/Image-touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b
  P142_BASELINE_SHA: ab534bdf965cddb4078c24dfd60be6b32edd7903
  P142_BASELINE_RUN: '35922568016'

jobs:
  build:
    name: Build exact P142 baseline + Android17 uclamp RQ idle P4
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out exact boot-tested P142 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P142_BASELINE_SHA }}

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-p143-uclamp-rq-idle-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52xq-p142-uclamp-reinc-${{ runner.os }}-
            a52xq-p141-schedutil-limits-${{ runner.os }}-
            a52xq-p140-schedutil-iowait-${{ runner.os }}-
            a52xq-f2fs325-p1-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Restore exact prepared P134 feature source cache
        id: p134_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base35633887441-p134-src-v1-${{ runner.os }}-${{ hashFiles('scripts/118_apply_f2fs_stable_325_p1.sh', 'scripts/119_apply_f2fs_gc_merge_p2.py', 'scripts/121_apply_f2fs_inmem_curseg_p3a.py', 'scripts/122_apply_f2fs_atgc_p3b.py', 'scripts/123_enable_f2fs_atgc_p3c.py', 'scripts/124_apply_f2fs_atgc_p4.py', 'scripts/125_apply_f2fs_block_age_p5a.py', 'scripts/126_enable_f2fs_block_age_p5b.py', 'scripts/127_apply_f2fs_gc_cp_p6.py', 'scripts/128_apply_f2fs_correctness_p7.py', 'scripts/129_apply_bpf_bootfix_p1.py', 'scripts/134_apply_bpf_devmap_rndis_clean_fix.py') }}

      - name: Require exact prepared source boundary
        run: |
          set -Eeuo pipefail
          echo "P134 cache hit: ${{ steps.p134_source.outputs.cache-hit }}"
          if [ "${{ steps.p134_source.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Exact prepared source cache used by the boot-tested P142 chain was not restored."
            exit 1
          fi

          KERNEL=workspace/touchgrass-a52xq
          test -d "$KERNEL/.git"
          grep -Fq '#define FUSE_KERNEL_MINOR_VERSION 40' "$KERNEL/include/uapi/linux/fuse.h"
          grep -Fq 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts' "$KERNEL/mm/vmscan.c"
          grep -Fq 'U17 uclamp + WALT schedutil compatibility path active' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts release
          chmod +x scripts/*.sh scripts/*.py

      - name: Replay P135 production diagnostics cleanup
        run: |
          set -Eeuo pipefail
          python3 scripts/135_remove_project_diagnostics.py \
            workspace/touchgrass-a52xq \
            artifacts/production-nodiag-p135
          git -C workspace/touchgrass-a52xq diff --check

      - name: Replay P136 A619 KGSL and power management
        run: |
          set -Eeuo pipefail
          python3 scripts/136_apply_a619_kgsl_p6_pm.py workspace/touchgrass-a52xq \
            | tee artifacts/a619-kgsl-p6-pm-p136.txt

      - name: Replay P137 boot rescue and ramoops guard
        run: |
          set -Eeuo pipefail
          python3 scripts/137_apply_a52_boot_rescue.py workspace/touchgrass-a52xq \
            | tee artifacts/boot-rescue-p137.txt

      - name: Replay P138 A619 KGSL P7 CP init
        run: |
          set -Eeuo pipefail
          python3 scripts/138_apply_a619_kgsl_p7_cp_init.py workspace/touchgrass-a52xq \
            | tee artifacts/a619-kgsl-p7-cp-init-p138.txt

      - name: Replay P139 Modern MGLRU P4
        run: |
          set -Eeuo pipefail
          python3 scripts/139_apply_mglru_modern_p4_pagecache.py workspace/touchgrass-a52xq \
            | tee artifacts/mglru-modern-p4-pagecache-p139.txt

      - name: Replay P140 Android17 schedutil IOWAIT P1
        run: |
          set -Eeuo pipefail
          python3 scripts/140_apply_schedutil_iowait_android17_p1.py workspace/touchgrass-a52xq \
            | tee artifacts/schedutil-iowait-android17-p1-p140.txt

      - name: Replay P141 schedutil limits synchronization P2
        run: |
          set -Eeuo pipefail
          python3 scripts/141_apply_schedutil_android17_limits_sync_p2.py workspace/touchgrass-a52xq \
            | tee artifacts/schedutil-android17-limits-sync-p2-p141.txt

      - name: Replay boot-tested P142 uclamp active-update P3
        run: |
          set -Eeuo pipefail
          python3 scripts/142_apply_uclamp_android17_reinc_idle_p3.py workspace/touchgrass-a52xq \
            | tee artifacts/uclamp-android17-reinc-idle-p3-p142.txt

          CORE=workspace/touchgrass-a52xq/kernel/sched/core.c
          grep -Fq 'A52 UCLAMP P3: Android17 active-update idle-state correctness' "$CORE"
          grep -Fq 'static inline void uclamp_rq_reinc_id(' "$CORE"

      - name: Apply Android17 uclamp RQ idle semantics P4
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/143_apply_uclamp_android17_rq_idle_p4.py" \
            -o /tmp/143_apply_uclamp_android17_rq_idle_p4.py

          python3 -m py_compile /tmp/143_apply_uclamp_android17_rq_idle_p4.py
          python3 /tmp/143_apply_uclamp_android17_rq_idle_p4.py workspace/touchgrass-a52xq \
            | tee artifacts/uclamp-android17-rq-idle-p4-p143.txt

          KERNEL=workspace/touchgrass-a52xq
          CORE="$KERNEL/kernel/sched/core.c"
          SH="$KERNEL/kernel/sched/sched.h"
          SUGOV="$KERNEL/kernel/sched/cpufreq_schedutil.c"

          git -C "$KERNEL" diff --check

          grep -Fq 'A52 UCLAMP P4: Android17 rq access helpers + idle-rq semantics' "$SH"
          grep -Fq 'static inline unsigned long uclamp_rq_get(' "$SH"
          grep -Fq 'static inline void uclamp_rq_set(' "$SH"
          grep -Fq 'static inline bool uclamp_rq_is_idle(' "$SH"
          grep -Fq 'if (uclamp_rq_is_idle(rq))' "$SH"
          grep -Fq 'uclamp_rq_get(rq, UCLAMP_MIN)' "$SH"
          grep -Fq 'uclamp_rq_get(rq, UCLAMP_MAX)' "$SH"

          grep -Fq 'uclamp_rq_set(rq, clamp_id, clamp_value);' "$CORE"
          grep -Fq 'clamp_id == UCLAMP_MAX && uclamp_rq_is_idle(rq)' "$CORE"
          grep -Fq 'A52 UCLAMP P3: Android17 active-update idle-state correctness' "$CORE"

          grep -Fq 'A52 SCHEDUTIL IOWAIT P1: Android17 6.18 fixed boost floor + uclamp-safe boost' "$SUGOV"
          grep -Fq 'A52 SCHEDUTIL P2: Android17 79443a7e limits_changed synchronization' "$SUGOV"
          grep -Fq 'U17 uclamp + WALT schedutil compatibility path active' "$SUGOV"

          git -C "$KERNEL" diff -- kernel/sched/sched.h kernel/sched/core.c \
            > artifacts/uclamp-android17-rq-idle-p4-p143.diff
          git -C "$KERNEL" diff --stat \
            | tee artifacts/uclamp-android17-rq-idle-p4-p143-diffstat.txt

      - name: Build integrated kernel
        run: |
          set -o pipefail
          echo '=== CCACHE BEFORE ==='
          ccache --show-stats || true

          START=$(date +%s)
          ./scripts/57_build_resukisu_susfs_manual_detection.sh \
            2>&1 | tee artifacts/uclamp-android17-rq-idle-p4-p143-build.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "kernel_build_seconds=$((END-START))"
          echo '=== CCACHE AFTER ==='
          ccache --show-stats || true
          exit "$RC"

      - name: Audit P143 image and source
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          CORE="$KERNEL/kernel/sched/core.c"
          SH="$KERNEL/kernel/sched/sched.h"
          SUGOV="$KERNEL/kernel/sched/cpufreq_schedutil.c"

          test -s "$IMAGE"
          test -s "$KERNEL/out/vmlinux"

          grep -Fxq 'CONFIG_UCLAMP_TASK=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_SCHED_TUNE=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_SCHED_WALT=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_LRU_GEN=y' "$KERNEL/out/.config"

          grep -Fq 'A52 UCLAMP P4: Android17 rq access helpers + idle-rq semantics' "$SH"
          grep -Fq 'static inline unsigned long uclamp_rq_get(' "$SH"
          grep -Fq 'static inline void uclamp_rq_set(' "$SH"
          grep -Fq 'static inline bool uclamp_rq_is_idle(' "$SH"
          grep -Fq 'if (uclamp_rq_is_idle(rq))' "$SH"
          grep -Fq 'uclamp_rq_util_with(cpu_rq(cpu), util, p)' "$KERNEL/kernel/sched/fair.c"

          grep -Fq 'A52 UCLAMP P3: Android17 active-update idle-state correctness' "$CORE"
          grep -Fq 'static inline void uclamp_rq_reinc_id(' "$CORE"
          grep -Fq 'clamp_id == UCLAMP_MAX && uclamp_rq_is_idle(rq)' "$CORE"

          grep -Fq 'A52 SCHEDUTIL IOWAIT P1: Android17 6.18 fixed boost floor + uclamp-safe boost' "$SUGOV"
          grep -Fq 'A52 SCHEDUTIL P2: Android17 79443a7e limits_changed synchronization' "$SUGOV"
          grep -Fq 'U17 uclamp + WALT schedutil compatibility path active' "$SUGOV"
          grep -Fq 'sugov_walt_adjust' "$SUGOV"

          grep -Fq 'A52 MGLRU Modern P4: upstream 081488051d28 underprotected page cache' "$KERNEL/mm/vmscan.c"
          grep -Fq 'A619 KGSL P7 CP INIT: Qualcomm f583f456d0a2' "$KERNEL/drivers/gpu/msm/adreno_a6xx.c"
          grep -Fq 'A52 BOOT RESCUE P137' "$KERNEL/drivers/input/input.c"
          grep -Fq 'A52_RAMOOPS_BOOT_HOLD_NS' "$KERNEL/fs/pstore/ram.c"
          grep -aFq 'A52_BOOT_RESCUE: Power + Volume Up detected inside 5s window' "$IMAGE"
          grep -aFq 'A52_BOOT_RESCUE: direct restart to recovery' "$IMAGE"

          ! grep -RFn 'a52_rndis_reftrace\|a52_rndis_fibtrace' \
            "$KERNEL/include/linux/netdevice.h" "$KERNEL/net/core/dev.c" \
            "$KERNEL/drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c"
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"

          git -C "$KERNEL" diff --check

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: packaging/AnyKernel3
          fetch-depth: 1

      - name: Package P143 flashable ZIP
        run: |
          set -Eeuo pipefail
          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-p143.sh
          sed -i "s/grep -Fxq '# CONFIG_KSU_SUSFS is not set'/grep -Fxq 'CONFIG_KSU_SUSFS=y'/" scripts/.package-p143.sh
          sed -i 's/SUSFS must remain disabled for this package/Kernel config does not enable SUSFS core/' scripts/.package-p143.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/.package-p143.sh')
          s = p.read_text()
          anchor = 'dump_boot;\nwrite_boot;'
          if s.count(anchor) != 1:
              raise SystemExit(f'unexpected boot-write anchor count: {s.count(anchor)}')
          s = s.replace(
              anchor,
              'dump_boot;\n'
              'patch_cmdline "sched_eevdf" "sched_eevdf=1";\n'
              'patch_cmdline "sched_cass" "sched_cass=1";\n'
              'write_boot;',
              1,
          )
          p.write_text(s)
          PY

          python3 scripts/88_patch_anykernel_vulkan_renderengine.py scripts/.package-p143.sh
          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + P142-BASE35922568016 + UCLAMP-RQIDLE-P143/' scripts/.package-p143.sh
          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/A52-P143-UCLAMP-ANDROID17-RQ-IDLE-P4.zip/' scripts/.package-p143.sh
          chmod +x scripts/.package-p143.sh
          ./scripts/.package-p143.sh 4.19.206 "$IMAGE" packaging/AnyKernel3 release
          rm -f scripts/.package-p143.sh

      - name: Verify package
        run: |
          set -Eeuo pipefail
          ZIP="$(find release -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -s "$ZIP"
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'install_vulkan_re_module;'
          unzip -l "$ZIP" | tee artifacts/package-list.txt
          sha256sum "$ZIP" | tee artifacts/package-sha256.txt

      - name: Save compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-p143-uclamp-rq-idle-${{ runner.os }}-${{ github.sha }}

      - name: Upload P143 flashable ZIP and audit
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-BASE35922568016-UCLAMP-RQIDLE-P143-${{ github.run_number }}
          path: |
            release/
            artifacts/uclamp-android17-rq-idle-p4-p143.txt
            artifacts/uclamp-android17-rq-idle-p4-p143.diff
            artifacts/uclamp-android17-rq-idle-p4-p143-diffstat.txt
            artifacts/package-sha256.txt
          if-no-files-found: error
          retention-days: 14

# P143 scheduler logical phase: Android17 uclamp rq access + idle-rq semantics P4
# exact boot-tested baseline: actions run 35922568016 / ab534bdf965cddb4078c24dfd60be6b32edd7903
# Android17/Linux 6.18: uclamp_rq_get/set/is_idle helpers
# upstream idle-rq semantic origin: 3e1493f46390618ea78607cb30c58fc19e2a5035
