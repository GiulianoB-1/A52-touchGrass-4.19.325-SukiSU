name: Phase446 exact anchor inspect
run-name: Phase446 exact anchor inspect

on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore reconstructed GKI tree
        id: p429
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase429-gki-out
          key: a52xq-phase429-reconstructed-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9
      - name: Exact DSI and SMMU symbols for Phase446
        run: |
          set -Eeuo pipefail
          test "${{ steps.p429.outputs.cache-hit }}" = "true"
          R="$PWD/gki/common"
          echo '=== DSI REGISTER OFFSETS ==='
          grep -Rns -E '^#define[[:space:]]+DSI_(STATUS|LANE_STATUS|CLK_STATUS|INT_CTRL|FIFO_STATUS)[[:space:]]' "$R/drivers/a52_display/msm/dsi" | head -100
          echo '=== SMMU TRANSITION ANCHORS ==='
          sed -n '1640,1870p' "$R/drivers/iommu/arm/arm-smmu/arm-smmu.c"
          sed -n '2200,2260p' "$R/drivers/iommu/arm/arm-smmu/arm-smmu.c"
          sed -n '3080,3220p' "$R/drivers/iommu/arm/arm-smmu/arm-smmu.c"
