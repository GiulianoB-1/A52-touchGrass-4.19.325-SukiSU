name: 85 - A52 U1 uclamp+WALT Clang11

on:
  push:
    branches:
      - agent/a52-u1-uclamp-walt-v1
    paths:
      - .github/workflows/85-a52-u1-uclamp-walt-clang11.yml
      - scripts/81_*
      - scripts/82_*
      - scripts/84_*
      - scripts/85_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-u1-uclamp-walt-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  IMAGE: artifacts/Image-touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b

jobs:
  build:
    name: Build and package U1 uclamp+WALT
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: a52xq-u1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a52xq-u1-${{ runner.os }}-
            a52xq-u1-${{ runner.os }}-
            a52xq-binder82-${{ runner.os }}-
            a52xq-binder81-${{ runner.os }}-
            a52xq-4.19.206-eevdf-p1-${{ runner.os }}-

      - name: Reconstruct exact Phase80 kernel baseline
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/01_prepare_source.sh
          ./scripts/03_apply_linux_4.19.153.sh
          ./scripts/04_apply_linux_4.19.154.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.154 4.19.159
          ./scripts/checkpoint_resolve_linux_4.19.159.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.159 4.19.164
          ./scripts/checkpoint_resolve_linux_4.19.164.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.164 4.19.180
          ./scripts/checkpoint_resolve_linux_4.19.180.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.180 4.19.200
          ./scripts/checkpoint_resolve_linux_4.19.200.sh
          ./scripts/57_update_linux_4.19.200_to_4.19.206.sh
          ./scripts/58_backport_bpf_ringbuf.sh
          ./scripts/58_apply_ringbuf_overrun_fix.sh
          ./scripts/07_patch_resukisu_exec_hook.sh
          python3 scripts/59_apply_eevdf_phase1_scaffold.py workspace/touchgrass-a52xq
          python3 scripts/60_apply_eevdf_phase2_accounting.py workspace/touchgrass-a52xq
          python3 scripts/61_apply_eevdf_phase3_deadline_lag.py workspace/touchgrass-a52xq
          python3 scripts/62_apply_eevdf_phase4_tree_picker.py workspace/touchgrass-a52xq
          python3 scripts/63_apply_eevdf_phase5_picker_integration.py workspace/touchgrass-a52xq
          python3 scripts/64_apply_eevdf_phase6_wakeup_preempt.py workspace/touchgrass-a52xq
          python3 scripts/65_apply_eevdf_phase7_placement_consistency.py workspace/touchgrass-a52xq
          python3 scripts/74_apply_eevdf_multitask_correctness.py workspace/touchgrass-a52xq
          python3 scripts/77_apply_eevdf_lifecycle_correctness.py workspace/touchgrass-a52xq
          python3 scripts/78_apply_eevdf77_cass_hybrid.py workspace/touchgrass-a52xq
          ./scripts/79_apply_mglru_phase1.sh
          python3 scripts/80_apply_mglru_android_hardening.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff --check

      - name: Apply successful Android17 Binder and BinderFS port
        run: |
          set -Eeuo pipefail
          ./scripts/81_apply_android17_binder_core_probe.sh
          python3 scripts/82_enable_retained_binderfs.py workspace/touchgrass-a52xq
          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'BINDER_GET_EXTENDED_ERROR' "$KERNEL/include/uapi/linux/android/binder.h"
          grep -Fq 'BR_ONEWAY_SPAM_SUSPECT' "$KERNEL/include/uapi/linux/android/binder.h"
          grep -Fq 'BR_TRANSACTION_PENDING_FROZEN' "$KERNEL/include/uapi/linux/android/binder.h"
          grep -Fxq 'CONFIG_ANDROID_BINDERFS=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          git -C "$KERNEL" diff --check

      - name: Apply Android17 Binder allocator on Linux 4.19
        run: |
          set -Eeuo pipefail
          chmod +x scripts/84_apply_android17_binder_alloc.sh
          python3 -m py_compile scripts/84_patch_android17_binder_alloc.py
          ./scripts/84_apply_android17_binder_alloc.sh
          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'struct binder_shrinker_mdata' "$KERNEL/drivers/android/binder_alloc.h"
          grep -Fq 'unsigned long vm_start;' "$KERNEL/drivers/android/binder_alloc.h"
          grep -Fq 'bool oneway_spam_detected;' "$KERNEL/drivers/android/binder_alloc.h"
          ! grep -Fq 'struct binder_lru_page' "$KERNEL/drivers/android/binder_alloc.h"
          grep -Fq 'static struct shrinker binder_shrinker' "$KERNEL/drivers/android/binder_alloc.c"
          git -C "$KERNEL" diff --check

      - name: Apply proven Android FUSE passthrough
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/84_apply_fuse_passthrough_android.py
          python3 scripts/84_apply_fuse_passthrough_android.py workspace/touchgrass-a52xq
          KERNEL=workspace/touchgrass-a52xq
          grep -Fxq 'CONFIG_FUSE_PASSTHROUGH=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fq '#define FUSE_PASSTHROUGH' "$KERNEL/include/uapi/linux/fuse.h"
          grep -Fq 'FUSE_DEV_IOC_PASSTHROUGH_OPEN' "$KERNEL/include/uapi/linux/fuse.h"
          grep -Fq 'fuse_passthrough_setup(fc, ff, &outarg);' "$KERNEL/fs/fuse/file.c"
          grep -Fq 'fuse_features_group' "$KERNEL/fs/fuse/inode.c"
          git -C "$KERNEL" diff --check

      - name: Apply U1 uclamp + WALT schedutil integration
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/85_apply_uclamp_walt.py
          python3 scripts/85_apply_uclamp_walt.py workspace/touchgrass-a52xq
          KERNEL=workspace/touchgrass-a52xq
          grep -Fxq 'CONFIG_UCLAMP_TASK=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fxq 'CONFIG_SCHED_TUNE=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fxq 'CONFIG_SCHED_WALT=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fq 'U1 uclamp+WALT schedutil path active' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          grep -Fq 'util = uclamp_rq_util_with(rq, util, NULL);' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          grep -Fq 'schedtune_prefer_idle(p)' "$KERNEL/kernel/sched/core.c"
          git -C "$KERNEL" diff --check

      - name: Build U1 uclamp+WALT kernel
        run: |
          set -o pipefail
          ./scripts/57_build_resukisu_susfs_manual_detection.sh \
            2>&1 | tee artifacts/u1-uclamp-walt-build.log

      - name: Audit U1 image
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          test -s "$IMAGE"
          test -s "$KERNEL/out/vmlinux"
          grep -Fxq 'CONFIG_UCLAMP_TASK=y' "$KERNEL/out/.config"
          grep -Fxq '# CONFIG_UCLAMP_TASK_GROUP is not set' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_SCHED_TUNE=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_SCHED_WALT=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_SCHED_CASS=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_ANDROID_BINDERFS=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_FUSE_PASSTHROUGH=y' "$KERNEL/out/.config"

          nm -n "$KERNEL/out/vmlinux" | grep -E ' [Tt] (uclamp_eff_value|schedutil_cpu_util|binder_alloc_new_buf|fuse_passthrough_open)$' \
            | tee artifacts/u1-vmlinux-symbols.txt
          grep -Fq 'uclamp_eff_value' artifacts/u1-vmlinux-symbols.txt
          grep -Fq 'binder_alloc_new_buf' artifacts/u1-vmlinux-symbols.txt
          grep -Fq 'fuse_passthrough_open' artifacts/u1-vmlinux-symbols.txt

          {
            echo phase=u1
            echo uclamp_task=enabled
            echo uclamp_task_group=disabled
            echo schedutil=walt-plus-schedtune-then-uclamp
            echo schedtune=retained-for-vendor-compat
            echo walt=retained
            echo cass=unchanged-walt-safe
            echo eevdf=phase77
            echo binder=android17-core-plus-allocator
            echo fuse_passthrough=phase87
            echo mglru=phase80-runtime-switchable
            echo compiler=vendor-clang-r383902
            echo kernel=4.19.206
          } | tee artifacts/u1-audit.txt

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: packaging/AnyKernel3
          fetch-depth: 1

      - name: Package Android17 U1 uclamp+WALT ZIP
        run: |
          set -Eeuo pipefail
          mkdir -p release
          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-u1.sh

          sed -i "s/grep -Fxq '# CONFIG_KSU_SUSFS is not set'/grep -Fxq 'CONFIG_KSU_SUSFS=y'/" scripts/.package-u1.sh
          sed -i 's/SUSFS must remain disabled for this package/Kernel config does not enable SUSFS core/' scripts/.package-u1.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/.package-u1.sh")
          s = p.read_text()
          anchor = "dump_boot;\nwrite_boot;"
          if s.count(anchor) != 1:
              raise SystemExit(f"unexpected AnyKernel boot-write anchor count: {s.count(anchor)}")
          s = s.replace(
              anchor,
              'dump_boot;\n'
              'patch_cmdline "sched_eevdf" "sched_eevdf=1";\n'
              'patch_cmdline "sched_cass" "sched_cass=1";\n'
              'write_boot;',
              1,
          )
          p.write_text(s)
          PY

          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + U1 uclamp WALT/' scripts/.package-u1.sh
          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/ReSukiSU-v4.1.0-U1-UCLAMP-WALT-CLANG11.zip/' scripts/.package-u1.sh
          chmod +x scripts/.package-u1.sh

          ./scripts/.package-u1.sh \
            4.19.206 \
            "$IMAGE" \
            packaging/AnyKernel3 \
            release

          rm -f scripts/.package-u1.sh

      - name: Verify packaged Binder hardware test
        run: |
          set -Eeuo pipefail
          ZIP="$(find release -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -s "$ZIP"
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=1";'
          unzip -l "$ZIP" | tee artifacts/u1-package-list.txt
          sha256sum "$ZIP" | tee artifacts/u1-package-sha256.txt

      - name: Record diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d workspace/touchgrass-a52xq/.git ]; then
            git -C workspace/touchgrass-a52xq status --short > artifacts/u1-kernel-status.txt || true
            git -C workspace/touchgrass-a52xq diff --check > artifacts/u1-diff-check.txt 2>&1 || true
          fi
          ccache --show-stats > artifacts/u1-ccache.txt 2>&1 || true

      - name: Upload Android17 U1 uclamp+WALT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-4.19.206-U1-UCLAMP-WALT-CLANG11-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Binder84 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-u1-uclamp-walt-${{ github.run_number }}-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
