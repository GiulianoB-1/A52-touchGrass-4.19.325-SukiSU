name: 257 one-shot dispatch - corrected rebuild

on:
  push:
    branches:
      - agent/a52-phase257-kgsl-publication-pipeline-v1
    paths:
      - .github/workflows/257-dispatch-fixed-rebuild.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch corrected Phase 257 fast rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: 257-fast-a52-kgsl-publication-rebuild.yml
          TARGET_REF: agent/a52-phase257-kgsl-publication-pipeline-v1
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -d "{\"ref\":\"${TARGET_REF}\"}"
          echo "Dispatched ${TARGET_WORKFLOW} on ${TARGET_REF}"
