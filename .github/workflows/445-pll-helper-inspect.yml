name: Phase446A cmdline A/B builder
run-name: Phase446A exact P444-r14 + clk_ignore_unused

on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths:
      - .github/workflows/445-pll-helper-inspect.yml
      - scripts/446_append_boot_cmdline.py

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download exact successful Phase444 GKI run14 boot
        uses: actions/download-artifact@v4
        with:
          name: A52XQ-PHASE444-GKI-DEEP-PASSIVE-14-BOOT-IMG
          path: intake
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37440953195

      - name: Append clk_ignore_unused and audit one-variable delta
        run: |
          set -Eeuo pipefail
          SRC="intake/boot-phase444-gki-deep-passive-compare-v1.img"
          OUTDIR="phase446a-clk-ignore-unused"
          OUT="$OUTDIR/boot-phase446a-gki-p444r14-clk-ignore-unused.img"
          REPORT="$OUTDIR/cmdline-patch-report.json"
          mkdir -p "$OUTDIR"

          test -s "$SRC"
          test "$(stat -c '%s' "$SRC")" -eq 100663296
          printf '%s  %s\n'             '7bf90c1be5edc5b3f92e30cf39c026e25d0b2cc5f89f437fe1862f588e117665'             "$SRC" | sha256sum -c -

          python3 scripts/446_append_boot_cmdline.py             --source "$SRC"             --output "$OUT"             --report "$REPORT"             --append clk_ignore_unused             --expect-source-sha256 7bf90c1be5edc5b3f92e30cf39c026e25d0b2cc5f89f437fe1862f588e117665

          test "$(stat -c '%s' "$OUT")" -eq 100663296
          grep -Fq '"all_bytes_outside_extra_cmdline_unchanged": true' "$REPORT"
          grep -Fq '"primary_cmdline_unchanged": true' "$REPORT"
          grep -Fq '"boot_id_unchanged": true' "$REPORT"
          grep -Fq 'clk_ignore_unused' "$REPORT"

          cat > "$OUTDIR/README.txt" <<'EOF'
          Phase446A: clk_disable_unused A/B
          =================================
          Exact baseline: Phase444 GKI run #14 boot image.
          Only modification: boot-header token "clk_ignore_unused".
          Kernel/ramdisk/DTB/recorder are unchanged.

          Phase444 terminal snapshot retains:
            R:intf_1 -> INTF1 FRAME_COUNT at +0x0AC
            R:top_0  -> MDP interrupt registers including CTL_0_START state

          Interpretation:
            F0 success and/or FRAME_COUNT substantially above ~310 supports
            clk_disable_unused as the early destructive event.
          EOF
          sha256sum "$SRC" "$OUT" | tee "$OUTDIR/SHA256SUMS"

      - name: Upload Phase446A
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE446A-GKI-P444R14-CLK-IGNORE-UNUSED-BOOT-IMG
          path: phase446a-clk-ignore-unused/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
