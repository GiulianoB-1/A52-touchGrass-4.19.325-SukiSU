name: Phase446 bus handoff microscope
run-name: Phase446 bus handoff microscope

on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore reconstructed GKI tree
        id: p429
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase429-gki-out
          key: a52xq-phase429-reconstructed-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9
      - name: Inspect actual bus-vote/handoff path
        run: |
          set -Eeuo pipefail
          test "${{ steps.p429.outputs.cache-hit }}" = "true"
          R="$PWD/gki/common"
          B="$PWD/workspace/gki-phase199-out"
          echo '=== CONFIG ==='
          grep -E '^CONFIG_(QCOM_BUS_SCALING|INTERCONNECT|INTERCONNECT_QCOM|INTERCONNECT_QCOM_RPMH|INTERCONNECT_QCOM_SM6350)=' "$B/.config" || true

          echo '=== SDE POWER BUS BRANCH ==='
          grep -n -A320 -B30 -E '^#ifdef CONFIG_QCOM_BUS_SCALING|^#else|^#endif|_sde_power_data_bus_set_quota|sde_power_data_bus_set_quota|sde_power_data_bus_parse|sde_power_data_bus_state_update|sde_power_reg_bus_parse' "$R/drivers/a52_display/msm/sde_power_handle.c" | head -1500

          echo '=== BUILT IMAGE PROVES REAL BRANCH ==='
          for s in 'invalid bus handle %d' 'data_bus_client register failed' 'msm_bus_scale_req'; do
            echo "-- $s"; grep -aobF "$s" "$B/arch/arm64/boot/Image" | head || true
          done

          echo '=== MDSS SDE BUS DT ==='
          grep -Rns -A80 -B30 -E 'mdss_sde|qcom,msm-bus,num-cases|qcom,msm-bus,num-paths|qcom,sde-data-bus|qcom,sde-reg-bus|bus-vector' "$R/arch/arm64/boot/dts/qcom/lagoon"* "$R/arch/arm64/boot/dts/qcom" 2>/dev/null | head -2600 || true

          echo '=== BUS PROXY CLIENT SOURCES/DT ==='
          grep -Rns -A100 -B30 -E 'bus-proxy-client|bus_proxy|proxy.*bus|msm_bus.*proxy|proxy.*msm_bus|Remove handoff bw requests|msm_bus_device_late_init|commit_late_init_data' "$R/drivers" "$R/arch/arm64/boot/dts/qcom" 2>/dev/null | head -2800 || true

          echo '=== MDP0 MEM / ICC / MNOC FLOOR ==='
          grep -Rns -A80 -B30 -Ei 'mdp0[-_]mem|mdss.*mem|display.*mnoc|mnoc.*display|floor.*display|floor.*mdp|400000000|5000000000|5000000000ULL|5000000000L|5000000' "$R/drivers/interconnect" "$R/drivers/soc/qcom" "$R/arch/arm64/boot/dts/qcom" 2>/dev/null | head -2600 || true

          echo '=== MSM BUS LATE HANDOFF EXACT ==='
          grep -Rns -A120 -B50 -E 'int __init msm_bus_device_late_init|bcm_remove_handoff_req|commit_late_init_data|init_time' "$R/drivers" 2>/dev/null | head -1800 || true
