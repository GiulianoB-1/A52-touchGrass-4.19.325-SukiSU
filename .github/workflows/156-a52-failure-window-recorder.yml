name: 156 - A52 failure-window recorder without watchdog

run-name: Build targeted black-screen recorder from agent/a52-keymaster-real-ion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/156-a52-failure-window-recorder.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-failure-window-recorder
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  RUN32_ARTIFACT_ID: '8635093061'
  RECORDER_BRANCH: agent/a52-keymaster-real-ion

jobs:
  build-package:
    name: Compile and package targeted failure-window recorder
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out recorder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORDER_BRANCH }}

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile \
            scripts/154_apply_a52xq_failure_window_probe.py \
            scripts/38_repack_a52_p1_boot.py

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Download verified Run 32 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p run32/extracted
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN32_ARTIFACT_ID}/zip" \
            --output run32/artifact.zip
          unzip -q run32/artifact.zip -d run32/extracted
          (cd run32/extracted && sha256sum -c SHA256SUMS)
          test -s run32/extracted/stage/full-source.patch
          test -s run32/extracted/config/final.config
          test -s run32/extracted/package/boot.img
          test -s run32/extracted/tools/decode-a52-unified-secure-recorder.py
          grep -Fq 'A52_ACKFR_EARLY_MIRRORED_BACKEND' run32/extracted/stage/full-source.patch
          grep -Fq 'A52USR2 BOOT_EARLY stage=mm_init' run32/extracted/stage/full-source.patch

      - name: Restore source and stage failure-window probe
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          test -d gki/common/.git
          test "$(git -C gki/common rev-parse HEAD)" = "${GKI_COMMON_SHA}"
          git -C gki/common reset --hard "${GKI_COMMON_SHA}"
          git -C gki/common clean -fd
          git -C gki/common apply --check "$PWD/run32/extracted/stage/full-source.patch"
          git -C gki/common apply "$PWD/run32/extracted/stage/full-source.patch"

          OUT="$PWD/artifacts/a52xq-gki-failure-window-recorder"
          mkdir -p "$OUT/logs" "$OUT/stage" "$OUT/config" "$OUT/compile" "$OUT/package" "$OUT/tools"
          python3 scripts/154_apply_a52xq_failure_window_probe.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/failure-window-stage.log"

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              'artifacts/a52xq-gki-failure-window-recorder/stage/'
              'phase25-a52-failure-window-probe-report.json').read_text())
          assert report['status'] == 'a52-failure-window-probe-v1-staged'
          assert report['payload_capture'] is False
          assert report['recorder']['capacity'] == 1536
          assert report['recorder']['heartbeat_interval_ms'] == 500
          assert report['recorder']['heartbeat_window_ms'] == 300000
          assert report['recorder']['continuous_persistence_after_capacity'] is True
          assert report['display']['active_probe_count'] >= 6
          assert report['watchdog']['registration_bypassed'] is True
          assert report['watchdog']['firmware_watchdog_disarmed'] is True
          PY

          grep -Fq 'HB tick=%u online=%u run=%lu j=%lu' \
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c
          grep -Fq 'A52_USR2_CONTINUOUS_PERSIST' \
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c
          grep -Fq 'A52_ACKFR_SCOPE("DISP", "drm_atomic_helper_commit")' \
            gki/common/drivers/gpu/drm/drm_atomic_helper.c
          grep -Fq 'A52_ACKFR_SCOPE("DISP", "drm_panel_prepare")' \
            gki/common/drivers/gpu/drm/drm_panel.c
          grep -Fq 'A52_FAILURE_WINDOW_WATCHDOG_DISARM' \
            gki/common/drivers/watchdog/qcom-wdt.c
          grep -Fq 'qcom_wdt_stop(&wdt->wdd);' \
            gki/common/drivers/watchdog/qcom-wdt.c
          git -C gki/common diff --check
          git -C gki/common add -N .
          git -C gki/common diff --binary --no-ext-diff > "$OUT/stage/failure-window-source.patch"
          test -s "$OUT/stage/failure-window-source.patch"

      - name: Resolve configuration and compile
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-failure-window-recorder"
          BUILD="$PWD/workspace/gki-failure-window-recorder-out"
          mkdir -p "$BUILD"
          cp run32/extracted/config/final.config "$BUILD/.config"
          gki/common/scripts/config --file "$BUILD/.config" --enable WATCHDOG
          gki/common/scripts/config --file "$BUILD/.config" --enable WATCHDOG_CORE
          gki/common/scripts/config --file "$BUILD/.config" --enable QCOM_WDT
          gki/common/scripts/config --file "$BUILD/.config" --disable WATCHDOG_HANDLE_BOOT_ENABLED
          gki/common/scripts/config --file "$BUILD/.config" --disable WATCHDOG_NOWAYOUT

          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$OUT/logs/olddefconfig.log"
          cp "$BUILD/.config" "$OUT/config/final.config"
          grep -Fxq 'CONFIG_QCOM_WDT=y' "$BUILD/.config"
          grep -Fxq '# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED is not set' "$BUILD/.config"

          set +e
          make -k -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
            KCFLAGS=-Wno-error=frame-larger-than Image > "$OUT/logs/compile.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/compile/make-return-code.txt"
          if [ "$rc" -ne 0 ]; then
            grep -nE '(^|: )(fatal error|error): |undefined reference to' \
              "$OUT/logs/compile.log" | tail -n 300 || true
            tail -n 400 "$OUT/logs/compile.log" || true
            exit "$rc"
          fi

          test -s "$BUILD/arch/arm64/boot/Image"
          cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image"
          gzip -n -9 -c "$OUT/compile/Image" > "$OUT/package/Image.gz"
          gzip -t "$OUT/package/Image.gz"
          grep -aFq 'HB tick=%u online=%u run=%lu j=%lu' "$OUT/compile/Image"
          grep -aFq 'WDT disarm before=%u after=%u' "$OUT/compile/Image"
          grep -aFq 'A52 diagnostic: watchdog disabled for manual recovery' "$OUT/compile/Image"
          grep -aFq 'drm_atomic_helper_commit' "$OUT/compile/Image"
          grep -aFq 'drm_panel_prepare' "$OUT/compile/Image"
          grep -aFq 'A52USR2 BOOT_EARLY stage=mm_init backend=early-mirrored' "$OUT/compile/Image"

      - name: Upload failed diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-failure-window-recorder-${{ github.run_number }}-FAILED-DIAGNOSTICS
          path: artifacts/a52xq-gki-failure-window-recorder
          if-no-files-found: warn
          retention-days: 7

      - name: Repack and audit boot image
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-failure-window-recorder
          python3 scripts/38_repack_a52_p1_boot.py \
            --source run32/extracted/package/boot.img \
            --kernel "$OUT/package/Image.gz" \
            --output "$OUT/package/boot.img" \
            --report "$OUT/package/repack-report.json"
          test -s "$OUT/package/boot.img"
          cp run32/extracted/tools/decode-a52-unified-secure-recorder.py \
            "$OUT/tools/decode-a52-unified-secure-recorder.py"

          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          root = Path('artifacts/a52xq-gki-failure-window-recorder')
          report = json.loads((root / 'stage/phase25-a52-failure-window-probe-report.json').read_text())
          repack = json.loads((root / 'package/repack-report.json').read_text())
          errors = re.findall(
              r'^[^:\s][^:]*:\d+:\d+: (?:fatal error|error): ',
              (root / 'logs/compile.log').read_text(errors='replace'), re.M)
          boot = root / 'package/boot.img'
          final = {
              'status': 'a52-failure-window-recorder-boot-audited',
              'flashable_candidate': True,
              'hardware_validated': False,
              'payload_capture': False,
              'compiler_error_count': len(errors),
              'heartbeat_interval_ms': report['recorder']['heartbeat_interval_ms'],
              'heartbeat_window_ms': report['recorder']['heartbeat_window_ms'],
              'display_probe_count': report['display']['active_probe_count'],
              'watchdog_disarmed_in_probe': report['watchdog']['firmware_watchdog_disarmed'],
              'watchdog_registration_bypassed': report['watchdog']['registration_bypassed'],
              'boot_sha256': hashlib.sha256(boot.read_bytes()).hexdigest(),
              'boot_bytes': boot.stat().st_size,
              'dtb_preserved': repack['invariants']['dtb_preserved'],
              'ramdisk_preserved': repack['invariants']['ramdisk_preserved'],
              'recovery_dtbo_preserved': repack['invariants']['recovery_dtbo_preserved'],
          }
          if errors:
              raise SystemExit(f'compiler errors survived audit: {len(errors)}')
          (root / 'final-audit.json').write_text(json.dumps(final, indent=2, sort_keys=True) + '\n')
          PY

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 GKI 5.10 FAILURE-WINDOW RECORDER

          Records a 500 ms kernel heartbeat, timed display-stack entry and exit
          events, and the Qualcomm watchdog state before and after it is stopped.
          The watchdog device is not registered, leaving time to enter recovery.

          Flash package/boot.img using the known-good Run 32 method. After the black
          screen, wait at least 10 seconds, enter recovery manually, and collect the
          complete raw 1 MiB RAMOOPS snapshot. Keep the raw file even if ZIP fails.

          This image is not hardware validated.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload flashable recorder artifact
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-failure-window-recorder-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-gki-failure-window-recorder
          if-no-files-found: error
          retention-days: 14

      - name: Require final audited output
        run: |
          set -Eeuo pipefail
          test -s artifacts/a52xq-gki-failure-window-recorder/package/boot.img
          grep -Fq '"status": "a52-failure-window-recorder-boot-audited"' \
            artifacts/a52xq-gki-failure-window-recorder/final-audit.json
