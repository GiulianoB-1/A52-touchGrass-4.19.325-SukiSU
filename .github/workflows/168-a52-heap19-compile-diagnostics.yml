name: 168 - A52 heap-19 compile diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/168-a52-heap19-compile-diagnostics.yml

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: a52-heap19-compile-diagnostics
  cancel-in-progress: true

env:
  FEATURE_BRANCH: agent/a52-qseecom-ta-heap19
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  ACTIVE_SOURCE_ARTIFACT_ID: '8654956416'
  ACTIVE_SOURCE_ARTIFACT_SHA256: a70b7cd08c3e578415cc5289a36a4efb1ad61cfe8734c2e198b9aa8ebb763c08

jobs:
  compile-diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out heap-19 feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}

      - name: Prepare runner and patcher
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile scripts/166_apply_a52_qseecom_ta_heap19.py
          python3 scripts/166_apply_a52_qseecom_ta_heap19.py --self-test

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Download audited active source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p active/extracted diagnostics
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACTIVE_SOURCE_ARTIFACT_ID}/zip" \
            --output active/artifact.zip
          printf '%s  %s\n' "${ACTIVE_SOURCE_ARTIFACT_SHA256}" active/artifact.zip \
            | sha256sum -c -
          unzip -q active/artifact.zip -d active/extracted
          (cd active/extracted && sha256sum -c SHA256SUMS)
          test -s active/extracted/stage/refgen-active-display-scopes-source.patch
          test -s active/extracted/config/final.config

      - name: Restore source and stage heap 19
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          test -d gki/common/.git
          test "$(git -C gki/common rev-parse HEAD)" = "${GKI_COMMON_SHA}"
          git -C gki/common reset --hard "${GKI_COMMON_SHA}"
          git -C gki/common clean -fd
          git -C gki/common apply --check \
            "$PWD/active/extracted/stage/refgen-active-display-scopes-source.patch"
          git -C gki/common apply \
            "$PWD/active/extracted/stage/refgen-active-display-scopes-source.patch"
          python3 scripts/166_apply_a52_qseecom_ta_heap19.py \
            --gki gki/common --output diagnostics/stage \
            2>&1 | tee diagnostics/stage.log
          git -C gki/common diff --check
          git -C gki/common add -N .
          git -C gki/common diff --binary --no-ext-diff \
            > diagnostics/qseecom-ta-heap19-source.patch

      - name: Compile heap-19 object and preserve complete log
        run: |
          set +e
          mkdir -p diagnostics/compile workspace/gki-qseecom-ta-heap19-diag-out
          BUILD="$PWD/workspace/gki-qseecom-ta-heap19-diag-out"
          cp active/extracted/config/final.config "$BUILD/.config"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            > diagnostics/olddefconfig.log 2>&1
          olddef_rc=$?
          printf '%s\n' "$olddef_rc" > diagnostics/olddefconfig-return-code.txt
          if [ "$olddef_rc" -eq 0 ]; then
            cp "$BUILD/.config" diagnostics/final.config
            make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
              KCFLAGS=-Wno-error=frame-larger-than \
              drivers/staging/android/ion/heaps/a52_qseecom_ta_heap.o \
              > diagnostics/compile.log 2>&1
            compile_rc=$?
          else
            compile_rc=125
          fi
          printf '%s\n' "$compile_rc" > diagnostics/compile/make-return-code.txt
          grep -nE '(^|: )(fatal error|error): |undefined reference to|warning:' \
            diagnostics/compile.log > diagnostics/compiler-errors.txt 2>/dev/null || true
          tail -n 800 diagnostics/compile.log > diagnostics/compile-tail-800.txt 2>/dev/null || true
          exit "$compile_rc"

      - name: Upload complete compiler diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-qseecom-ta-heap19-compiler-diagnostics-${{ github.run_number }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Report diagnostic run to issue 68
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > issue-comment.json
          import json
          import os
          body = (
              "## Heap-19 compiler diagnostics\n\n"
              f"- run: `{os.environ['GITHUB_RUN_ID']}`\n"
              f"- run number: `{os.environ['GITHUB_RUN_NUMBER']}`\n"
              f"- job status: `{os.environ['JOB_STATUS']}`\n"
              f"- source branch: `{os.environ['FEATURE_BRANCH']}`\n"
              f"- target: `drivers/staging/android/ion/heaps/a52_qseecom_ta_heap.o`\n"
              f"- artifact: `a52xq-qseecom-ta-heap19-compiler-diagnostics-{os.environ['GITHUB_RUN_NUMBER']}`\n\n"
              "The artifact preserves the complete object compiler log, extracted error lines, "
              "compile tail, generated heap-19 source patch, stage report, and return codes."
          )
          print(json.dumps({"body": body}))
          PY
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/68/comments" \
            --data-binary @issue-comment.json
