# registered trigger v2
name: TEMP 258 bridge - source route and dispatch A/B

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-258-temp-bridge.yml

permissions:
  contents: write
  actions: write

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Phase258 branch
        uses: actions/checkout@v4
        with:
          ref: agent/a52-phase258-no-namei-ab-v1
          fetch-depth: 0

      - name: Route cumulative Phase255 chain to Phase258 overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/255_phase254_postboot_visibility_overlay.py')
          t = p.read_text(encoding='utf-8')
          old = 'PHASE257 = Path(__file__).resolve().parent / "257_phase256_kgsl_publication_pipeline_overlay.py"'
          new = 'PHASE257 = Path(__file__).resolve().parent / "258_phase257_no_namei_ab.py"'
          if new not in t:
              if t.count(old) != 1:
                  raise SystemExit(f'Phase255 route anchor count {t.count(old)}')
              t = t.replace(old, new, 1)
              p.write_text(t, encoding='utf-8')
          compile(Path('scripts/258_phase257_no_namei_ab.py').read_text(encoding='utf-8'),
                  'scripts/258_phase257_no_namei_ab.py', 'exec')
          print('Phase255 now routes to Phase258 A/B overlay')
          PY
          git diff --check

      - name: Commit source-only Phase258 route
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- scripts/255_phase254_postboot_visibility_overlay.py; then
            echo 'Phase255 route already committed'
          else
            git add scripts/255_phase254_postboot_visibility_overlay.py
            git commit -m 'Route Phase 258 A/B through cumulative builder'
            git push origin HEAD:agent/a52-phase258-no-namei-ab-v1
          fi

      - name: Dispatch registered Phase257 fast workflow on Phase258 ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/257-fast-a52-kgsl-publication-rebuild.yml/dispatches" \
            -d '{"ref":"agent/a52-phase258-no-namei-ab-v1"}'
          echo 'Phase258 A/B compile dispatched through registered fast workflow'
