name: 319b - Phase176-179 lineage witness

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase319-gki-dsi-sixpoint-temporal-observer-v1
    paths:
      - .github/workflows/319b-phase175-lineage-witness.yml

permissions:
  contents: read
  actions: read

jobs:
  lineage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Phase176 through Phase179 workflow lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          token=os.environ['GH_TOKEN']
          h=['-H',f'Authorization: Bearer {token}','-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2022-11-28']
          def get(url):
              p=subprocess.run(['curl','--silent','--show-error','--location','--fail-with-body',*h,url],text=True,capture_output=True)
              return p.returncode,p.stdout,p.stderr

          workflows=[]
          for page in range(1,10):
              rc,out,err=get(f'{api}/actions/workflows?per_page=100&page={page}')
              if rc:
                  print('LIST_ERROR',page,err.strip()); break
              batch=json.loads(out).get('workflows',[])
              workflows.extend(batch)
              if len(batch)<100: break

          targets=[]
          print('PHASE176_179_WORKFLOWS_BEGIN')
          for w in workflows:
              path=w.get('path','')
              base=path.rsplit('/',1)[-1]
              name=w.get('name','')
              if any(base.startswith(f'{n}-') or name.startswith(f'{n} ') or name.startswith(f'{n} -') for n in (176,177,178,179)):
                  targets.append(w)
                  print('\t'.join(str(x) for x in (w.get('id'),name,path,w.get('state'))))
          print('PHASE176_179_WORKFLOWS_END')

          for w in targets:
              wid=w['id']; base=w.get('path','').rsplit('/',1)[-1]
              rc,out,err=get(f'{api}/actions/workflows/{wid}/runs?per_page=100')
              print(f'RUNS_BEGIN {base} id={wid}')
              if rc:
                  print('RUNS_ERROR',err.strip()); print(f'RUNS_END {base}'); continue
              for r in sorted(json.loads(out).get('workflow_runs',[]),key=lambda x:(x.get('run_number',0),x.get('created_at',''))):
                  print('\t'.join(str(x) for x in (r.get('run_number'),r.get('id'),r.get('created_at'),r.get('conclusion'),r.get('head_sha'),r.get('head_branch'),r.get('event'),r.get('display_title'))))
                  arc,aout,aerr=get(f"{api}/actions/runs/{r['id']}/artifacts?per_page=100")
                  if not arc:
                      for a in json.loads(aout).get('artifacts',[]):
                          print('ARTIFACT\t'+'\t'.join(str(x) for x in (a.get('id'),a.get('name'),a.get('size_in_bytes'),a.get('expired'),a.get('created_at'))))
              print(f'RUNS_END {base}')
          PY

      - name: Search repository history around Phase178
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --unshallow origin || git fetch --no-tags --depth=1200 origin
          echo PHASE178_COMMIT_MESSAGES_BEGIN
          git log --all --format='%H%x09%aI%x09%s' --grep='Phase 178\|Phase178\|phase 178\|phase178\|178 -' -i || true
          echo PHASE178_COMMIT_MESSAGES_END
          echo SDE_HISTORY_175_179_WINDOW_BEGIN
          git log --all --format='%H%x09%aI%x09%s' --since='2026-07-27T00:00:00Z' --until='2026-08-01T23:59:59Z' -- \
            scripts drivers/a52_display/msm/sde/sde_crtc.c drivers/a52_display/msm/sde/sde_encoder.c || true
          echo SDE_HISTORY_175_179_WINDOW_END
