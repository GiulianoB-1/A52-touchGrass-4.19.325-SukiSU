name: 132 - A52 USB RNDIS DEVMAP HASH Fix P3

on:
  push:
    branches:
      - agent/a52-opt-p1-mglru-cass-uclamp-sugov
    paths:
      - .github/workflows/132-a52-usb-rndis-devmap-hash-fix-p3.yml
      - scripts/132_apply_bpf_devmap_hash_unregister_fix_p3.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-usb-rndis-devmap-hash-fix-p3-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  IMAGE: artifacts/Image-touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b

jobs:
  build:
    name: Build exact 35633887441 baseline + USB RNDIS DEVMAP HASH fix P3
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out exact run 35633887441 project baseline
        uses: actions/checkout@v4
        with:
          ref: 95278a740d6c4ccca32489247f373a0f6ab96982

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-f2fs325-p1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52xq-effp1-recorder-${{ runner.os }}-
            a52xq-f2fs325-p1-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Restore exact 35461116688 pre-build kernel source
        id: prebuild_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-effp1-recorder-prebuild-${{ runner.os }}-${{ hashFiles('scripts/104_apply_fuse_740_upstream_passthrough.py', 'scripts/106_apply_mglru_modern_p1.py', 'scripts/106_apply_mglru_modern_p1_core.py', 'scripts/107_apply_mglru_modern_p2.py', 'scripts/108_apply_mglru_modern_p3.py', 'scripts/109_apply_eevdf_efficiency_p1.py', 'scripts/109b_finalize_eevdf_efficiency_p1.py', 'scripts/110_apply_uclamp_efficiency_p1.py', 'scripts/110b_finalize_uclamp_efficiency_p1.py', 'scripts/111_apply_mglru_power_diag_p1.py', 'scripts/112_apply_mglru_power_recorder_p2.py', 'scripts/115_apply_a52_efficiency_p1.py', 'scripts/116_apply_a52_scheduler_recorder.py', 'scripts/117_migrate_mglru_trace_to_proc.py') }}

      - name: Require exact successful baseline cache
        run: |
          set -Eeuo pipefail
          echo "cache-hit=${{ steps.prebuild_source.outputs.cache-hit }}"
          if [ "${{ steps.prebuild_source.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Exact pre-build source cache from baseline 35461116688 was not restored."
            exit 1
          fi
          test -d workspace/touchgrass-a52xq/.git
          grep -Fq '#define FUSE_KERNEL_MINOR_VERSION 40' workspace/touchgrass-a52xq/include/uapi/linux/fuse.h
          grep -Fq 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts' workspace/touchgrass-a52xq/mm/vmscan.c
          grep -Fq 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active' workspace/touchgrass-a52xq/kernel/sched/cass.c
          grep -Fq 'A52 A619 GPU UV P3: 565 MHz one ARC corner' workspace/touchgrass-a52xq/drivers/gpu/msm/kgsl_gmu.c

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts release
          chmod +x scripts/*.sh scripts/*.py

      - name: Apply compatible F2FS stable fixes through 4.19.325
        run: |
          set -Eeuo pipefail
          ./scripts/118_apply_f2fs_stable_325_p1.sh \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-stable325-p1.txt \
            artifacts/f2fs-stable325-patches
          cat artifacts/f2fs-stable325-p1.txt
          git -C workspace/touchgrass-a52xq diff --stat | tee artifacts/f2fs-stable325-diffstat.txt
          git -C workspace/touchgrass-a52xq diff -- fs/f2fs include/linux/f2fs_fs.h \
            > artifacts/f2fs-stable325-p1.diff || true

      - name: Apply F2FS gc_merge P2
        run: |
          set -Eeuo pipefail
          python3 scripts/119_apply_f2fs_gc_merge_p2.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff --check
          git -C workspace/touchgrass-a52xq diff --stat | tee artifacts/f2fs-gcmerge-p2-diffstat.txt
          git -C workspace/touchgrass-a52xq diff -- fs/f2fs > artifacts/f2fs-gcmerge-p2.diff
          grep -Fq 'F2FS_MOUNT_GC_MERGE' workspace/touchgrass-a52xq/fs/f2fs/f2fs.h
          grep -Fq 'waitqueue_active(fggc_wq)' workspace/touchgrass-a52xq/fs/f2fs/gc.c
          grep -Fq 'prepare_to_wait(&sbi->gc_thread->fggc_wq' workspace/touchgrass-a52xq/fs/f2fs/segment.c
          grep -Fq 'f2fs_submit_merged_write(sbi, DATA)' workspace/touchgrass-a52xq/fs/f2fs/segment.c
          grep -Fq '"gc_merge"' workspace/touchgrass-a52xq/fs/f2fs/super.c

      - name: Apply F2FS inmem curseg P3A
        run: |
          set -Eeuo pipefail
          python3 scripts/121_apply_f2fs_inmem_curseg_p3a.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-inmem-p3a
          git -C workspace/touchgrass-a52xq diff --check
          git -C workspace/touchgrass-a52xq diff --stat | tee artifacts/f2fs-inmem-p3a-diffstat.txt
          grep -Fq 'NR_CURSEG_INMEM_TYPE' workspace/touchgrass-a52xq/fs/f2fs/f2fs.h
          grep -Fq 'CURSEG_COLD_DATA_PINNED = NR_PERSISTENT_LOG' workspace/touchgrass-a52xq/fs/f2fs/f2fs.h
          grep -Fq 'void f2fs_save_inmem_curseg' workspace/touchgrass-a52xq/fs/f2fs/segment.c
          grep -Fq '__allocate_new_segment' workspace/touchgrass-a52xq/fs/f2fs/segment.c
          grep -Fq 'active_logs != NR_CURSEG_PERSIST_TYPE' workspace/touchgrass-a52xq/fs/f2fs/super.c
          ! grep -Rqs 'CURSEG_ALL_DATA_ATGC\|F2FS_MOUNT_ATGC\|GC_IDLE_AT' workspace/touchgrass-a52xq/fs/f2fs

      - name: Snapshot booted P3A F2FS source
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/pre-atgc-p3b/fs artifacts/pre-atgc-p3b/include/trace/events
          cp -a workspace/touchgrass-a52xq/fs/f2fs artifacts/pre-atgc-p3b/fs/
          cp -a workspace/touchgrass-a52xq/include/trace/events/f2fs.h artifacts/pre-atgc-p3b/include/trace/events/

      - name: Apply F2FS ATGC P3B
        run: |
          set -Eeuo pipefail
          python3 scripts/122_apply_f2fs_atgc_p3b.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-atgc-p3b
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-atgc-p3b/report.txt
          grep -Fq 'manual Samsung ATGC adaptation=PASS' artifacts/f2fs-atgc-p3b/report.txt
          grep -Fq 'ATGC default=off' artifacts/f2fs-atgc-p3b/report.txt

      - name: Enable ATGC at initial mount P3C
        run: |
          set -Eeuo pipefail
          python3 scripts/123_enable_f2fs_atgc_p3c.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-atgc-p3c
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-atgc-p3c/report.txt
          grep -Fq 'ATGC default=on at initial mount only' artifacts/f2fs-atgc-p3c/report.txt

      - name: Apply newer ATGC refinements P4
        run: |
          set -Eeuo pipefail
          python3 scripts/124_apply_f2fs_atgc_p4.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-atgc-p4
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-atgc-p4/report.txt
          grep -Fq 'dynamic_atgc_reenable=6efc3a05e613' artifacts/f2fs-atgc-p4/report.txt
          grep -Fq 'atgc_enabled_sysfs=6f092b55e1ad' artifacts/f2fs-atgc-p4/report.txt
          grep -Fq 'skip_empty_gc_sections=dccd324fa9bd' artifacts/f2fs-atgc-p4/report.txt

      - name: Apply block-age extent cache P5A
        run: |
          set -Eeuo pipefail
          python3 scripts/125_apply_f2fs_block_age_p5a.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-block-age-p5a
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-block-age-p5a/report.txt
          grep -Fq 'feature=71644dff4811' artifacts/f2fs-block-age-p5a/report.txt
          grep -Fq 'fix_age_math=b03a41a495df' artifacts/f2fs-block-age-p5a/report.txt
          grep -Fq 'activation=OFF by default' artifacts/f2fs-block-age-p5a/report.txt

      - name: Enable block-age extent cache P5B
        run: |
          set -Eeuo pipefail
          python3 scripts/126_enable_f2fs_block_age_p5b.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-block-age-p5b
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-block-age-p5b/report.txt
          grep -Fq 'age_extent_cache default=on at initial mount' artifacts/f2fs-block-age-p5b/report.txt
          grep -Fq 'observability=enabled,tree_count,node_count,allocated_data_blocks' artifacts/f2fs-block-age-p5b/report.txt

      - name: Apply GC/segment/checkpoint modernization P6
        run: |
          set -Eeuo pipefail
          python3 scripts/127_apply_f2fs_gc_cp_p6.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-gc-cp-p6
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-gc-cp-p6/report.txt
          grep -Fq 'checkpoint_freeze_fix=d50dfc0c7df7 adapted' artifacts/f2fs-gc-cp-p6/report.txt
          grep -Fq 'ioctl_gc_victim_fix=e9a844f6e487 adapted' artifacts/f2fs-gc-cp-p6/report.txt
          grep -Fq 'lfs_map_blocks_balance_fix=1005a3ca28e9' artifacts/f2fs-gc-cp-p6/report.txt

      - name: Apply recent correctness/data-integrity P7
        run: |
          set -Eeuo pipefail
          python3 scripts/128_apply_f2fs_correctness_p7.py \
            workspace/touchgrass-a52xq \
            artifacts/f2fs-correctness-p7
          git -C workspace/touchgrass-a52xq diff --check
          cat artifacts/f2fs-correctness-p7/report.txt
          grep -Fq 'nat_flag_lock_fix=238e14eb7226 adapted' artifacts/f2fs-correctness-p7/report.txt
          grep -Fq 'node_mark_fix=019f9dda7f66+c3e238bd1f56 adapted-to-pages' artifacts/f2fs-correctness-p7/report.txt
          grep -Fq 'write_end_io_uaf_fix=ce2739e482bc+2d9c4a4ed4ee adapted-to-pages' artifacts/f2fs-correctness-p7/report.txt

      - name: Apply BPF boot reliability P1
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/129_apply_bpf_bootfix_p1.py
          python3 scripts/129_apply_bpf_bootfix_p1.py \
            workspace/touchgrass-a52xq \
            artifacts/bpf-bootfix-p1
          cat artifacts/bpf-bootfix-p1/report.txt
          KERNEL=workspace/touchgrass-a52xq
          git -C "$KERNEL" diff --check
          ! grep -RFn 'REG_LIVE_DONE' "$KERNEL/include/linux/bpf_verifier.h" "$KERNEL/kernel/bpf/verifier.c"
          ! grep -Fq 'struct idpair' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'struct bpf_id_pair *idmap' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'i < BPF_ID_MAP_SIZE' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'if (env->explore_alu_limits)' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'ctx_access = true;' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'ctx_access = BPF_CLASS(insn->code) == BPF_STX;' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'ptype = BPF_PROG_TYPE_SK_MSG;' "$KERNEL/kernel/bpf/syscall.c"
          grep -Fq 'ptype = BPF_PROG_TYPE_SK_SKB;' "$KERNEL/kernel/bpf/syscall.c"
          git -C "$KERNEL" diff -- include/linux/bpf_verifier.h kernel/bpf/verifier.c kernel/bpf/syscall.c \
            > artifacts/bpf-bootfix-p1.diff

      - name: Apply USB RNDIS reftrace P1
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/130_apply_usb_rndis_reftrace_p1.py" \
            -o /tmp/130_apply_usb_rndis_reftrace_p1.py
          python3 -m py_compile /tmp/130_apply_usb_rndis_reftrace_p1.py
          python3 /tmp/130_apply_usb_rndis_reftrace_p1.py \
            workspace/touchgrass-a52xq \
            artifacts/usb-rndis-reftrace-p1
          cat artifacts/usb-rndis-reftrace-p1/report.txt

          KERNEL=workspace/touchgrass-a52xq
          git -C "$KERNEL" diff --check
          grep -Fq 'A52 USB RNDIS reftrace P1' "$KERNEL/include/linux/netdevice.h"
          grep -Fq 'a52_rndis_reftrace(dev, true);' "$KERNEL/include/linux/netdevice.h"
          grep -Fq 'a52_rndis_reftrace(dev, false);' "$KERNEL/include/linux/netdevice.h"
          grep -Fq 'A52_RNDIS_REFTRACE_SIZE' "$KERNEL/net/core/dev.c"
          grep -Fq 'proc_create("a52_rndis_reftrace"' "$KERNEL/net/core/dev.c"
          grep -Fq 'a52_rndis_reftrace_freeze(dev, refcnt);' "$KERNEL/net/core/dev.c"
          grep -Fq 'a52_rndis_reftrace_reset(net);' "$KERNEL/drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c"
          grep -Fq "a52_rndis_reftrace_mark(rndis_ipa_ctx->net, 'U');" "$KERNEL/drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c"

          git -C "$KERNEL" diff -- \
            include/linux/netdevice.h \
            net/core/dev.c \
            drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c \
            > artifacts/usb-rndis-reftrace-p1.diff

      - name: Apply USB RNDIS FIB trace P2
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/131_apply_usb_rndis_fibtrace_p2.py" \
            -o /tmp/131_apply_usb_rndis_fibtrace_p2.py
          python3 -m py_compile /tmp/131_apply_usb_rndis_fibtrace_p2.py
          python3 /tmp/131_apply_usb_rndis_fibtrace_p2.py \
            workspace/touchgrass-a52xq \
            artifacts/usb-rndis-fibtrace-p2
          cat artifacts/usb-rndis-fibtrace-p2/report.txt

          KERNEL=workspace/touchgrass-a52xq
          git -C "$KERNEL" diff --check
          grep -Fq 'A52 USB RNDIS FIB trace P2' "$KERNEL/include/linux/netdevice.h"
          grep -Fq 'A52_RNDIS_FIBTRACE_SIZE' "$KERNEL/net/core/dev.c"
          grep -Fq 'proc_create("a52_rndis_fibtrace"' "$KERNEL/net/core/dev.c"
          grep -Fq "a52_rndis_fibtrace(dev, 'G'" "$KERNEL/net/core/dev.c"
          grep -Fq "a52_rndis_fibtrace(nexthop_nh->nh_dev, '4'" "$KERNEL/net/ipv4/fib_semantics.c"
          grep -Fq "a52_rndis_fibtrace(nexthop_nh->nh_dev, 'q'" "$KERNEL/net/ipv4/fib_semantics.c"
          grep -Fq "a52_rndis_fibtrace(dev, 'A'" "$KERNEL/net/ipv6/route.c"
          grep -Fq "a52_rndis_fibtrace(dev, '6'" "$KERNEL/net/ipv6/route.c"
          grep -Fq "a52_rndis_fibtrace(f6i->fib6_nh.nh_dev, 'v'" "$KERNEL/net/ipv6/ip6_fib.c"
          grep -Fq 'a52_rndis_fibtrace_reset(net);' "$KERNEL/drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c"
          grep -Fq 'A52 USB RNDIS fix P3' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'dtab->map.map_type == BPF_MAP_TYPE_DEVMAP_HASH' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'dev_map_hash_remove_netdev(dtab, netdev);' "$KERNEL/kernel/bpf/devmap.c"

          git -C "$KERNEL" diff -- \
            include/linux/netdevice.h \
            net/core/dev.c \
            net/ipv4/fib_semantics.c \
            net/ipv6/route.c \
            net/ipv6/ip6_fib.c \
            drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c \
            > artifacts/usb-rndis-fibtrace-p2.diff

      - name: Apply BPF DEVMAP_HASH unregister fix P3
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/132_apply_bpf_devmap_hash_unregister_fix_p3.py" \
            -o /tmp/132_apply_bpf_devmap_hash_unregister_fix_p3.py
          python3 -m py_compile /tmp/132_apply_bpf_devmap_hash_unregister_fix_p3.py
          python3 /tmp/132_apply_bpf_devmap_hash_unregister_fix_p3.py \
            workspace/touchgrass-a52xq \
            artifacts/usb-rndis-devmap-hash-fix-p3
          cat artifacts/usb-rndis-devmap-hash-fix-p3/report.txt

          KERNEL=workspace/touchgrass-a52xq
          git -C "$KERNEL" diff --check
          grep -Fq 'A52 USB RNDIS fix P3' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'dtab->map.map_type == BPF_MAP_TYPE_DEVMAP_HASH' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'dev_map_hash_remove_netdev(dtab, netdev);' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'hlist_del_rcu(&dev->index_hlist);' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'call_rcu(&dev->rcu, __dev_map_entry_free);' "$KERNEL/kernel/bpf/devmap.c"

          git -C "$KERNEL" diff -- kernel/bpf/devmap.c \
            > artifacts/usb-rndis-devmap-hash-fix-p3.diff

      - name: Build integrated kernel
        run: |
          set -o pipefail
          echo '=== CCACHE BEFORE ==='
          ccache --show-stats || true
          START=$(date +%s)
          ./scripts/57_build_resukisu_susfs_manual_detection.sh \
            2>&1 | tee artifacts/f2fs-stable325-build.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "kernel_build_seconds=$((END-START))"
          echo '=== CCACHE AFTER ==='
          ccache --show-stats || true
          exit "$RC"

      - name: Audit integrated image
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          test -s "$IMAGE"
          test -s "$KERNEL/out/vmlinux"
          grep -Fxq 'CONFIG_F2FS_FS=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_FUSE_PASSTHROUGH=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_UCLAMP_TASK=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_BPF=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_BPF_SYSCALL=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_BPF_JIT=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_BPF_JIT_ALWAYS_ON=y' "$KERNEL/out/.config"
          ! grep -RFn 'REG_LIVE_DONE' "$KERNEL/include/linux/bpf_verifier.h" "$KERNEL/kernel/bpf/verifier.c"
          ! grep -Fq 'struct idpair' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'ctx_access = true;' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'ctx_access = BPF_CLASS(insn->code) == BPF_STX;' "$KERNEL/kernel/bpf/verifier.c"
          grep -Fq 'ptype = BPF_PROG_TYPE_SK_MSG;' "$KERNEL/kernel/bpf/syscall.c"
          grep -Fq 'ptype = BPF_PROG_TYPE_SK_SKB;' "$KERNEL/kernel/bpf/syscall.c"
          grep -Fq 'A52 USB RNDIS reftrace P1' "$KERNEL/include/linux/netdevice.h"
          grep -Fq 'A52_RNDIS_REFTRACE_SIZE' "$KERNEL/net/core/dev.c"
          grep -Fq 'proc_create("a52_rndis_reftrace"' "$KERNEL/net/core/dev.c"
          grep -Fq 'a52_rndis_reftrace_reset(net);' "$KERNEL/drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c"
          grep -Fq 'A52 USB RNDIS FIB trace P2' "$KERNEL/include/linux/netdevice.h"
          grep -Fq 'A52_RNDIS_FIBTRACE_SIZE' "$KERNEL/net/core/dev.c"
          grep -Fq 'proc_create("a52_rndis_fibtrace"' "$KERNEL/net/core/dev.c"
          grep -Fq "a52_rndis_fibtrace(dev, 'G'" "$KERNEL/net/core/dev.c"
          grep -Fq "a52_rndis_fibtrace(nexthop_nh->nh_dev, '4'" "$KERNEL/net/ipv4/fib_semantics.c"
          grep -Fq "a52_rndis_fibtrace(nexthop_nh->nh_dev, 'q'" "$KERNEL/net/ipv4/fib_semantics.c"
          grep -Fq "a52_rndis_fibtrace(dev, 'A'" "$KERNEL/net/ipv6/route.c"
          grep -Fq "a52_rndis_fibtrace(dev, '6'" "$KERNEL/net/ipv6/route.c"
          grep -Fq "a52_rndis_fibtrace(f6i->fib6_nh.nh_dev, 'v'" "$KERNEL/net/ipv6/ip6_fib.c"
          grep -Fq 'a52_rndis_fibtrace_reset(net);' "$KERNEL/drivers/platform/msm/ipa/ipa_clients/rndis_ipa.c"
          grep -Fq 'applied=' artifacts/f2fs-stable325-p1.txt
          grep -Fq 'processed=34' artifacts/f2fs-stable325-p1.txt
          grep -Fq 'F2FS_MOUNT_GC_MERGE' "$KERNEL/fs/f2fs/f2fs.h"
