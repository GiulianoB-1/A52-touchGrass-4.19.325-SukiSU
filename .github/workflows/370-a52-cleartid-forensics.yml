name: Phase370 - clear_child_tid forensics
run-name: Phase370 - clear_child_tid forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase346-dma-raw-v1
    paths:
      - .github/workflows/370-a52-cleartid-forensics.yml
      - scripts/360_apply_ufs_defer_pinpoint.py
      - scripts/361_apply_ufs_platform_gate.py
      - scripts/362_apply_ufs_qmp_flat_bridge.py
      - scripts/363_remove_phase340_60s_reboot.py
      - scripts/364_apply_apexd_syscall_ring.py
      - scripts/365_apply_apexd_writev_futex.py
      - scripts/366_apply_apexd_futex_threads.py
      - scripts/367_apply_apexd_kernel_futex_wake.py
      - scripts/368_apply_apexd_thread_forensics.py
      - scripts/369_apply_apexd_join_target.py
      - scripts/370_apply_cleartid_forensics.py

permissions:
  contents: read
  actions: write

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd

concurrency:
  group: a52-phase370-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase370 clear_child_tid forensics
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc g++ python3 bc bison flex clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves
          python3 -m py_compile \
            scripts/357_apply_init_exit_cause.py \
            scripts/358_apply_pid1_syscall_trace.py \
            scripts/359_apply_pid1_writev_payload.py \
            scripts/360_apply_ufs_defer_pinpoint.py \
            scripts/361_apply_ufs_platform_gate.py \
            scripts/362_apply_ufs_qmp_flat_bridge.py \
            scripts/363_remove_phase340_60s_reboot.py \
            scripts/364_apply_apexd_syscall_ring.py \
            scripts/365_apply_apexd_writev_futex.py \
            scripts/366_apply_apexd_futex_threads.py \
            scripts/367_apply_apexd_kernel_futex_wake.py \
            scripts/368_apply_apexd_thread_forensics.py \
            scripts/369_apply_apexd_join_target.py \
            scripts/370_apply_cleartid_forensics.py

      - name: Restore Phase346 baseline cache v2
        id: phase346-v2
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
            phase346-gki-out
          key: a52xq-phase346-baseline-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-445fe739

      - name: Restore Phase346 baseline cache v1
        if: steps.phase346-v2.outputs.cache-hit != 'true'
        id: phase346-v1
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
            phase346-gki-out
          key: a52xq-phase346-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-445fe739

      - name: Require validated Phase346 cache
        run: |
          set -Eeuo pipefail
          if [ '${{ steps.phase346-v2.outputs.cache-hit }}' != 'true' ] && \
             [ '${{ steps.phase346-v1.outputs.cache-hit }}' != 'true' ]; then
            echo 'Phase346 cache missing; run Phase357 first.' >&2
            exit 1
          fi
          test -s phase346-gki-out/package/boot.img
          test -s phase346-gki-out/config/final.config
          test -s workspace/gki-phase199-out/arch/arm64/boot/Image
          test "$(stat -c '%s' phase346-gki-out/package/boot.img)" -eq 100663296

      - name: Rebuild exact Phase357 baseline
        env:
          PHASE357_PREWARMED_PHASE346: '1'
        run: bash scripts/357_ci_build_gki.sh

      - name: Reapply Phase358 and Phase359 source lineage
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT" --check-only
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT"
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT" --check-only

      - name: Audit inherited UFS compatibility fixes
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          {
            echo "=== inherited UFS compatibility audit ==="
            for spec in \
              "PINCTRL_BYPASS|$ROOT/drivers/base/dd.c|A52_UFS_PINCTRL_DEFER_BYPASS" \
              "RPMH_MODE_ABI|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|A52RPMHABI copy=1" \
              "RPMH_DOWNSTREAM_PROVIDER|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|qcom,rpmh-vrm-regulator" \
              "UFS_ICE_SAFE|$ROOT/drivers/scsi/ufs/ufs-qcom-ice.c|A52_UFS_ICE_SAFE_BRINGUP" \
              "LEGACY_UFS_GDSC|$ROOT/drivers/regulator/a52-legacy-gdsc-regulator.c|gcc_ufs_phy_gdsc"; do
              IFS='|' read -r name file marker <<< "$spec"
              if [ -f "$file" ] && grep -Fq "$marker" "$file"; then
                echo "$name=present"
              else
                echo "$name=absent"
              fi
            done
          } | tee phase370-inherited-ufs-audit.txt

      - name: Apply Phase360 through Phase370 and compile
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          OUT="$PWD/phase370-gki-out"

          python3 scripts/360_apply_ufs_defer_pinpoint.py --root "$ROOT"
          python3 scripts/360_apply_ufs_defer_pinpoint.py --root "$ROOT" --check-only
          python3 scripts/361_apply_ufs_platform_gate.py --root "$ROOT"
          python3 scripts/361_apply_ufs_platform_gate.py --root "$ROOT" --check-only
          python3 scripts/362_apply_ufs_qmp_flat_bridge.py --root "$ROOT"
          python3 scripts/362_apply_ufs_qmp_flat_bridge.py --root "$ROOT" --check-only
          python3 scripts/363_remove_phase340_60s_reboot.py --root "$ROOT"
          python3 scripts/363_remove_phase340_60s_reboot.py --root "$ROOT" --check-only
          python3 scripts/364_apply_apexd_syscall_ring.py --root "$ROOT"
          python3 scripts/364_apply_apexd_syscall_ring.py --root "$ROOT" --check-only
          python3 scripts/365_apply_apexd_writev_futex.py --root "$ROOT"
          python3 scripts/365_apply_apexd_writev_futex.py --root "$ROOT" --check-only
          python3 scripts/366_apply_apexd_futex_threads.py --root "$ROOT"
          python3 scripts/366_apply_apexd_futex_threads.py --root "$ROOT" --check-only
          python3 scripts/367_apply_apexd_kernel_futex_wake.py --root "$ROOT"
          python3 scripts/367_apply_apexd_kernel_futex_wake.py --root "$ROOT" --check-only
          python3 scripts/368_apply_apexd_thread_forensics.py --root "$ROOT"
          python3 scripts/368_apply_apexd_thread_forensics.py --root "$ROOT" --check-only
          python3 scripts/369_apply_apexd_join_target.py --root "$ROOT"
          python3 scripts/369_apply_apexd_join_target.py --root "$ROOT" --check-only
          python3 scripts/370_apply_cleartid_forensics.py --root "$ROOT"
          python3 scripts/370_apply_cleartid_forensics.py --root "$ROOT" --check-only

          CORE="$ROOT/drivers/scsi/ufs/ufshcd.c"
          QCOM="$ROOT/drivers/scsi/ufs/ufs-qcom.c"
          DD="$ROOT/drivers/base/dd.c"
          PHY="$ROOT/drivers/phy/qualcomm/phy-qcom-qmp.c"
          REC="$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          SYSCALL="$ROOT/arch/arm64/kernel/syscall.c"
          FUTEX="$ROOT/kernel/futex/core.c"
          [ -f "$FUTEX" ] || FUTEX="$ROOT/kernel/futex.c"
          FORK="$ROOT/kernel/fork.c"
          echo "Phase370 patchers passed check-only audits"
          grep -Fq 'A52_PHASE362_UFS_QMP_FLAT_BRIDGE_V1' "$PHY"
          grep -Fq 'qcom,ufs-phy-qmp-v3' "$PHY"
          grep -Fq 'P362 FLAT_DETECTED children=0 phys=1' "$PHY"
          grep -Fq 'qcom_qmp_phy_create_a52_flat' "$PHY"
          grep -Fq 'A52_PHASE363_REMOVE_60S_REBOOT_V1' "$REC"
          grep -Fq 'P276 340C t=60 continue=1' "$REC"
          grep -Fq 'A52_PHASE364_APEXD_SYSCALL_RING_V1' "$SYSCALL"
          grep -Fq 'A52_R364_SIDEBAND_PHYS    0xB1BF0000ULL' "$SYSCALL"
          grep -Fq '!strncmp(current->comm, "apexd", TASK_COMM_LEN)' "$SYSCALL"
          grep -Fq 'A52_PHASE365_APEXD_WRITEV_FUTEX_V1' "$SYSCALL"
          grep -Fq 'A52_R365_SLOT_BYTES       1024U' "$SYSCALL"
          grep -Fq 'A52_R365_PAYLOAD_BYTES    844U' "$SYSCALL"
          grep -Fq 'A52_PHASE366_APEXD_FUTEX_THREADS_V1' "$SYSCALL"
          grep -Fq 'A52_R366_RING_SLOTS         56U' "$SYSCALL"
          grep -Fq 'A52_R366_LATCH_REPLICAS     8U' "$SYSCALL"
          grep -Fq 'A52_PHASE367_APEXD_KERNEL_FUTEX_WAKE_V1' "$FUTEX"
          grep -Fq 'READ_ONCE(current->clear_child_tid)' "$FUTEX"
          grep -Fq 'A52_PHASE368_APEXD_THREAD_FORENSICS_V1' "$SYSCALL"
          grep -Fq 'A52_R368_SLOTS              64U' "$SYSCALL"
          grep -Fq 'r.wchan = get_wchan(task);' "$SYSCALL"
          grep -Fq 'vma->vm_file->f_path.dentry->d_name.name' "$SYSCALL"
          grep -Fq 'kernel_restart("recovery");' "$SYSCALL"
          grep -Fq 'A52_PHASE369_APEXD_JOIN_TARGET_V1' "$SYSCALL"
          grep -Fq 'A52_R369_TRACK_SLOTS        128U' "$SYSCALL"
          grep -Fq 'access_process_vm(leader, (unsigned long)wait_uaddr' "$SYSCALL"
          grep -Fq 'stack_trace_save_tsk(task, r->kstack' "$SYSCALL"
          grep -Fq 'A52_PHASE370_CLEARTID_FORENSICS_V1' "$SYSCALL"
          grep -Fq 'A52_R370_EVT_CLONE_RETURN' "$SYSCALL"
          grep -Fq 'A52_PHASE370_CLEARTID_FORENSICS_V1' "$FORK"
          grep -Fq 'a52_r370_put_rc = put_user(0, a52_r370_ctid);' "$FORK"
          grep -Fq 'do_futex(a52_r370_ctid, FUTEX_WAKE' "$FORK"
          if ! git -C "$ROOT" diff --check; then
            echo "WARNING: git diff --check reported formatting issues; continuing to compile"
          fi

          cp phase357-gki-out/config/final.config "$BUILD/.config"
          make -C "$ROOT" O="$BUILD" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          cmp -s phase357-gki-out/config/final.config "$BUILD/.config"
          grep -Fxq 'CONFIG_PHY_QCOM_QMP=y' "$BUILD/.config"

          make -C "$ROOT" O="$BUILD" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image

          IMAGE="$BUILD/arch/arm64/boot/Image"
          test -s "$IMAGE"
          grep -aFq 'P360 c=1 QCOM stage=devm_phy_get' "$IMAGE"
          grep -aFq 'P361 c=1 PREPROBE stage=bus_probe_end' "$IMAGE"
          grep -aFq 'P361 c=1 PREPROBE stage=pm_activate' "$IMAGE"
          grep -aFq 'P362 FLAT_DETECTED children=0 phys=1' "$IMAGE"
          grep -aFq 'P362 FLAT_PROVIDER create_ret=%d' "$IMAGE"
          grep -aFq 'P276 340C t=60 continue=1' "$IMAGE"
          grep -aFq 'A52_PHASE364_APEXD_SYSCALL_RING_V1' "$IMAGE"
          grep -aFq 'A52_PHASE365_APEXD_WRITEV_FUTEX_V1' "$IMAGE"
          grep -aFq 'A52_PHASE366_APEXD_FUTEX_THREADS_V1' "$IMAGE"
          grep -aFq 'A52_PHASE367_APEXD_KERNEL_FUTEX_WAKE_V1' "$IMAGE"
          grep -aFq 'A52_PHASE368_APEXD_THREAD_FORENSICS_V1' "$IMAGE"
          grep -aFq 'A52_PHASE369_APEXD_JOIN_TARGET_V1' "$IMAGE"
          grep -aFq 'A52_PHASE370_CLEARTID_FORENSICS_V1' "$IMAGE"

          rm -rf "$OUT"
          mkdir -p "$OUT"/{package,compile,config,source,audit}
          cp "$IMAGE" "$BUILD/System.map" "$OUT/compile/"
          cp "$BUILD/.config" "$OUT/config/final.config"
          cp "$CORE" "$QCOM" "$DD" "$PHY" "$REC" "$SYSCALL" "$FUTEX" "$FORK" "$OUT/source/"
          cp scripts/360_apply_ufs_defer_pinpoint.py scripts/361_apply_ufs_platform_gate.py scripts/362_apply_ufs_qmp_flat_bridge.py scripts/363_remove_phase340_60s_reboot.py scripts/364_apply_apexd_syscall_ring.py scripts/365_apply_apexd_writev_futex.py scripts/366_apply_apexd_futex_threads.py scripts/367_apply_apexd_kernel_futex_wake.py scripts/368_apply_apexd_thread_forensics.py scripts/369_apply_apexd_join_target.py scripts/370_apply_cleartid_forensics.py "$OUT/audit/"
          cp phase370-inherited-ufs-audit.txt "$OUT/audit/"

          gzip -n -c "$IMAGE" > "$OUT/package/Image.gz"
          python3 scripts/38_repack_a52_p1_boot.py \
            --source phase357-gki-out/package/boot.img \
            --kernel "$OUT/package/Image.gz" \
            --output "$OUT/package/boot.img" \
            --report "$OUT/package/repack-report.json"
          test "$(stat -c '%s' "$OUT/package/boot.img")" -eq 100663296

          cat > "$OUT/PHASE370-SCHEMA.txt" <<'SCHEMA'
          Phase370 clear_child_tid forensics
          ====================================
          Runtime lineage: Phase357 + Phase358 + Phase359 + Phase360.

          Purpose
          -------
          Phase359 proved first-stage init aborts because required UFS partitions
          never appear. Driver-core tracing shows 1d84000.ufshc / ufshcd-qcom
          repeatedly returns -EPROBE_DEFER.

          Phase360 records exactly which dependency returns the defer.

          Generic UFS stages:
          init_hba_vreg, setup_hba_vreg, init_clocks, setup_clocks,
          init_device_vreg, setup_device_vreg, variant_hba_init.

          Per-resource detail:
          VREG name=<rail> ret=<errno>
          CLK name=<clock> ret=<errno>
          VOPS stage=init/setup_regulators

          Qualcomm detail:
          QCOM stage=devm_phy_get ret=<errno> supplier=<DT node>
          compat=<compatible> pdev=<device> driver=<driver/unbound>
          defer=<deferred-probe state>

          Phase361 retains the driver-core and Phase360 UFS trace.

          Phase362 restores the A52-specific legacy QMP-v3 PHY contract:
          - compatible qcom,ufs-phy-qmp-v3
          - downstream clock names ref_clk_src/ref_clk/ref_aux_clk
          - one generic PHY for Samsung's flat childless #phy-cells=0 node
          - downstream QMP-v3 lane/PCS offsets
          - reset bypass for the flat legacy provider

          Phase363 hardware result:
          - the kernel remains alive through the ~330 s safety window
          - init, servicemanager, hwservicemanager and vndservicemanager are alive
          - the second /system/bin/apexd group leader starts around 18.6 s
          - that apexd group leader does not exit before the 330 s cutoff
          - odsign, zygote, SurfaceFlinger and the DSI DMA transfer are never reached
          - Phase346 DMA slots p0..p6 remain empty

          Phase369 hardware result:
          - apexd group leader waits in plain FUTEX_WAIT on a pthread TID word
          - expected value is TID 1285
          - exact target TID 1285 no longer exists at ~31.7 s
          - access_process_vm() successfully reads the join word
          - the word still contains 1285 (0x505), not zero
          - therefore the pthread join is stuck because CLONE_CHILD_CLEARTID
            exit cleanup did not clear the TID word

          Phase370 traces the entire clear-child-TID lifecycle in one boot:
          - apexd clone() returns: child TID, clone flags, child_tid address
          - main-thread pthread_join-shaped FUTEX_WAIT target/address
          - every apexd thread entering mm_release()
          - clear_child_tid pointer, mm_users and signal flags
          - userspace word before cleanup
          - put_user(0, clear_child_tid) return and word immediately afterward
          - do_futex(FUTEX_WAKE) return and final word

          This distinguishes in one capture:
          - CLONE_CHILD_CLEARTID was never supplied
          - clear_child_tid was lost before exit
          - mm_release skipped cleanup because of its branch conditions
          - put_user failed
          - put_user succeeded but memory did not change
          - wake failed after a successful clear
          - or userspace rewrote the word after successful kernel cleanup

          Records are flushed immediately and the diagnostic boot reboots to
          recovery at ~45 s.
          SCHEMA

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          r=Path('phase370-gki-out')
          def sha(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()
          audit={}
          for line in (r/'audit/phase370-inherited-ufs-audit.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); audit[k]=v
          ident={
              'phase':'370',
              'name':'CLEARTID-FORENSICS-V1',
              'base_phase':'357',
              'source_lineage':['357','358','359','360','361','362','363','364','365','366','367','368','369','370'],
              'hardware_validated':False,
              'boot_img_size':(r/'package/boot.img').stat().st_size,
              'boot_img_sha256':sha(r/'package/boot.img'),
              'image_sha256':sha(r/'compile/Image'),
              'inherited_ufs_compatibility':audit,
              'git_sha':os.getenv('GITHUB_SHA'),
          }
          (r/'BUILD-IDENTITY.json').write_text(json.dumps(ident,indent=2,sort_keys=True)+'\n')
          PY

          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload Phase370
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE370-CLEARTID-FORENSICS-${{ github.run_number }}
          path: phase370-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE370-CLEARTID-FORENSICS-${{ github.run_number }}-BOOT-IMG
          path: phase370-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
