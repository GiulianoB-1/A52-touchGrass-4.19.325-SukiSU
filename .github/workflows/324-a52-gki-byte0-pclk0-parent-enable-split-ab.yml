name: 324 - A52 GKI BYTE0/PCLK0 parent-enable split A/B
run-name: Phase324 - BYTE0 vs PCLK0 parent-enable split A/B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase324-gki-byte0-pclk0-parent-enable-split-ab-v1
    paths:
      - .github/workflows/324-a52-gki-byte0-pclk0-parent-enable-split-ab.yml
      - scripts/324_apply_parent_enable_split.py
      - scripts/324_ci_build_gki.sh
      - scripts/319_apply_dsi_sixpoint_temporal_observer.py
      - scripts/319_ci_build_gki.sh
      - scripts/319_reconstruct_phase206_from_verified_artifact.sh
      - scripts/319_regenerate_phase175_base.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-phase324-parent-enable-split-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE319_GOOD_HEAD: e466f29c784001b5f933091298162714a9181b8d

jobs:
  gki:
    name: Build Phase324 ${{ matrix.variant }} parent-enable-only
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: [byte0, pclk0]
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE324_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase324 runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates unzip make gcc g++ python3 bc bison flex clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile scripts/319_apply_dsi_sixpoint_temporal_observer.py scripts/324_apply_parent_enable_split.py
          bash -n scripts/319_ci_build_gki.sh scripts/324_ci_build_gki.sh scripts/319_regenerate_phase175_base.sh

      - name: Restore exact successful Phase319 reconstruction helper
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/319_reconstruct_phase206_from_verified_artifact.sh?ref=${PHASE319_GOOD_HEAD}"
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github.raw+json' \
            "$API" --output "/tmp/p324-${PHASE324_VARIANT}-phase319-reconstruct-good.sh"
          test -s "/tmp/p324-${PHASE324_VARIANT}-phase319-reconstruct-good.sh"
          grep -Fq 'a52-port-compat.h' "/tmp/p324-${PHASE324_VARIANT}-phase319-reconstruct-good.sh"
          bash -n "/tmp/p324-${PHASE324_VARIANT}-phase319-reconstruct-good.sh"
          cp "/tmp/p324-${PHASE324_VARIANT}-phase319-reconstruct-good.sh" scripts/319_reconstruct_phase206_from_verified_artifact.sh
          chmod +x scripts/319_reconstruct_phase206_from_verified_artifact.sh

      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Build and audit Phase324 ${{ matrix.variant }}
        run: bash scripts/324_ci_build_gki.sh

      - name: Upload Phase324 ${{ matrix.variant }} evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE324-GKI-${{ matrix.variant }}-PARENT-ENABLE-ONLY-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase324-${{ matrix.variant }}-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase324 ${{ matrix.variant }} boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE324-GKI-${{ matrix.variant }}-PARENT-ENABLE-ONLY-${{ github.run_number }}-BOOT-IMG
          path: phase324-${{ matrix.variant }}-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Phase324 ${{ matrix.variant }} failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE324-GKI-${{ matrix.variant }}-PARENT-ENABLE-ONLY-${{ github.run_number }}-FAILED
          path: phase324-${{ matrix.variant }}-gki-failure/
          if-no-files-found: warn
          retention-days: 30
