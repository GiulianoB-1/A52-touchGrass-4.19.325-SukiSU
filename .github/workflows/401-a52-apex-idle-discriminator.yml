name: Phase401 - apexd idle discriminator
run-name: Phase401 - apexd idle discriminator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase378-gki-ufs-completion-flight-recorder-v1
    paths:
      - .github/workflows/401-a52-apex-idle-discriminator.yml
      - scripts/401_apply_apex_idle_discriminator.py
      - scripts/decode_phase401_apex_idle.py
      - scripts/38_repack_a52_p1_boot.py
      - .github/workflows/400-a52-irq-exec-discriminator.yml
      - scripts/400_apply_irq_exec_witness.py
      - scripts/decode_phase400_irq_exec.py
      - .github/workflows/399-a52-fixed-hardirq-witness.yml
      - scripts/399_apply_fixed_hardirq_witness.py
      - scripts/decode_phase399_irq_witness.py
      - .github/workflows/398-a52-dense-ap-cliff.yml
      - scripts/398_apply_dense_ap_cliff.py
      - scripts/decode_phase398_irq_cliff.py
      - .github/workflows/397-a52-downstream-bus-votes.yml
      - scripts/397_apply_downstream_bus_votes.py
      - .github/workflows/396-a52-noc-irq-evidence.yml
      - scripts/396_apply_noc_irq_evidence.py
      - scripts/decode_phase396_noc_irq.py

permissions:
  contents: read

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd

concurrency:
  group: a52-phase401-apex-idle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase401 apexd idle discriminator
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ python3 bc bison flex clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves
          python3 -m py_compile \
            scripts/395_apply_noc_wall_discriminator.py \
            scripts/396_apply_noc_irq_evidence.py \
            scripts/397_apply_downstream_bus_votes.py \
            scripts/398_apply_dense_ap_cliff.py \
            scripts/399_apply_fixed_hardirq_witness.py \
            scripts/400_apply_irq_exec_witness.py \
            scripts/401_apply_apex_idle_discriminator.py \
            scripts/decode_phase400_irq_exec.py \
            scripts/decode_phase401_apex_idle.py \
            scripts/decode_phase396_noc_irq.py \
            scripts/decode_phase398_irq_cliff.py \
            scripts/decode_phase399_irq_witness.py

      - name: Restore exact Phase357 baseline
        id: phase357-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase357-gki-out
          key: a52xq-phase357-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/357_ci_build_gki.sh', 'scripts/357_apply_init_exit_cause.py') }}

      - name: Validate Phase357 cache
        run: |
          set -Eeuo pipefail
          test "${{ steps.phase357-cache.outputs.cache-hit }}" = "true"
          test -d gki/common
          test -s workspace/gki-phase199-out/arch/arm64/boot/Image
          test -s phase357-gki-out/package/boot.img
          test -s phase357-gki-out/config/final.config

      - name: Reapply Phase358 and Phase359
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT" --check-only
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT"
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT" --check-only

      - name: Audit inherited UFS compatibility fixes
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          {
            echo "=== inherited UFS compatibility audit ==="
            for spec in \
              "PINCTRL_BYPASS|$ROOT/drivers/base/dd.c|A52_UFS_PINCTRL_DEFER_BYPASS" \
              "RPMH_MODE_ABI|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|A52RPMHABI copy=1" \
              "RPMH_DOWNSTREAM_PROVIDER|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|qcom,rpmh-vrm-regulator" \
              "UFS_ICE_SAFE|$ROOT/drivers/scsi/ufs/ufs-qcom-ice.c|A52_UFS_ICE_SAFE_BRINGUP" \
              "LEGACY_UFS_GDSC|$ROOT/drivers/regulator/a52-legacy-gdsc-regulator.c|gcc_ufs_phy_gdsc"; do
              IFS='|' read -r name file marker <<< "$spec"
              if [ -f "$file" ] && grep -Fq "$marker" "$file"; then
                echo "$name=present"
              else
                echo "$name=absent"
              fi
            done
          } | tee phase377-inherited-ufs-audit.txt

      - name: Audit Gladiator support in the A52 source tree
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          {
            echo "=== Phase396 Gladiator ERP source/DT audit ==="
            echo "kernel=$(git -C "$ROOT" rev-parse HEAD)"
            echo "targets=qcom,msm-gladiator-v2 qcom,msm-gladiator-v3 MSM_GLADIATOR_ERP gladiator_erp clear_gladiator_error"
            grep -RnsE \
              'qcom,msm-gladiator-v2|qcom,msm-gladiator-v3|MSM_GLADIATOR_ERP|gladiator_erp|clear_gladiator_error' \
              "$ROOT/arch/arm64/boot/dts" \
              "$ROOT/drivers/soc/qcom" \
              "$ROOT/drivers/interconnect" \
              "$ROOT/drivers/firmware" \
              2>/dev/null || true
          } | tee phase396-gladiator-audit.txt

      - name: Build Phase400 from Phase399 fixed-witness baseline
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          src = Path(".github/workflows/394-a52-mode-fixup-fifo-early.yml").read_text().splitlines()
          start = next(i for i,l in enumerate(src)
                       if l.strip() == "- name: Apply Phase360 through Phase394 and compile")
          runline = next(i for i in range(start + 1, len(src))
                         if src[i].strip() == "run: |")
          end = next(i for i in range(runline + 1, len(src))
                     if src[i].startswith("      - name:"))
          body = []
          for line in src[runline + 1:end]:
              body.append(line[10:] if line.startswith("          ") else line)
          script = "\n".join(body) + "\n"

          needle = 'python3 scripts/394_apply_mode_fixup_fifo_early.py --root "$ROOT" --check-only\n'
          insert = needle + (
              'python3 scripts/395_apply_noc_wall_discriminator.py --root "$ROOT"\n'
              'python3 scripts/395_apply_noc_wall_discriminator.py --root "$ROOT" --check-only\n'
              'python3 scripts/396_apply_noc_irq_evidence.py --root "$ROOT"\n'
              'python3 scripts/396_apply_noc_irq_evidence.py --root "$ROOT" --check-only\n'
              'python3 scripts/397_apply_downstream_bus_votes.py --root "$ROOT"\n'
              'python3 scripts/397_apply_downstream_bus_votes.py --root "$ROOT" --check-only\n'
              'python3 scripts/398_apply_dense_ap_cliff.py --root "$ROOT"\n'
              'python3 scripts/398_apply_dense_ap_cliff.py --root "$ROOT" --check-only\n'
              'python3 scripts/399_apply_fixed_hardirq_witness.py --root "$ROOT"\n'
              'python3 scripts/399_apply_fixed_hardirq_witness.py --root "$ROOT" --check-only\n'
              'python3 scripts/400_apply_irq_exec_witness.py --root "$ROOT"\n'
              'python3 scripts/400_apply_irq_exec_witness.py --root "$ROOT" --check-only\n'
              'python3 scripts/401_apply_apex_idle_discriminator.py --root "$ROOT"\n'
              'python3 scripts/401_apply_apex_idle_discriminator.py --root "$ROOT" --check-only\n'
          )
          if needle not in script:
              raise SystemExit("Phase394 insertion anchor missing")
          script = script.replace(needle, insert, 1)

          cfg_anchor = '"$ROOT/scripts/config" --file "$BUILD/.config" --set-val LOG_BUF_SHIFT 19\n'
          cfg_insert = cfg_anchor + (
              '"$ROOT/scripts/config" --file "$BUILD/.config" --enable WATCHDOG\n'
              '"$ROOT/scripts/config" --file "$BUILD/.config" --enable WATCHDOG_CORE\n'
              '"$ROOT/scripts/config" --file "$BUILD/.config" --enable WATCHDOG_HANDLE_BOOT_ENABLED\n'
              '"$ROOT/scripts/config" --file "$BUILD/.config" --enable QCOM_WDT\n'
          )
          if cfg_anchor not in script:
              raise SystemExit("Phase394 config insertion anchor missing")
          script = script.replace(cfg_anchor, cfg_insert, 1)

          script = script.replace("phase394-gki-out", "phase401-gki-out")
          script = script.replace("PHASE394-SCHEMA.txt", "PHASE401-SCHEMA.txt")
          script = script.replace("'phase':'394'", "'phase':'401'")
          script = script.replace(
              "'name':'MODE-FIXUP-FIFO-EARLY-V1'",
              "'name':'APEX-IDLE-DISCRIMINATOR-V1'")
          script = script.replace(
              "'392','393','394']",
              "'392','393','394','395','396','397','398','399','400','401']")
          script = script.replace(
              "grep -Fq '#define A52_R341_LIMIT 120U' \"$REC\"",
              "grep -Fq '#define A52_R341_LIMIT 400U' \"$REC\"")
          script = script.replace(
              "ERROR: Phase393 hardirq timer limit missing",
              "ERROR: Phase398 dense hardirq timer limit missing")
          # Phase401 retires the Phase380 raw UFS sampler. Its static helper
          # remains in source for lineage but is intentionally unreachable and may
          # be dead-stripped by Clang, so inherited Image-string audits are invalid.
          for stale in (
              "grep -aFq 'A52_PHASE379_UFS_SIDEBAND_SAMPLER_V1' \"$IMAGE\"\n",
              "grep -aFq 'UFS_SNAPSHOT' \"$IMAGE\"\n",
              "grep -aFq 'UFS_TAG' \"$IMAGE\"\n",
              "grep -aFq 'A52_PHASE380_USB_BLOCK_LIVE_DEBUG_V1' \"$IMAGE\"\n",
              "grep -aFq 'U380 READY nutrs=%u ver=%x copies=3 crc=crc32c' \"$IMAGE\"\n",
          ):
              if stale not in script:
                  raise SystemExit("Phase401 stale Phase380 audit anchor missing: " + stale.strip())
              script = script.replace(stale, "", 1)

          # Phase401 changes the runtime reachability graph substantially. The old
          # Phase394 preamble used silent binary-string greps for Phase360..384;
          # those are not valid proof once retired static paths are dead-stripped.
          # Keep the Image existence check, then resume at the named Phase385+
          # audits which emit useful diagnostics.
          pre_start = 'IMAGE="$BUILD/arch/arm64/boot/Image"\ntest -s "$IMAGE"\n'
          pre_end = 'echo "Phase385 runtime-record audit"\n'
          ps = script.find(pre_start)
          pe = script.find(pre_end, ps + len(pre_start))
          if ps < 0 or pe < 0:
              raise SystemExit("Phase401 legacy pre-audit boundaries missing")
          script = (
              script[:ps + len(pre_start)] +
              'echo "Phase401: legacy Phase360-384 Image-string preaudit retired"\n' +
              script[pe:]
          )

          # Phase401 deliberately retires the Phase393/R341 initcall. The function
          # remains in source as __maybe_unused lineage, so it must not be required
          # in System.map.
          old_p393_sym = (
              "grep -Fq ' a52_r393_irq_arm_init' \"$BUILD/System.map\" || {\n"
              "  echo \"ERROR: Phase393 IRQ armer missing from final System.map\" >&2; exit 1;\n"
              "}\n"
          )
          if old_p393_sym not in script:
              raise SystemExit("Phase401 stale Phase393 System.map audit missing")
          new_p393_sym = (
              "grep -Fq 'static int __init __maybe_unused a52_r393_irq_arm_init(void)' \"$REC\" || {\n"
              "  echo \"ERROR: retired Phase393 IRQ armer lineage missing from source\" >&2; exit 1;\n"
              "}\n"
          )
          script = script.replace(old_p393_sym, new_p393_sym, 1)
          Path("/tmp/phase401-build.sh").write_text(
              "set -Eeuo pipefail\n" + script)
          PY

          bash /tmp/phase401-build.sh

          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          OUT="$PWD/phase401-gki-out"
          IMAGE="$BUILD/arch/arm64/boot/Image"
          REC="$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          HDR="$ROOT/include/linux/a52_ack_secure_flight_recorder.h"
          IRQH="$ROOT/kernel/irq/handle.c"
          WDT="$ROOT/drivers/watchdog/qcom-wdt.c"

          echo "Phase396 watchdog handoff audit"
          grep -Fq 'qcom,msm-watchdog' "$WDT"
          grep -Fq 'fixed_rate = 32765' "$WDT"
          grep -Fq 'set_bit(WDOG_HW_RUNNING' "$WDT"
          grep -Fxq 'CONFIG_WATCHDOG=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_WATCHDOG_CORE=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_QCOM_WDT=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_PSTORE=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_PSTORE_RAM=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_PSTORE_CONSOLE=y' "$BUILD/.config"
          echo "Phase396 watchdog handoff audit: PASS"

          echo "Phase396 R48 and NoC IRQ source audit"
          grep -Fq 'A52_PHASE396_NOC_IRQ_EVIDENCE_V1' "$REC"
          grep -Fq 'A52_PHASE396_R48_TWO_COPY_V1' "$REC"
          grep -Fq '#define A52_R179_BANK_ALL (A52_R179_BANK_FTRACE | A52_R179_BANK_RECORD)' "$REC"
          ! grep -Fq '#define A52_R179_BANK_ALL (A52_R179_BANK_CONSOLE |' "$REC"
          grep -Fq 'A52_P396_HIT_PHYS        0xB1BFF800ULL' "$REC"
          grep -Fq '404U, 226U, 290U, 108U, 198U, 186U, 323U' "$REC"
          grep -Fq 'N396 MAP q=%u hw=%llu t=%u md=%u' "$REC"
          grep -Fq 'N396 S ms=%llu q=%u t=%u sw=%x hw=%x ok=%x dp=%u pc=%016llx' "$REC"
          grep -Fq 'N396 ARM map=%u fast=%u wc=%u kt=%ld' "$REC"
          grep -Fq 'a52_ackfr_noc_irq_hit(unsigned int irq);' "$HDR"
          grep -Fq 'a52_ackfr_noc_irq_hit(irq);' "$IRQH"
          grep -Fq 'A52_PHASE396_NOC_IRQ_EVIDENCE_V1' "$IRQH"
          echo "Phase396 R48 and NoC IRQ source audit: PASS"

          echo "Phase396 compiled-artifact audit"
          grep -aFq 'BOOT rs=ready phase=401 focus=apex-idle roots=%u copies=2 crc=crc32c' "$IMAGE" || {
            echo "ERROR: Phase401 apex-idle boot marker missing from Image" >&2; exit 1;
          }
          grep -aFq 'N396 MAP q=%u hw=%llu t=%u md=%u' "$IMAGE" || {
            echo "ERROR: Phase396 IRQ mapping record missing from Image" >&2; exit 1;
          }
          grep -aFq 'N396 S ms=%llu q=%u t=%u sw=%x hw=%x ok=%x dp=%u pc=%016llx' "$IMAGE" || {
            echo "ERROR: Phase396 IRQ state sample missing from Image" >&2; exit 1;
          }
          grep -aFq 'N396 ARM map=%u fast=%u wc=%u kt=%ld' "$IMAGE" || {
            echo "ERROR: Phase396 IRQ arming record missing from Image" >&2; exit 1;
          }
          grep -aFq 'N396 DONE ms=%llu wc=%u hits=%u' "$IMAGE" || {
            echo "ERROR: Phase396 IRQ completion record missing from Image" >&2; exit 1;
          }
          grep -Fq ' a52_p396_init' "$BUILD/System.map"
          grep -Fq ' a52_ackfr_noc_irq_hit' "$BUILD/System.map"
          test -s "$BUILD/kernel/irq/handle.o"
          llvm-nm "$BUILD/kernel/irq/handle.o" > "$RUNNER_TEMP/phase396-handle.nm"
          grep -Fq ' U a52_ackfr_noc_irq_hit' "$RUNNER_TEMP/phase396-handle.nm"
          echo "Phase396 compiled-artifact audit: PASS"

          echo "Phase397 downstream bus-vote source/link audit"
          UFS="$ROOT/drivers/scsi/ufs/ufs-qcom.c"
          USB="$ROOT/drivers/usb/dwc3/dwc3-qcom.c"
          grep -Fxq 'CONFIG_QCOM_BUS_SCALING=y' "$BUILD/.config"
          grep -Fq 'A52_PHASE397_UFS_BUS_VOTE_V1' "$UFS"
          grep -Fq 'A52_PHASE397_USB_BUS_VOTE_V1' "$USB"
          grep -Fq 'a52_p397_ufs_bus_register(pdev)' "$UFS"
          grep -Fq 'a52_p397_usb_bus_register(to_platform_device(dev), qcom)' "$USB"
          grep -Fq 'pdata->num_usecases - 1' "$UFS"
          grep -Fq 'pdata->num_usecases - 1' "$USB"
          grep -aFq 'A52 P397 UFS_BUS active client=%u max_vote=%u cases=%d' "$IMAGE"
          grep -aFq 'A52 P397 USB_BUS active client=%u max_vote=%u cases=%d' "$IMAGE"
          for sym in msm_bus_cl_get_pdata msm_bus_scale_register_client msm_bus_scale_client_update_request msm_bus_scale_unregister_client; do
            grep -Eq " [Tt] ${sym}$" "$BUILD/System.map" || {
              echo "ERROR: Phase397 missing linked msm_bus symbol: $sym" >&2; exit 1;
            }
          done
          test -s "$BUILD/drivers/scsi/ufs/ufs-qcom.o"
          test -s "$BUILD/drivers/usb/dwc3/dwc3-qcom.o"
          llvm-nm "$BUILD/drivers/scsi/ufs/ufs-qcom.o" > "$RUNNER_TEMP/phase397-ufs.nm"
          llvm-nm "$BUILD/drivers/usb/dwc3/dwc3-qcom.o" > "$RUNNER_TEMP/phase397-usb.nm"
          grep -Fq ' U msm_bus_cl_get_pdata' "$RUNNER_TEMP/phase397-ufs.nm"
          grep -Fq ' U msm_bus_scale_register_client' "$RUNNER_TEMP/phase397-ufs.nm"
          grep -Fq ' U msm_bus_scale_client_update_request' "$RUNNER_TEMP/phase397-ufs.nm"
          grep -Fq ' U msm_bus_cl_get_pdata' "$RUNNER_TEMP/phase397-usb.nm"
          grep -Fq ' U msm_bus_scale_register_client' "$RUNNER_TEMP/phase397-usb.nm"
          grep -Fq ' U msm_bus_scale_client_update_request' "$RUNNER_TEMP/phase397-usb.nm"
          echo "Phase397 downstream bus-vote source/link audit: PASS"

          echo "Phase398 timer lineage + Phase401 N396 throttle audit"
          grep -Fq 'A52_PHASE398_DENSE_AP_CLIFF_V1' "$REC" || {
            echo "ERROR: Phase398 timer lineage marker missing" >&2; exit 1;
          }
          grep -Fq '#define A52_R341_INTERVAL_MS 10U' "$REC" || {
            echo "ERROR: Phase398 10 ms timer interval lineage missing" >&2; exit 1;
          }
          grep -Fq '#define A52_R341_LIMIT 400U' "$REC" || {
            echo "ERROR: Phase398 400-tick timer limit lineage missing" >&2; exit 1;
          }
          grep -Fq 'u64 next_dense = 15000ULL;' "$REC" || {
            echo "ERROR: Phase401 N396 15 s start missing" >&2; exit 1;
          }
          grep -Fq 'now_ms >= 15000ULL && now_ms <= 22000ULL' "$REC" || {
            echo "ERROR: Phase401 N396 15-22 s window missing" >&2; exit 1;
          }
          grep -Fq 'next_dense += 250ULL;' "$REC" || {
            echo "ERROR: Phase401 N396 250 ms throttle missing" >&2; exit 1;
          }
          grep -aFq 'BOOT rs=ready phase=401 focus=apex-idle roots=%u copies=2 crc=crc32c' "$IMAGE" || {
            echo "ERROR: Phase401 boot marker missing from Image" >&2; exit 1;
          }
          echo "Phase398 timer lineage + Phase401 N396 throttle audit: PASS"

          echo "Phase399 fixed hardirq witness audit"
          grep -Fq 'A52_PHASE399_FIXED_HARDIRQ_WITNESS_V1' "$REC"
          grep -Fq 'A52_R341_RING_BYTES' "$REC"
          grep -Fq 'A52_P399_WITNESS_BYTES' "$REC"
          grep -Fq 'a52_p399_witness_write' "$REC"
          grep -aFq 'BOOT rs=ready phase=401 focus=apex-idle roots=%u copies=2 crc=crc32c' "$IMAGE"
          echo "Phase399 fixed hardirq witness audit: PASS"

          echo "Phase400 IRQ/execution witness audit"
          grep -Fq 'A52_PHASE400_IRQ_EXEC_WITNESS_V1' "$REC"
          grep -Fq 'a52_ackfr_irq_witness(unsigned int irq);' "$HDR"
          grep -Fq 'a52_ackfr_irq_witness(irq);' "$IRQH"
          grep -Fq 'A52_P400_IRQ_MAGIC' "$REC"
          grep -Fq 'A52_P400_EXEC_MAGIC' "$REC"
          grep -Fq 'set_cpus_allowed_ptr(current, cpumask_of(7))' "$REC"
          grep -Fq 'preempt_disable();' "$REC"
          grep -Fq 'cntpct_el0' "$REC"
          grep -aFq 'BOOT rs=ready phase=401 focus=apex-idle roots=%u copies=2 crc=crc32c' "$IMAGE"
          grep -Fq ' a52_ackfr_irq_witness' "$BUILD/System.map"
          test -s "$BUILD/kernel/irq/handle.o"
          llvm-nm "$BUILD/kernel/irq/handle.o" > "$RUNNER_TEMP/phase400-handle.nm"
          grep -Fq ' U a52_ackfr_irq_witness' "$RUNNER_TEMP/phase400-handle.nm"
          echo "Phase400 IRQ/execution source lineage audit: PASS"

          echo "Phase401 apexd/idle discriminator audit"
          IDLE="$ROOT/kernel/sched/idle.c"
          EXIT="$ROOT/kernel/exit.c"
          UFSCD="$ROOT/drivers/scsi/ufs/ufshcd.c"
          grep -Fq 'A52_PHASE401_APEX_IDLE_DISCRIMINATOR_V1' "$REC"
          grep -Fq '#define A52_P401_PHYS              0xB1BF8000ULL' "$REC"
          grep -Fq '#define A52_P401_BYTES             0x7800U' "$REC"
          grep -Fq '#define A52_P401_TIMER_LIMIT       4000U' "$REC"
          grep -Fq 'core_initcall_sync(a52_p401_init);' "$REC"
          grep -Fq 'late_initcall(a52_p401_timer_init);' "$REC"
          grep -Fq 'next_dense += 250ULL;' "$REC"
          ! grep -Fq 'late_initcall(a52_p400_exec_init);' "$REC"
          ! grep -Fq 'late_initcall(a52_r393_irq_arm_init);' "$REC"
          grep -Fq 'A52_PHASE379_UFS_SIDEBAND_SAMPLER_V1' "$UFSCD"
          grep -Fq 'A52_PHASE380_USB_BLOCK_LIVE_DEBUG_V1' "$UFSCD"
          grep -Fq 'static void __maybe_unused a52_r380_start_sampler(struct ufs_hba *hba)' "$UFSCD"
          ! grep -Fq 'a52_r380_start_sampler(hba);' "$UFSCD"
          grep -Fq 'a52_p401_irq_witness(irq);' "$IRQH"
          grep -Fq 'a52_p401_idle_enter();' "$IDLE"
          grep -Fq 'a52_p401_task_exit(current);' "$EXIT"
          grep -Fxq 'CONFIG_GENERIC_IDLE_POLL_SETUP=y' "$BUILD/.config" || {
            echo "ERROR: nohlt A/B invalid because CONFIG_GENERIC_IDLE_POLL_SETUP is not enabled" >&2
            exit 1
          }
          grep -aFq 'BOOT rs=ready phase=401 focus=apex-idle roots=%u copies=2 crc=crc32c' "$IMAGE"
          grep -Fq ' a52_p401_irq_witness' "$BUILD/System.map"
          grep -Fq ' a52_p401_idle_enter' "$BUILD/System.map"
          grep -Fq ' a52_p401_task_exit' "$BUILD/System.map"
          echo "Phase401 apexd/idle discriminator audit: PASS"

          cat > "$OUT/PHASE396-NOTES.txt" <<'EOF'
          Phase396 NoC IRQ evidence
          =========================
          - Restores CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y while preserving QCOM_WDT.
          - Verifies qcom,msm-watchdog fixed-rate bridge and WDOG_HW_RUNNING handoff.
          - Frees console-ramoops from R48: R48 now mirrors to ftrace + record only.
          - Keeps the separate 2 MiB Phase392 persistent gap triple-mirrored.
          - Watches Samsung NOCERR identifiers 404, 226, 290, 108, 198, 186, 323.
          - Resolves Linux IRQ, exact hwirq, and hwirq = target + 32 candidates.
          - Samples descriptor/irqchip state densely from 17.6 s through 18.6 s.
          - Preserves the first 12 watched IRQ hits in a two-copy raw lane at 0xB1BFF800.
          - Includes a source/DT Gladiator ERP audit, but does not enable or port Gladiator yet.
          EOF
          sed -i 's/^          //' "$OUT/PHASE396-NOTES.txt"

          cp "$REC" "$OUT/source/a52_ack_secure_flight_recorder.c"
          cp "$HDR" "$OUT/source/a52_ack_secure_flight_recorder.h"
          cp "$IRQH" "$OUT/source/irq-handle.c"
          cp "$WDT" "$OUT/source/qcom-wdt.c"
          cp scripts/395_apply_noc_wall_discriminator.py \
             scripts/396_apply_noc_irq_evidence.py \
             scripts/decode_phase396_noc_irq.py \
             "$OUT/audit/"
          cp phase396-gladiator-audit.txt "$OUT/audit/"
          cp "$ROOT/drivers/scsi/ufs/ufs-qcom.c" "$OUT/source/ufs-qcom.c"
          cp "$ROOT/drivers/usb/dwc3/dwc3-qcom.c" "$OUT/source/dwc3-qcom.c"
          cp scripts/397_apply_downstream_bus_votes.py "$OUT/audit/"
          cp scripts/398_apply_dense_ap_cliff.py scripts/decode_phase398_irq_cliff.py "$OUT/audit/"
          cp scripts/399_apply_fixed_hardirq_witness.py scripts/decode_phase399_irq_witness.py "$OUT/audit/"
          cp scripts/400_apply_irq_exec_witness.py scripts/decode_phase400_irq_exec.py "$OUT/audit/"
          cp scripts/401_apply_apex_idle_discriminator.py scripts/decode_phase401_apex_idle.py "$OUT/audit/"
          cp "$ROOT/kernel/sched/idle.c" "$OUT/source/idle.c"
          cp "$ROOT/kernel/exit.c" "$OUT/source/exit.c"
          cat > "$OUT/PHASE400-NOTES.txt" <<'EOF'
          Phase400 IRQ/execution discriminator
          ====================================
          - Inherits Phase399 fixed CPU0/5/7 timer witnesses.
          - Inherits Phase397 downstream UFS/USB MAX bus-vote fixes.
          - Adds fixed last-generic-IRQ witnesses for CPU0, CPU5 and CPU7.
          - Adds a CPU7 busy-poll execution witness from ~16.4 through ~17.0 s.
          - Busy witness uses direct instruction execution + CNTPCT with preemption
            disabled and hard IRQs enabled; it does not depend on timer IRQs, R48,
            workqueues or scheduler progress after arming.
          - If IRQ witnesses stop but busy witness advances, interrupt delivery
            collapsed while CPU7 remained executing.
          - If both stop together, CPU execution itself halted/stalled or the
            shared fabric/clock path needed for execution became unavailable.
          - The CPU7 busy loop is intentionally interventional: if it suppresses
            the crash, that is evidence for an idle/power-management race.
          EOF
          sed -i 's/^          //' "$OUT/PHASE400-NOTES.txt"
          cat > "$OUT/PHASE401-NOTES.txt" <<'EOF'
          Phase401 apexd / idle discriminator
          ===================================
          - Keeps the Phase397 UFS/USB MAX bus-vote fix unchanged.
          - Retires the overlapping Phase380 raw UFS sampler, Phase393/R341 arm worker,
            and Phase400 busy worker before taking exclusive ownership of
            0xB1BF8000..0xB1BFF7FF. Phase396 keeps 0xB1BFF800..0xB1BFFDFF.
          - Maps and clears Phase401 storage at core_initcall_sync, before the userspace cliff.
          - Persists last generic IRQ and 10 ms pinned hrtimer state for CPU0/CPU5/CPU7.
          - Hooks do_exit() and counts actual apexd tasks/threads, then focuses idle tracing
            after the worker burst rather than relying on an absolute boot timestamp.
          - Persists arch_cpu_idle() entry on CPU0/CPU5/CPU7 after focus.
          - Hrtimers run for 4000 ticks, about 40 seconds, so an early stop is not a budget stop.
          - N396 descriptor sampling is throttled to 250 ms to protect the R48 time horizon.
          - The workflow emits two boot images from the same kernel: NORMAL and NOHLT.
            NORMAL preserves the baseline cmdline; NOHLT only adds nohlt + cpuidle.off=1.
            nohlt is the relevant switch because prior Phase352 evidence found fallback
            arch_cpu_idle/WFI rather than generic cpuidle.
          EOF
          sed -i 's/^          //' "$OUT/PHASE401-NOTES.txt"
          cat > "$OUT/PHASE399-NOTES.txt" <<'EOF'
          Phase399 fixed hardirq witness
          ==============================
          - Inherits Phase398 10 ms CPU0/5/7 pinned hardirq ring and 16.0-17.2 s NoC sampling.
          - Inherits Phase397 downstream UFS/USB MAX bus-vote fixes.
          - Keeps Phase396 R48 two-copy policy: record + ftrace only; console bank is not an R48 mirror.
          - Reserves the final 192 bytes of each R341 copy for fixed CPU0/5/7 last-tick witnesses.
          - Each witness is overwritten in place from hardirq context, mirrored twice, cache-cleaned,
            and does not call a52_ackfr_record or depend on R48/workqueues/kthreads.
          - copy1 witness ends exactly at 0xB1BFF800; existing N396 raw lane starts there.
          EOF
          sed -i 's/^          //' "$OUT/PHASE399-NOTES.txt"
          cat > "$OUT/PHASE398-NOTES.txt" <<'EOF'
          Phase398 dense AP cliff probe
          =============================
          - Inherits Phase397 UFS/USB downstream MAX bus-vote fixes.
          - Targets the now-repeatable Linux/AP cliff at ~16.6-16.8 seconds.
          - Restores CPU0/5/7 pinned hardirq hrtimers from 250 ms to 10 ms.
          - Extends each timer to 400 ticks; the raw two-copy ring retains the
            most recent ~370 ms of three-CPU hardirq activity around the cliff.
          - Moves N396 dense descriptor sampling to 16.0-17.2 s at 10 ms cadence.
          - No functional power, clock, bus, display or storage behavior change.
          EOF
          sed -i 's/^          //' "$OUT/PHASE398-NOTES.txt"
          cat > "$OUT/PHASE397-NOTES.txt" <<'EOF'
          Phase397 downstream UFS/USB bus votes
          =====================================
          - Inherits Phase396 diagnostics unchanged: pstore console, two-copy R48,
            NoC IRQ raw lane and the Phase392/393/394/395 observers.
          - Restores the downstream qcom,msm-bus client contract for UFS.
          - Routes qcom,dwc-usb3-msm away from missing upstream ICC DT names and
            back to its downstream qcom,msm-bus table.
          - A/B policy holds each device at its highest DT use-case for the full
            device lifetime, removing under-voting as a variable.
          - Diagnostic correctness build only; dynamic power-optimized voting can
            be restored after the causal A/B result.
          EOF
          sed -i 's/^          //' "$OUT/PHASE397-NOTES.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
             xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

          echo "Phase401 apexd idle discriminator build: PASS"

      - name: Build Phase401 normal/nohlt A/B boot images
        run: |
          set -Eeuo pipefail
          OUT="$PWD/phase401-gki-out"
          BASE="$OUT/package/boot.img"
          NORMAL="$OUT/package/boot-phase401-normal.img"
          NOHLT="$OUT/package/boot-phase401-nohlt.img"
          test -s "$BASE"
          cp "$BASE" "$NORMAL"
          cp "$BASE" "$NOHLT"

          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "a52_boot_repack", "scripts/38_repack_a52_p1_boot.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          normal = Path("phase401-gki-out/package/boot-phase401-normal.img")
          nohlt = Path("phase401-gki-out/package/boot-phase401-nohlt.img")
          common = []
          treatment = ["nohlt", "cpuidle.off=1"]

          def patch_cmdline(path, extras):
              data = bytearray(path.read_bytes())
              before = module.parse_boot(bytes(data))
              tokens = before["cmdline"].split()
              for tok in extras:
                  key = tok.split("=", 1)[0]
                  tokens = [x for x in tokens
                            if x != tok and x.split("=", 1)[0] != key]
                  tokens.append(tok)
              cmdline = " ".join(tokens)
              encoded = cmdline.encode("ascii")
              if len(encoded) > 1534:
                  raise SystemExit(f"{path.name}: command line too long: {len(encoded)}")
              data[64:576] = b"\0" * 512
              data[608:1632] = b"\0" * 1024
              first = encoded[:511]
              second = encoded[511:]
              data[64:64 + len(first)] = first
              data[608:608 + len(second)] = second
              path.write_bytes(data)
              return before, module.parse_boot(path.read_bytes())

          base_path = Path("phase401-gki-out/package/boot.img")
          base = module.parse_boot(base_path.read_bytes())
          _, n = patch_cmdline(normal, common)
          _, h = patch_cmdline(nohlt, common + treatment)

          assert n["cmdline"] == base["cmdline"]
          assert "nohlt" not in n["cmdline"].split()
          assert "cpuidle.off=1" not in n["cmdline"].split()
          assert "nohlt" in h["cmdline"].split()
          assert "cpuidle.off=1" in h["cmdline"].split()

          immutable = ["header_version", "page_size", "board", "kernel_addr",
                       "ramdisk_addr", "tags_addr", "kernel", "ramdisk", "second", "dtb"]
          for key in immutable:
              assert n[key] == h[key], key
              assert n[key] == base[key], key
          assert normal.stat().st_size == nohlt.stat().st_size == base_path.stat().st_size

          Path("phase401-gki-out/PHASE401-AB.json").write_text(
              json.dumps({
                  "normal_cmdline": n["cmdline"],
                  "nohlt_cmdline": h["cmdline"],
                  "same_kernel_and_payload": True,
                  "treatment": "nohlt cpuidle.off=1",
                  "primary_switch": "nohlt",
              }, indent=2, sort_keys=True) + "\n")
          PY

          cat > "$OUT/PHASE401-AB.txt" <<'EOF'
          Phase401 A/B protocol
          =====================
          NORMAL: boot-phase401-normal.img
          NOHLT : boot-phase401-nohlt.img

          Both images contain the exact same compiled Phase401 kernel and payload.
          NORMAL preserves the baseline boot command line exactly.
          NOHLT differs only by adding: nohlt cpuidle.off=1.
          Verbose printk options are intentionally excluded from this causal A/B
          because extra console traffic could perturb the suspected timing race.

          Run at least 5 cold boots of NORMAL and 5 cold boots of NOHLT.
          Collect the ramoops bundle after every failed boot and at least one successful
          boot in each arm. Record whether Android reaches a stable UI.
          EOF

      - name: Upload Phase401
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE401-APEX-IDLE-${{ github.run_number }}
          path: phase401-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase401 normal boot.img
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE401-NORMAL-${{ github.run_number }}
          path: phase401-gki-out/package/boot-phase401-normal.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Phase401 nohlt boot.img
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE401-NOHLT-${{ github.run_number }}
          path: phase401-gki-out/package/boot-phase401-nohlt.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30