name: 112 - A52 MGLRU Power Recorder P2 Launcher

on:
  push:
    branches:
      - agent/a52-mglru-power-diag-p2
    paths:
      - scripts/106_apply_mglru_modern_p1.py
      - scripts/112_apply_mglru_power_recorder_p2.py
      - .github/workflows/112-a52-mglru-power-recorder-p2-launch.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: a52-mglru-power-recorder-p2-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-proven-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch workflow 106 on recorder P2 branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: agent/a52-mglru-power-diag-p2
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ["REPO"]
          ref = os.environ["REF"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/106-a52-mglru-modern-p1-clang11.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": ref}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              if resp.status != 204:
                  raise SystemExit(f"dispatch returned HTTP {resp.status}")
          print(f"dispatched workflow 106 on {ref}")
          PY
