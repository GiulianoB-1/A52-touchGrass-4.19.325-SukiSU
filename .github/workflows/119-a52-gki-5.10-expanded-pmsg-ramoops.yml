name: 119 - A52 GKI 5.10 expanded pmsg ramoops

run-name: Reallocate ramoops for late Android userspace evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/119-a52-gki-5.10-expanded-pmsg-ramoops.yml'
      - 'scripts/38_repack_a52_p1_boot.py'
      - 'scripts/76_repack_a52_boot_with_dtb.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-expanded-pmsg-ramoops-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKFLOW118_ARTIFACT_ID: '8619248709'
  WORKFLOW118_BOOT_SHA256: '4398c3ebcb9f99b7f5bddba9fd23292e784bb9e3f542769cfcc356158690ca4f'
  RAMOOPS_NODE: '/reserved-memory/a52-ramoops-reserved@b1b00000'

jobs:
  package:
    name: Package expanded-pmsg real-ION boot image
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates unzip python3 device-tree-compiler file
          python3 -m py_compile \
            scripts/38_repack_a52_p1_boot.py \
            scripts/76_repack_a52_boot_with_dtb.py

      - name: Download and verify Workflow 118 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p workflow118/extracted
          curl --fail --location --retry 5 --retry-all-errors \
            --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WORKFLOW118_ARTIFACT_ID}/zip" \
            --output workflow118/artifact.zip
          unzip -q workflow118/artifact.zip -d workflow118/extracted
          (cd workflow118/extracted && sha256sum -c SHA256SUMS)
          test -s workflow118/extracted/boot.img
          test -s workflow118/extracted/Image.gz
          test -s workflow118/extracted/final-audit.json
          echo "${WORKFLOW118_BOOT_SHA256}  workflow118/extracted/boot.img" | sha256sum -c -

          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('workflow118/extracted/final-audit.json').read_text())
          checks = {
              'flashable_source': audit.get('flashable_candidate') is True,
              'not_claimed_hardware_validated': audit.get('hardware_validated') is False,
              'compile_closed': audit.get('compiler_error_count') == 0,
              'make_succeeded': audit.get('make_return_code') == 0,
              'source_boot_hash': (
                  audit.get('boot_image_sha256')
                  == '4398c3ebcb9f99b7f5bddba9fd23292e784bb9e3f542769cfcc356158690ca4f'
              ),
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Workflow 118 source audit failed: ' + ', '.join(failed))
          PY

      - name: Extract source DTB
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops
          mkdir -p "$OUT/source-reports"

          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              'a52_boot_repack', 'scripts/38_repack_a52_p1_boot.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          boot = module.parse_boot(Path('workflow118/extracted/boot.img').read_bytes())
          Path('artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops/original.dtb').write_bytes(
              boot['dtb']
          )
          Path('artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops/Image.gz').write_bytes(
              boot['kernel']
          )
          PY

          cp workflow118/extracted/final-audit.json \
            "$OUT/source-reports/workflow118-final-audit.json"
          cp workflow118/extracted/source-reports/workflow116-final-residuals-report.json \
            "$OUT/source-reports/workflow116-final-residuals-report.json"

      - name: Reallocate ramoops toward Android pmsg
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops

          cp "$OUT/original.dtb" "$OUT/patched.dtb"

          test "$(fdtget -t s "$OUT/patched.dtb" "$RAMOOPS_NODE" compatible)" = ramoops
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" reg)" = \
            '0 b1b00000 0 100000'
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" record-size)" = 40000
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" console-size)" = 40000
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" ftrace-size)" = 40000
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" pmsg-size)" = 40000

          fdtput -d "$OUT/patched.dtb" "$RAMOOPS_NODE" record-size
          fdtput -d "$OUT/patched.dtb" "$RAMOOPS_NODE" ftrace-size
          fdtput -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" console-size 0x00040000
          fdtput -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" pmsg-size 0x000c0000

          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" console-size)" = 40000
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" pmsg-size)" = c0000
          if fdtget "$OUT/patched.dtb" "$RAMOOPS_NODE" record-size >/dev/null 2>&1; then
            echo 'record-size still exists' >&2
            exit 1
          fi
          if fdtget "$OUT/patched.dtb" "$RAMOOPS_NODE" ftrace-size >/dev/null 2>&1; then
            echo 'ftrace-size still exists' >&2
            exit 1
          fi

          dtc -I dtb -O dts -o "$OUT/patched.dts" "$OUT/patched.dtb" \
            2> "$OUT/dtc-warnings.txt"

      - name: Repack exact real-ION kernel with expanded pmsg DTB
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops

          python3 scripts/76_repack_a52_boot_with_dtb.py \
            --source workflow118/extracted/boot.img \
            --kernel "$OUT/Image.gz" \
            --dtb "$OUT/patched.dtb" \
            --output "$OUT/boot.img" \
            --report "$OUT/repack-report.json"

      - name: Audit exact boot delta
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              'a52_boot_repack', 'scripts/38_repack_a52_p1_boot.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          root = Path('artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops')
          source_bytes = Path('workflow118/extracted/boot.img').read_bytes()
          output_bytes = (root / 'boot.img').read_bytes()
          source = module.parse_boot(source_bytes)
          rebuilt = module.parse_boot(output_bytes)
          sha256 = lambda data: hashlib.sha256(data).hexdigest()

          checks = {
              'source_boot_hash_pinned': (
                  sha256(source_bytes)
                  == '4398c3ebcb9f99b7f5bddba9fd23292e784bb9e3f542769cfcc356158690ca4f'
              ),
              'partition_size_preserved': len(output_bytes) == len(source_bytes) == 100663296,
              'header_version_preserved': rebuilt['header_version'] == source['header_version'] == 2,
              'page_size_preserved': rebuilt['page_size'] == source['page_size'] == 4096,
              'board_preserved': rebuilt['board'] == source['board'] == 'SRPTJ06A012',
              'cmdline_preserved': rebuilt['cmdline'] == source['cmdline'],
              'kernel_preserved': rebuilt['kernel'] == source['kernel'],
              'ramdisk_preserved': rebuilt['ramdisk'] == source['ramdisk'],
              'second_preserved': rebuilt['second'] == source['second'],
              'recovery_dtbo_preserved': rebuilt['recovery_dtbo'] == source['recovery_dtbo'],
              'dtb_changed': rebuilt['dtb'] != source['dtb'],
              'ramoops_node_preserved': b'a52-ramoops-reserved@b1b00000' in rebuilt['dtb'],
              'ramoops_base_preserved': b'\x00\x00\x00\x00\xb1\xb0\x00\x00' in rebuilt['dtb'],
              'ufs_host_node_preserved': b'ufshc@1d84000' in rebuilt['dtb'],
              'ufs_phy_node_preserved': b'ufsphy_mem@1d87000' in rebuilt['dtb'],
              'legacy_gdsc_node_preserved': b'gcc_ufs_phy_gdsc' in rebuilt['dtb'],
              'boot_id_changed': rebuilt['id'] != source['id'],
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Workflow 119 audit failed: ' + ', '.join(failed))

          audit = {
              'status': 'expanded-pmsg-ramoops-repacked-audited',
              'flashable_candidate': True,
              'hardware_validated': False,
              'source': 'Workflow 118 run 2 real-ION boot candidate',
              'purpose': 'capture later Android userspace pmsg after Keymaster initialization',
              'ramoops': {
                  'base': '0xb1b00000',
                  'total_size': 0x100000,
                  'console_size': 0x40000,
                  'pmsg_size': 0xc0000,
                  'record_size': 0,
                  'ftrace_size': 0,
              },
              'source_boot_sha256': sha256(source_bytes),
              'boot_image_sha256': sha256(output_bytes),
              'boot_image_bytes': len(output_bytes),
              'kernel_sha256': sha256(rebuilt['kernel']),
              'checks': checks,
          }
          (root / 'final-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Finalize diagnostic candidate
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 5G GKI 5.10 EXPANDED-PMSG RAMOOPS CANDIDATE

          This keeps the exact Workflow 118 real-ION kernel and Samsung boot contents.
          Only the existing 1 MiB ramoops DTB allocation is repartitioned:

            console: 256 KiB
            pmsg:    768 KiB
            record:    0 KiB
            ftrace:    0 KiB

          The previous hardware capture proved that QSEE loaded skeymast successfully,
          but the 256 KiB pmsg zone was dominated by Keystore2 output before the later
          userspace boot outcome could be recovered. This candidate triples pmsg space.

          This boot.img is a flashable diagnostic candidate, not hardware validated.
          Keep the Workflow 118 boot image available for rollback. After one boot attempt,
          enter recovery and collect the raw 1 MiB ramoops region immediately.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"

          printf 'check\tresult\n' > "$OUT/candidate-status.tsv"
          printf 'source-workflow\t118 run 2\n' >> "$OUT/candidate-status.tsv"
          printf 'kernel-changed\tno\n' >> "$OUT/candidate-status.tsv"
          printf 'ramdisk-changed\tno\n' >> "$OUT/candidate-status.tsv"
          printf 'dtb-change\tramoops sizing only\n' >> "$OUT/candidate-status.tsv"
          printf 'console-bytes\t262144\n' >> "$OUT/candidate-status.tsv"
          printf 'pmsg-bytes\t786432\n' >> "$OUT/candidate-status.tsv"
          printf 'flashable-candidate\tyes\n' >> "$OUT/candidate-status.tsv"
          printf 'hardware-validated\tno\n' >> "$OUT/candidate-status.tsv"

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload Workflow 119 candidate
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-gki-5.10-expanded-pmsg-ramoops-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops
          if-no-files-found: error
          retention-days: 14

      - name: Require audited output
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-5.10-expanded-pmsg-ramoops')
          audit = json.loads((root / 'final-audit.json').read_text())
          expected = {
              'console_size': 0x40000,
              'pmsg_size': 0xc0000,
              'record_size': 0,
              'ftrace_size': 0,
          }
          failed = [
              name for name, passed in audit.get('checks', {}).items() if not passed
          ]
          if failed:
              raise SystemExit('residual audit failures: ' + ', '.join(failed))
          if audit.get('ramoops', {}) | {} != audit.get('ramoops', {}):
              raise SystemExit('invalid ramoops report')
          for key, value in expected.items():
              if audit.get('ramoops', {}).get(key) != value:
                  raise SystemExit(f'unexpected {key}')
          if audit.get('flashable_candidate') is not True:
              raise SystemExit('candidate flag missing')
          if audit.get('hardware_validated') is not False:
              raise SystemExit('hardware validation state is incorrect')
          if not (root / 'boot.img').is_file():
              raise SystemExit('boot.img is missing')
          PY
