name: Phase377C - P152 16K + IncFS compatibility

on:
  push:
    branches:
      - agent/a52-phase377c-p152-16k-incfs-v1
    paths:
      - .github/workflows/377c-a52-p152-16k-incfs.yml
      - scripts/150_apply_aod_power_saver_p1.py
      - scripts/151_apply_boot_async_deferred_init_p1.py
      - scripts/152_apply_boot_async_peripherals_p2.py
      - scripts/377c_apply_incfs_16k_compat.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-phase377c-p152-16k-incfs-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  IMAGE: artifacts/Image-touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b
  P150_BASELINE_SHA: 763a272cba83463fc495b3787812a1e78157250f
  P150_BASELINE_RUN: '36054686392'

jobs:
  build:
    name: Build P152 baseline with 16K pages + IncFS compat
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out exact boot-tested P150 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P150_BASELINE_SHA }}

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-p152-boot-async-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52xq-p150-aod-power-${{ runner.os }}-
            a52xq-p149-ufs-runtime-autosuspend-${{ runner.os }}-
            a52xq-p148-qcom-battery-${{ runner.os }}-
            a52xq-p143-uclamp-rq-idle-${{ runner.os }}-
            a52xq-f2fs325-p1-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Restore exact prepared P134 feature source cache
        id: p134_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base35633887441-p134-src-v1-${{ runner.os }}-${{ hashFiles('scripts/118_apply_f2fs_stable_325_p1.sh', 'scripts/119_apply_f2fs_gc_merge_p2.py', 'scripts/121_apply_f2fs_inmem_curseg_p3a.py', 'scripts/122_apply_f2fs_atgc_p3b.py', 'scripts/123_enable_f2fs_atgc_p3c.py', 'scripts/124_apply_f2fs_atgc_p4.py', 'scripts/125_apply_f2fs_block_age_p5a.py', 'scripts/126_enable_f2fs_block_age_p5b.py', 'scripts/127_apply_f2fs_gc_cp_p6.py', 'scripts/128_apply_f2fs_correctness_p7.py', 'scripts/129_apply_bpf_bootfix_p1.py', 'scripts/134_apply_bpf_devmap_rndis_clean_fix.py') }}

      - name: Restore exact 35461116688 pre-build source on P134 miss
        if: steps.p134_source.outputs.cache-hit != 'true'
        id: prebuild_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-effp1-recorder-prebuild-${{ runner.os }}-${{ hashFiles('scripts/104_apply_fuse_740_upstream_passthrough.py', 'scripts/106_apply_mglru_modern_p1.py', 'scripts/106_apply_mglru_modern_p1_core.py', 'scripts/107_apply_mglru_modern_p2.py', 'scripts/108_apply_mglru_modern_p3.py', 'scripts/109_apply_eevdf_efficiency_p1.py', 'scripts/109b_finalize_eevdf_efficiency_p1.py', 'scripts/110_apply_uclamp_efficiency_p1.py', 'scripts/110b_finalize_uclamp_efficiency_p1.py', 'scripts/111_apply_mglru_power_diag_p1.py', 'scripts/112_apply_mglru_power_recorder_p2.py', 'scripts/115_apply_a52_efficiency_p1.py', 'scripts/116_apply_a52_scheduler_recorder.py', 'scripts/117_migrate_mglru_trace_to_proc.py') }}

      - name: Restore exact 35196552336 prepared source on deeper cache miss
        if: steps.p134_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        id: base351_source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base352494-clean-nobt-recorder-pre-fuse104-${{ runner.os }}-v4

      - name: Restore Linux stable checkpoint cache
        if: steps.p134_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true' && steps.base351_source.outputs.cache-hit != 'true'
        id: stable_cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/linux-stable-checkpoint-cache
          key: a52xq-linux-stable-4.19.200-${{ runner.os }}-v2

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts release workspace
          chmod +x scripts/*.sh scripts/*.py

      - name: Reconstruct exact 35196552336 pre-FUSE104 baseline
        if: steps.p134_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true' && steps.base351_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          ./scripts/01_prepare_source.sh
          ./scripts/03_apply_linux_4.19.153.sh
          ./scripts/04_apply_linux_4.19.154.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.154 4.19.159
          ./scripts/checkpoint_resolve_linux_4.19.159.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.159 4.19.164
          ./scripts/checkpoint_resolve_linux_4.19.164.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.164 4.19.180
          ./scripts/checkpoint_resolve_linux_4.19.180.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.180 4.19.200
          ./scripts/checkpoint_resolve_linux_4.19.200.sh
          ./scripts/57_update_linux_4.19.200_to_4.19.206.sh
          ./scripts/58_backport_bpf_ringbuf.sh
          ./scripts/58_apply_ringbuf_overrun_fix.sh
          ./scripts/07_patch_resukisu_exec_hook.sh

          python3 scripts/59_apply_eevdf_phase1_scaffold.py workspace/touchgrass-a52xq
          python3 scripts/60_apply_eevdf_phase2_accounting.py workspace/touchgrass-a52xq
          python3 scripts/61_apply_eevdf_phase3_deadline_lag.py workspace/touchgrass-a52xq
          python3 scripts/62_apply_eevdf_phase4_tree_picker.py workspace/touchgrass-a52xq
          python3 scripts/63_apply_eevdf_phase5_picker_integration.py workspace/touchgrass-a52xq
          python3 scripts/64_apply_eevdf_phase6_wakeup_preempt.py workspace/touchgrass-a52xq
          python3 scripts/65_apply_eevdf_phase7_placement_consistency.py workspace/touchgrass-a52xq
          python3 scripts/74_apply_eevdf_multitask_correctness.py workspace/touchgrass-a52xq
          python3 scripts/77_apply_eevdf_lifecycle_correctness.py workspace/touchgrass-a52xq
          python3 scripts/78_apply_eevdf77_cass_hybrid.py workspace/touchgrass-a52xq

          ./scripts/79_apply_mglru_phase1.sh
          python3 scripts/80_apply_mglru_android_hardening.py workspace/touchgrass-a52xq

          ./scripts/81_apply_android17_binder_core_probe.sh
          python3 scripts/82_enable_retained_binderfs.py workspace/touchgrass-a52xq
          ./scripts/84_apply_android17_binder_alloc.sh
          python3 scripts/84_apply_fuse_passthrough_android.py workspace/touchgrass-a52xq

          python3 scripts/85_apply_android17_uclamp_phase1.py workspace/touchgrass-a52xq
          python3 scripts/86_apply_uclamp_cass_p2.py workspace/touchgrass-a52xq

          python3 scripts/85_apply_a619_gpu_modernization.py workspace/touchgrass-a52xq
          python3 scripts/87_apply_a619_gpu_modernization_p2.py workspace/touchgrass-a52xq
          python3 scripts/90_apply_a619_gpu_modernization_p3.py workspace/touchgrass-a52xq
          python3 scripts/91_apply_a619_gpu_modernization_p4.py workspace/touchgrass-a52xq
          python3 scripts/94_apply_a619_gpu_modernization_p5.py workspace/touchgrass-a52xq

          ./scripts/87_apply_bbr3_net.sh workspace/touchgrass-a52xq

          python3 scripts/98_apply_fuse_passthrough_modern_p1.py workspace/touchgrass-a52xq
          python3 scripts/99_apply_fuse_passthrough_modern_p2.py workspace/touchgrass-a52xq
          python3 scripts/101_apply_fuse_passthrough_modern_p3.py workspace/touchgrass-a52xq
          python3 scripts/102_apply_fuse_negotiation_probe.py workspace/touchgrass-a52xq
          python3 scripts/103_apply_fuse_740_init_compat.py workspace/touchgrass-a52xq

          python3 scripts/104_apply_a619_gpu_undervolt_p1.py workspace/touchgrass-a52xq
          python3 scripts/105_apply_a619_gpu_undervolt_p1_diag.py workspace/touchgrass-a52xq
          python3 scripts/106_apply_mglru_modern_p1.py workspace/touchgrass-a52xq

          git -C workspace/touchgrass-a52xq diff --check

      - name: Rebuild exact 35461116688 pre-build boundary
        if: steps.p134_source.outputs.cache-hit != 'true' && steps.prebuild_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq

          python3 -m py_compile scripts/115_apply_a52_efficiency_p1.py
          python3 scripts/115_apply_a52_efficiency_p1.py "$KERNEL" \
            2>&1 | tee artifacts/a52-efficiency-p1-apply.txt

          # Phase 112 in the pinned reconstruction already exports
          # /proc/lru_gen_trace. Older cached trees needed Phase 117 to migrate
          # the debugfs-only recorder. Keep the fallback compatible with both.
          if grep -Fq 'proc_create("lru_gen_trace", 0444, NULL, &mglru_rec_trace_fops);' "$KERNEL/mm/vmscan.c"; then
            echo "MGLRU recorder already has procfs export; Phase 117 migration not required." \
              | tee artifacts/mglru-procfs-migration-apply.txt
          else
            python3 -m py_compile scripts/117_migrate_mglru_trace_to_proc.py
            python3 scripts/117_migrate_mglru_trace_to_proc.py "$KERNEL" \
              2>&1 | tee artifacts/mglru-procfs-migration-apply.txt
          fi

          python3 -m py_compile scripts/116_apply_a52_scheduler_recorder.py
          python3 scripts/116_apply_a52_scheduler_recorder.py "$KERNEL" \
            2>&1 | tee artifacts/a52-scheduler-recorder-apply.txt

          python3 -m py_compile scripts/104_apply_fuse_740_upstream_passthrough.py
          python3 scripts/104_apply_fuse_740_upstream_passthrough.py "$KERNEL" \
            2>&1 | tee artifacts/fuse-740-native-apply.txt

          git -C "$KERNEL" diff --check
          grep -Fq '#define FUSE_KERNEL_MINOR_VERSION 40' "$KERNEL/include/uapi/linux/fuse.h"
          grep -Fq 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts' "$KERNEL/mm/vmscan.c"
          grep -Fq 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active' "$KERNEL/kernel/sched/cass.c"
          grep -Fq 'A52 A619 GPU UV P3: 565 MHz one ARC corner' "$KERNEL/drivers/gpu/msm/kgsl_gmu.c"

      - name: Require usable source boundary
        run: |
          set -Eeuo pipefail
          echo "P134 cache hit: ${{ steps.p134_source.outputs.cache-hit }}"
          echo "prebuild cache hit: ${{ steps.prebuild_source.outputs.cache-hit }}"
          echo "base351 cache hit: ${{ steps.base351_source.outputs.cache-hit }}"
          test -d workspace/touchgrass-a52xq/.git

          if [ "${{ steps.p134_source.outputs.cache-hit }}" = "true" ]; then
            grep -Fq 'static void dev_map_hash_remove_netdev' workspace/touchgrass-a52xq/kernel/bpf/devmap.c
          else
            grep -Fq '#define FUSE_KERNEL_MINOR_VERSION 40' workspace/touchgrass-a52xq/include/uapi/linux/fuse.h
            grep -Fq 'A52 MGLRU Efficiency P4: clear seed PTE before look-around bailouts' workspace/touchgrass-a52xq/mm/vmscan.c
            grep -Fq 'A52 CASS P3: uclamp-fit + sync-waker + no task double-count active' workspace/touchgrass-a52xq/kernel/sched/cass.c
            grep -Fq 'A52 A619 GPU UV P3: 565 MHz one ARC corner' workspace/touchgrass-a52xq/drivers/gpu/msm/kgsl_gmu.c
          fi

      - name: Rebuild prepared P134 boundary on cache miss
        if: steps.p134_source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq

          ./scripts/118_apply_f2fs_stable_325_p1.sh \
            "$KERNEL" artifacts/f2fs-stable325-p1.txt artifacts/f2fs-stable325-patches
          python3 scripts/119_apply_f2fs_gc_merge_p2.py "$KERNEL"
          python3 scripts/121_apply_f2fs_inmem_curseg_p3a.py "$KERNEL" artifacts/f2fs-inmem-p3a

          mkdir -p artifacts/pre-atgc-p3b/fs artifacts/pre-atgc-p3b/include/trace/events
          cp -a "$KERNEL/fs/f2fs" artifacts/pre-atgc-p3b/fs/
          cp -a "$KERNEL/include/trace/events/f2fs.h" artifacts/pre-atgc-p3b/include/trace/events/

          python3 scripts/122_apply_f2fs_atgc_p3b.py "$KERNEL" artifacts/f2fs-atgc-p3b
          python3 scripts/123_enable_f2fs_atgc_p3c.py "$KERNEL" artifacts/f2fs-atgc-p3c
          python3 scripts/124_apply_f2fs_atgc_p4.py "$KERNEL" artifacts/f2fs-atgc-p4
          python3 scripts/125_apply_f2fs_block_age_p5a.py "$KERNEL" artifacts/f2fs-block-age-p5a
          python3 scripts/126_enable_f2fs_block_age_p5b.py "$KERNEL" artifacts/f2fs-block-age-p5b
          python3 scripts/127_apply_f2fs_gc_cp_p6.py "$KERNEL" artifacts/f2fs-gc-cp-p6
          python3 scripts/128_apply_f2fs_correctness_p7.py "$KERNEL" artifacts/f2fs-correctness-p7
          python3 scripts/129_apply_bpf_bootfix_p1.py "$KERNEL" artifacts/bpf-bootfix-p1
          python3 scripts/134_apply_bpf_devmap_rndis_clean_fix.py "$KERNEL" artifacts/bpf-devmap-rndis-clean-p134

          git -C "$KERNEL" diff --check
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"
          grep -Fq 'F2FS_MOUNT_ATGC' "$KERNEL/fs/f2fs/f2fs.h"
          grep -Fq 'F2FS_MOUNT_AGE_EXTENT_CACHE' "$KERNEL/fs/f2fs/f2fs.h"

      - name: Save rebuilt P134 source cache
        if: steps.p134_source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-base35633887441-p134-src-v1-${{ runner.os }}-${{ hashFiles('scripts/118_apply_f2fs_stable_325_p1.sh', 'scripts/119_apply_f2fs_gc_merge_p2.py', 'scripts/121_apply_f2fs_inmem_curseg_p3a.py', 'scripts/122_apply_f2fs_atgc_p3b.py', 'scripts/123_enable_f2fs_atgc_p3c.py', 'scripts/124_apply_f2fs_atgc_p4.py', 'scripts/125_apply_f2fs_block_age_p5a.py', 'scripts/126_enable_f2fs_block_age_p5b.py', 'scripts/127_apply_f2fs_gc_cp_p6.py', 'scripts/128_apply_f2fs_correctness_p7.py', 'scripts/129_apply_bpf_bootfix_p1.py', 'scripts/134_apply_bpf_devmap_rndis_clean_fix.py') }}

      - name: Replay production chain through boot-tested P149
        run: |
          set -Eeuo pipefail

          python3 scripts/135_remove_project_diagnostics.py workspace/touchgrass-a52xq artifacts/production-nodiag-p135
          python3 scripts/136_apply_a619_kgsl_p6_pm.py workspace/touchgrass-a52xq
          python3 scripts/137_apply_a52_boot_rescue.py workspace/touchgrass-a52xq
          python3 scripts/138_apply_a619_kgsl_p7_cp_init.py workspace/touchgrass-a52xq
          python3 scripts/139_apply_mglru_modern_p4_pagecache.py workspace/touchgrass-a52xq
          python3 scripts/140_apply_schedutil_iowait_android17_p1.py workspace/touchgrass-a52xq
          python3 scripts/141_apply_schedutil_android17_limits_sync_p2.py workspace/touchgrass-a52xq
          python3 scripts/142_apply_uclamp_android17_reinc_idle_p3.py workspace/touchgrass-a52xq
          python3 scripts/143_apply_uclamp_android17_rq_idle_p4.py workspace/touchgrass-a52xq
          python3 scripts/145_apply_teo_baseline_p1.py workspace/touchgrass-a52xq backports/145_teo_4.19.c
          python3 scripts/146_apply_teo_active_recentfix_p2.py workspace/touchgrass-a52xq
          python3 scripts/148_apply_qcom_lpm_fixpack_p1.py workspace/touchgrass-a52xq
          python3 scripts/149_apply_ufs_runtime_autosuspend_p1.py workspace/touchgrass-a52xq \
            | tee artifacts/ufs-runtime-autosuspend-p149.txt

          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'A52 UFS P149: precise devfreq + runtime-PM autosuspend' "$KERNEL/drivers/scsi/ufs/ufshcd.c"
          grep -Fq 'A52 QCOM LPM P1: raw idle locks + short-idle tick + hotpath cleanup' "$KERNEL/drivers/cpuidle/lpm-levels.c"
          git -C "$KERNEL" diff --check

      - name: Apply P150 AOD power saver
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/150_apply_aod_power_saver_p1.py" \
            -o /tmp/150_apply_aod_power_saver_p1.py

          python3 -m py_compile /tmp/150_apply_aod_power_saver_p1.py
          python3 /tmp/150_apply_aod_power_saver_p1.py workspace/touchgrass-a52xq \
            | tee artifacts/aod-power-saver-p150.txt

          KERNEL=workspace/touchgrass-a52xq
          PANEL="$KERNEL/techpack/display/msm/samsung/S6E3FC3_AMS646YD01/ss_dsi_panel_S6E3FC3_AMS646YD01.c"
          COMMON="$KERNEL/techpack/display/msm/samsung/ss_dsi_panel_common.c"

          grep -Fq 'A52 AOD P150: FC3 60-to-30nit cap + duplicate LPM TX suppression' "$PANEL"
          grep -Fq 'if (requested == LPM_60NIT)' "$PANEL"
          grep -Fq 'return LPM_30NIT;' "$PANEL"
          grep -Fq 'static int a52_aod_last_lpm_bl[MAX_DISPLAY_NDX];' "$PANEL"
          grep -Fq 'a52_aod_lpm_bl_is_duplicate(vdd, lpm_bl_level)' "$PANEL"
          grep -Fq 'a52_aod_lpm_bl_cache(vdd, lpm_bl_level);' "$PANEL"
          test "$(grep -Fc 'int lpm_bl_level = a52_aod_effective_lpm_bl_level(vdd);' "$PANEL")" -eq 2
          test "$(grep -Fc 'switch (lpm_bl_level) {' "$PANEL")" -eq 2
          grep -Fq 'case LPM_30NIT:' "$PANEL"
          grep -Fq 'case LPM_60NIT:' "$PANEL"
          grep -Fq 'vdd->panel_lpm.esd_recovery' "$PANEL"
          grep -Fq 'unlikely(vdd->is_factory_mode)' "$PANEL"
          grep -Fq 'Hz : 30Hz' "$COMMON"

          git -C "$KERNEL" diff --check
          git -C "$KERNEL" diff -- \
            techpack/display/msm/samsung/S6E3FC3_AMS646YD01/ss_dsi_panel_S6E3FC3_AMS646YD01.c \
            > artifacts/aod-power-saver-p150.diff

      - name: Apply boot-proven P151 deferred init + first async batch
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/151_apply_boot_async_deferred_init_p1.py" \
            -o /tmp/151_apply_boot_async_deferred_init_p1.py
          python3 -m py_compile /tmp/151_apply_boot_async_deferred_init_p1.py
          python3 /tmp/151_apply_boot_async_deferred_init_p1.py workspace/touchgrass-a52xq \
            | tee artifacts/boot-async-deferred-p151.txt

          KERNEL=workspace/touchgrass-a52xq
          grep -Fxq 'CONFIG_DEFERRED_STRUCT_PAGE_INIT=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fq 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P151 */' "$KERNEL/drivers/nfc/sec_nfc.c"
          grep -Fq 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P151 */' "$KERNEL/drivers/fingerprint/et7xx-spi.c"
          git -C "$KERNEL" diff --check

      - name: Apply P152 second selective async peripheral batch
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/152_apply_boot_async_peripherals_p2.py" \
            -o /tmp/152_apply_boot_async_peripherals_p2.py
          python3 -m py_compile /tmp/152_apply_boot_async_peripherals_p2.py
          python3 /tmp/152_apply_boot_async_peripherals_p2.py workspace/touchgrass-a52xq \
            | tee artifacts/boot-async-peripherals-p152.txt

          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P152 */' "$KERNEL/drivers/sensors/sx9360.c"
          grep -Fq 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P152 */' "$KERNEL/drivers/vibrator/dc/dc_vibrator.c"
          git -C "$KERNEL" diff --check

          git -C "$KERNEL" diff -- \
            arch/arm64/configs/a52xq_defconfig \
            drivers/nfc/sec_nfc.c \
            drivers/fingerprint/et7xx-spi.c \
            drivers/sensors/sx9360.c \
            drivers/vibrator/dc/dc_vibrator.c \
            > artifacts/boot-async-p151-p152.diff
      - name: Apply kernel-only 16K ARM64 page geometry
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          CFG="$KERNEL/arch/arm64/configs/a52xq_defconfig"

          cp "$CFG" artifacts/a52xq_defconfig.pre-16k

          "$KERNEL/scripts/config" --file "$CFG" \
            -d ARM64_4K_PAGES \
            -e ARM64_16K_PAGES \
            -d ARM64_64K_PAGES \
            -d ARM64_VA_BITS_36 \
            -d ARM64_VA_BITS_39 \
            -d ARM64_VA_BITS_42 \
            -e ARM64_VA_BITS_47 \
            -d ARM64_VA_BITS_48

          cp "$CFG" artifacts/a52xq_defconfig.requested-16k

          {
            echo "=== requested ARM64 page geometry ==="
            grep -E '^(CONFIG_ARM64_(4K|16K|64K)_PAGES=|# CONFIG_ARM64_(4K|16K|64K)_PAGES|CONFIG_ARM64_VA_BITS(_[0-9]+)?=|# CONFIG_ARM64_VA_BITS_|CONFIG_ARM64_PAGE_SHIFT=|CONFIG_PGTABLE_LEVELS=)' "$CFG" || true
          } | tee artifacts/phase377c-16k-requested-config.txt

          git -C "$KERNEL" diff --check

      - name: Backport Android IncFS 16K-page compatibility
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/377c_apply_incfs_16k_compat.py
          python3 scripts/377c_apply_incfs_16k_compat.py workspace/touchgrass-a52xq \
            | tee artifacts/phase377c-incfs-16k-apply.txt

          KERNEL=workspace/touchgrass-a52xq
          VFS="$KERNEL/fs/incfs/vfs.c"
          grep -Fq 'A52 P377C: IncFS 16K-page compatibility backport' "$VFS"
          grep -Fq 'while (offset + total_read < size)' "$VFS"
          grep -Fq 'if (total_read == PAGE_SIZE)' "$VFS"
          grep -Fq 'data_buf = kzalloc(data_buf_size, GFP_NOFS);' "$VFS"
          ! grep -Fq 'BUILD_BUG_ON(PAGE_SIZE != INCFS_DATA_FILE_BLOCK_SIZE);' "$VFS"
          git -C "$KERNEL" diff --check

      - name: Audit obvious downstream 4K page assumptions
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          OUT=artifacts/phase377c-page-size-source-audit.txt
          : > "$OUT"

          {
            echo "=== explicit PAGE_SIZE/PAGE_SHIFT vs 4096/12 comparisons ==="
            grep -RInE \
              --exclude-dir=.git --exclude-dir=out \
              '(PAGE_SIZE[[:space:]]*(==|!=|<=|>=|<|>)[[:space:]]*4096|4096[[:space:]]*(==|!=|<=|>=|<|>)[[:space:]]*PAGE_SIZE|PAGE_SHIFT[[:space:]]*(==|!=)[[:space:]]*12|12[[:space:]]*(==|!=)[[:space:]]*PAGE_SHIFT)' \
              "$KERNEL/arch" "$KERNEL/drivers" "$KERNEL/fs" "$KERNEL/mm" "$KERNEL/include" \
              2>/dev/null || true

            echo
            echo "=== selected downstream 0x1000 / SZ_4K references ==="
            for d in \
              "$KERNEL/drivers/gpu" \
              "$KERNEL/drivers/iommu" \
              "$KERNEL/drivers/dma-buf" \
              "$KERNEL/drivers/scsi" \
              "$KERNEL/drivers/media" \
              "$KERNEL/drivers/android" \
              "$KERNEL/techpack/display"; do
              [ -d "$d" ] || continue
              grep -RInE \
                --exclude-dir=.git --exclude-dir=out \
                '(0x1000|SZ_4K)' "$d" 2>/dev/null || true
            done
          } >> "$OUT"

          wc -l "$OUT"
          head -200 "$OUT" || true

      - name: Build integrated kernel
        run: |
          set -o pipefail
          echo '=== CCACHE BEFORE ==='
          ccache --show-stats || true
          START=$(date +%s)
          ./scripts/57_build_resukisu_susfs_manual_detection.sh \
            2>&1 | tee artifacts/boot-async-p152-build.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "kernel_build_seconds=$((END-START))"
          echo '=== CCACHE AFTER ==='
          ccache --show-stats || true
          exit "$RC"

      - name: Audit P152 retained stack and final 16K geometry
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          CFG="$KERNEL/out/.config"
          PANEL="$KERNEL/techpack/display/msm/samsung/S6E3FC3_AMS646YD01/ss_dsi_panel_S6E3FC3_AMS646YD01.c"
          COMMON="$KERNEL/techpack/display/msm/samsung/ss_dsi_panel_common.c"
          UFS="$KERNEL/drivers/scsi/ufs/ufshcd.c"
          LPM="$KERNEL/drivers/cpuidle/lpm-levels.c"
          NFC="$KERNEL/drivers/nfc/sec_nfc.c"
          FP="$KERNEL/drivers/fingerprint/et7xx-spi.c"
          GRIP="$KERNEL/drivers/sensors/sx9360.c"
          VIB="$KERNEL/drivers/vibrator/dc/dc_vibrator.c"

          test -s "$IMAGE"
          test -s "$KERNEL/out/vmlinux"
          test -s "$CFG"

          grep -Fxq '# CONFIG_ARM64_4K_PAGES is not set' "$CFG"
          grep -Fxq 'CONFIG_ARM64_16K_PAGES=y' "$CFG"
          grep -Fxq '# CONFIG_ARM64_64K_PAGES is not set' "$CFG"
          grep -Fxq 'CONFIG_ARM64_PAGE_SHIFT=14' "$CFG"
          grep -Fxq 'CONFIG_ARM64_VA_BITS_47=y' "$CFG"
          grep -Fxq 'CONFIG_ARM64_VA_BITS=47' "$CFG"
          grep -Fxq 'CONFIG_PGTABLE_LEVELS=3' "$CFG"
          ! grep -Fxq 'CONFIG_ARM64_VA_BITS_39=y' "$CFG"

          {
            echo 'Phase377C final ARM64 geometry:'
            grep -E '^(CONFIG_ARM64_(4K|16K|64K)_PAGES=|# CONFIG_ARM64_(4K|16K|64K)_PAGES|CONFIG_ARM64_PAGE_SHIFT=|CONFIG_ARM64_VA_BITS(_[0-9]+)?=|# CONFIG_ARM64_VA_BITS_|CONFIG_PGTABLE_LEVELS=)' "$CFG"
          } | tee artifacts/phase377c-16k-final-config.txt

          grep -Fxq 'CONFIG_DEFERRED_STRUCT_PAGE_INIT=y' "$CFG"
          grep -Fxq 'CONFIG_SPARSEMEM=y' "$CFG"
          grep -Fxq 'CONFIG_NO_BOOTMEM=y' "$CFG"
          test "$(grep -Fc 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P151 */' "$NFC")" -eq 1
          test "$(grep -Fc 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P151 */' "$FP")" -eq 1
          test "$(grep -Fc 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P152 */' "$GRIP")" -eq 1
          test "$(grep -Fc 'PROBE_PREFER_ASYNCHRONOUS, /* A52 P152 */' "$VIB")" -eq 1

          grep -Eq '^CONFIG_PANEL_S6E3FC3_AMS646YD01_FHD=y$' "$CFG"
          grep -Fq 'A52 AOD P150: FC3 60-to-30nit cap + duplicate LPM TX suppression' "$PANEL"
          grep -Fq 'if (requested == LPM_60NIT)' "$PANEL"
          grep -Fq 'return LPM_30NIT;' "$PANEL"
          grep -Fq 'a52_aod_lpm_bl_is_duplicate(vdd, lpm_bl_level)' "$PANEL"
          grep -Fq 'Hz : 30Hz' "$COMMON"

          grep -Fq 'A52 UFS P149: precise devfreq + runtime-PM autosuspend' "$UFS"
          grep -Fq '#define UFSHCD_AUTO_SUSPEND_DELAY_MS 2000' "$UFS"
          grep -Fq 'A52 QCOM LPM P1: raw idle locks + short-idle tick + hotpath cleanup' "$LPM"
          grep -Fq 'A52 P148 BATTERY: Qualcomm LPM + WALT/schedutil correctness' "$KERNEL/kernel/sched/cpufreq_schedutil.c"
          grep -Fq 'A52 UCLAMP P4: Android17 rq access helpers + idle-rq semantics' "$KERNEL/kernel/sched/sched.h"
          grep -Fq 'A52 BOOT RESCUE P137' "$KERNEL/drivers/input/input.c"
          grep -Fq 'static void dev_map_hash_remove_netdev' "$KERNEL/kernel/bpf/devmap.c"

          {
            echo 'P152 final config:'
            grep -E '^(CONFIG_(DEFERRED_STRUCT_PAGE_INIT|SPARSEMEM|NO_BOOTMEM)=)' "$CFG"
            echo
            echo 'Async drivers:'
            grep -n 'PROBE_PREFER_ASYNCHRONOUS, /\* A52 P151 \*/' "$NFC" "$FP"
            grep -n 'PROBE_PREFER_ASYNCHRONOUS, /\* A52 P152 \*/' "$GRIP" "$VIB"
          } | tee artifacts/boot-async-p152-audit.txt

          git -C "$KERNEL" diff --check
      - name: Save compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-phase377c-16k-${{ runner.os }}-${{ github.sha }}

      - name: Collect kernel-only Phase377C artifacts
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          OUT=artifacts/phase377c-16k-kernel-only
          mkdir -p "$OUT"
          cp "$KERNEL/out/.config" "$OUT/final.config"
          cp "$KERNEL/out/arch/arm64/boot/Image" "$OUT/Image"
          cp "$KERNEL/out/vmlinux" "$OUT/vmlinux"
          cp artifacts/phase377c-16k-requested-config.txt "$OUT/"
          cp artifacts/phase377c-16k-final-config.txt "$OUT/"
          cp artifacts/phase377c-page-size-source-audit.txt "$OUT/"
          cp artifacts/boot-async-p152-build.log "$OUT/"
          cp artifacts/boot-async-p152-audit.txt "$OUT/" 2>/dev/null || true
          cp artifacts/a52xq_defconfig.pre-16k "$OUT/"
          cp artifacts/a52xq_defconfig.requested-16k "$OUT/"

          {
            echo "baseline_run=36058491006"
            echo "baseline_head_sha=c932824ddbd67cf9792599edd98ea4ce95c1ac12"
            echo "baseline_phase=P152\nincfs_16k_backport=e302f3a21b6554722c72787fddc4780c0280e88b"
            echo "scope=kernel-only"
            echo "page_size=16384"
            echo "page_shift=14"
            echo "va_bits=47"
            echo "pgtable_levels=3"
            echo "userspace_changed=no"
            echo "flashable=no"
            echo "hardware_validated=no"
            echo "image_sha256=$(sha256sum "$KERNEL/out/arch/arm64/boot/Image" | awk '{print $1}')"
          } > "$OUT/metadata.txt"

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload Phase377C kernel-only build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE377C-P152-BASE36058491006-16K-KERNEL-ONLY-${{ github.run_number }}
          path: artifacts/phase377c-16k-kernel-only/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE377C-16K-FAILED-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30


