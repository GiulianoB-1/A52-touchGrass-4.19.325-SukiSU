name: Phase374 - MDSS GDSC proxy parity
run-name: Phase374 - TouchGrass MDSS GDSC proxy parity A/B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase374-mdss-gdsc-proxy-parity-v1
    paths:
      - .github/workflows/374-a52-mdss-gdsc-proxy-parity.yml
      - scripts/374_apply_mdss_gdsc_proxy_parity.py
      - scripts/374_ci_build_gki.sh

permissions:
  contents: read
  actions: write

env:
  GKI_MANIFEST_BRANCH: common-android12-5.10-2026-04
  GKI_COMMON_TAG: android12-5.10-2026-04_r1
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE319_GOOD_HEAD: e466f29c784001b5f933091298162714a9181b8d

concurrency:
  group: a52-phase374-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase374 proxy parity
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase374 runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            repo git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves

          python3 -m py_compile \
            scripts/319_apply_dsi_sixpoint_temporal_observer.py \
            scripts/328_apply_full_touchgrass_display_clock_port.py \
            scripts/329_apply_dsi_debugbus_selector_readback.py \
            scripts/330_apply_dsi_early_breadcrumb_recorder.py \
            scripts/331_apply_post_retention_frontier_recorder.py \
            scripts/332_apply_persistent_timeout_frontier_recorder.py \
            scripts/335_apply_qsmmuv500_sacr_cache_lock_parity.py \
            scripts/336_apply_qsmmuv500_hf0_tbu_state_recorder.py \
            scripts/337_apply_atomic_check_stage_probe.py \
            scripts/338_apply_atomic_latch_pre_retention_snapshot.py \
            scripts/339_apply_warm_reboot_preservation_probe.py \
            scripts/340_apply_post12_runtime_discriminator.py \
            scripts/341_apply_hardirq_timer_frontier.py \
            scripts/342_apply_busyloop_counter_frontier.py \
            scripts/343_apply_instruction_counter_frontier.py \
            scripts/345_apply_dma_us_frontier.py \
            scripts/346_apply_dma_raw.py \
            scripts/374_apply_mdss_gdsc_proxy_parity.py

          bash -n \
            scripts/319_ci_build_gki.sh \
            scripts/328_ci_build_gki.sh \
            scripts/329_ci_build_gki.sh \
            scripts/330_ci_build_gki.sh \
            scripts/331_ci_build_gki.sh \
            scripts/332_ci_build_gki.sh \
            scripts/335_ci_build_gki.sh \
            scripts/336_ci_build_gki.sh \
            scripts/337_ci_build_gki.sh \
            scripts/338_ci_build_gki.sh \
            scripts/339_ci_build_gki.sh \
            scripts/340_ci_build_gki.sh \
            scripts/341_ci_build_gki.sh \
            scripts/342_ci_build_gki.sh \
            scripts/343_ci_build_gki.sh \
            scripts/345_ci_build_gki.sh \
            scripts/346_ci_build_gki.sh \
            scripts/374_ci_build_gki.sh \
            scripts/337_reconstruct_phase206_artifact_free.sh \
            scripts/319_regenerate_phase175_base.sh \
            scripts/319_reconstruct_phase206_from_verified_artifact.sh

      - name: Restore pinned GKI source
        id: gki-source-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_TAG }}-${{ env.GKI_COMMON_SHA }}

      - name: Sync exact official GKI source on cache miss
        if: steps.gki-source-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf gki
          mkdir -p gki
          cd gki
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$GKI_MANIFEST_BRANCH" \
            --depth=1
          repo sync -c -j4 --no-tags --fail-fast
          git -C common fetch --depth=1 \
            https://android.googlesource.com/kernel/common \
            "refs/tags/$GKI_COMMON_TAG"
          git -C common checkout --detach FETCH_HEAD

      - name: Validate exact pinned GKI source
        run: |
          set -Eeuo pipefail
          test -d gki/common/.git
          test -x gki/build/build.sh
          test "$(git -C gki/common rev-parse HEAD)" = "$GKI_COMMON_SHA"
          git -C gki/common diff --check

      - name: Save pinned GKI source cache
        if: steps.gki-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: gki
          key: ${{ steps.gki-source-cache.outputs.cache-primary-key }}

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Restore Phase345 baseline cache
        id: phase345-baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
          key: a52xq-phase345-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-d7f4426

      - name: Build Phase345 baseline on cache miss
        if: steps.phase345-baseline-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          bash scripts/345_ci_build_gki.sh

      - name: Validate Phase345 baseline
        run: |
          set -Eeuo pipefail
          test -s phase345-gki-out/package/boot.img
          test -s phase345-gki-out/compile/Image
          test -s phase345-gki-out/config/final.config
          test -s workspace/gki-phase199-out/arch/arm64/boot/Image
          test "$(stat -c '%s' phase345-gki-out/package/boot.img)" -eq 100663296

          grep -Fq 'A52_PHASE345_DMA_US_FRONTIER_V1' \
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c
          grep -Fq 'A52_PHASE343_INSTRUCTION_COUNTER_FRONTIER_V1' \
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c

      - name: Save Phase345 baseline cache
        if: steps.phase345-baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
          key: a52xq-phase345-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-d7f4426

      - name: Build Phase374
        env:
          PHASE346_PREWARMED_PHASE345: '1'
        run: bash scripts/374_ci_build_gki.sh

      - name: Upload full evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE374-MDSS-GDSC-PROXY-PARITY-${{ github.run_number }}
          path: phase374-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload boot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE374-MDSS-GDSC-PROXY-PARITY-${{ github.run_number }}-BOOT-IMG
          path: phase374-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE374-MDSS-GDSC-PROXY-PARITY-${{ github.run_number }}-FAILED
          path: phase374-gki-failure/
          if-no-files-found: warn
          retention-days: 30
