name: 321 - A52 GKI ESC0 shared safe lifecycle A/B
run-name: Phase321 - isolated ESC0 native safe-source park/restore A/B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase321-gki-esc0-shared-safe-lifecycle-ab-v1
    paths:
      - .github/workflows/321-a52-gki-esc0-shared-safe-lifecycle-ab.yml
      - scripts/321_apply_esc0_shared_safe.py
      - scripts/321_ci_build_gki.sh
      - scripts/319_apply_dsi_sixpoint_temporal_observer.py
      - scripts/319_ci_build_gki.sh
      - scripts/319_reconstruct_phase206_from_verified_artifact.sh
      - scripts/319_regenerate_phase175_base.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-phase321-esc0-safe-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git

jobs:
  gki:
    name: Build Phase321 GKI ESC0 shared safe lifecycle A/B
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase321 runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates unzip make gcc g++ python3 bc bison flex clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile scripts/319_apply_dsi_sixpoint_temporal_observer.py scripts/321_apply_esc0_shared_safe.py
          bash -n scripts/319_ci_build_gki.sh
          bash -n scripts/321_ci_build_gki.sh
          bash -n scripts/319_reconstruct_phase206_from_verified_artifact.sh
          bash -n scripts/319_regenerate_phase175_base.sh

      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Build and audit Phase321 GKI
        run: bash scripts/321_ci_build_gki.sh

      - name: Upload Phase321 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE321-GKI-ESC0-SHARED-SAFE-LIFECYCLE-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase321-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase321 boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE321-GKI-ESC0-SHARED-SAFE-LIFECYCLE-${{ github.run_number }}-BOOT-IMG
          path: phase321-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Phase321 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE321-GKI-ESC0-SHARED-SAFE-LIFECYCLE-${{ github.run_number }}-FAILED
          path: phase321-gki-failure/
          if-no-files-found: warn
          retention-days: 30
