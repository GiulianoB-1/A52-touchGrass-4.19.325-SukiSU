name: 129 - A52XQ KernelSU Keystore userspace recorder

run-name: Build metadata-only Keystore startup recorder module

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/129-a52xq-keystore-userspace-recorder.yml
      - scripts/129_build_a52xq_keystore_userspace_recorder.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52xq-keystore-userspace-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build audited KernelSU userspace recorder
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Build KernelSU module
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder
          mkdir -p "$OUT/package"

          python3 -m py_compile \
            scripts/129_build_a52xq_keystore_userspace_recorder.py

          python3 scripts/129_build_a52xq_keystore_userspace_recorder.py \
            --output "$OUT/package/A52XQ-Keystore-Startup-Recorder-KSU.zip" \
            --report "$OUT/a52xq-keystore-userspace-recorder-report.json"

      - name: Audit module format and collection policy
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder
          ZIP="$OUT/package/A52XQ-Keystore-Startup-Recorder-KSU.zip"
          REPORT="$OUT/a52xq-keystore-userspace-recorder-report.json"

          unzip -t "$ZIP"
          unzip -l "$ZIP" | tee "$OUT/package/module-contents.txt"

          for SCRIPT in \
            customize.sh service.sh boot-completed.sh collector.sh \
            export.sh action.sh uninstall.sh; do
            unzip -p "$ZIP" "$SCRIPT" | bash -n
          done

          unzip -p "$ZIP" module.prop | grep -Fxq 'id=a52_keystore_recorder'
          unzip -p "$ZIP" collector.sh | grep -Fq '/proc/a52_keymaster_flight_recorder'
          unzip -p "$ZIP" collector.sh | grep -Fq 'logcat -b all'
          unzip -p "$ZIP" collector.sh | grep -Fq 'grep -iE'
          unzip -p "$ZIP" collector.sh | grep -Fq 'health.csv'
          unzip -p "$ZIP" collector.sh | grep -Fq '/sys/fs/pstore'
          unzip -p "$ZIP" collector.sh | grep -Fq 'A52KMFR-PERSIST'
          unzip -p "$ZIP" export.sh | grep -Fq 'A52-Keystore-Recorder'
          unzip -p "$ZIP" export.sh | grep -Fq 'tar -czf'

          if unzip -p "$ZIP" collector.sh export.sh service.sh | \
            grep -Eq '/data/misc/keystore|/dev/block|dd if=|flash_image|debuggerd|/data/tombstones|bugreportz'; then
            echo 'Forbidden key material, memory dump, bugreport, or partition path found.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(
              'artifacts/a52xq-keystore-userspace-recorder/'
              'a52xq-keystore-userspace-recorder-report.json'
          ).read_text())
          assert report['status'] == 'a52xq-keystore-userspace-recorder-built-audited'
          assert report['hardware_validated'] is False
          assert report['kernel_changes'] is False
          assert report['another_kernel_recorder_added'] is False
          assert report['complements_existing_kernel_recorder'] is True
          assert report['automatic_internal_storage_export'] is True
          assert report['internal_storage_root'] == '/sdcard/A52-Keystore-Recorder'
          assert report['kernel_proc_endpoint'] == '/proc/a52_keymaster_flight_recorder'
          assert report['persistent_marker'] == 'A52KMFR-PERSIST'
          assert 'keystore-databases' in report['privacy_exclusions']
          assert 'command-response-buffers' in report['privacy_exclusions']
          assert 'process-memory' in report['privacy_exclusions']
          PY

      - name: Finalize standalone module artifact
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52XQ KERNELSU KEYSTORE USERSPACE RECORDER

          Install the module through KernelSU Manager and reboot.
          Do not flash the module from custom recovery.

          Automatic output folder:
            Internal storage/A52-Keystore-Recorder/<boot-id>/

          Kernel correlation source:
            /proc/a52_keymaster_flight_recorder

          This module complements the existing kernel recorder. It does not add
          another kernel recorder and does not modify the kernel or any partition.

          It excludes Keystore databases, keys, key blobs, authentication tokens,
          command/response buffers, process memory, tombstones and full bugreports.

          Module package:
            package/A52XQ-Keystore-Startup-Recorder-KSU.zip

          Hardware validation is still required on the Galaxy A52 5G.
          EOF

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload standalone KernelSU recorder artifact
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-kernelsu-keystore-userspace-recorder-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-keystore-userspace-recorder
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Require final module output
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-keystore-userspace-recorder
          test -s "$OUT/package/A52XQ-Keystore-Startup-Recorder-KSU.zip"
          test -s "$OUT/a52xq-keystore-userspace-recorder-report.json"
          test -s "$OUT/SHA256SUMS"
          grep -Fq 'a52xq-keystore-userspace-recorder-built-audited' \
            "$OUT/a52xq-keystore-userspace-recorder-report.json"
          grep -Fq '"another_kernel_recorder_added": false' \
            "$OUT/a52xq-keystore-userspace-recorder-report.json"
          grep -Fq '"automatic_internal_storage_export": true' \
            "$OUT/a52xq-keystore-userspace-recorder-report.json"
