name: 95 - A52 Turnip Autotune Direct Log v0.35

on:
  push:
    branches:
      - agent/a52-turnip-vulkan14-autotune-directlog-v035
    paths:
      - .github/workflows/95-a52-turnip-autotune-directlog-v035.yml
      - scripts/95_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-turnip-autotune-v035-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 30.0.16248370
  ANDROID_API: 36
  GLSLANG_COMMIT: e1b562a8bed273a02f30b59b66a5d499793cede5
  CCACHE_DIR: ${{ github.workspace }}/.ccache-turnip
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    name: Build v0.35 direct-liblog autotune diagnostic Turnip
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils zip unzip file binutils patchelf ccache pkg-config cmake \
            python3 python3-pip python3-setuptools python3-wheel \
            flex bison git ca-certificates
          python3 -m pip install --user --upgrade "meson>=1.4" ninja mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: a52-turnip-mesa2622-v035-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52-turnip-mesa2622-v035-ccache-${{ runner.os }}-
            a52-turnip-mesa2622-v034-ccache-${{ runner.os }}-
            a52-turnip-mesa2622-ccache-${{ runner.os }}-

      - name: Build pinned glslang
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/glslang-src"
          BUILD="$RUNNER_TEMP/glslang-build"
          DEST="$HOME/.local/bin"
          rm -rf "$SRC" "$BUILD"
          git clone --filter=blob:none https://github.com/KhronosGroup/glslang.git "$SRC"
          git -C "$SRC" checkout --detach "$GLSLANG_COMMIT"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$GLSLANG_COMMIT"
          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXTERNAL=OFF \
            -DENABLE_OPT=OFF \
            -DENABLE_HLSL=OFF \
            -DGLSLANG_TESTS=OFF \
            -DGLSLANG_ENABLE_INSTALL=OFF \
            -DENABLE_GLSLANG_BINARIES=ON
          cmake --build "$BUILD" --target glslang-standalone --parallel 2
          mkdir -p "$DEST"
          cp -L "$BUILD/StandAlone/glslangValidator" "$DEST/glslangValidator"
          chmod 0755 "$DEST/glslangValidator"
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/glslangValidator" --version

      - name: Locate Android SDK
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK r30
        run: |
          set -Eeuo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure compiler cache
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build v0.35 diagnostic Turnip
        run: |
          set -o pipefail
          chmod +x scripts/95_build_turnip_autotune_directlog_v035.sh
          mkdir -p artifacts
          ./scripts/95_build_turnip_autotune_directlog_v035.sh \
            "$GITHUB_WORKSPACE" "$NDK_ROOT" \
            "$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2-v035" \
            2>&1 | tee artifacts/turnip-v035-build.log

      - name: Package persistent v0.35 diagnostic module
        run: |
          set -Eeuo pipefail
          chmod +x scripts/95_package_turnip_autotune_directlog_v035.sh
          ./scripts/95_package_turnip_autotune_directlog_v035.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2-v035" \
            "$GITHUB_WORKSPACE/release-turnip-autotune-v035"

      - name: Audit v0.35 diagnostic build
        run: |
          set -Eeuo pipefail
          DRIVER="$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2-v035/dist/vulkan.adreno.so"
          INFO="$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2-v035/BUILD-INFO.txt"
          ZIP="$GITHUB_WORKSPACE/release-turnip-autotune-v035/touchGrass-Turnip-A619-Mesa-26.2.2-v0.35-AUTOTUNE-DIRECTLOG-DIAG-KSU.zip"

          test -s "$DRIVER"
          test -s "$INFO"
          test -s "$ZIP"
          grep -Fxq 'mesa_version=26.2.2' "$INFO"
          grep -Fxq 'kgsl_sync_merge=fixed-mixed-ts-syncfd-and-cross-queue-ts' "$INFO"
          grep -Fxq 'runtime_logging=autotune-direct-android-liblog-diagnostic' "$INFO"
          grep -Fxq 'autotune_diagnostics=direct-liblog-init-call-decision-bandwidth' "$INFO"
          unzip -p "$ZIP" module.prop | grep -Fxq 'version=0.35-vk1.4-autotune-directlog'
          unzip -p "$ZIP" module.prop | grep -Fxq 'versionCode=48'
          unzip -l "$ZIP" | grep -Fq 'payload/vulkan.adreno.so'
          strings "$DRIVER" | grep -Fq 'TGAT_INIT %s'
          strings "$DRIVER" | grep -Fq 'TGAT_CALL seq='
          strings "$DRIVER" | grep -Fq 'TGAT_DECISION seq='
          strings "$DRIVER" | grep -Fq 'TGAT_BW seq='
          readelf -Ws "$DRIVER" | grep -Fq '__android_log_print'
          readelf -d "$DRIVER" | grep -Fq 'Shared library: [liblog.so]'
          file "$DRIVER" | grep -Fq 'ARM aarch64'
          echo 'v035_autotune_directlog_diagnostic_audit=PASS'

      - name: Compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Upload v0.35 diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: A52-Turnip-Autotune-DIRECTLOG-DIAG-v0.35
          path: |
            release-turnip-autotune-v035/touchGrass-Turnip-A619-Mesa-26.2.2-v0.35-AUTOTUNE-DIRECTLOG-DIAG-KSU.zip
            artifacts/turnip-v035-build.log
            artifacts/turnip-mesa-26.2.2-v035/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
