name: 135 - Observe Workflow 125 after script 128 fix

on:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/135-observe-workflow125-after-script128-fix.yml

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      TARGET_SHA: 622815fcf16dfa7e5c506c2c72e1e01504cd7596
      WORKFLOW_FILE: 125-touchgrass-4.19-keymaster-flight-recorder.yml
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/a52-keymaster-real-ion
          fetch-depth: 0

      - name: Publish queued status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"workflow-125-persistent\",\"description\":\"Workflow 125 after script 128 fix is queued\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions\"}"

      - name: Discover, link and wait for target run
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['TARGET_SHA']
          workflow = os.environ['WORKFLOW_FILE']
          token = os.environ['GH_TOKEN']
          output = os.environ['GITHUB_OUTPUT']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'workflow-135-observer',
              'Content-Type': 'application/json',
          }

          def api(url: str, data: dict | None = None) -> dict:
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(url, data=payload, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          encoded_branch = urllib.parse.quote(branch, safe='')
          list_url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs'
              f'?branch={encoded_branch}&event=push&per_page=40'
          )
          selected = None
          for _ in range(90):
              runs = api(list_url).get('workflow_runs', [])
              candidates = [
                  run for run in runs
                  if run.get('head_sha') == sha and run.get('event') == 'push'
              ]
              if candidates:
                  selected = max(candidates, key=lambda run: run['id'])
                  break
              time.sleep(5)

          if selected is None:
              with open(output, 'a', encoding='utf-8') as handle:
                  handle.write('conclusion=not_found\n')
                  handle.write(
                      f'run_url=https://github.com/{repo}/actions/workflows/{workflow}\n'
                  )
              raise SystemExit(0)

          run_id = selected['id']
          run_url = selected['html_url']
          api(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              {
                  'state': 'pending',
                  'context': 'workflow-125-persistent',
                  'description': f'Workflow 125 run {run_id} is active',
                  'target_url': run_url,
              },
          )
          conclusion = 'timeout'
          for _ in range(360):
              run = api(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
              if run.get('status') == 'completed':
                  conclusion = run.get('conclusion') or 'unknown'
                  break
              time.sleep(10)

          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f'run_id={run_id}\n')
              handle.write(f'run_url={run_url}\n')
              handle.write(f'conclusion={conclusion}\n')
          print(f'Workflow 125 run {run_id}: {conclusion} - {run_url}')
          PY

      - name: Extract failure diagnostics
        if: steps.observe.outputs.conclusion != 'success' && steps.observe.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.observe.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics .workflow135
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > .workflow135/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          from pathlib import Path
          jobs = json.loads(Path('.workflow135/jobs.json').read_text()).get('jobs', [])
          selected = [job for job in jobs if job.get('conclusion') == 'failure'] or jobs
          if not selected:
              raise SystemExit('no job found')
          print(selected[0]['id'])
          PY
          )"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
            --output .workflow135/job-log.bin
          python3 - <<'PY'
          import io
          import os
          import re
          import zipfile
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          raw = Path('.workflow135/job-log.bin').read_bytes()
          if zipfile.is_zipfile(io.BytesIO(raw)):
              chunks = []
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  for name in sorted(archive.namelist()):
                      if not name.endswith('/'):
                          chunks.append(archive.read(name).decode('utf-8', errors='replace'))
              text = '\n'.join(chunks)
          else:
              text = raw.decode('utf-8', errors='replace')
          lines = text.splitlines()
          pattern = re.compile(
              r'(error|failed|failure|traceback|systemexit|assertion|calledprocess|'
              r'expected|missing|audit|exception|non-zero|exit code)', re.I
          )
          interesting = [line for line in lines if pattern.search(line)]
          report = [
              f'Workflow 125 failed run: {run_id}',
              f'Total decoded log lines: {len(lines)}',
              '', '=== Interesting lines ===', *interesting[-220:],
              '', '=== Final 320 lines ===', *lines[-320:], ''
          ]
          Path(f'diagnostics/workflow125-run-{run_id}-failure.txt').write_text(
              '\n'.join(report), encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "diagnostics/workflow125-run-${RUN_ID}-failure.txt"
          git commit -m "Record Workflow 125 run ${RUN_ID} failure"
          git push origin HEAD:agent/a52-keymaster-real-ion

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ steps.observe.outputs.conclusion }}
          RUN_URL: ${{ steps.observe.outputs.run_url }}
        run: |
          set -Eeuo pipefail
          conclusion="${CONCLUSION:-observer_failed}"
          run_url="${RUN_URL:-https://github.com/${GITHUB_REPOSITORY}/actions}"
          if [ "$conclusion" = success ]; then
            state=success
            description='Persistent Workflow 125 passed'
          else
            state=failure
            description="Persistent Workflow 125: ${conclusion}"
          fi
          payload="$(python3 - "$state" "$description" "$run_url" <<'PY'
          import json
          import sys
          print(json.dumps({
              'state': sys.argv[1],
              'context': 'workflow-125-persistent',
              'description': sys.argv[2][:140],
              'target_url': sys.argv[3],
          }))
          PY
          )"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "$payload"
          test "$state" = success
