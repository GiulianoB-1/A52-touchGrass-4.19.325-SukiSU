name: 127 - Trigger persistent TouchGrass Keymaster recorder

on:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - scripts/125_apply_touchgrass_keymaster_flight_recorder.py
      - scripts/126_apply_touchgrass_audio_sysfs_boot_guard.py
      - scripts/127_apply_touchgrass_failed_boot_keymaster_persistence.py
      - .github/workflows/125-touchgrass-4.19-keymaster-flight-recorder.yml
      - .github/workflows/127-trigger-touchgrass-persistent-keymaster-recorder.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: trigger-touchgrass-persistent-keymaster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Workflow 125 on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/125-touchgrass-4.19-keymaster-flight-recorder.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"
