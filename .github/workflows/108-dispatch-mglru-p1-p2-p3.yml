name: 108 - Dispatch MGLRU P1 + P2 + P3

on:
  push:
    branches:
      - agent/a52-mglru-modern-p1-p2-p3-v1
    paths:
      - .github/workflows/108-dispatch-mglru-p1-p2-p3.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch exact baseline workflow on P1 + P2 + P3 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Dispatch revision 2: P3 uses upstream c28ac3c7 special-VMA guard.
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/359779432/dispatches" \
            -d '{"ref":"agent/a52-mglru-modern-p1-p2-p3-v1"}'
          echo "Dispatched workflow 359779432 on agent/a52-mglru-modern-p1-p2-p3-v1"
