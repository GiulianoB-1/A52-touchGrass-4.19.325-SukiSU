name: Phase347 - exact F0 FIFO A-B
run-name: Phase347 - exact F0 FIFO A-B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase347-f0-fifo-ab-v1
    paths:
      - .github/workflows/347-a52-f0-fifo-ab.yml
      - scripts/346_apply_dma_raw.py
      - scripts/347_apply_f0_fifo_ab.py
      - scripts/347_ci_build_gki.sh

permissions:
  contents: read
  actions: write

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE319_GOOD_HEAD: e466f29c784001b5f933091298162714a9181b8d

concurrency:
  group: a52-phase347-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase347 F0 FIFO A-B
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase347 runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves

          python3 -m py_compile \
            scripts/346_apply_dma_raw.py \
            scripts/347_apply_f0_fifo_ab.py
          bash -n scripts/347_ci_build_gki.sh

      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Restore Phase345 baseline cache
        id: phase345-baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
          key: a52xq-phase345-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-d7f4426

      - name: Build Phase345 baseline on cache miss
        if: steps.phase345-baseline-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          bash scripts/345_ci_build_gki.sh

      - name: Validate Phase345 baseline
        run: |
          set -Eeuo pipefail
          test -s phase345-gki-out/package/boot.img
          test -s phase345-gki-out/compile/Image
          test -s phase345-gki-out/config/final.config
          test -s workspace/gki-phase199-out/arch/arm64/boot/Image
          test "$(stat -c '%s' phase345-gki-out/package/boot.img)" -eq 100663296
          grep -Fq 'A52_PHASE345_DMA_US_FRONTIER_V1' \
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c
          grep -Fq 'A52_PHASE293_GKI_DMA_DONE_REFERENCE_V1' \
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl.c

      - name: Save Phase345 baseline cache
        if: steps.phase345-baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase345-gki-out
          key: a52xq-phase345-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-d7f4426

      - name: Build Phase347
        env:
          PHASE347_PREWARMED_PHASE345: '1'
        run: bash scripts/347_ci_build_gki.sh

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE347-F0-FIFO-AB-${{ github.run_number }}
          path: phase347-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload boot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE347-F0-FIFO-AB-${{ github.run_number }}-BOOT-IMG
          path: phase347-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE347-F0-FIFO-AB-${{ github.run_number }}-FAILED
          path: phase347-gki-failure/
          if-no-files-found: warn
          retention-days: 30
