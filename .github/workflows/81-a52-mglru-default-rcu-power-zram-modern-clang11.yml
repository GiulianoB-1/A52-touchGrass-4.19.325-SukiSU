          Phase81 first-boot policy:
          - CONFIG_LRU_GEN=y and CONFIG_LRU_GEN_ENABLED=y.
          - MGLRU starts enabled by the kernel itself.
          - CONFIG_RCU_FAST_NO_HZ=y for lower idle callback wakeups.
          - CONFIG_RCU_NOCB_CPU=y and boot cmdline rcu_nocbs=6-7.
          - RCU_LAZY is intentionally not used.
          - ZRAM uses sleepable entry locking and preemptible compression streams.
          - Runtime MGLRU kill switch remains /sys/kernel/mm/lru_gen/enabled.
          EOF

