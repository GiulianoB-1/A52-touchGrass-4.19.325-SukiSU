name: 160 - A52 REFGEN display-supply candidate

run-name: Build ACK 5.10 black-screen candidate with Kona REFGEN regulator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/160-a52-gki-5.10-refgen-display-fix.yml
      - scripts/160_apply_a52xq_refgen_regulator.py
      - scripts/154_apply_a52xq_failure_window_probe.py
      - scripts/38_repack_a52_p1_boot.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-refgen-display-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  RUN32_ARTIFACT_ID: '8635093061'

jobs:
  build-package:
    name: Compile and package REFGEN display-supply candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile \
            scripts/154_apply_a52xq_failure_window_probe.py \
            scripts/160_apply_a52xq_refgen_regulator.py \
            scripts/38_repack_a52_p1_boot.py

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Download and verify hardware-tested Run 32 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p run32/extracted
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN32_ARTIFACT_ID}/zip" \
            --output run32/artifact.zip
          unzip -q run32/artifact.zip -d run32/extracted
          (cd run32/extracted && sha256sum -c SHA256SUMS)
          test -s run32/extracted/stage/full-source.patch
          test -s run32/extracted/config/final.config
          test -s run32/extracted/package/boot.img
          test -s run32/extracted/tools/decode-a52-unified-secure-recorder.py
          grep -Fq 'A52_ACKFR_EARLY_MIRRORED_BACKEND' run32/extracted/stage/full-source.patch

      - name: Restore Run 32 and stage display diagnostics
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          test -d gki/common/.git
          test "$(git -C gki/common rev-parse HEAD)" = "${GKI_COMMON_SHA}"
          git -C gki/common reset --hard "${GKI_COMMON_SHA}"
          git -C gki/common clean -fd
          git -C gki/common apply --check "$PWD/run32/extracted/stage/full-source.patch"
          git -C gki/common apply "$PWD/run32/extracted/stage/full-source.patch"

          OUT="$PWD/artifacts/a52xq-gki-refgen-display-fix"
          mkdir -p "$OUT/logs" "$OUT/stage" "$OUT/config" "$OUT/compile" "$OUT/package" "$OUT/tools"

          python3 scripts/154_apply_a52xq_failure_window_probe.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/failure-window-stage.log"

          python3 scripts/160_apply_a52xq_refgen_regulator.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/refgen-stage.log"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-refgen-display-fix/stage')
          recorder = json.loads((root / 'phase25-a52-failure-window-probe-report.json').read_text())
          refgen = json.loads((root / 'phase26-a52-refgen-regulator-report.json').read_text())
          assert recorder['status'] == 'a52-failure-window-probe-v1-staged'
          assert recorder['recorder']['heartbeat_interval_ms'] == 500
          assert recorder['watchdog']['registration_bypassed'] is True
          assert refgen['status'] == 'a52-refgen-display-supply-v1-staged'
          assert refgen['stock_dtb_compatible'] == 'qcom,refgen-kona-regulator'
          assert refgen['instrumentation']['payload_capture'] is False
          assert refgen['instrumentation']['enable'] is True
          assert refgen['instrumentation']['disable'] is True
          PY

          grep -Fq 'config REGULATOR_REFGEN' gki/common/drivers/regulator/Kconfig
          grep -Fq 'obj-$(CONFIG_REGULATOR_REFGEN) += refgen.o' gki/common/drivers/regulator/Makefile
          grep -Fq 'A52_REFGEN_DISPLAY_SUPPLY_V1' gki/common/drivers/regulator/refgen.c
          grep -Fq 'qcom,refgen-kona-regulator' gki/common/drivers/regulator/refgen.c
          grep -Fq 'REFGEN_REG_PWRDWN_CTRL5' gki/common/drivers/regulator/refgen.c
          grep -Fq 'REFGEN kona_enable raw=0x%x->0x%x enabled=%u' gki/common/drivers/regulator/refgen.c
          grep -Fq 'REFGEN kona_disable raw=0x%x->0x%x enabled=%u' gki/common/drivers/regulator/refgen.c
          grep -Fq 'REFGEN probe ready initial_enabled=%d' gki/common/drivers/regulator/refgen.c
          git -C gki/common diff --check
          git -C gki/common add -N .
          git -C gki/common diff --binary --no-ext-diff > "$OUT/stage/refgen-display-source.patch"
          test -s "$OUT/stage/refgen-display-source.patch"

      - name: Resolve REFGEN and recorder configuration and compile
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-refgen-display-fix"
          BUILD="$PWD/workspace/gki-refgen-display-fix-out"
          mkdir -p "$BUILD"
          cp run32/extracted/config/final.config "$BUILD/.config"

          gki/common/scripts/config --file "$BUILD/.config" --enable REGULATOR_REFGEN
          gki/common/scripts/config --file "$BUILD/.config" --enable WATCHDOG
          gki/common/scripts/config --file "$BUILD/.config" --enable WATCHDOG_CORE
          gki/common/scripts/config --file "$BUILD/.config" --enable QCOM_WDT
          gki/common/scripts/config --file "$BUILD/.config" --disable WATCHDOG_HANDLE_BOOT_ENABLED
          gki/common/scripts/config --file "$BUILD/.config" --disable WATCHDOG_NOWAYOUT

          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$OUT/logs/olddefconfig.log"
          cp "$BUILD/.config" "$OUT/config/final.config"

          grep -Fxq 'CONFIG_REGULATOR_REFGEN=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_QCOM_WDT=y' "$BUILD/.config"
          grep -Fxq 'CONFIG_WATCHDOG=y' "$BUILD/.config"
          grep -Fxq '# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED is not set' "$BUILD/.config"

          set +e
          make -k -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
            KCFLAGS=-Wno-error=frame-larger-than Image \
            > "$OUT/logs/compile.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/compile/make-return-code.txt"
          if [ "$rc" -ne 0 ]; then
            echo '::group::Compiler errors'
            grep -nE '(^|: )(fatal error|error): |undefined reference to' \
              "$OUT/logs/compile.log" | tail -n 300 || true
            echo '::endgroup::'
            echo '::group::Compile log tail'
            tail -n 400 "$OUT/logs/compile.log" || true
            echo '::endgroup::'
            exit "$rc"
          fi

          test -s "$BUILD/arch/arm64/boot/Image"
          test -s "$BUILD/drivers/regulator/refgen.o"
          cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image"
          gzip -n -9 -c "$OUT/compile/Image" > "$OUT/package/Image.gz"
          gzip -t "$OUT/package/Image.gz"

          grep -aFq 'Qualcomm REFGEN regulator with A52 display diagnostics' "$OUT/compile/Image"
          grep -aFq 'qcom,refgen-kona-regulator' "$OUT/compile/Image"
          grep -aFq 'REFGEN driver_register rc=%d' "$OUT/compile/Image"
          grep -aFq 'REFGEN probe enter compat=%s' "$OUT/compile/Image"
          grep -aFq 'REFGEN kona_enable raw=0x%x->0x%x enabled=%u' "$OUT/compile/Image"
          grep -aFq 'REFGEN kona_disable raw=0x%x->0x%x enabled=%u' "$OUT/compile/Image"
          grep -aFq 'HB tick=%u online=%u run=%lu j=%lu' "$OUT/compile/Image"
          grep -aFq 'WDT disarm before=%u after=%u' "$OUT/compile/Image"
          grep -aFq 'A52USR2 BOOT_EARLY stage=mm_init backend=early-mirrored' "$OUT/compile/Image"

      - name: Upload failed diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-refgen-display-fix-${{ github.run_number }}-FAILED-DIAGNOSTICS
          path: artifacts/a52xq-gki-refgen-display-fix
          if-no-files-found: warn
          retention-days: 7

      - name: Repack and audit boot image
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-refgen-display-fix
          python3 scripts/38_repack_a52_p1_boot.py \
            --source run32/extracted/package/boot.img \
            --kernel "$OUT/package/Image.gz" \
            --output "$OUT/package/boot.img" \
            --report "$OUT/package/repack-report.json"
          test -s "$OUT/package/boot.img"
          cp run32/extracted/tools/decode-a52-unified-secure-recorder.py \
            "$OUT/tools/decode-a52-unified-secure-recorder.py"

          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-refgen-display-fix')
          recorder = json.loads((root / 'stage/phase25-a52-failure-window-probe-report.json').read_text())
          refgen = json.loads((root / 'stage/phase26-a52-refgen-regulator-report.json').read_text())
          repack = json.loads((root / 'package/repack-report.json').read_text())
          compile_log = (root / 'logs/compile.log').read_text(errors='replace')
          errors = re.findall(r'^[^:\s][^:]*:\d+:\d+: (?:fatal error|error): ', compile_log, re.M)
          boot = root / 'package/boot.img'
          final = {
              'status': 'a52-refgen-display-fix-boot-audited',
              'flashable_candidate': True,
              'hardware_validated': False,
              'root_cause_status': 'leading-hypothesis-requires-device-test',
              'stock_dtb_provider': refgen['stock_dtb_compatible'],
              'refgen_built_in': True,
              'refgen_instrumented': True,
              'payload_capture': False,
              'compiler_error_count': len(errors),
              'heartbeat_interval_ms': recorder['recorder']['heartbeat_interval_ms'],
              'watchdog_disarmed_in_probe': recorder['watchdog']['firmware_watchdog_disarmed'],
              'watchdog_registration_bypassed': recorder['watchdog']['registration_bypassed'],
              'boot_sha256': hashlib.sha256(boot.read_bytes()).hexdigest(),
              'boot_bytes': boot.stat().st_size,
              'dtb_preserved': repack['invariants']['dtb_preserved'],
              'ramdisk_preserved': repack['invariants']['ramdisk_preserved'],
              'recovery_dtbo_preserved': repack['invariants']['recovery_dtbo_preserved'],
          }
          if errors:
              raise SystemExit(f'compiler errors survived audit: {len(errors)}')
          if not all((final['dtb_preserved'], final['ramdisk_preserved'], final['recovery_dtbo_preserved'])):
              raise SystemExit('boot-container preservation audit failed')
          (root / 'final-audit.json').write_text(json.dumps(final, indent=2, sort_keys=True) + '\n')
          PY

          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 GKI 5.10 REFGEN DISPLAY-SUPPLY CANDIDATE

          This candidate adds the Qualcomm Kona REFGEN regulator required by the
          stock A52 DTB as the DSI refgen-supply provider.  It keeps the existing
          five-minute heartbeat, display probes, persistent RAMOOPS recorder and
          Qualcomm watchdog disarm.

          Persistent REFGEN records include:
          - driver registration result
          - probe and MMIO mapping
          - initial hardware state
          - every enable, disable and state check
          - failures and return codes

          Test procedure:
          1. Back up the currently working boot partition.
          2. Flash only package/boot.img using the same proven method as Run 32.
          3. Observe whether Android reaches and retains the lock screen.
          4. If the screen still goes black, leave it for at least 15 seconds.
          5. Reboot directly into recovery and collect the untouched raw 1 MiB RAMOOPS image.

          This image is not hardware validated.  Keep the known-working rollback image available.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload flashable REFGEN candidate
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-refgen-display-fix-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-gki-refgen-display-fix
          if-no-files-found: error
          retention-days: 14

      - name: Require final audited output
        run: |
          set -Eeuo pipefail
          test -s artifacts/a52xq-gki-refgen-display-fix/package/boot.img
          grep -Fq '"status": "a52-refgen-display-fix-boot-audited"' \
            artifacts/a52xq-gki-refgen-display-fix/final-audit.json
          grep -Fq '"refgen_built_in": true' \
            artifacts/a52xq-gki-refgen-display-fix/final-audit.json
