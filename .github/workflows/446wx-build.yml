      - name: Preserve Phase446AF vmlinux for crash decoding
        if: success()
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          test -s "$BUILD/vmlinux"
          test -s "$BUILD/System.map"
          test -s "$ROOT/scripts/faddr2line"
          mkdir -p phase446af-debug
          cp "$BUILD/vmlinux" phase446af-debug/vmlinux
          cp "$BUILD/System.map" phase446af-debug/System.map
          cp "$ROOT/scripts/faddr2line" phase446af-debug/faddr2line
          cp "$BUILD/.config" phase446af-debug/final.config
          readelf -SW phase446af-debug/vmlinux | grep -F '.debug_info'
          printf '%s\n' "P446AF DWARF vmlinux retained for exact offset decoding" >> "$GITHUB_STEP_SUMMARY"
      - name: Save exact per-variant Kbuild objects
        if: success() && steps.kbuild_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            workspace/gki-phase199-out
            !workspace/gki-phase199-out/vmlinux
            !workspace/gki-phase199-out/arch/arm64/boot/Image
          key: mangrove-kbuild-v5-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ matrix.variant.id }}-${{ steps.build_cache_key.outputs.fingerprint }}-${{ steps.build_cache_key.outputs.config }}-${{ steps.build_cache_key.outputs.toolchain }}
      - name: Save reusable clang ccache even if packaging fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: mangrove-clang-ccache-v3-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ matrix.variant.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package and audit Phase447C independently compiled ${{ matrix.variant.id }} boot
        if: success()
        run: |
          set -Eeuo pipefail
          bash scripts/446z_package_preserved.sh
          python3 -m py_compile scripts/447c_finalize_variant.py
          python3 scripts/447c_finalize_variant.py \
            --source f0bisect-gki-p6-out/package/boot-f0bisect-gki-p6-v1.img \
            --config workspace/gki-phase199-out/.config \
            --variant "${{ matrix.variant.id }}" --out phase447b-variants
          python3 - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("phase447b-variants/compiled-variant.json").read_text())
          assert x["primary_cmdline_length"] <= 480
          assert x["compiled_config"]["CONFIG_LOG_BUF_SHIFT"] == 23
          print("P447C PRIMARY ARGS:",x["primary_cmdline"])
          print("P447C BOOT HEADER version=",x["boot_header_version"],"cmdline_length=",x["primary_cmdline_length"])
          PY
          if command -v unpack_bootimg >/dev/null 2>&1; then
            unpack_bootimg --boot_img "$(find phase447b-variants -name '*.boot.img' -type f -print -quit)" --out /tmp/p447c-unpack | head -n 45
          fi
          cat phase447b-variants/READ-BEFORE-FLASH.txt >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.variant.id }}" in
            A) ORIGINAL_BOOT="phase447b-variants/A-wave2-battery-only.boot.img" ;;
            B) ORIGINAL_BOOT="phase447b-variants/B-wave3-dsp-no-mss.boot.img" ;;
            C) ORIGINAL_BOOT="phase447b-variants/C-wave3-modem-ipa.boot.img" ;;
            D) ORIGINAL_BOOT="phase447b-variants/D-wave2-ipc-only.boot.img" ;;
            E) ORIGINAL_BOOT="phase447b-variants/E-wave2-glink-qrtr-only.boot.img" ;;
            F) ORIGINAL_BOOT="phase447b-variants/F-wave2-therm-guard-glink-qrtr.boot.img" ;;
            G) ORIGINAL_BOOT="phase447b-variants/G-wave2-manual-adsp-pas.boot.img" ;;
            *) echo "Invalid Mangrove variant"; exit 1 ;;
          esac
          MANGROVE_BOOT="phase447b-variants/Mangrove-Kernel-447M-${{ matrix.variant.id }}.boot.img"
          test -s "$ORIGINAL_BOOT"
          cp "$ORIGINAL_BOOT" "$MANGROVE_BOOT"
          cmp "$ORIGINAL_BOOT" "$MANGROVE_BOOT"
          if [ "${{ matrix.variant.id }}" = F ]; then
            # Edit the ACTUAL packaged DTB, not an unused kernel DTS.
            python3 scripts/453_daily_pstore_dtb.py --boot "$MANGROVE_BOOT" \
              --output phase447b-variants/MANGROVE-453-DAILY.boot.img \
              --report phase447b-variants/P453-RAMOOPS-DTB-MANIFEST.json
            MANGROVE_BOOT="phase447b-variants/MANGROVE-453-DAILY.boot.img"
            python3 scripts/453_daily_pstore_dtb.py --boot "$MANGROVE_BOOT" --check-only \
              | tee phase447b-variants/P453-RAMOOPS-BOOT-AUDIT.txt
          fi
          if [ "${{ matrix.variant.id }}" = G ]; then
            # P457 452-G must use the booting P451-DSP map: NO /firmware/scm.
            git fetch --depth=1 origin b80b04b64c0c7dfcf48a3aac0174f7b834f8b142
            git show FETCH_HEAD:scripts/451_dsp_boot_dtb.py > scripts/451_dsp_boot_dtb.py
            python3 scripts/451_dsp_boot_dtb.py --boot "$MANGROVE_BOOT" \
              --output phase447b-variants/MANGROVE-452-DSP-CHG.boot.img \
              --report phase447b-variants/P452-SCM-DSP-DTB-MANIFEST.json \
              --config workspace/gki-phase199-out/.config
            MANGROVE_BOOT="phase447b-variants/MANGROVE-452-DSP-CHG.boot.img"
            python3 scripts/451_dsp_boot_dtb.py --boot "$MANGROVE_BOOT" \
              --config workspace/gki-phase199-out/.config --check-only \
              | tee phase447b-variants/P452-SCM-DSP-BOOT-AUDIT.txt
            python3 -c 'import runpy,sys; sys.path.insert(0,"scripts"); from pathlib import Path; from u1_patch_boot_dtb import walk; p=runpy.run_path("scripts/38_repack_a52_p1_boot.py")["parse_boot"]; dtb=p(Path("phase447b-variants/MANGROVE-452-DSP-CHG.boot.img").read_bytes())["dtb"]; assert all(path!="/firmware/scm" for path, *_ in walk(dtb)), "SCM unexpectedly present"; print("P458 P457-BASE SCM-OFF DTB VERIFIED")'
            # P458 only changes the finalized boot FDT's ramoops node:
            # drop inert reservation duplicate, keep a single active region,
            # set ecc-size=<48>. No kernel/ramdisk/SCM/PAS modifications.
            python3 scripts/458_pstore_ecc48_dtb.py --boot "$MANGROVE_BOOT" \
              --output phase447b-variants/MANGROVE-P458-H0-RAMOOPS-ECC48.boot.img \
              --report phase447b-variants/P458-RAMOOPS-DTB-MANIFEST.json
            MANGROVE_BOOT="phase447b-variants/MANGROVE-P458-H0-RAMOOPS-ECC48.boot.img"
            python3 scripts/458_pstore_ecc48_dtb.py --boot "$MANGROVE_BOOT" --check-only \
              | tee phase447b-variants/P458-RAMOOPS-BOOT-AUDIT.txt
            # Add disabled SCM only AFTER unchanged P457 DSP map + ECC48.
            python3 scripts/458_dsp_disabled_scm_dtb.py --boot "$MANGROVE_BOOT" \
              --output phase447b-variants/MANGROVE-P458-DSP-SCM-ON-DEMAND.boot.img \
              --report phase447b-variants/P458-DSP-DISABLED-SCM-DTB.json
            MANGROVE_BOOT="phase447b-variants/MANGROVE-P458-DSP-SCM-ON-DEMAND.boot.img"
            python3 scripts/458_dsp_disabled_scm_dtb.py --boot "$MANGROVE_BOOT" --check-only \
              | tee phase447b-variants/P458-DSP-DISABLED-SCM-AUDIT.txt
            echo 'P458 runtime-only acceptance: no boot-time firmware:scm, no Venus/NPU load, 4 deferred devices, manual ADSP start only' >> "$GITHUB_STEP_SUMMARY"
            echo 'P458 pstore runtime acceptance (NOT CI-verified): pstore: Registered ramoops' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ matrix.variant.id }}" = E ]; then
            cp "$MANGROVE_BOOT" phase447b-variants/MANGROVE-449-DAILY.boot.img
          elif [ "${{ matrix.variant.id }}" = F ]; then
            cp "$MANGROVE_BOOT" phase447b-variants/MANGROVE-452-DAILY.boot.img
          fi
          printf 'Mangrove Kernel variant %s packaged: %s\n' "${{ matrix.variant.id }}" "$MANGROVE_BOOT" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.variant.ipc }}" = 1 ]; then
            EXTRA=()
            if [ "${{ matrix.variant.id }}" = G ]; then EXTRA+=(--manual-pas); fi
            python3 scripts/448a_ipc_stage1.py --root "$PWD/gki/common" --tg "$PWD/workspace/touchgrass-a52xq" \
              --config "$PWD/workspace/gki-phase199-out/.config" --boot "$MANGROVE_BOOT" "${EXTRA[@]}" \
              | tee phase447b-variants/P448-IPC-BOOT-AUDIT.txt
            cat phase447b-variants/P448-IPC-BOOT-AUDIT.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ matrix.variant.id }}" = E ] || [ "${{ matrix.variant.id }}" = F ] || [ "${{ matrix.variant.id }}" = G ]; then
            EXTRA=()
            if [ "${{ matrix.variant.id }}" = G ]; then EXTRA+=(--manual-pas); fi
            python3 scripts/448b_glink_qrtr_stage2.py --root "$PWD/gki/common" --tg "$PWD/workspace/touchgrass-a52xq" \
              --config "$PWD/workspace/gki-phase199-out/.config" --boot "$MANGROVE_BOOT" "${EXTRA[@]}" \
              | tee phase447b-variants/P448-GLINK-QRTR-BOOT-AUDIT.txt
            cat phase447b-variants/P448-GLINK-QRTR-BOOT-AUDIT.txt >> "$GITHUB_STEP_SUMMARY"
          fi
