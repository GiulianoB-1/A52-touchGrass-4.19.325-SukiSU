name: 325 - A52 TouchGrass RCG semantic port
run-name: Phase325 - exact TouchGrass RCG current-config semantic port

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase325-touchgrass-rcg-semantic-port-v1
    paths:
      - .github/workflows/325-a52-touchgrass-rcg-semantic-audit.yml
      - scripts/325_audit_touchgrass_rcg_semantics.py
      - scripts/325_apply_touchgrass_rcg_current_config.py
      - scripts/325_ci_build_gki.sh
      - scripts/319_apply_dsi_sixpoint_temporal_observer.py
      - scripts/319_ci_build_gki.sh
      - scripts/319_reconstruct_phase206_from_verified_artifact.sh
      - scripts/319_regenerate_phase175_base.sh

permissions:
  contents: read
  actions: read

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE319_GOOD_HEAD: e466f29c784001b5f933091298162714a9181b8d

concurrency:
  group: a52-phase325-touchgrass-rcg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit exact pinned clock semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Fetch exact TouchGrass clock sources
        run: |
          set -Eeuo pipefail
          TG="$PWD/phase325-touchgrass"
          mkdir -p "$TG/drivers/clk/qcom"
          BASE="https://raw.githubusercontent.com/micr0softstore/samsung_android_kernel_a52xq/${TOUCHGRASS_COMMIT}/drivers/clk/qcom"
          for f in clk-rcg.h clk-rcg2.c dispcc-lagoon.c; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
              "$BASE/$f" -o "$TG/drivers/clk/qcom/$f"
            test -s "$TG/drivers/clk/qcom/$f"
          done

      - name: Verify exact identities
        run: |
          set -Eeuo pipefail
          test "$(git -C gki/common rev-parse HEAD)" = "$GKI_COMMON_SHA"
          test "$(make -s -C gki/common kernelversion)" = 5.10.252
          python3 -m py_compile scripts/325_audit_touchgrass_rcg_semantics.py scripts/325_apply_touchgrass_rcg_current_config.py
          bash -n scripts/325_ci_build_gki.sh

      - name: Run Phase325 semantic audit
        run: |
          set -Eeuo pipefail
          rm -rf phase325-source-audit
          python3 scripts/325_audit_touchgrass_rcg_semantics.py \
            --gki gki/common \
            --tg phase325-touchgrass \
            --out phase325-source-audit
          {
            echo "gki_sha=$(git -C gki/common rev-parse HEAD)"
            echo "gki_version=$(make -s -C gki/common kernelversion)"
            echo "touchgrass_sha=${TOUCHGRASS_COMMIT}"
            sha256sum phase325-source-audit/*
          } | tee phase325-source-audit/IDENTITY.txt

      - name: Enforce decision-grade facts
        run: |
          set -Eeuo pipefail
          R=phase325-source-audit/REPORT.txt
          grep -Fxq 'gki_pristine_has_dispcc_lagoon=no' "$R"
          grep -Fxq 'tg_has_current_config_helper=yes' "$R"
          grep -Fxq 'gki_has_current_config_helper=no' "$R"
          grep -Fxq 'tg_byte2_calls_current_config=yes' "$R"
          grep -Fxq 'tg_pixel_calls_current_config=yes' "$R"
          grep -Fxq 'gki_byte2_calls_current_config=no' "$R"
          grep -Fxq 'gki_pixel_calls_current_config=no' "$R"
          grep -Fxq 'tg_struct_enable_safe_config=yes' "$R"
          grep -Fxq 'gki_struct_enable_safe_config=no' "$R"
          grep -Fxq 'tg_byte0_safe_config=yes' "$R"
          grep -Fxq 'tg_pclk0_safe_config=yes' "$R"
          grep -Fxq 'tg_esc0_safe_config=yes' "$R"
          grep -F 'PROVEN_DELTA_BYTE2=' "$R"
          grep -F 'PROVEN_DELTA_PIXEL=' "$R"
          grep -F 'PROVEN_DELTA_SAFE_LIFECYCLE=' "$R"

      - name: Upload Phase325 source audit
        uses: actions/upload-artifact@v4
        with:
          name: A52-PHASE325-TOUCHGRASS-RCG-SEMANTIC-AUDIT
          path: phase325-source-audit/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  gki:
    name: Build Phase325 exact TouchGrass RCG semantic port
    needs: audit
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase325 runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates unzip make gcc g++ python3 bc bison flex clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile scripts/319_apply_dsi_sixpoint_temporal_observer.py scripts/325_apply_touchgrass_rcg_current_config.py
          bash -n scripts/319_ci_build_gki.sh scripts/325_ci_build_gki.sh scripts/319_regenerate_phase175_base.sh

      - name: Restore exact successful Phase319 reconstruction helper
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/319_reconstruct_phase206_from_verified_artifact.sh?ref=${PHASE319_GOOD_HEAD}"
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github.raw+json' \
            "$API" --output /tmp/p325-phase319-reconstruct-good.sh
          test -s /tmp/p325-phase319-reconstruct-good.sh
          grep -Fq 'a52-port-compat.h' /tmp/p325-phase319-reconstruct-good.sh
          bash -n /tmp/p325-phase319-reconstruct-good.sh
          cp /tmp/p325-phase319-reconstruct-good.sh scripts/319_reconstruct_phase206_from_verified_artifact.sh
          chmod +x scripts/319_reconstruct_phase206_from_verified_artifact.sh

      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Build and audit Phase325 GKI
        run: bash scripts/325_ci_build_gki.sh

      - name: Upload Phase325 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE325-GKI-TOUCHGRASS-RCG-CURRENT-CONFIG-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase325-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase325 boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE325-GKI-TOUCHGRASS-RCG-CURRENT-CONFIG-${{ github.run_number }}-BOOT-IMG
          path: phase325-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Phase325 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE325-GKI-TOUCHGRASS-RCG-CURRENT-CONFIG-${{ github.run_number }}-FAILED
          path: phase325-gki-failure/
          if-no-files-found: warn
          retention-days: 30
