name: 93 - A52 Turnip Mesa 26.2.2 A619 KGSL Vulkan 1.4 Dual ABI

on:
  push:
    branches:
      - agent/a52-turnip-mesa-26.2.2-a619-kgsl-vulkan14-v2
    paths:
      - .github/workflows/93-a52-turnip-mesa-26.2.2-a619-kgsl-vulkan14-dualabi.yml
      - scripts/93_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-turnip-vk14-dualabi-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 30.0.16248370
  GLSLANG_COMMIT: e1b562a8bed273a02f30b59b66a5d499793cede5
  CCACHE_DIR: ${{ github.workspace }}/.ccache-turnip-vk14
  CCACHE_MAXSIZE: 6G

jobs:
  build:
    name: Build Turnip Vulkan 1.4 arm64 + arm32 and package SukiSU module
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             curl xz-utils zip unzip file binutils patchelf ccache pkg-config cmake             python3 python3-pip python3-setuptools python3-wheel             flex bison git ca-certificates
          python3 -m pip install --user --upgrade "meson>=1.4" ninja mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build pinned glslang
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/glslang-src"
          BUILD="$RUNNER_TEMP/glslang-build"
          DEST="$HOME/.local/bin"

          rm -rf "$SRC" "$BUILD"
          git clone --filter=blob:none https://github.com/KhronosGroup/glslang.git "$SRC"
          git -C "$SRC" checkout --detach "$GLSLANG_COMMIT"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$GLSLANG_COMMIT"

          cmake -S "$SRC" -B "$BUILD" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_EXTERNAL=OFF             -DENABLE_OPT=OFF             -DENABLE_HLSL=OFF             -DGLSLANG_TESTS=OFF             -DGLSLANG_ENABLE_INSTALL=OFF             -DENABLE_GLSLANG_BINARIES=ON

          cmake --build "$BUILD" --target glslang-standalone --parallel 2
          cp -L "$BUILD/StandAlone/glslangValidator" "$DEST/glslangValidator"
          chmod 0755 "$DEST/glslangValidator"
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/glslangValidator" --version

      - name: Locate Android SDK
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK r30
        run: |
          set -Eeuo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang" --version
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi36-clang" --version

      - name: Restore Turnip compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache-turnip-vk14
          key: a52-turnip-vk14-26.2.2-ndk30-${{ runner.os }}-${{ hashFiles('scripts/93_build_turnip_mesa_26_2_2_vulkan14.sh') }}
          restore-keys: |
            a52-turnip-vk14-26.2.2-ndk30-${{ runner.os }}-
            a52-turnip-26.2.2-ndk30-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=file_macro,time_macros
          ccache --zero-stats

      - name: Build Mesa 26.2.2 Turnip Vulkan 1.4 for both Android ABIs
        run: |
          set -o pipefail
          chmod +x scripts/93_build_turnip_mesa_26_2_2_vulkan14.sh
          mkdir -p artifacts
          ./scripts/93_build_turnip_mesa_26_2_2_vulkan14.sh             "$GITHUB_WORKSPACE"             "$NDK_ROOT"             "$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2-vk14"             2>&1 | tee artifacts/turnip-mesa-26.2.2-vk14-build.log

      - name: Package flashable SukiSU KernelSU module
        run: |
          set -Eeuo pipefail
          chmod +x scripts/93_package_turnip_a619_vulkan14_module.sh
          ./scripts/93_package_turnip_a619_vulkan14_module.sh             "$GITHUB_WORKSPACE"             "$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2-vk14"             "$GITHUB_WORKSPACE/release-turnip-vk14"

      - name: Audit Vulkan 1.4 drivers and installable module
        run: |
          set -Eeuo pipefail
          D64=artifacts/turnip-mesa-26.2.2-vk14/arm64/vulkan.adreno.so
          D32=artifacts/turnip-mesa-26.2.2-vk14/arm32/vulkan.adreno.so
          INFO=artifacts/turnip-mesa-26.2.2-vk14/BUILD-INFO.txt
          ZIP=release-turnip-vk14/touchGrass-A52XQ-Turnip-Mesa-26.2.2-Vulkan-1.4-KSU.zip

          test -s "$D64"
          test -s "$D32"
          test -s "$ZIP"

          grep -Fxq 'mesa_version=26.2.2' "$INFO"
          grep -Fxq 'gpu=Adreno 619' "$INFO"
          grep -Fxq 'kmd=KGSL' "$INFO"
          grep -Fxq 'android_api=36' "$INFO"
          grep -Fxq 'turnip_api=Vulkan-1.4' "$INFO"
          grep -Fxq 'architectures=arm64-v8a,armeabi-v7a' "$INFO"

          readelf -h "$D64" | grep -Fq 'ELF64'
          readelf -h "$D64" | grep -Fq 'AArch64'
          readelf -h "$D32" | grep -Fq 'ELF32'
          readelf -h "$D32" | grep -Eq 'Machine:[[:space:]]+ARM'

          for drv in "$D64" "$D32"; do
            readelf -d "$drv" | grep -Fq 'vulkan.adreno.so'
            ! readelf -d "$drv" | grep -Fq '(RUNPATH)'
            readelf -Ws "$drv" | grep -Eq '[[:space:]]HMI$'
            for lib in libhardware.so liblog.so libnativewindow.so libsync.so libc.so; do
              readelf -d "$drv" | grep -Fq "Shared library: [$lib]"
            done
          done

          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -Fxq 'id=touchgrass_turnip_a619_vk14'
          unzip -p "$ZIP" module.prop | grep -Fq 'Vulkan 1.4'
          unzip -p "$ZIP" README.txt | grep -Fq 'KernelSU/SukiSU module manager'
          unzip -l "$ZIP" | grep -Fq 'payload/lib64/vulkan.adreno.so'
          unzip -l "$ZIP" | grep -Fq 'payload/lib/vulkan.adreno.so'
          unzip -p "$ZIP" post-fs-data.sh | grep -Fq 'mount -o bind "$STAGE64" "$TARGET64"'
          unzip -p "$ZIP" post-fs-data.sh | grep -Fq 'mount -o bind "$STAGE32" "$TARGET32"'

          sha256sum "$D64" "$D32" "$ZIP" | tee artifacts/turnip-vk14-final-sha256.txt
          unzip -l "$ZIP" | tee artifacts/turnip-vk14-module-list.txt
          ccache --show-stats | tee artifacts/turnip-vk14-ccache.txt

      - name: Save Turnip compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache-turnip-vk14
          key: a52-turnip-vk14-26.2.2-ndk30-${{ runner.os }}-${{ hashFiles('scripts/93_build_turnip_mesa_26_2_2_vulkan14.sh') }}

      - name: Upload flashable Vulkan 1.4 SukiSU module
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-TURNIP-MESA-26.2.2-VULKAN-1.4-KSU-${{ github.run_number }}
          path: |
            release-turnip-vk14/touchGrass-A52XQ-Turnip-Mesa-26.2.2-Vulkan-1.4-KSU.zip
            release-turnip-vk14/touchGrass-A52XQ-Turnip-Mesa-26.2.2-Vulkan-1.4-KSU.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Vulkan 1.4 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-turnip-vk14-${{ github.run_number }}-diagnostics
          path: |
            artifacts/turnip-mesa-26.2.2-vk14/BUILD-INFO.txt
            artifacts/turnip-mesa-26.2.2-vk14/arm64/*.txt
            artifacts/turnip-mesa-26.2.2-vk14/arm64/*.sha256
            artifacts/turnip-mesa-26.2.2-vk14/arm32/*.txt
            artifacts/turnip-mesa-26.2.2-vk14/arm32/*.sha256
            artifacts/turnip-mesa-26.2.2-vk14-build.log
            artifacts/turnip-vk14-final-sha256.txt
            artifacts/turnip-vk14-module-list.txt
            artifacts/turnip-vk14-ccache.txt
          if-no-files-found: warn
          retention-days: 14
