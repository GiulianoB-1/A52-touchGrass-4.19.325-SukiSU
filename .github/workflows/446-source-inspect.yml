name: Phase446 source inspect
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/446-source-inspect.yml]
env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore reconstructed GKI tree
        id: p429
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase429-gki-out
          key: a52xq-phase429-reconstructed-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9
      - name: Exact Phase446 safety and takeover source
        run: |
          ROOT="$PWD/gki/common"
          echo "cache-hit=${{ steps.p429.outputs.cache-hit }}"
          echo '=== CLK_OFF / BRANCH STATUS CONTRACT ==='
          grep -Rns -A35 -B15 -E '#define.*CLK_OFF|CLK_OFF|clk_branch.*is_enabled|clk_branch2.*is_enabled' "$ROOT/drivers/clk/qcom" "$ROOT/include" 2>/dev/null | head -1200 || true
          echo '=== DISPLAY GDSC REFERENCES ==='
          grep -Rns -A40 -B20 -Ei 'mdss.*gdsc|gdsc.*mdss|display.*gdsc|sde.*gdsc|gdscr'             "$ROOT/arch/arm64/boot/dts/qcom/lagoon"*             "$ROOT/drivers/a52_display/msm" "$ROOT/drivers/regulator" "$ROOT/drivers/clk/qcom" 2>/dev/null | head -2400 || true
          echo '=== EXACT SDE POWER RESOURCE INIT ==='
          sed -n '180,430p' "$ROOT/drivers/a52_display/msm/sde_power_handle.c" 2>/dev/null || true
          echo '=== EXACT SDE KMS MMU / HW INIT SYMBOLS ==='
          grep -n -A130 -B50 -E '_sde_kms_mmu_init|static int sde_kms_hw_init|sde_kms_hw_init\(|sde_vbif|sde_rsc|irq_preinstall|cont_splash_config'             "$ROOT/drivers/a52_display/msm/sde/sde_kms.c" 2>/dev/null | head -3200 || true
          echo '=== PP AUTOREFRESH / LINE REG OFFSETS ==='
          grep -Rns -A50 -B20 -E 'AUTOREFRESH|AUTO_REFRESH|LINE_COUNT|TEAR.*COUNT'             "$ROOT/drivers/a52_display/msm/sde" 2>/dev/null | head -2200 || true
          echo '=== VBIF HALT/PENDING OFFSETS ==='
          grep -Rns -A45 -B20 -Ei 'xin.*halt|halt.*xin|pending|pnd'             "$ROOT/drivers/a52_display/msm/sde" 2>/dev/null | head -2200 || true
          echo '=== SDE DRM BIND CALL ORDER ==='
          sed -n '1000,1205p' "$ROOT/drivers/a52_display/msm/msm_drv.c" 2>/dev/null || true
