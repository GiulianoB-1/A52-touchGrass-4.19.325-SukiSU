# Status probe generation 8: Phase 226 final-manifest rebuild
name: 226 - Report builder status

run-name: Report Phase 226 builder status

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase226-odsign-gate-v1
    paths:
      - .github/workflows/226-status-probe.yml

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-22.04
    steps:
      - name: Report latest Phase 226 target run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW_ID: '325785868'
          TARGET_REF: agent/a52-phase226-odsign-gate-v1
          TARGET_PR: '127'
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW_ID}/runs?branch=${TARGET_REF}&per_page=10"
          response="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          count="$(jq -r '.total_count' <<<"$response")"
          if [[ "$count" == 0 ]]; then
            body='Phase 226 status probe: no target builder run is currently visible for `agent/a52-phase226-odsign-gate-v1`.'
          else
            run_id="$(jq -r '.workflow_runs[0].id' <<<"$response")"
            run_url="$(jq -r '.workflow_runs[0].html_url' <<<"$response")"
            event="$(jq -r '.workflow_runs[0].event' <<<"$response")"
            status="$(jq -r '.workflow_runs[0].status' <<<"$response")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // "pending"' <<<"$response")"
            head_sha="$(jq -r '.workflow_runs[0].head_sha' <<<"$response")"
            name="$(jq -r '.workflow_runs[0].name' <<<"$response")"
            body="Direct Phase 226 status probe:\n\n- Workflow: \`${name}\`\n- Run: [${run_id}](${run_url})\n- Event: \`${event}\`\n- Status: \`${status}\`\n- Conclusion: \`${conclusion}\`\n- Head: \`${head_sha}\`"
          fi
          jq -n --arg body "$body" '{body:$body}' > comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            --data-binary @comment.json
