name: Phase345 - DMA us
run-name: Phase345 - DMA us frontier

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase345-dma-us-v1
    paths:
      - .github/workflows/345-a52-dma-us.yml
      - scripts/345_apply_dma_us_frontier.py
      - scripts/345_ci_build_gki.sh

permissions:
  contents: read
  actions: read

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE319_GOOD_HEAD: e466f29c784001b5f933091298162714a9181b8d

concurrency:
  group: a52-phase345-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase345 DMA us
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase345 runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves

          python3 -m py_compile \
            scripts/319_apply_dsi_sixpoint_temporal_observer.py \
            scripts/328_apply_full_touchgrass_display_clock_port.py \
            scripts/329_apply_dsi_debugbus_selector_readback.py \
            scripts/330_apply_dsi_early_breadcrumb_recorder.py \
            scripts/331_apply_post_retention_frontier_recorder.py \
            scripts/332_apply_persistent_timeout_frontier_recorder.py \
            scripts/335_apply_qsmmuv500_sacr_cache_lock_parity.py \
            scripts/336_apply_qsmmuv500_hf0_tbu_state_recorder.py \
            scripts/337_apply_atomic_check_stage_probe.py \
            scripts/338_apply_atomic_latch_pre_retention_snapshot.py \
            scripts/339_apply_warm_reboot_preservation_probe.py \
            scripts/340_apply_post12_runtime_discriminator.py \
            scripts/341_apply_hardirq_timer_frontier.py \
            scripts/342_apply_busyloop_counter_frontier.py \
            scripts/343_apply_instruction_counter_frontier.py \
            scripts/345_apply_dma_us_frontier.py

          bash -n \
            scripts/319_ci_build_gki.sh \
            scripts/328_ci_build_gki.sh \
            scripts/329_ci_build_gki.sh \
            scripts/330_ci_build_gki.sh \
            scripts/331_ci_build_gki.sh \
            scripts/332_ci_build_gki.sh \
            scripts/335_ci_build_gki.sh \
            scripts/336_ci_build_gki.sh \
            scripts/337_ci_build_gki.sh \
            scripts/338_ci_build_gki.sh \
            scripts/339_ci_build_gki.sh \
            scripts/340_ci_build_gki.sh \
            scripts/341_ci_build_gki.sh \
            scripts/342_ci_build_gki.sh \
            scripts/343_ci_build_gki.sh \
            scripts/345_ci_build_gki.sh \
            scripts/337_reconstruct_phase206_artifact_free.sh \
            scripts/319_regenerate_phase175_base.sh \
            scripts/319_reconstruct_phase206_from_verified_artifact.sh

      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD
      - name: Build
        run: bash scripts/345_ci_build_gki.sh
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE345-DMA-US-${{ github.run_number }}
          path: phase345-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Upload boot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE345-DMA-US-${{ github.run_number }}-BOOT-IMG
          path: phase345-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE345-DMA-US-${{ github.run_number }}-FAILED
          path: phase345-gki-failure/
          if-no-files-found: warn
          retention-days: 30
