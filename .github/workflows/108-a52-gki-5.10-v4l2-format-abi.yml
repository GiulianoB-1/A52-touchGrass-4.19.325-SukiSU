name: 108 - A52 GKI 5.10 V4L2 format ABI

run-name: Restore downstream SDE rotator pixel-format ABI on Android 5.10

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/108-a52-gki-5.10-v4l2-format-abi.yml'
      - 'scripts/108_apply_a52xq_v4l2_format_abi.py'
      - 'scripts/107_apply_a52xq_clk_div_debugfs.py'
      - 'scripts/106_apply_a52xq_prfmt_pm_qos.py'
      - 'scripts/105_apply_a52xq_display_contract.py'
      - 'scripts/104_apply_a52xq_phase2_kernel_api.py'
      - 'scripts/103_apply_a52xq_phase1_compat.py'
      - 'scripts/a52xq_downstream_port_probe_v3.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-gki-5.10-v4l2-format-abi-${{ github.ref }}
  cancel-in-progress: false

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_SHA: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  WORKFLOW99_ARTIFACT_ID: '8590238316'
  WORKFLOW100_ARTIFACT_ID: '8591698036'
  WORKFLOW107_ARTIFACT_ID: '8601965001'

jobs:
  v4l2-format-abi:
    name: Port SDE rotator format and device-type ABI
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves device-tree-compiler
          python3 -m py_compile \
            scripts/a52xq_downstream_port_probe_v3.py \
            scripts/103_apply_a52xq_phase1_compat.py \
            scripts/104_apply_a52xq_phase2_kernel_api.py \
            scripts/105_apply_a52xq_display_contract.py \
            scripts/106_apply_a52xq_prfmt_pm_qos.py \
            scripts/107_apply_a52xq_clk_div_debugfs.py \
            scripts/108_apply_a52xq_v4l2_format_abi.py

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Download verified baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          download() {
            local name="$1" id="$2"
            mkdir -p "${name}/extracted"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "${name}/artifact.zip"
            unzip -q "${name}/artifact.zip" -d "${name}/extracted"
            (cd "${name}/extracted" && sha256sum -c SHA256SUMS)
          }
          download workflow99 "${WORKFLOW99_ARTIFACT_ID}"
          download workflow100 "${WORKFLOW100_ARTIFACT_ID}"
          download workflow107 "${WORKFLOW107_ARTIFACT_ID}"
          test -s workflow99/extracted/full-integrated-rpmh-mode-abi-fix.patch
          test -s workflow100/extracted/preserved.dts
          test -s workflow107/extracted/config/final.config
          grep -Fq '"compiler_error_count": 288' workflow107/extracted/final-state.json
          grep -Fq '"target_closed": true' workflow107/extracted/final-state.json

      - name: Replay hardware-tested Workflow 99 source
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          git -C gki/common reset --hard "${GKI_COMMON_SHA}"
          git -C gki/common clean -fd
          PATCH="$PWD/workflow99/extracted/full-integrated-rpmh-mode-abi-fix.patch"
          git -C gki/common apply --check "$PATCH"
          git -C gki/common apply "$PATCH"

      - name: Fetch exact working TouchGrass source
        run: |
          set -Eeuo pipefail
          rm -rf touchgrass
          git init touchgrass
          git -C touchgrass remote add origin https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
          git -C touchgrass fetch --depth=1 origin "${TOUCHGRASS_SHA}"
          git -C touchgrass checkout --detach FETCH_HEAD
          test "$(git -C touchgrass rev-parse HEAD)" = "${TOUCHGRASS_SHA}"

      - name: Recreate closed Workflow 107 baseline
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-v4l2-format-abi
          mkdir -p "$OUT/logs" "$OUT/stage" "$OUT/config" "$OUT/compile"
          python3 scripts/a52xq_downstream_port_probe_v3.py \
            --touchgrass touchgrass --gki gki/common \
            --dts workflow100/extracted/preserved.dts --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/stage-port.log"
          python3 scripts/103_apply_a52xq_phase1_compat.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/phase1-stage.log"
          python3 scripts/104_apply_a52xq_phase2_kernel_api.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/phase2-stage.log"
          python3 scripts/105_apply_a52xq_display_contract.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/display-contract-stage.log"
          python3 scripts/106_apply_a52xq_prfmt_pm_qos.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/prfmt-pm-qos-stage.log"
          python3 scripts/107_apply_a52xq_clk_div_debugfs.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/clk-div-debugfs-stage.log"

      - name: Apply V4L2 format ABI migration
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-v4l2-format-abi
          python3 scripts/108_apply_a52xq_v4l2_format_abi.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/v4l2-format-abi-stage.log"
          test -s "$OUT/stage/phase6-v4l2-format-abi-report.json"
          grep -Fq 'phase6-v4l2-format-abi-staged' \
            "$OUT/stage/phase6-v4l2-format-abi-report.json"

      - name: Resolve migrated configuration
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-5.10-v4l2-format-abi"
          BUILD="$PWD/workspace/gki-v4l2-format-abi-out"
          mkdir -p "$BUILD"
          cp workflow107/extracted/config/final.config "$BUILD/.config"
          cp "$BUILD/.config" "$OUT/config/before.config"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$OUT/logs/olddefconfig.log"
          cp "$BUILD/.config" "$OUT/config/final.config"

      - name: Compile migrated downstream tree
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-5.10-v4l2-format-abi"
          BUILD="$PWD/workspace/gki-v4l2-format-abi-out"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          "$CLANG" --version | tee "$OUT/logs/toolchain.log"
          set +e
          make -k -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
            KCFLAGS=-Wno-error=frame-larger-than Image > "$OUT/logs/port-compile.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/compile/make-return-code.txt"
          if test -s "$BUILD/arch/arm64/boot/Image"; then
            cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image-NON-FLASHABLE"
          fi

      - name: Measure Workflow 108 closure
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import collections
          import json
          import re
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-5.10-v4l2-format-abi')
          baseline = json.loads(
              Path('workflow107/extracted/compile/compile-incompatibilities.json').read_text()
          )
          compiler = re.compile(
              r'^(?P<file>[^:\s][^:]*):(?P<line>\d+):(?P<column>\d+): '
              r'(?P<kind>fatal error|error): (?P<message>.*)$'
          )
          target = re.compile(
              r"use of undeclared identifier "
              r"'(?:V4L2_PIX_FMT_[A-Z0-9_]+|VFL_TYPE_GRABBER)'"
          )

          def subsystem(path):
              if 'drivers/gpu/msm/' in path:
                  return 'display-kgsl'
              if 'drivers/a52_display/' in path or 'techpack/display/' in path:
                  return 'display-sde-dsi-panel'
              if 'drivers/a52_secure/' in path:
                  return 'secure-qseecom'
              return 'kernel-integration'

          entries = []
          signatures = collections.Counter()
          subsystems = collections.Counter()
          residual = collections.Counter()
          for line in (root / 'logs/port-compile.log').read_text(
              errors='replace'
          ).splitlines():
              match = compiler.match(line)
              if not match:
                  continue
              item = match.groupdict()
              item['subsystem'] = subsystem(item['file'])
              entries.append(item)
              signatures[(item['subsystem'], item['message'])] += 1
              subsystems[item['subsystem']] += 1
              if target.search(item['message']):
                  residual[item['message']] += 1

          baseline_target = sum(
              1 for item in baseline['entries'] if target.search(item['message'])
          )
          unique = [
              {'subsystem': key[0], 'message': key[1], 'count': value}
              for key, value in signatures.most_common()
          ]
          result = {
              'status': 'v4l2-format-abi-compile-complete',
              'flashable': False,
              'hardware_validated': False,
              'make_return_code': int(
                  (root / 'compile/make-return-code.txt').read_text()
              ),
              'baseline_compiler_error_count': baseline['compiler_error_count'],
              'compiler_error_count': len(entries),
              'error_reduction': baseline['compiler_error_count'] - len(entries),
              'baseline_target_error_count': baseline_target,
              'residual_target_error_count': sum(residual.values()),
              'target_error_reduction': baseline_target - sum(residual.values()),
              'target_closed': not residual,
              'residual_target_signatures': dict(residual.most_common()),
              'unique_error_signature_count': len(unique),
              'subsystem_counts': dict(subsystems),
              'unique_signatures': unique,
              'entries': entries[:1800],
          }
          (root / 'compile/compile-incompatibilities.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          md = [
              '# A52 Workflow 108 V4L2 format ABI result',
              '',
              f"- Workflow 107 errors: **{baseline['compiler_error_count']}**",
              f"- Remaining errors: **{len(entries)}**",
              f"- Total error reduction: **{result['error_reduction']}**",
              f"- Targeted baseline errors: **{baseline_target}**",
              f"- Targeted residual errors: **{result['residual_target_error_count']}**",
              f"- Target closed: **{result['target_closed']}**",
              '',
              '## Remaining errors by subsystem',
              '',
          ]
          md += [f'- `{key}`: {value}' for key, value in subsystems.most_common()]
          md += ['', '## Highest-frequency remaining incompatibilities', '']
          md += [
              f"- `{item['subsystem']}` x{item['count']}: {item['message']}"
              for item in unique[:140]
          ]
          (root / 'compile/WORKFLOW-108-RESULT.md').write_text(
              '\n'.join(md) + '\n'
          )
          PY

      - name: Finalize Workflow 108 artifact
        if: always()
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-v4l2-format-abi
          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 5G GKI 5.10 V4L2 FORMAT ABI MIGRATION

          This artifact is non-flashable and not hardware validated.
          Workflow 99 remains the hardware-tested storage baseline.
          Workflow 108 imports the exact downstream SDE and Qualcomm pixel-format
          FOURCC definitions used by the rotator and maps the removed legacy
          VFL_TYPE_GRABBER device type to Android 5.10 VFL_TYPE_VIDEO.

          This workflow does not validate userspace rotator operation and does not
          yet migrate generic clock flags, IOMMU, DMA cache or remaining DRM APIs.
          Do not flash this artifact.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/a52xq-gki-5.10-v4l2-format-abi')
          report = root / 'compile/compile-incompatibilities.json'
          if report.is_file():
              r = json.loads(report.read_text())
              final = {
                  'status': 'v4l2-format-abi-migration-complete',
                  'flashable': False,
                  'hardware_validated': False,
                  'workflow99_baseline_preserved': True,
                  'compiler_error_count': r['compiler_error_count'],
                  'error_reduction': r['error_reduction'],
                  'baseline_target_error_count': r['baseline_target_error_count'],
                  'residual_target_error_count': r['residual_target_error_count'],
                  'target_closed': r['target_closed'],
              }
          else:
              final = {
                  'status': 'v4l2-format-abi-staging-failed',
                  'flashable': False,
                  'hardware_validated': False,
                  'workflow99_baseline_preserved': True,
              }
          (root / 'final-state.json').write_text(
              json.dumps(final, indent=2, sort_keys=True) + '\n'
          )
          PY
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload Workflow 108 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-gki-5.10-v4l2-format-abi-${{ github.run_number }}-NON-FLASHABLE
          path: artifacts/a52xq-gki-5.10-v4l2-format-abi
          if-no-files-found: error
          retention-days: 14

      - name: Require targeted closure and net progress
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path(
                  'artifacts/a52xq-gki-5.10-v4l2-format-abi/final-state.json'
              ).read_text()
          )
          if not state.get('target_closed', False):
              raise SystemExit(
                  f"Workflow 108 still has "
                  f"{state.get('residual_target_error_count', 'unknown')} targeted errors"
              )
          if state.get('baseline_target_error_count') != 70:
              raise SystemExit(
                  f"Workflow 108 expected 70 targeted baseline errors, found "
                  f"{state.get('baseline_target_error_count', 'unknown')}"
              )
          if state.get('error_reduction', 0) <= 0:
              raise SystemExit(
                  f"Workflow 108 did not reduce total compiler errors: "
                  f"{state.get('compiler_error_count', 'unknown')} remain"
              )
          PY
