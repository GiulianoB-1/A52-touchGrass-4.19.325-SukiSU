name: Phase445 PLL helper inspect
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PLL helper patch
        run: |
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          s=zlib.decompress(base64.b64decode(Path("scripts/445_apply_recovery_ladder.py.z64").read_text().strip())).decode()
          lines=s.splitlines()
          for needle in ("def pll_10nm_path","def patch_pll","a52_p445_pll10_snapshot"):
              for i,l in enumerate(lines):
                  if needle in l:
                      print("\n###",needle,"line",i+1)
                      for j in range(max(0,i-35),min(len(lines),i+150)):
                          print(f"{j+1:04d}: {lines[j]}")
                      break
          PY
