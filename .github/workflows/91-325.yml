          python3 scripts/88_apply_f2fs_segment_age_accounting.py workspace/touchgrass-a52xq

          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'static void update_segment_mtime(struct f2fs_sb_info *sbi, block_t blkaddr)' "$KERNEL/fs/f2fs/segment.c"
          grep -Fq 'se->mtime = div_u64(se->mtime * se->valid_blocks + mtime,' "$KERNEL/fs/f2fs/segment.c"
          grep -Fq 'update_segment_mtime(sbi, blkaddr);' "$KERNEL/fs/f2fs/segment.c"
          python3 - "$KERNEL/fs/f2fs/segment.c" <<'PY'
          from pathlib import Path
          import sys
          s = Path(sys.argv[1]).read_text()
          old = """\tse->valid_blocks = new_vblocks;
          \tse->mtime = get_mtime(sbi, false);
          \tif (se->mtime > SIT_I(sbi)->max_mtime)
          \t\tSIT_I(sbi)->max_mtime = se->mtime;
          """
          if old in s:
              raise SystemExit('old last-write-wins segment mtime block is still present')
          PY

          # This first foundation must not enable ATGC yet.
          ! grep -Fq 'struct atgc_management' "$KERNEL/fs/f2fs/f2fs.h"
          ! grep -Fq 'CURSEG_ALL_DATA_ATGC' "$KERNEL/fs/f2fs/f2fs.h"
          ! grep -Fq 'Opt_atgc' "$KERNEL/fs/f2fs/super.c"

