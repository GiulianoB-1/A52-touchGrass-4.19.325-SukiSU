name: Phase414 - sequential 2MiB Samsung + 1MiB RAM recorder
run-name: Phase414 - sequential 2MiB Samsung + 1MiB RAM recorder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase378-gki-ufs-completion-flight-recorder-v1
    paths:
      - .github/workflows/414-a52-sequential-3m-recorder.yml
      - .github/workflows/411-a52-fifo-panic-smmu.yml
      - .github/workflows/409-a52-ram1m-debug2m-dsi.yml
      - .github/workflows/408-a52-direct-bio-samsung-dsi.yml
      - .github/workflows/407-a52-samsung-debug-dsi.yml
      - .github/workflows/406-a52-persistent-memory-dma.yml
      - .github/workflows/405-a52-stable-memory-dma.yml
      - .github/workflows/403-a52-dsi-nohlt-retire-ufs-sampler.yml
      - .github/workflows/402-a52-dsi-nohlt-clean.yml
      - scripts/402_apply_dsi_nohlt_cleanup.py
      - scripts/403_apply_retire_phase380_ufs_sampler.py
      - scripts/405_apply_dma_done_direct.py
      - scripts/406_apply_p392_cache_persist.py
      - scripts/407_apply_samsung_debug_dsi.py
      - scripts/408_apply_direct_bio_debug_dsi.py
      - scripts/409_apply_ram1m_debug2m_dsi.py
      - scripts/411_apply_fifo_panic_smmu_experiment.py
      - scripts/413_apply_concurrent_debug2m_mirror.py
      - scripts/414_apply_sequential_3m_recorder.py
      - scripts/decode_phase414_sequential_3m.py
      - scripts/decode_phase409_ram1m_debug2m.py
      - scripts/decode_phase408_samsung_debug_dsi.py
      - scripts/decode_phase407_samsung_debug_dsi.py
      - scripts/decode_phase405_dma_done.py
      - scripts/397_apply_downstream_bus_votes.py
      - scripts/38_repack_a52_p1_boot.py
      - .github/workflows/394-a52-mode-fixup-fifo-early.yml

permissions:
  contents: read

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd

concurrency:
  group: a52-phase414-sequential-3m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase414 sequential 3MiB recorder
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ python3 bc bison flex clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves
          python3 -m py_compile \
            scripts/397_apply_downstream_bus_votes.py \
            scripts/402_apply_dsi_nohlt_cleanup.py \
            scripts/403_apply_retire_phase380_ufs_sampler.py \
            scripts/405_apply_dma_done_direct.py \
            scripts/406_apply_p392_cache_persist.py \
            scripts/407_apply_samsung_debug_dsi.py \
            scripts/408_apply_direct_bio_debug_dsi.py \
            scripts/409_apply_ram1m_debug2m_dsi.py \
            scripts/411_apply_fifo_panic_smmu_experiment.py \
            scripts/413_apply_concurrent_debug2m_mirror.py \
            scripts/414_apply_sequential_3m_recorder.py \
            scripts/decode_phase414_sequential_3m.py \
            scripts/decode_phase409_ram1m_debug2m.py \
            scripts/decode_phase408_samsung_debug_dsi.py \
            scripts/decode_phase407_samsung_debug_dsi.py \
            scripts/decode_phase405_dma_done.py \
            scripts/38_repack_a52_p1_boot.py

      - name: Restore exact Phase357 baseline
        id: phase357-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase357-gki-out
          key: a52xq-phase357-baseline-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/357_ci_build_gki.sh', 'scripts/357_apply_init_exit_cause.py') }}

      - name: Validate Phase357 cache
        run: |
          set -Eeuo pipefail
          test "${{ steps.phase357-cache.outputs.cache-hit }}" = "true"
          test -d gki/common
          test -s workspace/gki-phase199-out/arch/arm64/boot/Image
          test -s phase357-gki-out/package/boot.img
          test -s phase357-gki-out/config/final.config

      - name: Reapply Phase358 and Phase359
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT"
          python3 scripts/358_apply_pid1_syscall_trace.py --root "$ROOT" --check-only
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT"
          python3 scripts/359_apply_pid1_writev_payload.py --root "$ROOT" --check-only

      - name: Build Phase394 DSI lineage plus Phase397 contracts and Phase402 cleanup
        run: |
          set -Eeuo pipefail

          ROOT="$PWD/gki/common"
          {
            echo "=== inherited UFS compatibility audit ==="
            for spec in \
              "PINCTRL_BYPASS|$ROOT/drivers/base/dd.c|A52_UFS_PINCTRL_DEFER_BYPASS" \
              "RPMH_MODE_ABI|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|A52RPMHABI copy=1" \
              "RPMH_DOWNSTREAM_PROVIDER|$ROOT/drivers/regulator/a52-rpmh-regulator-downstream.c|qcom,rpmh-vrm-regulator" \
              "UFS_ICE_SAFE|$ROOT/drivers/scsi/ufs/ufs-qcom-ice.c|A52_UFS_ICE_SAFE_BRINGUP" \
              "LEGACY_UFS_GDSC|$ROOT/drivers/regulator/a52-legacy-gdsc-regulator.c|gcc_ufs_phy_gdsc"; do
              IFS='|' read -r name file marker <<< "$spec"
              if [ -f "$file" ] && grep -Fq "$marker" "$file"; then
                echo "$name=present"
              else
                echo "$name=absent"
              fi
            done
          } | tee phase377-inherited-ufs-audit.txt

          python3 - <<'PY'
          from pathlib import Path

          src = Path(".github/workflows/394-a52-mode-fixup-fifo-early.yml").read_text().splitlines()
          start = next(i for i,l in enumerate(src)
                       if l.strip() == "- name: Apply Phase360 through Phase394 and compile")
          runline = next(i for i in range(start + 1, len(src))
                         if src[i].strip() == "run: |")
          end = next(i for i in range(runline + 1, len(src))
                     if src[i].startswith("      - name:"))
          body = [
              line[10:] if line.startswith("          ") else line
              for line in src[runline + 1:end]
          ]
          script = "\n".join(body) + "\n"

          needle = 'python3 scripts/394_apply_mode_fixup_fifo_early.py --root "$ROOT" --check-only\n'
          insert = needle + (
              'python3 scripts/402_apply_dsi_nohlt_cleanup.py --root "$ROOT"\n'
              'python3 scripts/402_apply_dsi_nohlt_cleanup.py --root "$ROOT" --check-only\n'
              'python3 scripts/403_apply_retire_phase380_ufs_sampler.py --root "$ROOT"\n'
              'python3 scripts/403_apply_retire_phase380_ufs_sampler.py --root "$ROOT" --check-only\n'
              'python3 scripts/405_apply_dma_done_direct.py --root "$ROOT"\n'
              'python3 scripts/405_apply_dma_done_direct.py --root "$ROOT" --check-only\n'
              'python3 scripts/406_apply_p392_cache_persist.py --root "$ROOT"\n'
              'python3 scripts/406_apply_p392_cache_persist.py --root "$ROOT" --check-only\n'
              'python3 scripts/407_apply_samsung_debug_dsi.py --root "$ROOT"\n'
              'python3 scripts/407_apply_samsung_debug_dsi.py --root "$ROOT" --check-only\n'
              'python3 scripts/408_apply_direct_bio_debug_dsi.py --root "$ROOT"\n'
              'python3 scripts/408_apply_direct_bio_debug_dsi.py --root "$ROOT" --check-only\n'
              'python3 scripts/409_apply_ram1m_debug2m_dsi.py --root "$ROOT"\n'
              'python3 scripts/409_apply_ram1m_debug2m_dsi.py --root "$ROOT" --check-only\n'
              'python3 scripts/411_apply_fifo_panic_smmu_experiment.py --root "$ROOT"\n'
              'python3 scripts/411_apply_fifo_panic_smmu_experiment.py --root "$ROOT" --check-only\n'
              'python3 scripts/413_apply_concurrent_debug2m_mirror.py --root "$ROOT"\n'
              'python3 scripts/413_apply_concurrent_debug2m_mirror.py --root "$ROOT" --check-only\n'
              'python3 scripts/414_apply_sequential_3m_recorder.py --root "$ROOT"\n'
              'python3 scripts/414_apply_sequential_3m_recorder.py --root "$ROOT" --check-only\n'
          )
          if needle not in script:
              raise SystemExit("Phase402 Phase394 insertion anchor missing")
          script = script.replace(needle, insert, 1)

          cfg = '"$ROOT/scripts/config" --file "$BUILD/.config" --set-val LOG_BUF_SHIFT 19\n'
          if cfg not in script:
              raise SystemExit("Phase402 config anchor missing")
          script = script.replace(
              cfg,
              cfg + '"$ROOT/scripts/config" --file "$BUILD/.config" --enable GENERIC_IDLE_POLL_SETUP\n',
              1)

          script = script.replace("phase394-gki-out", "phase414-gki-out")
          script = script.replace("PHASE394-SCHEMA.txt", "PHASE414-SCHEMA.txt")
          script = script.replace("'phase':'394'", "'phase':'414'")
          script = script.replace(
              "'name':'MODE-FIXUP-FIFO-EARLY-V1'",
              "'name':'SEQUENTIAL-3M-RECORDER-V1'")
          script = script.replace(
              "'392','393','394']",
              "'392','393','394','397','402','403','405','406','407','408','409','411','413','414']")

          # Phase394's inherited audits intentionally require every old observer
          # to remain linked. Phase402 retires those observers. Keep only Image
          # existence here; dedicated Phase402 audits follow after the generated
          # build script.
          pre_start = 'IMAGE="$BUILD/arch/arm64/boot/Image"\ntest -s "$IMAGE"\n'
          package_start = 'rm -rf "$OUT"\n'
          ps = script.find(pre_start)
          pe = script.find(package_start, ps + len(pre_start))
          if ps < 0 or pe < 0:
              raise SystemExit("Phase402 legacy audit boundaries missing")
          script = (
              script[:ps + len(pre_start)] +
              'echo "Phase402: legacy broad-probe compiled audits retired"\n' +
              script[pe:]
          )

          Path("/tmp/phase402-build.sh").write_text("set -Eeuo pipefail\n" + script)
          PY

          bash /tmp/phase402-build.sh

          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          OUT="$PWD/phase414-gki-out"
          IMAGE="$BUILD/arch/arm64/boot/Image"
          REC="$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          DSI="$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c"
          DSIHW="$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c"
          DSIDISPLAY="$ROOT/drivers/a52_display/msm/dsi/dsi_display.c"
          DSIPANEL="$ROOT/drivers/a52_display/msm/dsi/dsi_panel.c"
          SSPANEL="$ROOT/drivers/a52_display/msm/samsung/ss_dsi_panel_common.c"
          MSMSMMU="$ROOT/drivers/a52_display/msm/msm_smmu.c"
          ARMSMMU="$ROOT/drivers/iommu/arm/arm-smmu/arm-smmu.c"
          IRQH="$ROOT/kernel/irq/handle.c"
          UFS="$ROOT/drivers/scsi/ufs/ufs-qcom.c"
          UFSCORE="$ROOT/drivers/scsi/ufs/ufshcd.c"
          USB="$ROOT/drivers/usb/dwc3/dwc3-qcom.c"

          echo "Phase414 sequential 3MiB recorder audit"
          test -s "$IMAGE"
          grep -Fxq 'CONFIG_GENERIC_IDLE_POLL_SETUP=y' "$BUILD/.config"
          grep -Fq 'A52_PHASE403_RETIRE_PHASE380_UFS_SAMPLER_V1' "$UFSCORE"
          ! grep -Fq 'a52_r380_start_sampler(hba);' "$UFSCORE"

          # Functional treatment remains Phase411 FIFO<=64.
          grep -Fq 'A52_PHASE411_FIFO_PANIC_SMMU_EXPERIMENT_V1' "$DSI"
          grep -Fq '(cmd_len + 4) <= DSI_CTRL_MAX_CMD_FIFO_STORE_SIZE' "$DSI"
          grep -Fq '*flags |= DSI_CTRL_CMD_FIFO_STORE' "$DSI"
          grep -Fq 'a52_p411_timeout_panic(dsi_ctrl);' "$DSI"

          # Phase414 owns the Samsung +0x800000 region. Old Phase413 mirror is dead.
          grep -Fq 'A52_PHASE414_SEQUENTIAL_3M_RECORDER_V1' "$REC"
          grep -Fq 'A52_P414_DEBUG_OFFSET        0x00800000ULL' "$REC"
          grep -Fq 'A52_P414_DISK_BYTES          (2U * SZ_1M)' "$REC"
          grep -Fq 'A52_P414_RAM_PHYS            0xB1A00000ULL' "$REC"
          grep -Fq 'A52_P414_RAM_BYTES           SZ_1M' "$REC"
          grep -Fq 'A52_P414_RECORD_BYTES        128U' "$REC"
          grep -Fq 'a52_p414_disk_count < A52_P414_DISK_CAPACITY' "$REC"
          grep -Fq 'a52_p414_ram_count < A52_P414_RAM_CAPACITY' "$REC"
          grep -Fq 'A52_P414_STATE_FULL' "$REC"
          grep -Fq 'a52_p414_submit_page' "$REC"
          grep -Fq 'system_unbound_wq' "$REC"
          grep -Fq 'P414 BOOT id=%llu disk=%u ram=%u' "$REC"
          grep -Fq 'return !strncmp(message, "P414 ", 5) ||' "$REC"
          grep -Fq 'strncmp(fmt, "P414", 4)' "$REC"

          # B1900000 legacy backend is limited to its lower MiB; B1A is Phase414.
          grep -Fq '#define A52_P392_BYTES' "$REC"
          grep -Fq 'SZ_1M /* Phase414 leaves B1A00000 free */' "$REC"

          # No whole-image CRC was added to the new recorder.
          ! grep -Fq 'a52_p414_crc' "$REC"

          # Generic pre-F0 command chronology plus explicit exact-F0 flags.
          grep -Fq 'static atomic_t a52_p414_host_seq' "$DSI"
          grep -Fq 'if (n > 128U)' "$DSI"
          grep -Fq 'P414 H n=%u c=%d t=%x l=%u f=%x m=%x p=%llx' "$DSI"
          grep -Fq 'P414 F0 pre f=%x' "$DSI"
          grep -Fq 'P414 F0 post f=%x' "$DSI"
          ! grep -Fq 'a52_p413_persist_bootstrap();' "$DSI"
          ! grep -Fq 'a52_p413_persist_mode_event(11U' "$DSI"
          ! grep -Fq 'a52_p409_init_buffers();' "$DSI"
          ! grep -Fq 'static atomic_t a52_p413_mirror_gen' "$DSIHW"

          for token in \
            'P414 LIFE dsi_display_register' \
            'P414 LIFE dsi_display_dev_probe' \
            'P414 LIFE dsi_display_init' \
            'P414 LIFE dsi_display_bind' \
            'P414 LIFE dsi_panel_get' \
            'P414 LIFE dsi_panel_drv_init'; do
            grep -aFq "$token" "$IMAGE" || {
              echo "ERROR: missing Phase414 Image token: $token" >&2; exit 1;
            }
          done

          # Existing SMMU/bus contracts and R48 lineage remain.
          grep -Fq 'A52P411 SMMU_CTX' "$ARMSMMU"
          grep -Fq 'A52_PHASE397_UFS_BUS_VOTE_V1' "$UFS"
          grep -Fq 'A52_PHASE397_USB_BUS_VOTE_V1' "$USB"
          grep -aFq 'P414 BOOT id=%llu disk=%u ram=%u' "$IMAGE"
          grep -aFq 'A52_PHASE414_SEQUENTIAL_3M_RECORDER_V1' "$IMAGE"
          grep -aFq 'RS48' "$IMAGE"
          grep -aFq 'R48' "$IMAGE"
          echo "Phase414 sequential 3MiB recorder audit: PASS"

          cp scripts/397_apply_downstream_bus_votes.py \
             scripts/402_apply_dsi_nohlt_cleanup.py \
             scripts/403_apply_retire_phase380_ufs_sampler.py \
             scripts/405_apply_dma_done_direct.py \
             scripts/406_apply_p392_cache_persist.py \
             scripts/407_apply_samsung_debug_dsi.py \
             scripts/408_apply_direct_bio_debug_dsi.py \
             scripts/409_apply_ram1m_debug2m_dsi.py \
             scripts/411_apply_fifo_panic_smmu_experiment.py \
             scripts/413_apply_concurrent_debug2m_mirror.py \
             scripts/414_apply_sequential_3m_recorder.py \
             scripts/decode_phase414_sequential_3m.py \
             scripts/decode_phase409_ram1m_debug2m.py \
             scripts/decode_phase408_samsung_debug_dsi.py \
             scripts/decode_phase407_samsung_debug_dsi.py \
             scripts/decode_phase405_dma_done.py "$OUT/audit/"
          cp "$REC" "$DSI" "$DSIHW" "$DSIDISPLAY" "$DSIPANEL" "$SSPANEL" "$MSMSMMU" "$ARMSMMU" "$IRQH" "$UFS" "$UFSCORE" "$USB" "$OUT/source/"

          cat > "$OUT/PHASE414-NOTES.txt" <<'EOF'
          Phase414 sequential 3 MiB recorder
          ==================================
          Logical order is fixed and non-wrapping:

            tier 1: Samsung debug +0x800000, 2 MiB
            tier 2: persistent RAM 0xB1A00000, 1 MiB
            then:   STOP

          The first records therefore remain on the Samsung partition. The RAM
          tier is used only after the Samsung 2 MiB logical capacity is full.

          Hot-path behavior
          -----------------
          - Fixed 128-byte records with global monotonic sequence numbers.
          - No Phase414 whole-image CRC.
          - Samsung-bound records are copied to a vmalloc staging image only;
            block I/O occurs on system_unbound_wq.
          - Completed 4 KiB pages are immutable and written directly.
          - The current partial page is copied under the recorder spinlock to a
            bounce page, then written without holding the lock.
          - If the debug block device is not ready, writes retry in background.
          - Reserved-RAM continuation uses B1A00000..B1AFFFFF and explicit cache
            cleaning so it survives the recovery reboot.
          - Existing Phase392 is restricted to B1900000..B19FFFFF.

          Identity and stale-record rejection
          -----------------------------------
          - Header magic + phase=414 + boot_id + global_seq + counts + commit.
          - boot_id is incremented from the persistent B1A header every boot.
          - P414 BOOT carries the same boot_id into R48/RS48.
          - R48/RS48 and its three ramoops transports remain untouched.

          Display frontier
          ----------------
          - Lifecycle entry breadcrumbs cover display registration/probe/bind,
            panel acquisition/driver init, and Samsung early/panel init.
          - First 128 generic DSI transfers record controller, type, length,
            software flags, MIPI flags, and first 8 payload bytes.
          - Exact F0 records flags before and after mode selection.
          - Phase411 FIFO<=64 treatment, timeout panic, SMMU diagnostics, nohlt,
            and cpuidle.off=1 remain unchanged.
          EOF
          sed -i 's/^          //' "$OUT/PHASE414-NOTES.txt"

          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Build Phase414 sequential-3m boot image
        run: |
          set -Eeuo pipefail
          OUT="$PWD/phase414-gki-out"
          BASE="$OUT/package/boot.img"
          FINAL="$OUT/package/boot-phase414-sequential-3m.img"
          test -s "$BASE"
          cp "$BASE" "$FINAL"

          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "a52_boot_repack", "scripts/38_repack_a52_p1_boot.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          base_path = Path("phase414-gki-out/package/boot.img")
          final = Path("phase414-gki-out/package/boot-phase414-sequential-3m.img")
          base = module.parse_boot(base_path.read_bytes())
          data = bytearray(final.read_bytes())
          tokens = base["cmdline"].split()
          for tok in ("nohlt", "cpuidle.off=1", "panic=1"):
              key = tok.split("=", 1)[0]
              tokens = [x for x in tokens if x != tok and x.split("=", 1)[0] != key]
              tokens.append(tok)
          cmdline = " ".join(tokens)
          encoded = cmdline.encode("ascii")
          if len(encoded) > 1534:
              raise SystemExit(f"Phase411 command line too long: {len(encoded)}")
          data[64:576] = b"\0" * 512
          data[608:1632] = b"\0" * 1024
          first = encoded[:511]
          second = encoded[511:]
          data[64:64 + len(first)] = first
          data[608:608 + len(second)] = second
          final.write_bytes(data)

          out = module.parse_boot(final.read_bytes())
          assert "nohlt" in out["cmdline"].split()
          assert "cpuidle.off=1" in out["cmdline"].split()
          assert "panic=1" in out["cmdline"].split()
          assert "ignore_loglevel" in out["cmdline"].split()
          for key in ("header_version","page_size","board","kernel_addr",
                      "ramdisk_addr","tags_addr","kernel","ramdisk","second","dtb"):
              assert out[key] == base[key], key
          assert final.stat().st_size == base_path.stat().st_size
          Path("phase414-gki-out/PHASE414-BOOT.json").write_text(
              json.dumps({
                  "cmdline": out["cmdline"],
                  "treatment": "FIFO<=64 + sequential Samsung2MiB then RAM1MiB recorder + timeout panic; nohlt cpuidle.off=1 panic=1",
                  "kernel_payload_unchanged_by_cmdline_patch": True,
              }, indent=2, sort_keys=True) + "\n")
          PY

          sha256sum "$FINAL"
          echo "Phase414 sequential-3m boot image: PASS"

      - name: Upload Phase414
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE414-SEQUENTIAL-3M-${{ github.run_number }}
          path: phase414-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase414 boot.img
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE414-SEQUENTIAL-3M-${{ github.run_number }}-BOOT-IMG
          path: phase414-gki-out/package/boot-phase414-sequential-3m.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
