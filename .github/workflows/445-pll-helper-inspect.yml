name: Phase446 canonical patch inspect
run-name: Phase446 canonical patch inspect
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Expand and inspect canonical Phase446 patch
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          p=Path("scripts/446_apply_heartbeat_cb2.py.z64")
          s=zlib.decompress(base64.b64decode(p.read_text().strip())).decode()
          Path("/tmp/p446.py").write_text(s)
          print("bytes",len(s))
          for k in [
            "msm_bus_node_device_type *bus_dev",
            "P446_RAM_PHYS","struct p446_rec","a52_p446_note_smmu",
            "F446-08","SSPP","SRC0_ADDR","LAYER_EXT2","lm_op",
            "FRAME_COUNT","A52_PHASE446_BUS_LATE_HANDOFF",
            "A52_PHASE446_CB2_SWITCH"
          ]:
            print("\n====",k,"====")
            pos=0; n=0
            while True:
              i=s.find(k,pos)
              if i<0 or n>=6: break
              print(s[max(0,i-1800):min(len(s),i+4200)])
              pos=i+len(k); n+=1
          PY
