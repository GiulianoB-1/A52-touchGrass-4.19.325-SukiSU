name: 272R - Phase272 regression reference rebuild

run-name: Phase272 regression reference rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase378-gki-ufs-completion-flight-recorder-v1
    paths:
      - .github/workflows/272r-a52-regression-reference-rebuild.yml
permissions:
  contents: read
  actions: read

concurrency:
  group: a52-phase272r-regression-reference-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
  PHASE266_BASE_SHA: b279c8beb1ae4f032a7dfe0c22cd69dbb1756398
  PHASE267_HW_SHA: f1c2f2b7f4430b0bfbc0f4acd7f43adf637edf27

jobs:
  build:
    name: Rebuild Phase272 regression reference
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out Phase272 branch
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves

      - name: Sync pinned GKI source
        run: |
          set -Eeuo pipefail
          rm -rf gki
          mkdir -p gki
          cd gki
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-2026-04 \
            --depth=1
          repo sync -c -j4 --no-tags --fail-fast
          git -C common fetch --depth=1 \
            https://android.googlesource.com/kernel/common \
            refs/tags/android12-5.10-2026-04_r1
          git -C common checkout --detach FETCH_HEAD
          test "$(git -C common rev-parse HEAD)" = "${GKI_COMMON_SHA}"

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Reconstruct, patch, compile and repack Phase272
        run: bash scripts/272_ci_build.sh

      - name: Snapshot Phase272 display regression sources
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          OUT="$PWD/phase272-out/regression-source"
          mkdir -p "$OUT"
          for p in \
            drivers/a52_display/msm/sde/sde_encoder.c \
            drivers/a52_display/msm/sde/sde_connector.c \
            drivers/a52_display/msm/sde/sde_rm.c \
            drivers/a52_display/msm/dsi/dsi_display.c \
            drivers/a52_display/msm/dsi/dsi_drm.c \
            drivers/a52_display/msm/msm_drv.h \
            include/uapi/drm/drm_mode.h; do
            test -s "$ROOT/$p"
            cp "$ROOT/$p" "$OUT/$(basename "$p")"
          done
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS"


      - name: Upload Phase272 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE272R-REGRESSION-REFERENCE-${{ github.run_number }}
          path: phase272-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase272 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase272-FAILURE-DIAGNOSTICS-${{ github.run_number }}
          path: |
            phase272-failure/
            phase271-failure/
            phase270-failure/
            phase269-failure/
            phase268-failure/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
