name: Phase439 - DSI autopsy matrix
run-name: Phase439 - DSI autopsy A/B/C + Golden

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase432-ctrl-cache-run-v1
    paths:
      - .github/workflows/439-a52-dsi-autopsy-matrix.yml
      - scripts/439_apply_dsi_autopsy.py
      - scripts/decode_phase439_dsi.py
      - scripts/439g_apply_golden_dsi_autopsy.py
      - scripts/439g_ci_build_golden.sh

permissions:
  contents: read
  actions: read

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_PATH: /usr/bin:/usr/local/bin

concurrency:
  group: a52-phase439-dsi-autopsy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gki:
    name: Build Phase439${{ matrix.variant }} GKI
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, C]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Phase439 payload
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/437_apply_kgsl_open_corridor.py \
            scripts/438_apply_devbw_semantic_parity.py \
            scripts/439_apply_dsi_autopsy.py \
            scripts/decode_phase439_dsi.py \
            scripts/decode_phase437_open.py
          python3 scripts/437_apply_kgsl_open_corridor.py --help >/dev/null
          python3 scripts/438_apply_devbw_semantic_parity.py --help >/dev/null
          python3 scripts/439_apply_dsi_autopsy.py --help >/dev/null
          python3 scripts/decode_phase439_dsi.py --help >/dev/null
          python3 scripts/decode_phase437_open.py --help >/dev/null
          echo "Phase439 payload: PASS"

      - name: Prepare runner and ccache wrappers
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ python3 bc bison flex clang lld llvm ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves unzip
          mkdir -p "$RUNNER_TEMP/a52-ccache-bin" "$CCACHE_DIR"
          cat > "$RUNNER_TEMP/a52-ccache-bin/clang" <<'EOF'
          #!/bin/sh
          exec ccache /usr/bin/clang "$@"
          EOF
          cat > "$RUNNER_TEMP/a52-ccache-bin/clang++" <<'EOF'
          #!/bin/sh
          exec ccache /usr/bin/clang++ "$@"
          EOF
          chmod +x "$RUNNER_TEMP/a52-ccache-bin/clang" "$RUNNER_TEMP/a52-ccache-bin/clang++"
          echo "$RUNNER_TEMP/a52-ccache-bin" >> "$GITHUB_PATH"

      - name: Restore canonical Phase429 source
        id: source
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            phase429-gki-out
          key: a52xq-phase429-source-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-phase432ctrl-base
          restore-keys: |
            a52xq-phase429-source-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-

      - name: Require cached Phase429 source
        run: |
          set -Eeuo pipefail
          test -d gki/common
          test -s phase429-gki-out/package/boot-phase429-apex-sf-focused-census-v1.img
          test -s phase429-gki-out/config/final.config
          python3 scripts/429_apply_apex_sf_focused_census.py --root "$PWD/gki/common" --check-only
          echo "Phase429 source cache: PASS"

      - name: Restore TouchGrass source
        id: tg
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-source-v3-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone TouchGrass on cache miss
        if: steps.tg.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Restore Phase436 object tree
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: workspace/gki-phase199-out
          key: a52xq-phase439-dsi-${{ matrix.variant }}-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/439_apply_dsi_autopsy.py', 'scripts/438_apply_devbw_semantic_parity.py') }}
          restore-keys: |
            a52xq-phase439-dsi-${{ matrix.variant }}-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-
            a52xq-phase438-devbw-parity-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-
            a52xq-phase437-kgsl-open-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-
            a52xq-phase436-adreno-start-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-
            a52xq-phase435-terminal-race-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-
            a52xq-phase434-clean-f0-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-

      - name: Detect reusable object tree
        id: warm
        run: |
          set -Eeuo pipefail
          BUILD="$PWD/workspace/gki-phase199-out"
          if test -s "$BUILD/.config" && test -s "$BUILD/arch/arm64/boot/Image"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Phase436-compatible object tree: HIT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Phase436-compatible object tree: MISS"
          fi

      - name: Restore rolling clang ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-phase439-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-

      - name: Configure compiler cache
        run: |
          set -Eeuo pipefail
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -z
          ccache -s

      - name: Prepare build directory on object-cache miss
        if: steps.warm.outputs.hit != 'true'
        run: |
          set -Eeuo pipefail
          BUILD="$PWD/workspace/gki-phase199-out"
          mkdir -p "$BUILD"
          cp phase429-gki-out/config/final.config "$BUILD/.config"
          make -C "$PWD/gki/common" O="$BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Reapply Phase430 through Phase432-CTRL
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/430_apply_sf_dma_forensics.py --root "$ROOT"
          python3 scripts/430_postapply_hardening.py --root "$ROOT"
          python3 scripts/431_apply_safe_gap_forensics.py --root "$ROOT"
          python3 scripts/432_apply_sf_hwc_bootanim_chain.py --root "$ROOT"
          python3 scripts/432ctrl_apply_odsign_keymint_qsee_trace.py --root "$ROOT"
          python3 scripts/432ctrl_apply_odsign_keymint_qsee_trace.py --root "$ROOT" --check-only

      - name: Reapply Phase433 performance
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          TG="$PWD/workspace/touchgrass-a52xq"
          python3 scripts/433_apply_cpu_mem_perf.py --root "$ROOT" --touchgrass "$TG"
          "$ROOT/scripts/config" --file "$BUILD/.config" \
            -e ARM_QCOM_CPUFREQ_HW -e CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            -d CPU_FREQ_DEFAULT_GOV_SCHEDUTIL -e CPU_FREQ_GOV_PERFORMANCE \
            -e QCOM_BIMC_BWMON -e DEVFREQ_GOV_QCOM_BW_HWMON \
            -e ARM_MEMLAT_MON -e DEVFREQ_GOV_MEMLAT \
            -e ARM_QCOM_DEVFREQ_FW -e QCOM_DEVFREQ_DEVBW -e DUTVFREQ_SIMPLE_DEV
          make -C "$ROOT" O="$BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 olddefconfig
          python3 scripts/433_apply_cpu_mem_perf.py --root "$ROOT" --check-only

      - name: Reapply Phase434 through Phase436
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/434_apply_clean_f0.py --root "$ROOT"
          python3 scripts/435_apply_terminal_race.py --root "$ROOT" --overlap-report /tmp/p435-overlap.txt
          python3 scripts/436_apply_adreno_start_frontier.py --root "$ROOT" --overlap-report /tmp/p436-overlap.txt
          python3 scripts/434_apply_clean_f0.py --root "$ROOT" --check-only
          python3 scripts/436_apply_adreno_start_frontier.py --root "$ROOT" --check-only --overlap-report /tmp/p436-overlap-check.txt
          echo "Phase436 baseline reconstructed: PASS"

      - name: Apply Phase437 KGSL open corridor
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/437_apply_kgsl_open_corridor.py --root "$ROOT"
          python3 scripts/437_apply_kgsl_open_corridor.py --root "$ROOT" --check-only
          grep -Fq '#define A52_P414_RAM_BYTES           (SZ_1M - SZ_16K - SZ_8K)' "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          grep -Fq '#define A52_P437_PHYS       0xB1AFA000ULL' "$ROOT/drivers/a52_secure/a52_phase437_open.c"
          grep -Fq '#define A52_P436_PHYS       0xB1AFC000ULL' "$ROOT/drivers/a52_secure/a52_phase436_frontier.c"
          ! grep -Fq 'P437_' "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c"
          ! grep -Fq 'P437_' "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c"
          echo "Phase437 source audit: PASS"

      - name: Apply Phase438 DEVBW semantic parity
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"

          python3 scripts/438_apply_devbw_semantic_parity.py --root "$ROOT"
          python3 scripts/438_apply_devbw_semantic_parity.py --root "$ROOT" --check-only

          grep -Fq 'A52_PHASE438_DEVBW_SEMANTIC_PARITY_V1' "$ROOT/drivers/devfreq/devfreq_devbw.c"
          grep -Fq 'if (count <= 0)' "$ROOT/drivers/devfreq/devfreq_devbw.c"
          grep -Fq 'if (count > 0)' "$ROOT/drivers/devfreq/devfreq_devbw.c"
          ! grep -Fq 'A52_PHASE438_DEVBW_SEMANTIC_PARITY_V1' "$ROOT/drivers/devfreq/devfreq.c"
          echo "Phase438 DEVBW source audit: PASS"

      - name: Apply Phase439 DSI autopsy variant
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          V="${{ matrix.variant }}"

          python3 scripts/439_apply_dsi_autopsy.py --root "$ROOT" --variant "$V"
          python3 scripts/439_apply_dsi_autopsy.py --root "$ROOT" --variant "$V" --check-only

          grep -Fq 'A52_PHASE439_DSI_AUTOPSY_V1' "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c"
          grep -Fq 'A52P439 DSI F0 DMA_DONE timeout' "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c"
          grep -Fq 'P439 S i=%u p=%u' "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c"
          if [ "$V" = C ]; then
            grep -Fq 'MIPI_DSI_MSG_USE_LPM' "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c"
          fi
          if [ "$V" = B ]; then
            grep -Fq 'early_unlock pre' "$ROOT/drivers/a52_display/msm/dsi/dsi_display.c"
          fi
          echo "Phase439$V source audit: PASS"

      - name: Incremental compile Phase439${{ matrix.variant }}
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"

          make -C "$ROOT" O="$BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image

          IMAGE="$BUILD/arch/arm64/boot/Image"
          MAP="$BUILD/System.map"
          test -s "$IMAGE"
          test -s "$MAP"

          python3 scripts/437_apply_kgsl_open_corridor.py --root "$ROOT" --check-only
          python3 scripts/438_apply_devbw_semantic_parity.py --root "$ROOT" --check-only
          python3 scripts/439_apply_dsi_autopsy.py --root "$ROOT" --variant "${{ matrix.variant }}" --check-only
          grep -aFq 'A52_PHASE437_KGSL_OPEN_CORRIDOR_V1' "$IMAGE"
          grep -aFq 'A52_PHASE438_DEVBW_SEMANTIC_PARITY_V1' "$IMAGE"
          grep -aFq 'A52_PHASE439_DSI_AUTOPSY_V1' "$IMAGE"
          grep -aFq 'A52P439 DSI F0 DMA_DONE timeout' "$IMAGE"
          grep -Fq ' a52_p437_mark' "$MAP"
          grep -Fq ' a52_p437_target_current' "$MAP"
          grep -Fq ' a52_p437_arm_target' "$MAP"
          grep -Fq ' a52_p436_mark' "$MAP"
          grep -Fq ' a52_p430_dma_event' "$MAP"
          ! grep -Fq ' a52_p430_sampler_fn' "$MAP"
          ! grep -Fq ' a52_p430_dma_timer_fn' "$MAP"
          ccache -s

      - name: Save Phase439 object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: workspace/gki-phase199-out
          key: a52xq-phase439-dsi-${{ matrix.variant }}-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/439_apply_dsi_autopsy.py', 'scripts/438_apply_devbw_semantic_parity.py') }}

      - name: Save rolling clang ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-phase439-${{ matrix.variant }}-${{ github.run_id }}

      - name: Package Phase439${{ matrix.variant }}
        if: success()
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          V="${{ matrix.variant }}"
          OUT="$PWD/phase439-${V}-gki-out"
          SOURCE_BOOT="$PWD/phase429-gki-out/package/boot-phase429-apex-sf-focused-census-v1.img"
          FINAL="$OUT/package/boot-phase439-${V}-dsi-autopsy-v1.img"

          rm -rf "$OUT"
          cp -a phase429-gki-out "$OUT"
          cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image"
          cp "$BUILD/System.map" "$OUT/compile/System.map"
          cp "$BUILD/.config" "$OUT/config/final.config"

          mkdir -p "$OUT/source" "$OUT/audit"
          cp "$ROOT/fs/open.c" "$ROOT/fs/namei.c" "$ROOT/fs/char_dev.c" "$OUT/source/"
          cp "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c" \
             "$ROOT/drivers/a52_secure/a52_phase436_frontier.c" \
             "$ROOT/drivers/a52_secure/a52_phase437_open.c" \
             "$ROOT/drivers/devfreq/devfreq_devbw.c" \
             "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c" \
             "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c" \
             "$ROOT/drivers/a52_display/msm/dsi/dsi_display.c" \
             "$ROOT/drivers/a52_display/msm/sde/sde_dbg.c" "$OUT/source/"
          cp "$ROOT/include/linux/a52_phase436_frontier.h" \
             "$ROOT/include/linux/a52_phase437_open.h" "$OUT/source/"
          cp scripts/437_apply_kgsl_open_corridor.py \
             scripts/437_apply_kgsl_open_corridor.py.z64 \
             scripts/438_apply_devbw_semantic_parity.py \
             scripts/439_apply_dsi_autopsy.py \
             scripts/decode_phase439_dsi.py \
             scripts/decode_phase437_open.py \
             scripts/decode_phase437_open.py.z64 \
             scripts/decode_phase436_frontier.py \
             scripts/decode_phase436_frontier.py.z64 \
             scripts/decode_phase414_sequential_3m.py "$OUT/audit/"
          cp /tmp/p435-overlap.txt /tmp/p436-overlap.txt "$OUT/audit/" 2>/dev/null || true

          gzip -n -c "$BUILD/arch/arm64/boot/Image" > "$OUT/package/Image.gz"
          python3 scripts/38_repack_a52_p1_boot.py \
            --source "$SOURCE_BOOT" --kernel "$OUT/package/Image.gz" \
            --output "$FINAL" --report "$OUT/package/phase439-repack-report.json"
          test "$(stat -c '%s' "$FINAL")" -eq 100663296

          cat > "$OUT/PHASE439-NOTES.txt" <<EOF
          Phase439$V DSI autopsy
          ======================
          Base: proven Phase438 DEVBW semantic-parity fix.
          Variant A: normal late HS F0, timed autopsy + timeout panic.
          Variant B: early normal-path HS unlock/relock, then normal late F0.
          Variant C: normal late F0 forced through semantic USE_LPM flag.
          Timed points: PRE, +15 us, +35 us, +50 us, timeout.
          Timed evidence: controller state, real CLK_STATUS, debug bus 0x171,
          PLL_COMMON_STATUS_ONE and v3 PHY common/lane state.
          Timeout evidence: six-selector DSI debug sweep, Qualcomm platform DSI
          debug-bus dump when available, cached display rails, stack, panic.
          SMMU/IRQ are intentionally sanity-only: P426/P427 already established
          valid translation/routing and the hardware DMA_DONE bit never sets.
          EOF

          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
          sha256sum "$FINAL"

      - name: Upload Phase439 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE439${{ matrix.variant }}-DSI-AUTOPSY-FAIL-DIAG-${{ github.run_number }}
          path: |
            gki/common/fs/open.c
            gki/common/fs/namei.c
            gki/common/fs/char_dev.c
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c
            gki/common/drivers/a52_secure/a52_phase436_frontier.c
            gki/common/drivers/a52_secure/a52_phase437_open.c
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl.c
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c
            gki/common/drivers/a52_display/msm/dsi/dsi_display.c
            gki/common/drivers/a52_display/msm/sde/sde_dbg.c
            gki/common/include/linux/a52_phase436_frontier.h
            gki/common/include/linux/a52_phase437_open.h
            workspace/gki-phase199-out/.config
            workspace/gki-phase199-out/System.map
            workspace/gki-phase199-out/arch/arm64/boot/Image
            scripts/437_apply_kgsl_open_corridor.py
            scripts/437_apply_kgsl_open_corridor.py.z64
            scripts/438_apply_devbw_semantic_parity.py
            scripts/439_apply_dsi_autopsy.py
            scripts/decode_phase439_dsi.py
            scripts/decode_phase437_open.py
            scripts/decode_phase437_open.py.z64
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7

      - name: Upload Phase439${{ matrix.variant }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE439${{ matrix.variant }}-DSI-AUTOPSY-${{ github.run_number }}
          path: phase439-${{ matrix.variant }}-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase439${{ matrix.variant }} boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE439${{ matrix.variant }}-DSI-AUTOPSY-${{ github.run_number }}-BOOT-IMG
          path: phase439-${{ matrix.variant }}-gki-out/package/boot-phase439-${{ matrix.variant }}-dsi-autopsy-v1.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  golden:
    name: Build Phase439G TouchGrass Golden
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '4'
      CCACHE_DIR: ${{ github.workspace }}/golden-work/.ccache
      CCACHE_MAXSIZE: 5G
      GOLDEN_CONTROL_REF: agent/a52-golden-touchgrass-clock-reference-v1
      PHASE315G_COMMIT: a82b49ec1c0227611d8dc9a26a7249dae0a8c938
      BOOT_SOURCE_ASSET_ID: '478920392'
      BOOT_SOURCE_SHA256: '41ae3b24771c70747c26aa17a18d254ffcb1c0d742b96f4f1f1fff20a6638554'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Golden runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils gzip zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar
          python3 -m py_compile scripts/439g_apply_golden_dsi_autopsy.py
          bash -n scripts/439g_ci_build_golden.sh

      - name: Create exact Golden-control workspace and hydrate observers
        run: |
          set -Eeuo pipefail
          rm -rf golden-work
          gh repo clone "$GITHUB_REPOSITORY" golden-work -- \
            --depth=1 --branch "$GOLDEN_CONTROL_REF" --single-branch

          git -C golden-work fetch --depth=1 origin "$PHASE315G_COMMIT"
          git -C golden-work show FETCH_HEAD:scripts/315g_apply_golden_f0_full_prestate_reference.py \
            > golden-work/scripts/315g_apply_golden_f0_full_prestate_reference.py
          git -C golden-work show FETCH_HEAD:scripts/315g_ci_build.sh \
            > golden-work/scripts/315g_ci_build.sh

          cp scripts/319_apply_dsi_sixpoint_temporal_observer.py golden-work/scripts/
          cp scripts/319g_ci_build_golden.sh golden-work/scripts/
          cp scripts/344g_apply_golden_dma_transition_recorder.py golden-work/scripts/
          cp scripts/424g_apply_golden_paired_hw_snapshot.py golden-work/scripts/
          cp scripts/424g_ci_build_golden.sh golden-work/scripts/
          cp scripts/439g_apply_golden_dsi_autopsy.py golden-work/scripts/
          cp scripts/439g_ci_build_golden.sh golden-work/scripts/

          python3 -m py_compile \
            golden-work/scripts/315g_apply_golden_f0_full_prestate_reference.py \
            golden-work/scripts/319_apply_dsi_sixpoint_temporal_observer.py \
            golden-work/scripts/344g_apply_golden_dma_transition_recorder.py \
            golden-work/scripts/424g_apply_golden_paired_hw_snapshot.py \
            golden-work/scripts/439g_apply_golden_dsi_autopsy.py
          bash -n golden-work/scripts/439g_ci_build_golden.sh

      - name: Restore Golden compiler cache
        uses: actions/cache@v4
        with:
          path: golden-work/.ccache
          key: a52xq-phase439g-golden-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a52xq-phase424g-golden-${{ runner.os }}-
            a52xq-phase319-golden-${{ runner.os }}-
            a52xq-phase315g-golden-${{ runner.os }}-
            a52xq-linux-4.19.200-ccache-${{ runner.os }}-

      - name: Build Phase439G Golden oracle
        run: |
          set -Eeuo pipefail
          cd golden-work
          bash scripts/439g_ci_build_golden.sh

      - name: Hydrate Golden FDR repack helpers
        if: success()
        run: |
          set -Eeuo pipefail
          mkdir -p golden-work/scripts golden-work/projects/a52-p1-boot-image
          fetch_file() {
            local ref="$1" path="$2" out="golden-work/$2"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$out"
            test -s "$out"
          }
          fetch_file main scripts/37_validate_a52_p1_boot_source.py
          fetch_file main scripts/38_repack_a52_p1_boot.py
          fetch_file main projects/a52-p1-boot-image/boot-source.lock
          chmod +x golden-work/scripts/37_validate_a52_p1_boot_source.py \
            golden-work/scripts/38_repack_a52_p1_boot.py

      - name: Repack Phase439G with known-good Golden FDR container
        if: success()
        run: |
          set -Eeuo pipefail
          cd golden-work
          OUT=phase439-golden-out
          mkdir -p intake "$OUT/package"
          gzip -n -9 -c "$OUT/Image" > "$OUT/package/Image.gz"
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${BOOT_SOURCE_ASSET_ID}" \
            --output intake/boot.img
          test "$(stat -c %s intake/boot.img)" = 100663296
          printf '%s  %s\n' "$BOOT_SOURCE_SHA256" intake/boot.img | sha256sum -c -
          python3 scripts/37_validate_a52_p1_boot_source.py intake/boot.img \
            --lock projects/a52-p1-boot-image/boot-source.lock \
            --output "$OUT/package/source-validation.json"
          python3 scripts/38_repack_a52_p1_boot.py \
            --source intake/boot.img --kernel "$OUT/package/Image.gz" \
            --output "$OUT/package/boot-phase439g-touchgrass-golden-v1.img" \
            --report "$OUT/package/repack-report.json"
          test "$(stat -c %s "$OUT/package/boot-phase439g-touchgrass-golden-v1.img")" -eq 100663296
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Save Golden compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: golden-work/.ccache
          key: a52xq-phase439g-golden-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Phase439G Golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE439G-GOLDEN-FAILED-${{ github.run_number }}
          path: |
            golden-work/phase439-golden-failure/
            golden-work/phase424-golden-failure/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7

      - name: Upload Phase439G Golden
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE439G-TOUCHGRASS-GOLDEN-${{ github.run_number }}
          path: golden-work/phase439-golden-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase439G Golden boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE439G-TOUCHGRASS-GOLDEN-${{ github.run_number }}-BOOT-IMG
          path: golden-work/phase439-golden-out/package/boot-phase439g-touchgrass-golden-v1.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
