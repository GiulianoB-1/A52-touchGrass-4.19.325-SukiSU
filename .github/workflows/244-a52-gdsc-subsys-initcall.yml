name: 244 - A52 GDSC subsys initcall

run-name: Build Phase 244 GDSC subsys-initcall diagnostic candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase244-gdsc-subsys-initcall-v1
    paths:
      - .github/workflows/244-a52-gdsc-subsys-initcall.yml
      - scripts/199_runtime_fix_binary_audit.py
      - scripts/227_phase226_retention_wrapper.py
      - scripts/227_phase226_retention_wrapper_base.py
      - scripts/230_phase229_driver_core_wrapper.py
      - scripts/233_payload.py
      - scripts/234_repair_phase230_layout.py
      - scripts/235_phase234_rscc_master_overlay.py
      - scripts/236_phase235_display_init_overlay.py
      - scripts/237_phase236_ofpop_probe_overlay.py
      - scripts/238_phase237_platform_include_preflight.py
      - scripts/238_phase237_broad_gpu_supplier_overlay.py
      - scripts/238_phase237_gdsc_parent_diag_repair.py
      - scripts/238_phase237_cx_journal_extension.py
      - scripts/238_phase237_cx_driver_walk_extension.py
      - scripts/238_phase237_controlflow_safety_overlay.py
      - scripts/238_phase237_retention_replay_timing_repair.py
      - scripts/238_phase237_c_indent_sanitize.py
      - scripts/239_phase233_fb_msm_audit_repair.py
      - scripts/239_phase238_gpu_cx_vdd_parent_overlay.py
      - scripts/239_phase238_identity_overlay.py
      - scripts/240_phase239_cx_frozen_latch_overlay.py
      - scripts/240_phase239_cx_frozen_latch_overlay_v2.py
      - scripts/240_phase239_identity_overlay.py
      - scripts/241_phase240_cx_broad_corridor_latch_overlay.py
      - scripts/241_phase240_cxf241_postcapacity_repair.py
      - scripts/241_phase240_compile_shape_repair.py
      - scripts/241_phase240_identity_overlay.py
      - scripts/241_phase240_generated_source_audit.py
      - scripts/242_phase241_cx_sticky_state_overlay.py
      - scripts/242_phase241_identity_overlay.py
      - scripts/242_phase241_generated_source_audit.py
      - scripts/243_phase242_cxgx_live_supplier_overlay.py
      - scripts/243_phase242_identity_overlay.py
      - scripts/243_phase242_generated_source_audit.py
      - scripts/244_phase243_gdsc_subsys_initcall_overlay.py
      - scripts/244_phase243_identity_overlay.py
      - scripts/244_phase243_generated_source_audit.py
      - scripts/244_package.py
      - scripts/244_trigger.txt
      - scripts/237_package.py
      - scripts/242_package.py
      - scripts/243_package.py

permissions:
  actions: write
  contents: read

concurrency:
  group: a52-phase244-gdsc-subsys-initcall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build and package Phase 244
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out Phase 244 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore cumulative patch layout and self-test
        run: |
          set -Eeuo pipefail
          python3 scripts/234_repair_phase230_layout.py
          python3 scripts/233_payload.py
          python3 scripts/239_phase233_fb_msm_audit_repair.py --self-test
          python3 scripts/239_phase233_fb_msm_audit_repair.py
          python3 -m py_compile \
            scripts/199_runtime_fix_binary_audit.py \
            scripts/227_phase226_retention_wrapper.py \
            scripts/227_phase226_retention_wrapper_base.py \
            scripts/230_phase229_driver_core_wrapper.py \
            scripts/239_phase238_gpu_cx_vdd_parent_overlay.py \
            scripts/239_phase238_identity_overlay.py \
            scripts/240_phase239_cx_frozen_latch_overlay_v2.py \
            scripts/240_phase239_identity_overlay.py \
            scripts/241_phase240_cx_broad_corridor_latch_overlay.py \
            scripts/241_phase240_cxf241_postcapacity_repair.py \
            scripts/241_phase240_compile_shape_repair.py \
            scripts/241_phase240_identity_overlay.py \
            scripts/241_phase240_generated_source_audit.py \
            scripts/242_phase241_cx_sticky_state_overlay.py \
            scripts/242_phase241_identity_overlay.py \
            scripts/242_phase241_generated_source_audit.py \
            scripts/243_phase242_cxgx_live_supplier_overlay.py \
            scripts/243_phase242_identity_overlay.py \
            scripts/243_phase242_generated_source_audit.py \
            scripts/244_phase243_gdsc_subsys_initcall_overlay.py \
            scripts/244_phase243_identity_overlay.py \
            scripts/244_phase243_generated_source_audit.py \
            scripts/244_package.py
          python3 scripts/199_runtime_fix_binary_audit.py --self-test
          python3 scripts/239_phase238_gpu_cx_vdd_parent_overlay.py --self-test
          python3 scripts/240_phase239_cx_frozen_latch_overlay_v2.py --self-test
          python3 scripts/241_phase240_cxf241_postcapacity_repair.py --self-test
          python3 scripts/241_phase240_compile_shape_repair.py --self-test
          python3 scripts/242_phase241_cx_sticky_state_overlay.py --self-test
          python3 scripts/243_phase242_cxgx_live_supplier_overlay.py --self-test
          python3 scripts/243_phase242_identity_overlay.py --self-test
          python3 scripts/243_phase242_generated_source_audit.py --self-test
          python3 scripts/244_phase243_gdsc_subsys_initcall_overlay.py --self-test
          python3 scripts/244_phase243_identity_overlay.py --self-test
          python3 scripts/244_phase243_generated_source_audit.py --self-test
          python3 scripts/227_phase226_retention_wrapper.py --self-test
          git diff --check

      - name: Verify Phase 244 source scope
        run: |
          set -Eeuo pipefail
          grep -Fq 'A52_PHASE244_GDSC_SUBSYS_INITCALL_V1' scripts/244_phase243_gdsc_subsys_initcall_overlay.py
          grep -Fq 'A52_PHASE244_SUBSYS_LEVEL_ENTRY_V1' scripts/244_phase243_gdsc_subsys_initcall_overlay.py
          grep -Fq 'A52_PHASE244_GDSC_INIT_REGISTER_V1' scripts/244_phase243_gdsc_subsys_initcall_overlay.py
          grep -Fq 'CXF244 V q=%d l=%d' scripts/244_phase243_gdsc_subsys_initcall_overlay.py
          grep -Fq 'CXF244 I q=%d s=X rc=%d' scripts/244_phase243_gdsc_subsys_initcall_overlay.py
          grep -Fq 'phase=244 focus=gdsc-subsys-initcall' scripts/244_phase243_identity_overlay.py
          grep -Fq 'PHASE 244 HARDWARE VALIDATION' scripts/244_trigger.txt
          grep -Fq 'agent/a52-phase244-gdsc-subsys-initcall-v1' scripts/244_package.py
          grep -Fq '244_phase243_gdsc_subsys_initcall_overlay.py' scripts/227_phase226_retention_wrapper.py
          grep -Fq 'PHASE244_IDENTITY_PATH' scripts/199_runtime_fix_binary_audit.py

      - name: Dispatch inherited builder and package Phase 244
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/244_package.py

      - name: Verify Phase 244 candidate
        run: |
          set -Eeuo pipefail
          OUT=phase244-out
          test -s "$OUT/package/boot.img"
          test -s "$OUT/compile/Image"
          test -s "$OUT/final-audit.json"
          test -s "$OUT/BUILD-IDENTITY.json"
          test -s "$OUT/SHA256SUMS"
          test -s "$OUT/PHASE244-HARDWARE-TEST.txt"
          test -s "$OUT/audit/phase244/244_phase243_gdsc_subsys_initcall_overlay.py"
          for marker in \
            'BOOT rs=ready phase=244 focus=gdsc-subsys-initcall' \
            'CXF244 V q=%d l=%d' \
            'CXF244 I q=%d s=E' \
            'CXF244 I q=%d s=B' \
            'CXF244 I q=%d s=X rc=%d' \
            'A52GDSC driver-register enter' \
            'A52GDSC driver-register exit rc=%d' \
            'CXF243 M c=%c q=%d rc=%d' \
            'A52GDSC CX_VDD_PARENT_GET_V1 dev=%s rc=%d' \
            '3d9106c' '3d9100c' 'a52-legacy-gdsc-regulator'; do
            grep -aFq "$marker" "$OUT/compile/Image"
          done
          ! grep -aFq 'BOOT rs=ready phase=243 focus=cx-gdsc-own-suppliers' "$OUT/compile/Image"
          grep -Fq 'BOOT rs=ready phase=244 focus=gdsc-subsys-initcall' "$OUT/PHASE244-HARDWARE-TEST.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('phase244-out/final-audit.json').read_text())
          assert audit['phase']==244
          assert audit['functional_base_phase']==239
          assert audit['hardware_validated'] is False
          assert audit['phase244_phase239_vdd_parent_fix_retained'] is True
          assert audit['phase244_phase243_live_hooks_retained'] is True
          assert audit['phase244_live_only'] is True
          assert audit['phase244_logical_copies_per_boundary']==3
          assert audit['phase244_graphics_behavior_changed'] is False
          assert audit['phase244_provider_behavior_changed'] is False
          assert audit['phase244_driver_core_functional_behavior_changed'] is False
          assert audit['phase244_initcall_order_or_level_changed'] is False
          assert audit['phase244_recorder_transport_changed'] is False
          PY
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Upload Phase 244 candidate
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase244-GDSC-SUBSYS-INITCALL-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase244-out
          if-no-files-found: error
          retention-days: 30
