name: TouchGrass GKI Composer KernelSU companion

run-name: Package precise Composer KernelSU companion recorder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/touchgrass-composer-ksu-companion-v1
    paths:
      - .github/workflows/touchgrass-composer-ksu-companion.yml
      - tools/tg_composer_ksu_companion/**
      - scripts/COLLECT_TOUCHGRASS_HYBRID_REFERENCE.bat

permissions:
  contents: read
  actions: read

jobs:
  package-module:
    name: Audit and package KernelSU companion
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out module branch
        uses: actions/checkout@v4

      - name: Normalize and syntax-check module
        run: |
          set -Eeuo pipefail
          MOD=tools/tg_composer_ksu_companion
          for f in module.prop customize.sh post-fs-data.sh service.sh recorder.sh action.sh boot-completed.sh README.md; do
            test -f "$MOD/$f"
          done

          sed -i 's/\r$//' "$MOD"/*.sh "$MOD/module.prop" "$MOD/README.md"
          for f in "$MOD"/*.sh; do
            echo "SYNTAX $f"
            sh -n "$f"
          done

          grep -Fxq 'id=tg_composer_reference' "$MOD/module.prop"
          grep -Fxq 'versionCode=2' "$MOD/module.prop"
          grep -Fq 'recorder.sh" early' "$MOD/post-fs-data.sh"
          grep -Fq 'recorder.sh" late' "$MOD/service.sh"
          grep -Fq 'PRECOMPOSER_ARMED' "$MOD/recorder.sh"
          grep -Fq 'vendor.qti.hardware.display.composer-service' "$MOD/recorder.sh"
          if grep -Fq 'vendor.qti.hardware.displ*' "$MOD/recorder.sh"; then
            echo 'Broad display-service matcher is forbidden' >&2
            exit 1
          fi
          grep -Fq 'tg_boot_reference' "$MOD/recorder.sh"
          grep -Fq 'set_event_pid' "$MOD/recorder.sh"
          grep -Fq 'options/overwrite' "$MOD/recorder.sh"
          grep -Fq 'drm_mode_getproperty_ioctl' "$MOD/recorder.sh"
          grep -Fq 'drm_mode_obj_get_properties_ioctl' "$MOD/recorder.sh"
          grep -Fq 'drm_atomic_ioctl' "$MOD/recorder.sh"
          grep -Fq 'msm_atomic_check' "$MOD/recorder.sh"

          if grep -En '(^|[[:space:]])(strace|ptrace|setprop|resetprop|stop|start)([[:space:]]|$)' "$MOD/recorder.sh"; then
            echo 'Forbidden mutating/ptrace command found in recorder.sh' >&2
            exit 1
          fi

      - name: Audit Windows hybrid collector
        shell: bash
        run: |
          set -Eeuo pipefail
          BAT=scripts/COLLECT_TOUCHGRASS_HYBRID_REFERENCE.bat
          test -s "$BAT"
          for marker in \
            tg_display_reference \
            tg_boot_reference \
            tg_final_boot_reference \
            tg_gpu_reference \
            tg_ksu_composer_reference \
            dmesg.txt \
            logcat-all.txt \
            binder-state.txt \
            lshal.txt \
            SHA256SUMS.txt; do
            echo "COLLECTOR_MARKER $marker"
            grep -Fq "$marker" "$BAT"
          done

      - name: Build KernelSU installer and handoff package
        run: |
          set -Eeuo pipefail
          MOD=tools/tg_composer_ksu_companion
          OUT=artifacts/tg-composer-ksu-companion
          mkdir -p "$OUT"

          (
            cd "$MOD"
            zip -r9 "$GITHUB_WORKSPACE/$OUT/TG-Composer-Reference-KSU-v1.1.zip" \
              module.prop customize.sh post-fs-data.sh service.sh recorder.sh action.sh boot-completed.sh README.md
          )

          cp scripts/COLLECT_TOUCHGRASS_HYBRID_REFERENCE.bat "$OUT/"
          cp "$MOD/README.md" "$OUT/README-KSU-COMPANION.md"

          cat > "$OUT/BUILD-IDENTITY.txt" <<EOF
          TG_COMPOSER_KSU_COMPANION_V1_1
          repository=$GITHUB_REPOSITORY
          workflow_run=$GITHUB_RUN_ID
          workflow_sha=$GITHUB_SHA
          module_id=tg_composer_reference
          module_version=1.1
          exact_composer_match=true
          early_post_fs_data=true
          diagnostic_only=true
          use_same_module_on_touchgrass_and_gki=true
          EOF
          sed -i 's/^          //' "$OUT/BUILD-IDENTITY.txt"

          unzip -l "$OUT/TG-Composer-Reference-KSU-v1.1.zip"
          for f in module.prop customize.sh post-fs-data.sh service.sh recorder.sh; do
            zipinfo -1 "$OUT/TG-Composer-Reference-KSU-v1.1.zip" | grep -Fxq "$f"
          done

          (
            cd "$OUT"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload KernelSU companion package
        uses: actions/upload-artifact@v4
        with:
          name: TG-Composer-KSU-Companion-${{ github.run_number }}-DIAGNOSTIC
          path: artifacts/tg-composer-ksu-companion/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
