name: 167 - Repair heap-19 validation gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/167-repair-heap19-validation-gate.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-feature-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch feature-branch repair definition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/167-repair-heap19-validation-gate.yml/dispatches" \
            --data '{"ref":"agent/a52-qseecom-ta-heap19"}'
