name: Mangrove Kernel | Phase 452 SCM-only DSP candidate + unchanged DAILY fallback
run-name: P452 DAILY fallback + DSP-CHG H0 (manual ADSP and manual charger opt-in)
on:
  push:
    branches:
      - agent/p452-scm-h1-staging
  workflow_dispatch:
    inputs:
      decode_pc:
        description: 'Kernel symbol+offset[/size] (exact vmlinux required)'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  GKI_MANIFEST_BRANCH: common-android12-5.10-2026-04
  GKI_COMMON_TAG: android12-5.10-2026-04_r1
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  # Defined-empty prevents Kbuild's dirty-tree '+' from changing uname -r.
  LOCALVERSION: ''
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_PATH: /usr/bin:/usr/local/bin
concurrency:
  group: a52-phase447-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gki:
    if: false
    name: Mangrove ${{ matrix.variant.label }} (wave=${{ matrix.variant.wave }} MSS=${{ matrix.variant.mss }} IPA=${{ matrix.variant.ipa }} IPC=${{ matrix.variant.ipc }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { id: F, label: 452-DAILY-FALLBACK, wave: 2, mss: 0, ipa: 0, ipc: 1 }
          - { id: G, label: 452-DSP-CHG-H0-MANUAL, wave: 2, mss: 0, ipa: 0, ipc: 1 }
    env:
      GH_TOKEN: ${{ github.token }}
    # P447C: independent .config builds in parallel in the SAME workflow run.
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase441 payload
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/437_apply_kgsl_open_corridor.py \
            scripts/438_apply_devbw_semantic_parity.py \
            scripts/439_apply_dsi_autopsy.py \
            scripts/440_apply_early_f0_cleanup_forensics.py \
            scripts/441_apply_vrr_state_compat.py \
            scripts/444_apply_deep_passive_compare.py \
            scripts/445_apply_recovery_ladder.py \
            scripts/decode_phase444.py \
            scripts/decode_phase445.py \
            scripts/decode_phase439_dsi.py \
            scripts/decode_phase437_open.py
          python3 scripts/437_apply_kgsl_open_corridor.py --help >/dev/null
          python3 scripts/438_apply_devbw_semantic_parity.py --help >/dev/null
          python3 scripts/439_apply_dsi_autopsy.py --help >/dev/null
          python3 scripts/440_apply_early_f0_cleanup_forensics.py --help >/dev/null
          python3 scripts/441_apply_vrr_state_compat.py --help >/dev/null
          python3 scripts/444_apply_deep_passive_compare.py --help >/dev/null
          python3 scripts/445_apply_recovery_ladder.py --help >/dev/null
          python3 -m py_compile scripts/f0_bisect_v2_transform.py scripts/f0_bisect_stage_guard.py scripts/f0_bisect_ar_idle.py scripts/crash1_apply_fault_and_frameevent.py
          python3 -m py_compile scripts/crash1_fix_gki_dma_fence_union.py scripts/fence1b_disable_sde_dbg_panic.py scripts/fence1c_quiet_sde_evtlog.py scripts/fence1c_fix_dsi_pll_hw_init.py scripts/fence1e_quiet_dump_record_f0.py scripts/fence1f_reopen_p445_gate_at_cold_prepare.py scripts/fence1g_nopanic_trace_cold_on.py scripts/446k_apply_matched_cold_compare.py scripts/446l_apply_post_trigger_twin.py scripts/446l_apply_smmu_cb2_live.py scripts/446m_apply_gdsc_irq_ab.py scripts/446n_apply_dsi_irq_rearm.py scripts/446p_apply_qcom_dsi_packet.py scripts/446q_reconcile_phase_markers.py scripts/446q_apply_ion_prime_pipeline_trace.py scripts/446r_apply_commit_gem_lifetime.py scripts/446r2_bound_rpmh_tcs.py scripts/446r2_apply_pon_wake_diag.py scripts/446s_apply_memlat_guards.py scripts/446s_apply_frame_trace.py scripts/446s_apply_suspend_timing.py scripts/446s_apply_arm_memlat_pmu.py scripts/446s_port_legacy_pmic_gpio.py scripts/446s_publish_final_inputs.py scripts/446s_apply_gpu_slumber_trace.py scripts/446s_apply_kgsl_smmu_runtime_pm.py scripts/a52_final_tree_manifest_audit.py
          python3 scripts/crash1_fix_gki_dma_fence_union.py --help >/dev/null
          python3 scripts/fence1b_disable_sde_dbg_panic.py --help >/dev/null
          python3 scripts/fence1c_quiet_sde_evtlog.py --help >/dev/null
          python3 scripts/fence1c_fix_dsi_pll_hw_init.py --help >/dev/null
          python3 scripts/crash1_apply_fault_and_frameevent.py --help >/dev/null
          python3 scripts/f0_bisect_ar_idle.py --help >/dev/null
          python3 scripts/f0_bisect_stage_guard.py --help >/dev/null
          python3 -m py_compile scripts/446_apply_heartbeat_cb2.py scripts/446b_apply_heartbeat_fixes.py scripts/446c_apply_takeover_window.py scripts/446g_apply_te_irq_test.py scripts/446h_apply_panel_f0_microscope.py scripts/446i_apply_passive_f0_twin.py scripts/446d_apply_power_clock_microscope.py scripts/446d_apply_capacity_guard.py scripts/446d_apply_extra_observers.py scripts/decode_phase446.py scripts/decode_phase446d.py scripts/decode_phase446g.py scripts/decode_phase446_pair.py scripts/446_append_boot_cmdline.py scripts/446j_apply_dispcc_misc.py scripts/u1_port_legacy_qusb2_phy.py scripts/u1_patch_boot_dtb.py scripts/u2_apply_gki_usb_composite_handover.py scripts/38_repack_a52_p1_boot.py
          python3 scripts/446_apply_heartbeat_cb2.py --help >/dev/null
          python3 scripts/446b_apply_heartbeat_fixes.py --help >/dev/null
          python3 scripts/446c_apply_takeover_window.py --help >/dev/null
          python3 scripts/446g_apply_te_irq_test.py --help >/dev/null
          python3 scripts/446h_apply_panel_f0_microscope.py --help >/dev/null
          python3 scripts/446i_apply_passive_f0_twin.py --help >/dev/null
          python3 scripts/446j_apply_dispcc_misc.py --help >/dev/null
          python3 scripts/u1_port_legacy_qusb2_phy.py --help >/dev/null
          python3 scripts/u1_patch_boot_dtb.py --help >/dev/null
          python3 scripts/u2_apply_gki_usb_composite_handover.py --help >/dev/null
          python3 scripts/38_repack_a52_p1_boot.py --help >/dev/null
          python3 scripts/446d_apply_power_clock_microscope.py --help >/dev/null
          python3 scripts/446d_apply_capacity_guard.py --help >/dev/null
          python3 scripts/446d_apply_extra_observers.py --help >/dev/null
          bash -n scripts/446d_collect_boot_identity.sh
          python3 scripts/decode_phase446d.py --help >/dev/null
          python3 scripts/decode_phase446g.py --help >/dev/null
          python3 scripts/decode_phase446.py --help >/dev/null
          python3 scripts/decode_phase444.py --help >/dev/null
          python3 scripts/decode_phase445.py --help >/dev/null
          python3 scripts/decode_phase439_dsi.py --help >/dev/null
          python3 scripts/decode_phase437_open.py --help >/dev/null
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          src = zlib.decompress(base64.b64decode(
              Path("scripts/444_apply_deep_passive_compare.py.z64").read_text().strip()
          )).decode("utf-8", "replace")
          required = (
              "A52_PHASE444_DEEP_PASSIVE_COMPARE_V1",
              "PRE_DEEP",
              "PRE_TRIGGER",
              "HOT_0_75US",
              "DSI_KONA_BUS",
              "MMC_MAJOR179",
              "a52_p444_sde_capture",
              "a52_p444_store_section",
              "P444 TERM ret=%d/%d irq=%u/%u",
          )
          missing = [x for x in required if x not in src]
          if missing:
              raise SystemExit("Phase444 expanded-source contract missing: " + ", ".join(missing))
          has_crc = ("crc=%" in src.lower()) or ("crc32" in src.lower())
          duplicate_sets = (
              ("st=%x/%x", "ck=%x/%x", "in=%x/%x", "ln=%x/%x", "db=%x/%x"),
              ("st=%08x/%08x", "ck=%08x/%08x", "in=%08x/%08x",
               "ln=%08x/%08x", "db=%08x/%08x"),
          )
          has_dups = any(all(tok in src for tok in toks) for toks in duplicate_sets)
          if not (has_crc or has_dups):
              raise SystemExit("Phase444 TG summary integrity missing: need CRC32 or duplicated key fields")
          print("Phase444 expanded-source contract: PASS",
                "integrity=crc" if has_crc else "integrity=duplicates")
          PY
          echo "Phase441 payload: PASS"
      - name: Prepare runner and ccache wrappers
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            repo git curl ca-certificates make gcc g++ python3 bc bison flex clang lld llvm ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves unzip device-tree-compiler
          mkdir -p "$RUNNER_TEMP/a52-ccache-bin" "$CCACHE_DIR"
          cat > "$RUNNER_TEMP/a52-ccache-bin/clang" <<'EOF'
          #!/bin/sh
          exec ccache /usr/bin/clang "$@"
          EOF
          cat > "$RUNNER_TEMP/a52-ccache-bin/clang++" <<'EOF'
          #!/bin/sh
          exec ccache /usr/bin/clang++ "$@"
          EOF
          chmod +x "$RUNNER_TEMP/a52-ccache-bin/clang" "$RUNNER_TEMP/a52-ccache-bin/clang++"
          echo "$RUNNER_TEMP/a52-ccache-bin" >> "$GITHUB_PATH"
          # Hash compiler contents, not only its pathname: safe across updates.
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
      - name: Restore reusable clang ccache (variant-scoped)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: mangrove-clang-ccache-v3-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ matrix.variant.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mangrove-clang-ccache-v3-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ matrix.variant.id }}-
      - name: Restore SHA-pinned Phase446S full source and boot
        run: |
          set -Eeuo pipefail
          mkdir -p workspace/phase446s-inputs workspace/phase446s-boot gki/common
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API/12106509365/zip" -o workspace/phase446s-inputs.zip
          printf '%s  %s\n' 2c7e02b424df29f17ef16087864dacd2068293fb70d6be823de0c85ab7715533 workspace/phase446s-inputs.zip | sha256sum -c -
          unzip -q workspace/phase446s-inputs.zip -d workspace/phase446s-inputs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          base=Path('workspace/phase446s-inputs')
          ident=json.loads((base/'FINAL-BUILD-INPUTS.json').read_text())
          assert ident['phase']=='446S' and ident['schema']=='a52-final-build-inputs-v1'
          print('Phase446S exported git HEAD:',ident['pinned_gki_git_head'])
          assert ident['boot_image_sha256']=='e69d7d9d676a2419a92683a5ee5c9bbf091b2a744d92381dbab3e89a661f646b'
          assert 'final-patched-gki-source.tar.zst' in ident['files']
          for name,expect in ident['files'].items():
              p=base/name
              assert p.is_file(),name
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''):h.update(block)
              assert p.stat().st_size==expect['bytes'] and h.hexdigest()==expect['sha256'],name
          manifest=json.loads((base/'final-tree-manifest.json').read_text())
          assert manifest['strict'] is True and not manifest['missing_required']
          assert manifest['gki_common_pinned_sha']==os.environ['GKI_COMMON_SHA']
          assert manifest['gki_common_actual_git_head']==ident['pinned_gki_git_head']
          assert manifest['source_fingerprint_sha256']=='21664e4ad870aa8b68bf2e54fd4aa4d8fb321120f8b2712d8663d240e933e48c'
          print('P446T PHASE446S COMPLETE SOURCE VERIFIED')
          PY
          tar --use-compress-program=zstd -xf workspace/phase446s-inputs/final-patched-gki-source.tar.zst -C gki/common
          test -s gki/common/Makefile
          git -C gki/common init -q
          git -C gki/common remote add origin https://android.googlesource.com/kernel/common
          if ! git -C gki/common -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "refs/tags/$GKI_COMMON_TAG"; then
            git -C gki/common fetch --depth=1 --no-tags origin "refs/tags/$GKI_COMMON_TAG"
          fi
          test "$(git -C gki/common rev-parse 'FETCH_HEAD^{commit}')" = "$GKI_COMMON_SHA"
          git -C gki/common reset --mixed "$GKI_COMMON_SHA"
          test "$(git -C gki/common rev-parse HEAD)" = "$GKI_COMMON_SHA"
          grep -Fq 'A52_PHASE446R_COMMIT_GEM_LIFETIME_V1' gki/common/drivers/a52_display/msm/msm_atomic.c
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API/12106519108/zip" -o workspace/phase446s-boot.zip
          printf '%s  %s\n' 406a9c65e1d6550869b4628f7bd06694b03dd486982831bc8a6790c3a1bdc383 workspace/phase446s-boot.zip | sha256sum -c -
          unzip -q workspace/phase446s-boot.zip -d workspace/phase446s-boot
          test "$(find workspace/phase446s-boot -name 'boot-f0bisect-gki-p6-v1.img' -type f | wc -l)" -eq 1
          SOURCE="$(find workspace/phase446s-boot -name 'boot-f0bisect-gki-p6-v1.img' -type f -print -quit)"
          printf '%s  %s\n' e69d7d9d676a2419a92683a5ee5c9bbf091b2a744d92381dbab3e89a661f646b "$SOURCE" | sha256sum -c -
          test "$(stat -c '%s' "$SOURCE")" -eq 100663296
          python3 - "$SOURCE" <<'PY'
          import runpy,hashlib,json,sys
          parse=runpy.run_path('scripts/38_repack_a52_p1_boot.py')['parse_boot']
          dtb=parse(open(sys.argv[1],'rb').read())['dtb']
          manifest=json.load(open('workspace/phase446s-inputs/FINAL-BUILD-INPUTS.json'))
          assert hashlib.sha256(dtb).hexdigest()==manifest['files']['boot-final.dtb']['sha256']
          print('P446T BOOT DTB VERIFIED')
          PY
          mkdir -p phase429-gki-out/{package,compile,config} workspace/gki-phase199-out
          cp "$SOURCE" phase429-gki-out/package/boot-phase429-apex-sf-focused-census-v1.img
          cp workspace/phase446s-inputs/final.config workspace/gki-phase199-out/.config
          cp workspace/phase446s-inputs/final.config phase429-gki-out/config/final.config
          make -C "$PWD/gki/common" O="$PWD/workspace/gki-phase199-out" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 olddefconfig
          cmp workspace/phase446s-inputs/final.config workspace/gki-phase199-out/.config
          echo 'P446T exact Phase446S source recovery PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore exact pinned TouchGrass audit reference
        run: |
          set -Eeuo pipefail
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD
          test "$(git -C workspace/touchgrass-a52xq rev-parse HEAD)" = "$TOUCHGRASS_COMMIT"
