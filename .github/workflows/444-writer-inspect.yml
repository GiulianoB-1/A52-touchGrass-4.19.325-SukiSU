name: Phase444 writer inspect
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/444-writer-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Phase444 generated writer
        run: |
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          s=zlib.decompress(base64.b64decode(Path("scripts/444_apply_deep_passive_compare.py.z64").read_text().strip())).decode()
          lines=s.splitlines()
          for needle in ("a52_p444_store_section","P444_MAX_SECTIONS","section_count"):
              for i,l in enumerate(lines):
                  if needle in l:
                      print("\n###",needle,"line",i+1)
                      for j in range(max(0,i-45),min(len(lines),i+100)):
                          print(f"{j+1:04d}: {lines[j]}")
                      break
          PY
