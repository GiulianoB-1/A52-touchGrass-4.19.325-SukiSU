name: 81 - A52 MGLRU Default + RCU Power + Modern ZRAM Clang11

on:
  push:
    branches:
      - agent/a52-phase81-mglru-default-rcunocb-zram-modern-4.19.206-v1
    paths:
      - .github/workflows/78-a52-eevdf77-cass-hybrid-clang11.yml
      - .github/workflows/79-a52-eevdf77-cass-phase81-mglru-rcu-power-zram-modern-clang11.yml
      - .github/workflows/80-a52-eevdf77-cass-mglru-p2-android-hardening-clang11.yml
      - .github/workflows/81-a52-mglru-default-rcu-power-zram-modern-clang11.yml
      - scripts/74_*
      - scripts/77_*
      - scripts/78_*
      - scripts/79_*
      - scripts/80_*
      - scripts/81_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-phase81-mglru-rcu-power-zram-modern-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  LABEL: touchgrass-4.19.206-resukisu-v4.1.0-susfs-v1.4.2-manual-core
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b

jobs:
  build:
    name: Build Phase81 MGLRU-default + RCU-power + modern-ZRAM packages with Clang11
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: a52xq-4.19.206-eevdf-p1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a52xq-4.19.206-bpf-ringbuf-${{ runner.os }}-
            a52xq-4.19.206-manual-susfs-detection-${{ runner.os }}-

      - name: Prepare exact touchGrass source
        run: |
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/01_prepare_source.sh

      - name: Update vendor tree to Linux 4.19.206
        run: |
          ./scripts/03_apply_linux_4.19.153.sh
          ./scripts/04_apply_linux_4.19.154.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.154 4.19.159
          ./scripts/checkpoint_resolve_linux_4.19.159.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.159 4.19.164
          ./scripts/checkpoint_resolve_linux_4.19.164.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.164 4.19.180
          ./scripts/checkpoint_resolve_linux_4.19.180.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.180 4.19.200
          ./scripts/checkpoint_resolve_linux_4.19.200.sh
          ./scripts/57_update_linux_4.19.200_to_4.19.206.sh

      - name: Restore working ReSukiSU BPF-repair baseline
        run: |
          ./scripts/58_backport_bpf_ringbuf.sh
          ./scripts/58_apply_ringbuf_overrun_fix.sh
          ./scripts/07_patch_resukisu_exec_hook.sh

      - name: Apply EEVDF phase 1 sched_entity scaffold
        run: |
          mkdir -p artifacts
          python3 scripts/59_apply_eevdf_phase1_scaffold.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- include/linux/sched.h \
            | tee artifacts/eevdf-phase1-sched-entity.diff
          grep -Fq 'EEVDF phase 1 scaffold' workspace/touchgrass-a52xq/include/linux/sched.h
          grep -Fq 'deadline;' workspace/touchgrass-a52xq/include/linux/sched.h
          grep -Fq 'min_deadline;' workspace/touchgrass-a52xq/include/linux/sched.h
          grep -Fq 'vlag;' workspace/touchgrass-a52xq/include/linux/sched.h
          grep -Fq 'slice;' workspace/touchgrass-a52xq/include/linux/sched.h

      - name: Apply EEVDF phase 2 weighted virtual-time accounting
        run: |
          python3 scripts/60_apply_eevdf_phase2_accounting.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/sched.h kernel/sched/fair.c \
            | tee artifacts/eevdf-phase2-accounting.diff
          grep -Fq 'EEVDF phase 2 accounting' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_avg_vruntime_add' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_entity_eligible' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF phase 3 deadline and lag bookkeeping
        run: |
          python3 scripts/61_apply_eevdf_phase3_deadline_lag.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c \
            | tee artifacts/eevdf-phase3-deadline-lag.diff
          grep -Fq 'EEVDF phase 3 deadline/lag bookkeeping' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_update_deadline' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_update_entity_lag' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF phase 4 augmented tree and picker scaffold
        run: |
          python3 scripts/62_apply_eevdf_phase4_tree_picker.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c \
            | tee artifacts/eevdf-phase4-tree-picker.diff
          grep -Fq 'EEVDF phase 4 augmented deadline tree' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'rb_insert_augmented_cached' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_pick_entity' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF phase 5 picker integration
        run: |
          python3 scripts/63_apply_eevdf_phase5_picker_integration.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c \
            | tee artifacts/eevdf-phase5-picker-integration.diff
          grep -Fq 'EEVDF phase 5 picker integration' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'sched_eevdf_enabled' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'sched_eevdf=1' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF phase 6 wakeup and tick preemption
        run: |
          python3 scripts/64_apply_eevdf_phase6_wakeup_preempt.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c \
            | tee artifacts/eevdf-phase6-wakeup-preempt.diff
          grep -Fq 'EEVDF phase 6 wakeup/preemption integration' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_should_preempt' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'curr->vruntime - curr->deadline' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF phase 7 placement consistency
        run: |
          python3 scripts/65_apply_eevdf_phase7_placement_consistency.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c \
            | tee artifacts/eevdf-phase7-placement-consistency.diff
          grep -Fq 'EEVDF phase 7 placement consistency' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'eevdf_place_entity' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'lag *= load + weight' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'se->deadline = se->vruntime + vslice' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF multitask correctness fixes
        run: |
          python3 scripts/74_apply_eevdf_multitask_correctness.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c \
            | tee artifacts/eevdf-multitask-correctness.diff
          grep -Fq 'static bool eevdf_update_deadline' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'struct sched_entity *best_left = NULL' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'return eevdf_pick_entity(cfs_rq) == se;' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'likely(!sched_eevdf_enabled)' workspace/touchgrass-a52xq/kernel/sched/fair.c

      - name: Apply EEVDF lifecycle correctness
        run: |
          python3 scripts/77_apply_eevdf_lifecycle_correctness.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/sched.h kernel/sched/core.c kernel/sched/fair.c \
            | tee artifacts/eevdf-lifecycle-correctness.diff
          grep -Fq '#define ENQUEUE_INITIAL' workspace/touchgrass-a52xq/kernel/sched/sched.h
          grep -Fq 'ENQUEUE_NOCLOCK | ENQUEUE_INITIAL' workspace/touchgrass-a52xq/kernel/sched/core.c
          grep -Fq 'proc_create_single("eevdf_status"' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'curr->vlag == curr->deadline' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'walt_latency_policy_seen' workspace/touchgrass-a52xq/kernel/sched/fair.c
          ! grep -Fq 'slice = max_t(u64, (u64)sysctl_sched_min_granularity, TICK_NSEC)' workspace/touchgrass-a52xq/kernel/sched/fair.c
          git -C workspace/touchgrass-a52xq diff --check

      - name: Apply WALT-safe CASS on Phase 77 EEVDF
        run: |
          python3 scripts/78_apply_eevdf77_cass_hybrid.py workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq diff -- kernel/sched/fair.c kernel/sched/cass.c init/Kconfig arch/arm64/configs/a52xq_defconfig \
            | tee artifacts/eevdf77-cass-hybrid.diff
          grep -Fq 'CASS+EEVDF77 hybrid fair CPU placement path is active' workspace/touchgrass-a52xq/kernel/sched/cass.c
          grep -Fq 'walt_stats.cumulative_runnable_avg_scaled' workspace/touchgrass-a52xq/kernel/sched/cass.c
          grep -Fq 'util += p_util' workspace/touchgrass-a52xq/kernel/sched/cass.c
          grep -Fq '.select_task_rq		= cass_select_task_rq_fair,' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fxq 'CONFIG_SCHED_CASS=y' workspace/touchgrass-a52xq/arch/arm64/configs/a52xq_defconfig
          grep -Fq 'proc_create_single("eevdf_status"' workspace/touchgrass-a52xq/kernel/sched/fair.c
          grep -Fq 'curr->vlag == curr->deadline' workspace/touchgrass-a52xq/kernel/sched/fair.c
          ! grep -Fq 'cpu_util_rt(' workspace/touchgrass-a52xq/kernel/sched/cass.c
          ! grep -Fq 'cpu_util_dl(' workspace/touchgrass-a52xq/kernel/sched/cass.c
          ! grep -Fq 'cpu_util_irq(' workspace/touchgrass-a52xq/kernel/sched/cass.c
          git -C workspace/touchgrass-a52xq diff --check

      - name: Import MGLRU phase 1 with runtime default OFF
        run: |
          chmod +x scripts/79_apply_mglru_phase1.sh
          bash -n scripts/79_apply_mglru_phase1.sh
          ./scripts/79_apply_mglru_phase1.sh

          grep -Fxq 'CONFIG_LRU_GEN=y' workspace/touchgrass-a52xq/arch/arm64/configs/a52xq_defconfig
          grep -Fxq '# CONFIG_LRU_GEN_ENABLED is not set' workspace/touchgrass-a52xq/arch/arm64/configs/a52xq_defconfig
          grep -Fq 'lru_gen_enabled' workspace/touchgrass-a52xq/mm/vmscan.c
          grep -Fq 'lru_gen_enter_fault' workspace/touchgrass-a52xq/mm/memory.c
          git -C workspace/touchgrass-a52xq diff --check

      - name: Apply Phase80 Android MGLRU latency and LMKD hardening
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/80_apply_mglru_android_hardening.py
          python3 scripts/80_apply_mglru_android_hardening.py workspace/touchgrass-a52xq

          KERNEL=workspace/touchgrass-a52xq
          ! grep -Fq 'wait_event_killable(lruvec->mm_state.wait' "$KERNEL/mm/vmscan.c"
          ! grep -Fq 'wake_up_all(&lruvec->mm_state.wait)' "$KERNEL/mm/vmscan.c"
          ! grep -Fq 'init_waitqueue_head(&lruvec->mm_state.wait)' "$KERNEL/mm/vmscan.c"
          ! grep -Fq 'mm_state->nr_walkers' "$KERNEL/mm/vmscan.c"
          grep -Fq 'if (walk->max_seq != max_seq)' "$KERNEL/mm/vmscan.c"
          grep -Fq 'mod_lruvec_state(lruvec, WORKINGSET_REFAULT, delta);' "$KERNEL/mm/workingset.c"
          grep -Fq 'mod_lruvec_state(lruvec, WORKINGSET_ACTIVATE, delta);' "$KERNEL/mm/workingset.c"
          grep -Fq 'unused; kept for ABI/layout compatibility' "$KERNEL/include/linux/mmzone.h"
          git -C "$KERNEL" diff --check

      - name: Apply Phase81 MGLRU default-on and RCU power configuration
        run: |
          set -Eeuo pipefail
          chmod +x scripts/81_apply_mglru_default_rcu_power.sh
          bash -n scripts/81_apply_mglru_default_rcu_power.sh
          ./scripts/81_apply_mglru_default_rcu_power.sh

          KERNEL=workspace/touchgrass-a52xq
          grep -Fxq 'CONFIG_LRU_GEN_ENABLED=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fxq 'CONFIG_RCU_EXPERT=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fxq 'CONFIG_RCU_FAST_NO_HZ=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          grep -Fxq 'CONFIG_RCU_NOCB_CPU=y' "$KERNEL/arch/arm64/configs/a52xq_defconfig"
          git -C "$KERNEL" diff --check

      - name: Apply Phase81 newer ZRAM and zsmalloc foundation
        run: |
          set -Eeuo pipefail
          chmod +x scripts/81_apply_zram_zsmalloc_modern.sh
          bash -n scripts/81_apply_zram_zsmalloc_modern.sh
          python3 -m py_compile scripts/81_modernize_zram_preemptible.py
          ./scripts/81_apply_zram_zsmalloc_modern.sh

          KERNEL=workspace/touchgrass-a52xq
          grep -Fq 'wait_on_bit_lock(&zram->table[index].flags' "$KERNEL/drivers/block/zram/zram_drv.c"
          grep -Fq 'clear_and_wake_up_bit(ZRAM_LOCK' "$KERNEL/drivers/block/zram/zram_drv.c"
          grep -Fq 'struct mutex lock;' "$KERNEL/drivers/block/zram/zcomp.h"
          ! grep -Fq 'get_cpu_ptr(comp->stream)' "$KERNEL/drivers/block/zram/zcomp.c"
          git -C "$KERNEL" diff --check

      - name: Build Phase81 MGLRU default + RCU power + modern ZRAM/zsmalloc
        run: |
          set -o pipefail
          ./scripts/57_build_resukisu_susfs_manual_detection.sh \
            2>&1 | tee artifacts/linux-4.19.206-phase81-mglru-rcu-power-zram-modern-clang11-build.log

      - name: Audit build result
        run: |
          set -Eeuo pipefail
          KERNEL=workspace/touchgrass-a52xq
          test -s "artifacts/Image-${LABEL}"
          test -s "$KERNEL/out/vmlinux"
          grep -Fxq 'CONFIG_SCHED_CASS=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_LRU_GEN=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_LRU_GEN_ENABLED=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_RCU_EXPERT=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_RCU_FAST_NO_HZ=y' "$KERNEL/out/.config"
          grep -Fxq 'CONFIG_RCU_NOCB_CPU=y' "$KERNEL/out/.config"
          grep -Fq 'lru_gen_enabled' "$KERNEL/mm/vmscan.c"
          grep -Fq 'lru_gen_enter_fault' "$KERNEL/mm/memory.c"
          nm -n "$KERNEL/out/vmlinux" | grep -E ' [Tt] lru_gen_' | head -40 \
            | tee artifacts/mglru-vmlinux-symbols.txt || true
          nm -n "$KERNEL/out/vmlinux" \
            | grep -F 'cass_select_task_rq_fair' \
            | tee artifacts/cass-vmlinux-symbol.txt
          strings "$KERNEL/out/vmlinux" \
            | grep -F 'CASS+EEVDF77 hybrid fair CPU placement path is active' \
            | tee artifacts/cass-runtime-proof-string.txt
          nm -n "$KERNEL/out/vmlinux" \
            | grep -E ' [Tt] bpf_ringbuf_(output|reserve|submit|discard|query)' \
            | tee artifacts/bpf-ringbuf-vmlinux-symbols.txt
          {
            echo phase=81-mglru-default-rcu-power-zram-modern-clang11
            echo mglru=default-on-runtime-switchable-android-hardened
            echo mglru_default=enabled-from-kernel-init
            echo mglru_runtime_enable=/sys/kernel/mm/lru_gen/enabled
            echo mglru_speculative_fault_integration=enabled\n            echo mglru_android_wait_priority_inversion_fix=enabled\n            echo mglru_lmkd_workingset_accounting_fix=enabled
            echo kernel=4.19.206
            echo sched_entity_scaffold=passed
            echo weighted_virtual_time_accounting=passed
            echo eligibility_helper=present
            echo deadline_bookkeeping=passed
            echo lag_capture=passed
            echo eevdf_pick=compiled-not-active
            echo augmented_deadline_tree=passed
            echo task_selection=EEVDF_when_enabled
            echo cpu_placement=CASS_when_enabled
            echo eevdf_enabled=boot-cmdline-controlled
            echo cass_enabled=boot-cmdline-controlled
            echo cass_accounting=WALT-safe-no-hard-util
            echo deadline_expiry_resched=fixed
            echo picker_search=v6.6-style
            echo wakeup_preempt=eevdf-exclusive
            echo child_runs_first=legacy-only
            echo cross_rq_state=lag-preserving-destination-placement
            echo fork_initial_enqueue=explicit
            echo cgroup_move=destination-placement
            echo reweight=lag-deadline-tree-corrected
            echo run_to_parity=enabled
            echo yield=eevdf-aware
            echo base_slice=min-granularity
            echo runtime_status=/proc/eevdf_status
            echo walt_latency_policy=instrumented-only
            echo hybrid_default=sched_eevdf_1_sched_cass_1
            echo compiler=vendor-clang-r383902
            echo rcu_fast_no_hz=enabled
            echo rcu_nocb_cpu=enabled
            echo rcu_nocbs_policy=6-7
            echo rcu_lazy=not-used
            echo zram_entry_lock=sleepable
            echo zcomp_streams=preemptible
            echo zsmalloc_foundation=post-4.19.206-fixes
            echo bpf_ringbuf=retained
            echo resukisu=retained
          } | tee artifacts/eevdf-phase1-audit.txt

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: packaging/AnyKernel3
          fetch-depth: 1

      - name: Package Phase77 EEVDF + CASS hybrid and full rollback ZIPs
        run: |
          set -Eeuo pipefail
          mkdir -p release-hybrid release-rollback
          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-hybrid-enabled.sh
          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-hybrid-rollback.sh

          for f in scripts/.package-hybrid-enabled.sh scripts/.package-hybrid-rollback.sh; do
            sed -i "s/grep -Fxq '# CONFIG_KSU_SUSFS is not set'/grep -Fxq 'CONFIG_KSU_SUSFS=y'/" "$f"
            sed -i 's/SUSFS must remain disabled for this package/Kernel config does not enable SUSFS core/' "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          for name, eevdf, cass in (
              ("scripts/.package-hybrid-enabled.sh", "1", "1"),
              ("scripts/.package-hybrid-rollback.sh", "0", "0"),
          ):
              p = Path(name)
              s = p.read_text()
              anchor = "dump_boot;\nwrite_boot;"
              if s.count(anchor) != 1:
                  raise SystemExit(
                      f"unexpected AnyKernel boot-write anchor count in {name}: {s.count(anchor)}"
                  )
              s = s.replace(
                  anchor,
                  f'dump_boot;\n'
                  f'patch_cmdline "sched_eevdf" "sched_eevdf={eevdf}";\n'
                  f'patch_cmdline "sched_cass" "sched_cass={cass}";\n'
                  f'patch_cmdline "rcu_nocbs" "rcu_nocbs=6-7";\n'
                  f'write_boot;',
                  1,
              )
              p.write_text(s)
          PY

          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + EEVDF77 CASS MGLRU DEFAULT RCU-POWER ZRAM-MODERN/' scripts/.package-hybrid-enabled.sh
          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + EEVDF77 CASS MGLRU DEFAULT RCU-POWER ZRAM-MODERN SCHED ROLLBACK/' scripts/.package-hybrid-rollback.sh

          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/ReSukiSU-v4.1.0-EEVDF77-CASS-MGLRU-P3-RCUPOWER-ZRAM-CLANG11.zip/' scripts/.package-hybrid-enabled.sh
          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/ReSukiSU-v4.1.0-EEVDF77-CASS-MGLRU-P3-RCUPOWER-ZRAM-CLANG11-SCHED-ROLLBACK.zip/' scripts/.package-hybrid-rollback.sh

          chmod +x scripts/.package-hybrid-enabled.sh scripts/.package-hybrid-rollback.sh

          ./scripts/.package-hybrid-enabled.sh \
            4.19.206 \
            "artifacts/Image-${LABEL}" \
            packaging/AnyKernel3 \
            release-hybrid

          ./scripts/.package-hybrid-rollback.sh \
            4.19.206 \
            "artifacts/Image-${LABEL}" \
            packaging/AnyKernel3 \
            release-rollback

          rm -f scripts/.package-hybrid-enabled.sh scripts/.package-hybrid-rollback.sh

      - name: Verify packaged hybrid boot toggles
        run: |
          set -Eeuo pipefail
          HYBRID_ZIP="$(find release-hybrid -maxdepth 1 -name '*.zip' -type f | head -1)"
          ROLLBACK_ZIP="$(find release-rollback -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -s "$HYBRID_ZIP"
          test -s "$ROLLBACK_ZIP"

          unzip -p "$HYBRID_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=1";'
          unzip -p "$HYBRID_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=1";'
          unzip -p "$HYBRID_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "rcu_nocbs" "rcu_nocbs=6-7";'
          unzip -p "$ROLLBACK_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=0";'
          unzip -p "$ROLLBACK_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=0";'
          unzip -p "$ROLLBACK_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "rcu_nocbs" "rcu_nocbs=6-7";'

          {
            echo 'hardware_test_package=passed'
            echo 'hybrid_cmdline=sched_eevdf=1 sched_cass=1'
            echo 'rollback_cmdline=sched_eevdf=0 sched_cass=0'
            echo 'eevdf=phase77-lifecycle-correctness'
            echo 'cass=phase1b-walt-safe'
            echo 'mglru=compiled-default-on'
            echo 'mglru_default=on'
            echo 'rcu_fast_no_hz=on'
            echo 'rcu_nocbs=6-7'
