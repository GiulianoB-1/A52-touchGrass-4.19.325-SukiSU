      - name: Compute exact per-variant Kbuild cache identity
        id: build_cache_key
        run: |
          set -Eeuo pipefail
          BUILD="$PWD/workspace/gki-phase199-out"
          FP="$(python3 -c 'import json;print(json.load(open("phase446r2-manifest/final-tree.json"))["source_fingerprint_sha256"])')"
          CONFIG_SHA="$(sha256sum "$BUILD/.config" | cut -d' ' -f1)"
          CLANG_SHA="$(/usr/bin/clang --version | head -n 1 | sha256sum | cut -d' ' -f1)"
          printf 'fingerprint=%s\nconfig=%s\ntoolchain=%s\n' "$FP" "$CONFIG_SHA" "$CLANG_SHA" >> "$GITHUB_OUTPUT"
          sha256sum "$BUILD/.config" > "$RUNNER_TEMP/mangrove-config-before-cache.sha256"
      - name: Restore exact matching Kbuild objects (never cross-variant)
        id: kbuild_cache
        uses: actions/cache/restore@v4
