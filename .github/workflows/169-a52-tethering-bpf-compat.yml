      - name: Install pinned AOSP Clang 22 r596125
        run: |
          set -Eeuo pipefail

          KERNEL="$GITHUB_WORKSPACE/workspace/touchgrass-a52xq"
          TOOLCHAIN_REPO="$GITHUB_WORKSPACE/.toolchains/aosp-clang"
          OLD_CLANG="$KERNEL/toolchain/clang/host/linux-x86/clang-r383902/bin/clang"

          mkdir -p "$GITHUB_WORKSPACE/.toolchains" artifacts
          NEW_CLANG="$TOOLCHAIN_REPO/$AOSP_CLANG_REVISION/bin/clang"
          CACHE_OK=0
          if [ -x "$NEW_CLANG" ] && [ -d "$TOOLCHAIN_REPO/.git" ]; then
            if [ "$(git -C "$TOOLCHAIN_REPO" rev-parse HEAD 2>/dev/null || true)" = "$AOSP_CLANG_COMMIT" ]; then
              CACHE_OK=1
              echo "Using cached AOSP Clang 22 toolchain"
            fi
          fi

          if [ "$CACHE_OK" -ne 1 ]; then
            rm -rf "$TOOLCHAIN_REPO"
            git init -q "$TOOLCHAIN_REPO"
            git -C "$TOOLCHAIN_REPO" remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
            git -C "$TOOLCHAIN_REPO" sparse-checkout init --cone
            git -C "$TOOLCHAIN_REPO" sparse-checkout set "$AOSP_CLANG_REVISION"
            git -C "$TOOLCHAIN_REPO" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$AOSP_CLANG_COMMIT"
            git -C "$TOOLCHAIN_REPO" checkout --quiet --detach FETCH_HEAD
          fi
          test -x "$NEW_CLANG"
          test "$(git -C "$TOOLCHAIN_REPO" rev-parse HEAD)" = "$AOSP_CLANG_COMMIT"

          {
            echo "=== ORIGINAL P152 COMPILER ==="
            "$OLD_CLANG" --version || true
            echo
            echo "=== EXPERIMENT COMPILER ==="
            "$NEW_CLANG" --version
            echo
            echo "aosp_clang_commit=$(git -C "$TOOLCHAIN_REPO" rev-parse HEAD)"
          } | tee artifacts/clang22-toolchain.txt

          "$NEW_CLANG" --version | grep -Fq 'r596125'
          "$NEW_CLANG" --version | grep -Eq 'clang version 22([.]| )'
          echo "A52_CLANG_OVERRIDE=$NEW_CLANG" >> "$GITHUB_ENV"

      - name: Save pinned Clang 22 toolchain cache
        if: steps.clang22_toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
