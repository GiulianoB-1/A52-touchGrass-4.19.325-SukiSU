name: 246 - A52 subsys initcall corridor

run-name: Build Phase 246 subsys-initcall corridor candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase246-subsys-initcall-corridor-v1
    paths:
      - .github/workflows/246-a52-subsys-initcall-corridor.yml
      - scripts/199_runtime_fix_binary_audit.py
      - scripts/227_phase226_retention_wrapper.py
      - scripts/227_phase226_retention_wrapper_base.py
      - scripts/233_payload.py
      - scripts/234_repair_phase230_layout.py
      - scripts/239_phase233_fb_msm_audit_repair.py
      - scripts/239_phase238_gpu_cx_vdd_parent_overlay.py
      - scripts/239_phase238_identity_overlay.py
      - scripts/240_phase239_cx_frozen_latch_overlay_v2.py
      - scripts/240_phase239_identity_overlay.py
      - scripts/241_phase240_cx_broad_corridor_latch_overlay.py
      - scripts/241_phase240_cxf241_postcapacity_repair.py
      - scripts/241_phase240_compile_shape_repair.py
      - scripts/241_phase240_identity_overlay.py
      - scripts/241_phase240_generated_source_audit.py
      - scripts/242_phase241_cx_sticky_state_overlay.py
      - scripts/242_phase241_identity_overlay.py
      - scripts/242_phase241_generated_source_audit.py
      - scripts/243_phase242_cxgx_live_supplier_overlay.py
      - scripts/243_phase242_identity_overlay.py
      - scripts/243_phase242_generated_source_audit.py
      - scripts/245_phase243_fwdevlink_permissive_overlay.py
      - scripts/246_phase245_subsys_initcall_corridor_overlay.py
      - scripts/243_package.py
      - scripts/245_package.py
      - scripts/245_package_r2.py
      - scripts/246_package.py
      - scripts/246_design.md
      - scripts/246_trigger.txt

permissions:
  actions: write
  contents: read

concurrency:
  group: a52-phase246-subsys-initcall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build and package Phase 246
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out Phase 246 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore cumulative layout and self-test
        run: |
          set -Eeuo pipefail
          python3 scripts/234_repair_phase230_layout.py
          python3 scripts/233_payload.py
          python3 scripts/239_phase233_fb_msm_audit_repair.py --self-test
          python3 scripts/239_phase233_fb_msm_audit_repair.py
          python3 -m py_compile \
            scripts/199_runtime_fix_binary_audit.py \
            scripts/227_phase226_retention_wrapper.py \
            scripts/227_phase226_retention_wrapper_base.py \
            scripts/239_phase238_gpu_cx_vdd_parent_overlay.py \
            scripts/243_phase242_cxgx_live_supplier_overlay.py \
            scripts/243_phase242_identity_overlay.py \
            scripts/243_phase242_generated_source_audit.py \
            scripts/245_phase243_fwdevlink_permissive_overlay.py \
            scripts/246_phase245_subsys_initcall_corridor_overlay.py \
            scripts/243_package.py \
            scripts/245_package.py \
            scripts/245_package_r2.py \
            scripts/246_package.py
          python3 scripts/199_runtime_fix_binary_audit.py --self-test
          python3 scripts/239_phase238_gpu_cx_vdd_parent_overlay.py --self-test
          python3 scripts/243_phase242_cxgx_live_supplier_overlay.py --self-test
          python3 scripts/243_phase242_identity_overlay.py --self-test
          python3 scripts/243_phase242_generated_source_audit.py --self-test
          python3 scripts/245_phase243_fwdevlink_permissive_overlay.py --self-test
          python3 scripts/246_phase245_subsys_initcall_corridor_overlay.py --self-test
          python3 scripts/227_phase226_retention_wrapper.py --self-test
          git diff --check

      - name: Verify Phase 246 source scope
        run: |
          set -Eeuo pipefail
          grep -Fq 'static u32 fw_devlink_flags = FW_DEVLINK_FLAGS_PERMISSIVE;' scripts/245_phase243_fwdevlink_permissive_overlay.py
          grep -Fq 'char\s*\*\s*command_line' scripts/246_phase245_subsys_initcall_corridor_overlay.py
          grep -Fq 'CXF246 V q=%d l=%d' scripts/246_phase245_subsys_initcall_corridor_overlay.py
          grep -Fq 'CXF246 S n=%d f=%ps' scripts/246_phase245_subsys_initcall_corridor_overlay.py
          grep -Fq 'CXF246 X q=%d n=%d' scripts/246_phase245_subsys_initcall_corridor_overlay.py
          grep -Fq '245_phase243_fwdevlink_permissive_overlay.py' scripts/227_phase226_retention_wrapper.py
          grep -Fq '246_phase245_subsys_initcall_corridor_overlay.py' scripts/227_phase226_retention_wrapper.py
          ! grep -Fq '("244_phase243_gdsc_subsys_initcall_overlay.py",' scripts/227_phase226_retention_wrapper.py
          test ! -e scripts/244_phase243_identity_overlay.py
          grep -Fq 'agent/a52-phase246-subsys-initcall-corridor-v1' scripts/246_package.py
          grep -Fq 'A52_RAW_RAMOOPS_20260810_094102.zip' scripts/246_design.md

      - name: Dispatch inherited builder and package Phase 246
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/246_package.py

      - name: Verify Phase 246 candidate
        run: |
          set -Eeuo pipefail
          OUT=phase246-out
          test -s "$OUT/package/boot.img"
          test -s "$OUT/compile/Image"
          test -s "$OUT/final-audit.json"
          test -s "$OUT/BUILD-IDENTITY.json"
          test -s "$OUT/SHA256SUMS"
          test -s "$OUT/PHASE246-DESIGN.md"
          test -s "$OUT/PHASE246-HARDWARE-TEST.txt"
          test -s "$OUT/audit/phase246/246_phase245_subsys_initcall_corridor_overlay.py"

          for marker in \
            'BOOT rs=ready phase=243 focus=cx-gdsc-own-suppliers' \
            'CXF243 M c=%c q=%d rc=%d' \
            'CXF243 G c=%c q=%d rc=%d ls=%d' \
            'CXF246 V q=%d l=%d' \
            'CXF246 S n=%d f=%ps' \
            'CXF246 X q=%d n=%d' \
            'A52GDSC driver-register enter' \
            'A52GDSC driver-register exit rc=%d' \
            'A52GDSC CX_VDD_PARENT_GET_V1 dev=%s rc=%d' \
            '3d9106c' '3d9100c'; do
            grep -aFq "$marker" "$OUT/compile/Image"
          done
          ! grep -aFq 'BOOT rs=ready phase=244 focus=gdsc-subsys-initcall' "$OUT/compile/Image"
          ! grep -aFq 'CXF244 V q=%d l=%d' "$OUT/compile/Image"
          ! grep -aFq 'CXF244 I q=%d s=' "$OUT/compile/Image"

          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path('phase246-out')
          audit = json.loads((out / 'final-audit.json').read_text())
          assert audit['phase'] == 246
          assert audit['base_phase'] == 245
          assert audit['functional_base_phase'] == 245
          assert audit['hardware_validated'] is False
          assert audit['phase246_phase245_fwdevlink_permissive_retained'] is True
          assert audit['phase246_phase243_cxgx_hooks_retained'] is True
          assert audit['phase246_phase244_overlay_applied'] is False
          assert audit['phase246_initcall_order_or_return_changed'] is False
          assert audit['phase246_provider_behavior_changed'] is False
          assert audit['phase246_dt_changed'] is False
          assert audit['phase246_boot_cmdline_changed'] is False
          assert audit['phase246_recorder_transport_changed'] is False
          assert audit['phase246_phase245_hardware_evidence']['valid_contiguous_sequences'] == 254

          repack = json.loads((out / 'package/repack-report.json').read_text())
          inv = repack['invariants']
          for key in ('board_preserved', 'cmdline_preserved', 'dtb_preserved',
                      'ramdisk_preserved', 'header_version_preserved',
                      'partition_size_preserved', 'replacement_kernel_used'):
              assert inv[key] is True, key
          assert 'fw_devlink=' not in repack.get('cmdline', '')
          PY

          (cd "$OUT" && sha256sum -c SHA256SUMS)
          sha256sum "$OUT/package/boot.img"

      - name: Upload Phase 246 candidate
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase246-SUBSYS-INITCALL-CORRIDOR-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase246-out
          if-no-files-found: error
          retention-days: 30
