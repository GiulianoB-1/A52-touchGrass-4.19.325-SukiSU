name: Phase431 - safe SF gap + DMA forensics
run-name: Phase431 - safe SF gap + DMA forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase378-gki-ufs-completion-flight-recorder-v1
    paths:
      - .github/workflows/431-a52-safe-sf-gap-forensics.yml
      - scripts/431_apply_safe_gap_forensics.py
      - scripts/decode_phase431_gap.py

permissions:
  contents: read
  actions: read

env:
  GKI_MANIFEST_BRANCH: common-android12-5.10-2026-04
  GKI_COMMON_TAG: android12-5.10-2026-04_r1
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_PATH: /usr/bin:/usr/local/bin

concurrency:
  group: a52-phase431-safe-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phase431 safe SF gap forensics
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner and ccache wrappers
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            repo git curl ca-certificates make gcc g++ python3 bc bison flex \
            clang lld llvm ccache gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 zstd xz-utils file dwarves unzip
          python3 -m py_compile scripts/431_apply_safe_gap_forensics.py scripts/decode_phase431_gap.py
          python3 scripts/431_apply_safe_gap_forensics.py --help >/dev/null
          python3 scripts/decode_phase431_gap.py --help >/dev/null

          mkdir -p "$RUNNER_TEMP/a52-ccache-bin" "$CCACHE_DIR"
          cat > "$RUNNER_TEMP/a52-ccache-bin/clang" <<'EOF'
          #!/bin/sh
          exec ccache /usr/bin/clang "$@"
          EOF
          cat > "$RUNNER_TEMP/a52-ccache-bin/clang++" <<'EOF'
          #!/bin/sh
          exec ccache /usr/bin/clang++ "$@"
          EOF
          chmod +x "$RUNNER_TEMP/a52-ccache-bin/clang" "$RUNNER_TEMP/a52-ccache-bin/clang++"
          echo "$RUNNER_TEMP/a52-ccache-bin" >> "$GITHUB_PATH"

      - name: Restore rolling clang ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ github.run_id }}
          restore-keys: |
            a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-

      - name: Configure compiler cache
        run: |
          set -Eeuo pipefail
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -z
          ccache -s

      - name: Restore Phase429 source baseline
        id: phase429-source
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            phase429-gki-out
          key: a52xq-phase429-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9

      - name: Restore Phase357 source baseline
        if: steps.phase429-source.outputs.cache-hit != 'true'
        id: phase357-source
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            phase357-gki-out
          key: a52xq-phase357-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-363c3290

      - name: Restore pinned GKI source on source-baseline miss
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true'
        id: gki-source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v2-${{ runner.os }}-${{ env.GKI_COMMON_TAG }}-${{ env.GKI_COMMON_SHA }}

      - name: Sync exact pinned GKI on complete source miss
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true' && steps.gki-source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf gki
          mkdir -p gki
          cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b "$GKI_MANIFEST_BRANCH" --depth=1
          repo sync -c -j4 --no-tags --fail-fast
          git -C common fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/$GKI_COMMON_TAG"
          git -C common checkout --detach FETCH_HEAD
          test "$(git -C common rev-parse HEAD)" = "$GKI_COMMON_SHA"

      - name: Save pinned GKI source cache
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true' && steps.gki-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v2-${{ runner.os }}-${{ env.GKI_COMMON_TAG }}-${{ env.GKI_COMMON_SHA }}

      - name: Restore exact TouchGrass source
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true'
        id: touchgrass-source
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-source-v3-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone TouchGrass on source-cache miss
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true' && steps.touchgrass-source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Save TouchGrass source cache
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true' && steps.touchgrass-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-source-v3-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Cold-reconstruct Phase357 only when both source baselines are gone
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          echo "No Phase429/357 source snapshot survived. Reconstructing once with rolling ccache enabled."
          bash scripts/345_ci_build_gki.sh
          PHASE346_PREWARMED_PHASE345=1 bash scripts/346_ci_build_gki.sh
          PHASE357_PREWARMED_PHASE346=1 bash scripts/357_ci_build_gki.sh

      - name: Validate Phase357 source baseline
        if: steps.phase429-source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          test -d gki/common
          test -s phase357-gki-out/package/boot.img
          test -s phase357-gki-out/config/final.config
          test "$(stat -c '%s' phase357-gki-out/package/boot.img)" -eq 100663296
          grep -Fq 'A52_PHASE357_INIT_EXIT_CAUSE_V1' \
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c
          echo "Phase357 source baseline validation: PASS"

      - name: Save compact Phase357 source baseline
        if: steps.phase429-source.outputs.cache-hit != 'true' && steps.phase357-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gki/common
            phase357-gki-out
          key: a52xq-phase357-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-363c3290

      - name: Reconstruct Phase429 from Phase357 source
        if: steps.phase429-source.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p workspace/gki-phase199-out
          python3 - <<'PY'
          from pathlib import Path
          src=Path(".github/workflows/429-a52-apex-sf-focused-census.yml").read_text().splitlines()
          def extract(name,out):
              start=next(i for i,l in enumerate(src) if l.strip()==f"- name: {name}")
              runline=next(i for i in range(start+1,len(src)) if src[i].strip()=="run: |")
              end=next((i for i in range(runline+1,len(src)) if src[i].startswith("      - name:")),len(src))
              body=[line[10:] if line.startswith("          ") else line for line in src[runline+1:end]]
              Path(out).write_text("set -Eeuo pipefail\n"+"\n".join(body)+"\n")
          extract("Reapply Phase358 and Phase359","/tmp/p429-reapply.sh")
          extract("Build Phase429 focused census lineage plus contracts","/tmp/p429-build.sh")
          extract("Build Phase429 focused-census boot image","/tmp/p429-boot.sh")
          PY
          bash /tmp/p429-reapply.sh
          bash /tmp/p429-build.sh
          bash /tmp/p429-boot.sh
          test -s phase429-gki-out/package/boot-phase429-apex-sf-focused-census-v1.img
          python3 scripts/429_apply_apex_sf_focused_census.py --root "$PWD/gki/common" --check-only

      - name: Save compact Phase429 source baseline
        if: steps.phase429-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gki/common
            phase429-gki-out
          key: a52xq-phase429-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9

      - name: Restore Phase431 object cache
        id: phase431-objects
        uses: actions/cache/restore@v4
        with:
          path: workspace/gki-phase199-out
          key: a52xq-phase431-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/431_apply_safe_gap_forensics.py', 'scripts/430_apply_sf_dma_forensics.py', 'scripts/430_postapply_hardening.py', 'scripts/430_parts/**') }}
          restore-keys: |
            a52xq-phase431-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-

      - name: Restore optional Phase430 object cache
        if: steps.phase431-objects.outputs.cache-hit != 'true'
        id: phase430-objects
        uses: actions/cache/restore@v4
        with:
          path: workspace/gki-phase199-out
          key: a52xq-phase430-compile-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-171864d59e68077e7e8b27bb3dcd75b0f36989ea45faa2998151c40b636ffed8
          restore-keys: |
            a52xq-phase430-compile-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-

      - name: Prepare Phase429 build directory
        if: steps.phase431-objects.outputs.cache-hit != 'true' && steps.phase430-objects.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          BUILD="$PWD/workspace/gki-phase199-out"
          mkdir -p "$BUILD"
          cp phase429-gki-out/config/final.config "$BUILD/.config"
          make -C "$PWD/gki/common" O="$BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Reapply exact Phase430 diagnostics
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/430_apply_sf_dma_forensics.py --root "$ROOT"
          python3 scripts/430_apply_sf_dma_forensics.py --root "$ROOT" --check-only
          python3 scripts/430_postapply_hardening.py --root "$ROOT"
          python3 scripts/430_postapply_hardening.py --root "$ROOT" --check-only

      - name: Apply Phase431 safe gap diagnostics
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          python3 scripts/431_apply_safe_gap_forensics.py --root "$ROOT"
          python3 scripts/431_apply_safe_gap_forensics.py --root "$ROOT" --check-only

          # Phase414 stays exactly 2 MiB Samsung first, then 1 MiB persistent RAM.
          grep -Fq '#define A52_P414_DEBUG_OFFSET        0x00800000ULL' \
            "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          grep -Fq '#define A52_P414_DISK_BYTES          (2U * SZ_1M)' \
            "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          grep -Fq '#define A52_P414_RAM_PHYS            0xB1A00000ULL' \
            "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          grep -Fq '#define A52_P414_RAM_BYTES           SZ_1M' \
            "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"

          ! grep -Fq 'a52_p430_ufs_compact(snapshot_id);' "$ROOT/arch/arm64/kernel/syscall.c"
          python3 - <<'PY'
          from pathlib import Path
          u=Path("gki/common/drivers/scsi/ufs/ufshcd.c").read_text()
          assert u.count("WRITE_ONCE(a52_r378_hba, hba);") == 1, "unexpected HBA assignment count"
          assert u.count("a52_r378_start_snapshots(") == 1, "Phase378 starter has an active call site"
          assert "Phase430: retain HBA identity even though Phase378 sampler stays retired." not in u
          print("Phase431 UFS safety validation: PASS")
          PY

          # TouchGrass-validated event-style chronology, bounded to the SF window.
          grep -Fq 'P431 RI e n=%d irq=%d st=%lx use=%u' "$ROOT/drivers/soc/qcom/rpmh-rsc.c"
          grep -Fq 'P431 RC n=%d id=%d e=%d st=%u c=%u' "$ROOT/drivers/soc/qcom/rpmh-rsc.c"
          grep -Fq 'P276 301R e st=%d ty=%d n=%d off=%d use=%u ws=%u irq=%d' "$ROOT/drivers/soc/qcom/rpmh-rsc.c"
          grep -Fq 'P276 301B A r=%d st=%d mb=%s' "$ROOT/drivers/soc/qcom/msm_bus/msm_bus_fabric_rpmh.c"

      - name: Compile Phase431 with ccache
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          make -C "$ROOT" O="$BUILD" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image

          IMAGE="$BUILD/arch/arm64/boot/Image"
          MAP="$BUILD/System.map"
          test -s "$IMAGE"
          test -s "$MAP"
          python3 scripts/431_apply_safe_gap_forensics.py --root "$ROOT" --check-only

          grep -aFq 'P431 SF0 p=%d ns=%llu' "$IMAGE"
          grep -aFq 'P431 SB id=%u rel=%llu' "$IMAGE"
          grep -aFq 'P431 SD id=%u nr=%u rel=%llu' "$IMAGE"
          grep -aFq 'P431 EXEC affinity cpu=7 rc=%d' "$IMAGE"
          grep -aFq 'P431 RI e n=%d irq=%d st=%lx use=%u' "$IMAGE"
          grep -aFq 'P431 RC n=%d id=%d e=%d st=%u c=%u' "$IMAGE"
          grep -aFq 'P430 PANIC_ARMED ctrl=%d irq=%u' "$IMAGE"
          grep -Fq ' a52_p430_dma_finalize' "$MAP"
          grep -Fq ' a52_p430_smmu_forensic' "$MAP"

          ccache -s

      - name: Save Phase431 object cache
        if: success() && steps.phase431-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/gki-phase199-out
          key: a52xq-phase431-objects-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ hashFiles('scripts/431_apply_safe_gap_forensics.py', 'scripts/430_apply_sf_dma_forensics.py', 'scripts/430_postapply_hardening.py', 'scripts/430_parts/**') }}

      - name: Save rolling clang ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-clang-ccache-v2-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-${{ github.run_id }}

      - name: Package Phase431
        if: success()
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          BUILD="$PWD/workspace/gki-phase199-out"
          OUT="$PWD/phase431-gki-out"
          SOURCE_BOOT="$PWD/phase429-gki-out/package/boot-phase429-apex-sf-focused-census-v1.img"
          FINAL="$OUT/package/boot-phase431-safe-sf-gap-forensics-v1.img"

          rm -rf "$OUT"
          cp -a phase429-gki-out "$OUT"
          cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image"
          cp "$BUILD/System.map" "$OUT/compile/System.map"
          cp "$BUILD/.config" "$OUT/config/final.config"
          cp "$ROOT/arch/arm64/kernel/syscall.c" "$OUT/source/syscall.c"
          cp "$ROOT/drivers/scsi/ufs/ufshcd.c" "$OUT/source/ufshcd.c"
          cp "$ROOT/drivers/soc/qcom/rpmh-rsc.c" "$OUT/source/rpmh-rsc.c"
          cp "$ROOT/drivers/soc/qcom/msm_bus/msm_bus_fabric_rpmh.c" "$OUT/source/msm_bus_fabric_rpmh.c"
          cp "$ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c" "$OUT/source/a52_ack_secure_flight_recorder.c"
          cp "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl.c" "$OUT/source/dsi_ctrl.c"
          cp "$ROOT/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c" "$OUT/source/dsi_ctrl_hw_cmn.c"
          cp "$ROOT/drivers/iommu/arm/arm-smmu/arm-smmu.c" "$OUT/source/arm-smmu.c"

          mkdir -p "$OUT/audit"
          cp scripts/431_apply_safe_gap_forensics.py scripts/decode_phase431_gap.py "$OUT/audit/"

          gzip -n -c "$BUILD/arch/arm64/boot/Image" > "$OUT/package/Image.gz"
          python3 scripts/38_repack_a52_p1_boot.py \
            --source "$SOURCE_BOOT" --kernel "$OUT/package/Image.gz" \
            --output "$FINAL" --report "$OUT/package/phase431-repack-report.json"
          test "$(stat -c '%s' "$FINAL")" -eq 100663296

          cat > "$OUT/PHASE431-NOTES.txt" <<'EOF'
          Phase431 safe SF-gap + exact-F0 DMA forensics
          =================================================
          - Removes the Phase430 asynchronous UFS snapshot call entirely.
          - Removes Phase430's re-registration of a52_r378_hba.
          - Keeps the Phase403-retired historical UFS sampler retired.
          - SurfaceFlinger snapshots: +0, +1, +3, +5, +20, +60 s plus first atomic.
          - P431 SB is persisted before task discovery; SL after discovery; TB/TD
            bracket each stack capture; SD is written after task records persist.
          - Three-copy CRC task records remain.
          - Final 0x200 bytes of the task sideband carry the CPU7 CNTPCT
            non-interrupt execution witness around SF+4.5..20 s.
          - TouchGrass-style event chronology is retained without broad function
            tracing: inherited Phase301 Display-RSC/RPMh/msm_bus send/vote markers,
            plus bounded P431 RI/RC Display-RSC IRQ completion records.
          - Phase430 exact-F0 diagnostics remain intact: raw DSI samples, corrected
            TCS0/TCS1, clocks/power, passive SMMU, SW translation, hardware
            ATS1PR/ATSR/PAR, three-copy DMA image, PANIC_ARMED + dump_stack().
          - Invalid-IOVA control remains compiled but disabled.
          - Phase414 chronology remains 2 MiB Samsung debug partition first,
            followed by 1 MiB persistent RAM, non-wrapping.
          - Build caching uses compact Phase357/429 source snapshots plus a rolling
            1 GiB clang ccache; full 600-900 MiB object-tree caches are optional only.
          EOF

          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
          sha256sum "$FINAL"

      - name: Upload Phase431 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE431-FAIL-DIAG-${{ github.run_number }}
          path: |
            gki/common/arch/arm64/kernel/syscall.c
            gki/common/drivers/scsi/ufs/ufshcd.c
            gki/common/drivers/soc/qcom/rpmh-rsc.c
            gki/common/drivers/soc/qcom/msm_bus/msm_bus_fabric_rpmh.c
            gki/common/drivers/a52_secure/a52_ack_secure_flight_recorder.c
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl.c
            gki/common/drivers/a52_display/msm/dsi/dsi_ctrl_hw_cmn.c
            gki/common/drivers/iommu/arm/arm-smmu/arm-smmu.c
            workspace/gki-phase199-out/.config
            workspace/gki-phase199-out/System.map
            scripts/431_apply_safe_gap_forensics.py
            scripts/decode_phase431_gap.py
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7

      - name: Upload Phase431
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE431-SAFE-SF-GAP-${{ github.run_number }}
          path: phase431-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Upload Phase431 boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-PHASE431-SAFE-SF-GAP-${{ github.run_number }}-BOOT-IMG
          path: phase431-gki-out/package/boot-phase431-safe-sf-gap-forensics-v1.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
