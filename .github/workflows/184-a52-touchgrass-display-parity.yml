name: 184 - A52 TouchGrass display dependency parity

run-name: Compare working TouchGrass display initialization against phase 183

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-touchgrass-display-parity-v1
    paths:
      - .github/workflows/184-a52-touchgrass-display-parity.yml
      - scripts/184_compare_touchgrass_display.py
      - scripts/184_effective_dt_audit.py
  pull_request:
    branches:
      - agent/a52-dispcc-probe-trace-v1
    paths:
      - .github/workflows/184-a52-touchgrass-display-parity.yml
      - scripts/184_compare_touchgrass_display.py
      - scripts/184_effective_dt_audit.py

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-touchgrass-display-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  GKI_COMMON_TAG: android12-5.10-2026-04_r1
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  SOURCE_ARTIFACT_ID: '8681171875'
  SOURCE_ARTIFACT_SHA256: c9f6b0041abd5c9305d05534b1afcdf5ebee6de607ad08784721e364a2bf4c11

jobs:
  compare:
    name: Compare TouchGrass and phase-183 display initialization
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out comparison branch
        uses: actions/checkout@v4

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-${{ env.GKI_COMMON_TAG }}-${{ env.GKI_COMMON_SHA }}

      - name: Restore prepared TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass vendor source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "${TOUCHGRASS_REPO}"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "${TOUCHGRASS_COMMIT}"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Validate exact sources
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          test -d gki/common/.git
          test -d workspace/touchgrass-a52xq/.git
          test "$(git -C gki/common rev-parse HEAD)" = "${GKI_COMMON_SHA}"
          test "$(git -C workspace/touchgrass-a52xq rev-parse HEAD)" = "${TOUCHGRASS_COMMIT}"
          test "$(make -s -C gki/common kernelversion)" = 5.10.252
          tg_version="$(make -s -C workspace/touchgrass-a52xq kernelversion)"
          case "$tg_version" in
            4.19.152|4.19.200) ;;
            *) printf 'unexpected TouchGrass version: %s\n' "$tg_version" >&2; exit 1 ;;
          esac
          printf 'touchgrass_version=%s\n' "$tg_version"

      - name: Install DT analysis dependency
        run: |
          set -Eeuo pipefail
          if ! command -v dtc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends device-tree-compiler
          fi
          dtc --version
          command -v fdtoverlay

      - name: Reconstruct exact audited phase 183 source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GKI_CACHE_HIT: ${{ steps.gki-cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          bash scripts/183_ci.sh
          test -f gki/common/drivers/pinctrl/qcom/pinctrl-lagoon.c
          test -f gki/common/drivers/clk/qcom/dispcc-lagoon.c
          test -f gki/common/drivers/irqchip/qcom-pdc.c
          test -s artifacts/a52xq-dispcc-probe-trace/package/boot.img
          grep -Fqx 'CONFIG_DISP_CC_LAGOON=y' artifacts/a52xq-dispcc-probe-trace/config/final.config
          grep -Fqx 'CONFIG_PINCTRL_LAGOON=y' artifacts/a52xq-dispcc-probe-trace/config/final.config
          git -C gki/common diff --check

      - name: Resolve exact TouchGrass configuration
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-config-out
          make -C workspace/touchgrass-a52xq \
            O="$PWD/workspace/touchgrass-config-out" \
            ARCH=arm64 a52xq_defconfig
          test -s workspace/touchgrass-config-out/.config
          grep -Fqx 'CONFIG_PINCTRL_LAGOON=y' workspace/touchgrass-config-out/.config
          grep -Fqx 'CONFIG_QCOM_PDC=y' workspace/touchgrass-config-out/.config

      - name: Generate complete display initialization parity report
        run: |
          set -Eeuo pipefail
          rm -rf artifacts/a52-touchgrass-display-parity
          python3 scripts/184_compare_touchgrass_display.py \
            --touchgrass workspace/touchgrass-a52xq \
            --gki gki/common \
            --touchgrass-config workspace/touchgrass-config-out/.config \
            --gki-config artifacts/a52xq-dispcc-probe-trace/config/final.config \
            --phase183-artifact artifacts/a52xq-dispcc-probe-trace \
            --output artifacts/a52-touchgrass-display-parity

      - name: Audit A52 board revisions and effective display DT
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52-touchgrass-display-parity/effective-dt
          mkdir -p "$OUT"
          python3 scripts/184_effective_dt_audit.py \
            --helpers scripts/184_compare_touchgrass_display.py \
            --touchgrass workspace/touchgrass-a52xq \
            --gki gki/common \
            --phase183-dtb artifacts/a52-touchgrass-display-parity/phase183-preserved-base.dtb \
            --output "$OUT"
          test -s "$OUT/EFFECTIVE-DT-REPORT.md"
          test -s "$OUT/effective-dt-audit.json"
          test -s "$OUT/touchgrass-display-dependencies.json"
          test -s "$OUT/a52-panel-property-hashes.json"
          grep -Fq 'a52-touchgrass-effective-dt-display-audit-not-flashable' "$OUT/effective-dt-audit.json"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          sed -n '1,260p' "$OUT/EFFECTIVE-DT-REPORT.md"

      - name: Audit comparison artifact
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52-touchgrass-display-parity
          test -s "$OUT/REPORT.md"
          test -s "$OUT/comparison.json"
          test -s "$OUT/critical-node-driver-matrix.json"
          test -s "$OUT/config-comparison.json"
          test -s "$OUT/function-locations-touchgrass.json"
          test -s "$OUT/function-locations-phase183.json"
          test -s "$OUT/init-registration-touchgrass.json"
          test -s "$OUT/init-registration-phase183.json"
          test -s "$OUT/phase183-preserved-base.dtb"
          test -s "$OUT/phase183-preserved-base.dts"
          test -s "$OUT/effective-dt/EFFECTIVE-DT-REPORT.md"
          grep -Fq 'a52-touchgrass-display-parity-v2-not-flashable' "$OUT/comparison.json"
          grep -Fq 'Runtime compatible audit' "$OUT/REPORT.md"
          ! find "$OUT" -type f \( -name boot.img -o -name Image -o -name Image.gz \) | grep -q .
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          sed -n '1,320p' "$OUT/REPORT.md"

      - name: Upload non-flashable comparison
        uses: actions/upload-artifact@v4
        with:
          name: a52-touchgrass-display-parity-v2-${{ github.run_number }}-NOT-FLASHABLE
          path: artifacts/a52-touchgrass-display-parity
          if-no-files-found: error
          retention-days: 30
