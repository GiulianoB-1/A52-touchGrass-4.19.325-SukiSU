name: Phase446 canonical field inspect
run-name: Phase446 canonical field inspect
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact fields and bus patch
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          s=zlib.decompress(base64.b64decode(Path("scripts/446_apply_heartbeat_cb2.py.z64").read_text().strip())).decode()
          for k in ["sspp_off","struct p446_rec","ctl_","lm_","0x29000","0x45000","0x2000","bcm_remove_handoff_req","bus_dev = NULL","def patch_central"]:
            print("\n########",k,"########")
            p=0; n=0
            while True:
              i=s.find(k,p)
              if i<0 or n>=8: break
              print(s[max(0,i-2600):min(len(s),i+6500)])
              p=i+len(k); n+=1
          PY
