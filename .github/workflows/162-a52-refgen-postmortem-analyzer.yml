name: 162 - A52 REFGEN postmortem analyzer

run-name: Validate metadata-only REFGEN hardware-test and diagnosis tooling

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - tools/a52-refgen/diagnose-a52-refgen-display.py
      - tools/a52-refgen/validate-a52-refgen-hardware-inputs.py
      - tools/a52-refgen/preflight_a52_refgen_candidate.bat
      - tools/a52-refgen/validate_a52_refgen_capture.bat
      - docs/A52-REFGEN-POSTMORTEM.md
      - .github/workflows/162-a52-refgen-postmortem-analyzer.yml
  push:
    branches:
      - agent/a52-refgen-postmortem-analyzer
      - agent/a52-refgen-context-aware-analyzer
      - agent/a52-refgen-hardware-intake-validator
    paths:
      - tools/a52-refgen/diagnose-a52-refgen-display.py
      - tools/a52-refgen/validate-a52-refgen-hardware-inputs.py
      - tools/a52-refgen/preflight_a52_refgen_candidate.bat
      - tools/a52-refgen/validate_a52_refgen_capture.bat
      - docs/A52-REFGEN-POSTMORTEM.md
      - .github/workflows/162-a52-refgen-postmortem-analyzer.yml

permissions:
  contents: read

concurrency:
  group: a52-refgen-postmortem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer-self-test:
    name: Compile and self-test REFGEN hardware-test tooling
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out tooling branch
        uses: actions/checkout@v4

      - name: Compile Python tools
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            tools/a52-refgen/diagnose-a52-refgen-display.py \
            tools/a52-refgen/validate-a52-refgen-hardware-inputs.py

      - name: Run validator safety tests
        run: |
          set -Eeuo pipefail
          python3 tools/a52-refgen/validate-a52-refgen-hardware-inputs.py self-test \
            | tee validator-self-test.json
          grep -Fq '"status": "self-test-passed"' validator-self-test.json
          grep -Fq '"name": "candidate_corruption"' validator-self-test.json
          grep -Fq '"name": "capture_corruption"' validator-self-test.json
          grep -Fq '"name": "zip_traversal_rejected"' validator-self-test.json

      - name: Run built-in verdict tests
        run: |
          set -Eeuo pipefail
          python3 tools/a52-refgen/diagnose-a52-refgen-display.py --self-test \
            | tee analyzer-self-test.json
          grep -Fq '"status": "self-test-passed"' analyzer-self-test.json

      - name: Run decoded-CSV integration test
        run: |
          set -Eeuo pipefail
          mkdir -p fixture output
          cat > fixture/standard.csv <<'EOF_CSV'
          seq,monotonic_ns,pid,tgid,cpu,comm,message
          1,1000000,1,1,0,swapper,WDT disarm before=1 after=0
          2,2000000,1,1,0,swapper,REFGEN driver_register rc=0
          3,3000000,1,1,0,swapper,"REFGEN probe enter compat=qcom,refgen-kona-regulator"
          4,4000000,1,1,0,swapper,REFGEN mapped start=0x88e7000 size=96 raw=0x0
          5,5000000,1,1,0,swapper,REFGEN probe ready initial_enabled=0
          6,6000000,100,100,3,surfaceflinger,REFGEN kona_enable raw=0x0->0x1 enabled=1
          7,7000000,100,100,3,surfaceflinger,DISP enter fn=dsi_display_enable
          8,8000000,2,2,1,kworker,HB tick=1 online=8 run=2 j=100
          EOF_CSV
          sed -i 's/^          //' fixture/standard.csv
          python3 tools/a52-refgen/diagnose-a52-refgen-display.py \
            --standard-csv fixture/standard.csv \
            --screen-result black \
            --output output \
            | tee integration-result.json
          grep -Fq '"verdict": "refgen_operational_display_scope_stalled"' \
            integration-result.json
          grep -Fq '"code": "refgen_operational_display_scope_stalled"' \
            output/diagnosis.json
          test -s output/diagnosis.md
          test -s output/critical-timeline.csv
          grep -Fq '"stock_lagoon_0x60_layout": true' output/diagnosis.json
          grep -Fq '"resource_covers_ctrl5": false' output/diagnosis.json
          grep -Fq 'outside the declared resource span' output/diagnosis.json
          grep -Fq '"pairing": "per-task-pid-tgid-with-comm-fallback"' output/diagnosis.json

      - name: Reject cross-task display scope pairing
        run: |
          set -Eeuo pipefail
          mkdir -p interleaved-output
          cat > fixture/interleaved.csv <<'EOF_CSV'
          seq,monotonic_ns,pid,tgid,cpu,comm,message
          1,1000000,100,100,2,surfaceflinger,DISP enter fn=dsi_display_enable
          2,2000000,200,200,4,composer,DISP enter fn=dsi_display_enable
          3,3000000,100,100,6,surfaceflinger,DISP exit fn=dsi_display_enable us=250
          EOF_CSV
          sed -i 's/^          //' fixture/interleaved.csv
          python3 tools/a52-refgen/diagnose-a52-refgen-display.py \
            --standard-csv fixture/interleaved.csv \
            --output interleaved-output \
            > interleaved-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('interleaved-output/diagnosis.json').read_text())
          unmatched = report['display']['unmatched_entries']
          assert report['display']['pairing'] == 'per-task-pid-tgid-with-comm-fallback'
          assert len(unmatched) == 1
          assert unmatched[0]['pid'] == 200
          assert unmatched[0]['tgid'] == 200
          PY

      - name: Enforce non-destructive metadata-only contract
        run: |
          set -Eeuo pipefail
          grep -Fq 'metadata-only; no secure payloads' \
            tools/a52-refgen/diagnose-a52-refgen-display.py
          grep -Fq 'This tool is deliberately non-destructive' \
            tools/a52-refgen/validate-a52-refgen-hardware-inputs.py
          if grep -niE 'adb[[:space:]]+shell[[:space:]]+(dd|flash)|fastboot[[:space:]]+flash|heimdall[[:space:]]+flash|(^|[^[:alnum:]_])odin([^[:alnum:]_]|$)' \
              tools/a52-refgen/validate-a52-refgen-hardware-inputs.py \
              tools/a52-refgen/preflight_a52_refgen_candidate.bat \
              tools/a52-refgen/validate_a52_refgen_capture.bat; then
            echo 'Unexpected flashing command found in validation tooling' >&2
            exit 1
          fi
          if grep -nE 'command buffer|response buffer|key material|process memory dump' \
              tools/a52-refgen/diagnose-a52-refgen-display.py; then
            echo 'Unexpected payload-capture language found' >&2
            exit 1
          fi
