name: Phase446 source inspect
# exports exact source inputs for heartbeat patching
# audit refresh after corrected Phase446 payload
on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/446-source-inspect.yml]
env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore reconstructed GKI tree
        id: p429
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase429-gki-out
          key: a52xq-phase429-reconstructed-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9
      - name: Exact Lagoon display GDSC and VBIF inspection
        run: |
          set -u
          ROOT="$PWD/gki/common"
          echo "cache-hit=${{ steps.p429.outputs.cache-hit }}"
          echo '=== SDE NODE POWER SUPPLIES ==='
          grep -Rns -A80 -B20 -E 'mdss_mdp:|compatible = "qcom,sde-kms"' "$ROOT/arch/arm64/boot/dts/qcom" 2>/dev/null | head -1800 || true
          echo '=== ALL LAGOON LEGACY GDSC NODES ==='
          grep -Rns -A45 -B20 -Ei 'gdsc|gdscr|power-domain|domain-supply' "$ROOT/arch/arm64/boot/dts/qcom/lagoon"* 2>/dev/null | head -2600 || true
          echo '=== LEGACY GDSC DRIVER STATE SEMANTICS ==='
          grep -n -A90 -B45 -E 'is_enabled|GDSCR|SW_COLLAPSE|PWR_ON|POWER_ON|gdscr|enable\(|disable\(' "$ROOT/drivers/regulator/a52-legacy-gdsc-regulator.c" | head -2600 || true
          echo '=== VBIF HW DEFS ==='
          grep -Rns -A55 -B30 -Ei 'xin.*halt|halt.*xin|pending|pnd|halt_ctrl|xin_halt'             "$ROOT/drivers/a52_display/msm/sde/sde_hw_vbif.c"             "$ROOT/drivers/a52_display/msm/sde/sde_hw_vbif.h"             "$ROOT/drivers/a52_display/msm/sde/sde_hw_catalog.c" 2>/dev/null | head -2400 || true
          echo '=== KMS MMU/RSC/VBIF EXACT CALL ORDER ==='
          grep -n -A180 -B70 -E '_sde_kms_mmu_init|sde_kms_hw_init|sde_rsc|sde_vbif|_sde_kms_hw_init_blocks'             "$ROOT/drivers/a52_display/msm/sde/sde_kms.c" 2>/dev/null | head -4200 || true

      - name: Stage exact Phase446 source inputs
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/gki/common"
          mkdir -p p446-src
          cp "$ROOT/drivers/a52_display/msm/sde/sde_kms.c" p446-src/
          cp "$ROOT/drivers/a52_display/msm/sde_power_handle.c" p446-src/
          cp "$ROOT/drivers/a52_display/msm/sde/sde_hw_vbif.c" p446-src/
          cp "$ROOT/drivers/a52_display/msm/sde/sde_hw_vbif.h" p446-src/
          cp "$ROOT/drivers/a52_display/msm/msm_drv.c" p446-src/
          cp "$ROOT/drivers/a52_display/msm/dsi/dsi_display.c" p446-src/
          cp "$ROOT/drivers/a52_display/msm/dsi/dsi_panel.c" p446-src/
          cp "$ROOT/drivers/iommu/iommu.c" p446-src/
          cp "$ROOT/drivers/iommu/arm/arm-smmu/arm-smmu.c" p446-src/
          cp "$ROOT/drivers/regulator/a52-legacy-gdsc-regulator.c" p446-src/
          cp "$ROOT/drivers/clk/qcom/dispcc-lagoon.c" p446-src/
          cp "$ROOT/drivers/clk/qcom/gcc-lagoon.c" p446-src/
          cp "$ROOT/arch/arm64/boot/dts/qcom/lagoon-sde.dtsi" p446-src/
          cp "$ROOT/arch/arm64/boot/dts/qcom/lagoon-gdsc.dtsi" p446-src/
      - name: Audit decoded Phase446 draft
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          p=Path("scripts/446_apply_early_heartbeat.py.z64")
          s=zlib.decompress(base64.b64decode(p.read_text().strip())).decode()
          print("=== PHASE446 DRAFT HEAD ===")
          print(s[:60000])
          print("=== PHASE446 DRAFT KEY TOKENS ===")
          for n in ["H00","H15","F446-00","F446-16","cb2_reuse","keep_boot_bw","bus_proxy","handoff","SDE_POWER_HANDLE_CONT_SPLASH_BUS","sde_power_data_bus_set_quota","arm_smmu","earlymap","SCTLR","TLBI","CB2","CB4"]:
              print(n, s.count(n))
          Path("p446-src/446_apply_early_heartbeat.decoded.py").write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase446-exact-source-inputs
          path: p446-src/
          compression-level: 0
          retention-days: 7
