name: 226 - A52 odsign gate RS48 recorder

run-name: Build Phase 226 odsign post-fs-data gate recorder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase226-odsign-gate-v1
    paths:
      - .github/workflows/213-a52-ion-transaction-trace.yml
      - scripts/218_payload.py
      - scripts/218_phase217_wrapper.py.z64
      - scripts/226_driver_chunks/**
      - scripts/226_payload_chunks/**
      - scripts/226_design.md
      - scripts/226_trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-phase226-odsign-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  SOURCE_ARTIFACT_ID: '8681171875'
  SOURCE_ARTIFACT_SHA256: c9f6b0041abd5c9305d05534b1afcdf5ebee6de607ad08784721e364a2bf4c11
  PHASE198_ARTIFACT_ID: '8819127383'
  PHASE198_ARTIFACT_SHA256: 99ff045d09811d43106612ef2682216a7d29dfaa7825e2360bef403e31a41eb6
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git

jobs:
  build-package:
    name: Build and audit Phase 226 odsign recorder
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out Phase 226 branch
        uses: actions/checkout@v4

      - name: Materialize and verify Phase 213-226 scripts
        run: |
          set -Eeuo pipefail
          python3 scripts/213_payload.py
          python3 scripts/216_payload.py
          python3 scripts/217_payload.py
          mv scripts/217_apply_graphics_service_trace.py \
             scripts/217_apply_graphics_service_trace_base.py
          python3 scripts/218_payload.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/217_ci.sh')
          text = path.read_text(encoding='utf-8')
          old = '#define A52_R179_HEARTBEAT_LIMIT 60U'
          new = '#define A52_R179_HEARTBEAT_LIMIT 180U'
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected exactly one stale Phase 217 heartbeat audit, found {text.count(old)}'
              )
          path.write_text(text.replace(old, new), encoding='utf-8')
          repaired = path.read_text(encoding='utf-8')
          if old in repaired or repaired.count(new) != 1:
              raise SystemExit('Phase 226 heartbeat audit repair failed')
          print('Phase 217 heartbeat audit updated for Phase 226 limit 180U')
          PY
          cp scripts/218_phase217_wrapper.py \
             scripts/217_apply_graphics_service_trace.py
          sed -i 's|cp -a "$BASE_OUT" "$OUT"|cp -a "$BASE_OUT"/. "$OUT"/|' scripts/213_ci.sh
          grep -Fq 'cp -a "$BASE_OUT"/. "$OUT"/' scripts/213_ci.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/213_apply_ion_transaction_trace.py')
          text = path.read_text(encoding='utf-8')
          old = r'pr_warn_once("%s: ioctl validate failed\n", __func__);'
          new = r'pr_warn_once("%s: ioctl validate failed\\n", __func__);'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Phase 213 C-string escape target')
          path.write_text(text.replace(old, new), encoding='utf-8')
          repaired = path.read_text(encoding='utf-8')
          if repaired.count(new) != 1 or old in repaired:
              raise SystemExit('Phase 213 C-string escape repair failed')
          print('Phase 213 C-string newline escape repaired')
          PY
          python3 -m py_compile \
            scripts/213_payload.py \
            scripts/216_payload.py \
            scripts/217_payload.py \
            scripts/218_payload.py \
            scripts/213_apply_ion_transaction_trace.py \
            scripts/214_apply_qsecom_heap27.py \
            scripts/215_apply_qsee_transaction_trace.py \
            scripts/216_apply_qsee_deep_trace.py \
            scripts/217_apply_graphics_service_trace_base.py \
            scripts/218_apply_keymint_qsee_trace.py \
            scripts/222_apply_sg_boot_progress_trace.py \
            scripts/222_compare_runtime_traces.py \
            scripts/223_apply_ufs_query_ioctl.py \
            scripts/224_apply_early_userspace_trace.py \
            scripts/225_apply_kgsl_late_state.py \
            scripts/226_apply_odsign_gate_trace.py \
            scripts/218_phase217_wrapper.py \
            scripts/217_apply_graphics_service_trace.py
          bash -n scripts/213_ci.sh
          bash -n scripts/214_ci.sh
          bash -n scripts/215_ci.sh
          bash -n scripts/216_ci.sh
          bash -n scripts/217_ci.sh

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile \
            scripts/199_runtime_fix_crc_anchor_v2.py \
            scripts/199_runtime_fix_binary_audit.py \
            scripts/199_apply_recorder_crc32c.py \
            scripts/200_apply_smmu_defer_trace.py \
            scripts/201_apply_smmu_component_dependency.py \
            scripts/202_apply_driver_core_trace.py \
            scripts/203_apply_apps_smmu_qsmmuv500_compat.py \
            scripts/204_apply_apps_smmu_scm_handoff.py \
            scripts/206_apply_smmu_display_contracts.py \
            scripts/208_apply_secure_vmid.py \
            scripts/210_apply_first_atomic_rs48.py \
            scripts/211_apply_drm_client_trace.py \
            scripts/211_decode_r210_rs48_transport_fusion.py \
            scripts/212_apply_graphics_startup_trace.py \
            scripts/213_apply_ion_transaction_trace.py \
            scripts/214_apply_qsecom_heap27.py \
            scripts/215_apply_qsee_transaction_trace.py \
            scripts/216_apply_qsee_deep_trace.py \
            scripts/217_apply_graphics_service_trace_base.py \
            scripts/218_apply_keymint_qsee_trace.py \
            scripts/222_apply_sg_boot_progress_trace.py \
            scripts/223_apply_ufs_query_ioctl.py \
            scripts/224_apply_early_userspace_trace.py \
            scripts/225_apply_kgsl_late_state.py \
            scripts/226_apply_odsign_gate_trace.py \
            scripts/218_phase217_wrapper.py \
            scripts/217_apply_graphics_service_trace.py \
            scripts/38_repack_a52_p1_boot.py
          bash -n scripts/208_reconstruct_phase206_source.sh
          bash -n scripts/209_prepare_phase206.sh
          bash -n scripts/212_ci.sh
          bash -n scripts/213_ci.sh
          bash -n scripts/214_ci.sh
          bash -n scripts/215_ci.sh
          bash -n scripts/216_ci.sh
          bash -n scripts/217_ci.sh

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}

      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "${TOUCHGRASS_REPO}"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "${TOUCHGRASS_COMMIT}"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD

      - name: Build, package and audit Phase 226
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          test -d workspace/touchgrass-a52xq/.git
          test "$(git -C workspace/touchgrass-a52xq rev-parse HEAD)" = "${TOUCHGRASS_COMMIT}"
          python3 scripts/199_runtime_fix_crc_anchor_v2.py
          python3 scripts/199_runtime_fix_binary_audit.py
          bash scripts/209_prepare_phase206.sh
          bash scripts/213_ci.sh
          bash scripts/214_ci.sh
          bash scripts/215_ci.sh
          bash scripts/216_ci.sh
          bash scripts/217_ci.sh
          OUT=artifacts/a52xq-graphics-startup-trace
          TRACE_ROOT=workspace/gki-phase199-src
          if test ! -f "$TRACE_ROOT/fs/exec.c"; then TRACE_ROOT=gki/common; fi
          grep -Fq 'A52_PHASE226_ODSIGN_GATE_TRACE' "$TRACE_ROOT/drivers/a52_secure/a52_ack_secure_flight_recorder.c"
          grep -Fq 'A52_PHASE226_ODSIGN_GATE_TRACE' "$TRACE_ROOT/fs/exec.c"
          grep -Fq 'A52_PHASE226_ODSIGN_GATE_TRACE' "$TRACE_ROOT/kernel/exit.c"
          grep -Fq 'A52_PHASE226_ODSIGN_GATE_TRACE' "$TRACE_ROOT/fs/open.c"
          grep -Fq 'A52_PHASE226_ODSIGN_GATE_TRACE' "$TRACE_ROOT/fs/ioctl.c"
          grep -Fq 'A52_PHASE226_ODSIGN_GATE_TRACE' "$TRACE_ROOT/net/socket.c"
          for marker in \
            'ODSPOST 226 ts' \
            'ODSPOST 226 exec' \
            'ODSPOST 226 exit' \
            'ODSPOST 226 open' \
            'ODSPOST 226 io-' \
            'ODSPOST 226 con-' \
            'GFXPOST 225 ks1' \
            'GFXPOST 225 ks2'; do
            grep -aFq "$marker" "$OUT/compile/Image"
          done
          cp scripts/226_design.md "$OUT/PHASE226-DESIGN.md"
          cp scripts/226_trigger.txt "$OUT/PHASE226-HARDWARE-TEST.txt"
          printf '%s\n' \
            'Phase 226 adds metadata-only odsign/odrefresh gate tracing.' \
            'It does not bypass signing, publish completion properties, weaken fs-verity, or record payload buffers or key material.' \
            >> "$OUT/README-FIRST.txt"

      - name: Upload failed diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-odsign-gate-${{ github.run_number }}-FAILED-DIAGNOSTICS
          path: artifacts/a52xq-graphics-startup-trace
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Phase 226 candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-odsign-gate-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-graphics-startup-trace
          if-no-files-found: error
          retention-days: 30
