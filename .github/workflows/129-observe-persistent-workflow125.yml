name: 129 - Observe persistent Workflow 125

on:
  push:
    branches:
      - agent/a52-keymaster-real-ion
    paths:
      - .github/workflows/129-observe-persistent-workflow125.yml

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: observe-persistent-workflow125-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"workflow-125-persistent\",\"description\":\"Persistent Workflow 125 is queued\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions\"}"

      - name: Dispatch Workflow 125 on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/125-touchgrass-4.19-keymaster-flight-recorder.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"

      - name: Discover and wait for Workflow 125
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          output = os.environ['GITHUB_OUTPUT']
          workflow = '125-touchgrass-4.19-keymaster-flight-recorder.yml'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'workflow-129-observer',
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe='')
          list_url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs'
              f'?branch={encoded_branch}&event=workflow_dispatch&per_page=30'
          )

          selected = None
          for _ in range(90):
              data = get_json(list_url)
              candidates = [
                  run for run in data.get('workflow_runs', [])
                  if run.get('head_sha') == sha
                  and run.get('event') == 'workflow_dispatch'
              ]
              if candidates:
                  selected = max(candidates, key=lambda run: run['id'])
                  break
              time.sleep(5)

          if selected is None:
              with open(output, 'a', encoding='utf-8') as handle:
                  handle.write('conclusion=not_found\n')
                  handle.write(
                      f'run_url=https://github.com/{repo}/actions/workflows/{workflow}\n'
                  )
              raise SystemExit(0)

          run_id = selected['id']
          run_url = selected['html_url']
          conclusion = 'timeout'
          for _ in range(360):
              run = get_json(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              )
              if run.get('status') == 'completed':
                  conclusion = run.get('conclusion') or 'unknown'
                  break
              time.sleep(10)

          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f'run_id={run_id}\n')
              handle.write(f'run_url={run_url}\n')
              handle.write(f'conclusion={conclusion}\n')
          print(f'Workflow 125 run {run_id}: {conclusion} - {run_url}')
          PY

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_CONCLUSION: ${{ steps.observe.outputs.conclusion }}
          OBSERVED_RUN_URL: ${{ steps.observe.outputs.run_url }}
        run: |
          set -Eeuo pipefail
          conclusion="${OBSERVED_CONCLUSION:-observer_failed}"
          run_url="${OBSERVED_RUN_URL:-https://github.com/${GITHUB_REPOSITORY}/actions}"
          if [ "$conclusion" = success ]; then
            state=success
            description='Persistent Workflow 125 passed'
          else
            state=failure
            description="Persistent Workflow 125: ${conclusion}"
          fi
          payload="$(python3 - "$state" "$description" "$run_url" <<'PY'
          import json
          import sys
          print(json.dumps({
              'state': sys.argv[1],
              'context': 'workflow-125-persistent',
              'description': sys.argv[2][:140],
              'target_url': sys.argv[3],
          }))
          PY
          )"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          test "$state" = success
