name: 92 - A52 Turnip Mesa 26.2.2 A619 KGSL Vulkan 1.3

on:
  push:
    branches:
      - agent/a52-turnip-mesa-26.2.2-a619-kgsl-v1
    paths:
      - .github/workflows/92-a52-turnip-mesa-26.2.2-a619-kgsl-vulkan13.yml
      - scripts/92_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a52-turnip-mesa-26.2.2-a619-kgsl-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 30.0.16248370
  GLSLANG_VERSION: 16.6.0
  GLSLANG_COMMIT: e1b562a8bed273a02f30b59b66a5d499793cede5
  CCACHE_DIR: ${{ github.workspace }}/.ccache-turnip
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    name: Build Mesa 26.2.2 Turnip A619 KGSL Vulkan 1.3
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils zip unzip file binutils patchelf ccache pkg-config cmake \
            python3 python3-pip python3-setuptools python3-wheel \
            flex bison git ca-certificates
          python3 -m pip install --user --upgrade "meson>=1.4" ninja mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build pinned glslang >= 12.2
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/glslang-src"
          BUILD="$RUNNER_TEMP/glslang-build"
          DEST="$HOME/.local/bin"

          rm -rf "$SRC" "$BUILD"
          git clone --filter=blob:none https://github.com/KhronosGroup/glslang.git "$SRC"
          git -C "$SRC" checkout --detach "$GLSLANG_COMMIT"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$GLSLANG_COMMIT"

          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXTERNAL=OFF \
            -DENABLE_OPT=OFF \
            -DENABLE_HLSL=OFF \
            -DGLSLANG_TESTS=OFF \
            -DGLSLANG_ENABLE_INSTALL=OFF \
            -DENABLE_GLSLANG_BINARIES=ON

          cmake --build "$BUILD" --target glslang-standalone --parallel 2

          GLSLANG_VALIDATOR="$BUILD/StandAlone/glslangValidator"
          test -x "$GLSLANG_VALIDATOR"
          mkdir -p "$DEST"
          cp -L "$GLSLANG_VALIDATOR" "$DEST/glslangValidator"
          chmod 0755 "$DEST/glslangValidator"

          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/glslangValidator" --version

      - name: Locate Android SDK
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdk_root=$SDK_ROOT"
          echo "sdkmanager=$SDKMANAGER"

      - name: Install pinned Android NDK r30
        run: |
          set -Eeuo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang" --version

      - name: Restore Turnip compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache-turnip
          key: a52-turnip-26.2.2-ndk30-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            a52-turnip-26.2.2-ndk30-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build Mesa 26.2.2 Turnip for A619 KGSL
        run: |
          set -o pipefail
          chmod +x scripts/92_build_turnip_mesa_26_2_2.sh
          mkdir -p artifacts
          ./scripts/92_build_turnip_mesa_26_2_2.sh "$GITHUB_WORKSPACE" "$NDK_ROOT" \
            "$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2" \
            2>&1 | tee artifacts/turnip-mesa-26.2.2-build.log

      - name: Package reversible KernelSU module
        run: |
          set -Eeuo pipefail
          chmod +x scripts/92_package_turnip_a619_module.sh
          ./scripts/92_package_turnip_a619_module.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/artifacts/turnip-mesa-26.2.2" \
            "$GITHUB_WORKSPACE/release-turnip"

      - name: Audit Turnip HAL and package
        run: |
          set -Eeuo pipefail
          DRIVER=artifacts/turnip-mesa-26.2.2/dist/vulkan.adreno.so
          PROBE=artifacts/turnip-mesa-26.2.2/dist/turnip-vk-probe
          INFO=artifacts/turnip-mesa-26.2.2/BUILD-INFO.txt
          ZIP=release-turnip/touchGrass-Turnip-A619-Mesa-26.2.2-KGSL-Vulkan-1.3-KSU.zip

          test -s "$DRIVER"
          test -s "$PROBE"
          test -s "$ZIP"
          grep -Fxq 'mesa_version=26.2.2' "$INFO"
          grep -Fxq 'gpu=Adreno 619' "$INFO"
          grep -Fxq 'kmd=KGSL' "$INFO"
          grep -Fxq 'android_api=36' "$INFO"
          grep -Fxq 'turnip_api_cap=Vulkan-1.3' "$INFO"
          grep -Fxq 'turnip_upstream_api=Vulkan-1.4' "$INFO"
          grep -Fxq 'probe_mode=device-create-buffer-fill-queue-submit-fence-memory-verify' "$INFO"

          file "$DRIVER" | grep -Fq 'ARM aarch64'
          file "$PROBE" | grep -Fq 'ARM aarch64'
          readelf -d "$PROBE" | grep -Fq 'Shared library: [libvulkan.so]'
          strings "$PROBE" | grep -Fq 'gpu_submit_status=PASS'
          strings "$PROBE" | grep -Fq 'verify_mismatches=%u'
          strings "$PROBE" | grep -Fq 'noop_submit_status=PASS'
          strings "$PROBE" | grep -Fq 'noop_before_vkQueueSubmit=1'
          strings "$PROBE" | grep -Fq 'fill_before_vkQueueSubmit=1'
          strings "$PROBE" | grep -Fq 'vkQueueSubmit_result=%d'
          strings "$PROBE" | grep -Fq 'vkWaitForFences_result=%d'
          readelf -d "$DRIVER" | grep -Fq 'vulkan.adreno.so'
          ! readelf -d "$DRIVER" | grep -Fq '(RUNPATH)'
          readelf -Ws "$DRIVER" | grep -Eq '[[:space:]]HMI$'
          for lib in libhardware.so liblog.so libnativewindow.so libsync.so libc.so; do
            readelf -d "$DRIVER" | grep -Fq "Shared library: [$lib]"
          done

          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -Fxq 'id=touchgrass_turnip_a619'
          unzip -p "$ZIP" module.prop | grep -Fxq 'version=0.5-vk1.3-submit-forensics'
          unzip -p "$ZIP" tools/turnip-live-test.sh | grep -Fq 'STOCK QUALCOMM SUBMISSION BASELINE'
          unzip -p "$ZIP" tools/turnip-live-test.sh | grep -Fq 'TURNIP VULKAN SUBMISSION PROBE'
          unzip -p "$ZIP" tools/turnip-live-test.sh | grep -Fq 'TURNIP KERNEL WATCH'
          unzip -p "$ZIP" tools/turnip-live-test.sh | grep -Fq 'timeout 20'
          unzip -p "$ZIP" post-fs-data.sh | grep -Fq 'boot_override=disabled'
          ! unzip -p "$ZIP" post-fs-data.sh | grep -Fq 'mount -o bind'
          unzip -p "$ZIP" action.sh | grep -Fq 'turnip-live-test.sh'
          unzip -p "$ZIP" README.txt | grep -Fq '32-bit Vulkan applications continue using the stock Qualcomm 32-bit driver'
          unzip -l "$ZIP" | grep -Fq 'tools/turnip-vk-probe'
          unzip -l "$ZIP" | grep -Fq 'tools/turnip-live-test.sh'

          sha256sum "$DRIVER" "$PROBE" "$ZIP" | tee artifacts/turnip-final-sha256.txt
          unzip -l "$ZIP" | tee artifacts/turnip-module-list.txt
          ccache --show-stats | tee artifacts/turnip-ccache.txt

      - name: Save Turnip compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache-turnip
          key: a52-turnip-26.2.2-ndk30-${{ runner.os }}-${{ github.sha }}

      - name: Upload Turnip KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-TURNIP-MESA-26.2.2-A619-KGSL-VULKAN-1.3-KSU-${{ github.run_number }}
          path: |
            release-turnip/*.zip
            release-turnip/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Turnip build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-turnip-mesa-26.2.2-${{ github.run_number }}-diagnostics
          path: |
            artifacts/turnip-mesa-26.2.2/BUILD-INFO.txt
            artifacts/turnip-mesa-26.2.2/*.txt
            artifacts/turnip-mesa-26.2.2/*.sha256
            artifacts/turnip-mesa-26.2.2-build.log
            artifacts/turnip-final-sha256.txt
            artifacts/turnip-module-list.txt
            artifacts/turnip-ccache.txt
          if-no-files-found: warn
          retention-days: 14
