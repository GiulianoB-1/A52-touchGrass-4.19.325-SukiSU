name: TEMP Phase258 SG-fix dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-258-sgfix-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch corrected Phase258 fast rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/257-fast-a52-kgsl-publication-rebuild.yml/dispatches" \
            -d '{"ref":"agent/a52-phase258-sg-restored-fastpath-v1"}'
          echo 'Corrected Phase258 fast rebuild dispatched'
