name: Phase259 one-shot tracer compile repair

on:
  push:
    branches:
      - agent/a52-phase259-kgsl-node-lifetime-v1
    paths:
      - .github/workflows/zz-259-fix-and-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a52-phase259-kgsl-node-lifetime-v1
          fetch-depth: 2

      - name: Materialize clean corrected Phase259 tracer
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/zz-259-fix-and-dispatch.yml \
            | sed -n "/cat > \/tmp\/phase259.py.gz.b64 <<'B64'/,/^[[:space:]]*B64$/p" \
            | sed '1d;$d;s/^[[:space:]]*//' > /tmp/phase259.py.gz.b64
          test -s /tmp/phase259.py.gz.b64
          base64 -d /tmp/phase259.py.gz.b64 | gzip -d > scripts/259_kgsl_node_lifetime_trace.py
          sed -i 's/[[:blank:]]\+$//' scripts/259_kgsl_node_lifetime_trace.py
          python3 -m py_compile scripts/259_kgsl_node_lifetime_trace.py
          test "$(sha256sum scripts/259_kgsl_node_lifetime_trace.py | awk '{print $1}')" = "e3d1cd80977014cceb4fbefcbe3c73c335d1b6da4971fe562406c9b942c35cb4"
          grep -q 'return (unsigned long)current->nsproxy;' scripts/259_kgsl_node_lifetime_trace.py
          grep -q 'F259 mkb n=%u p=%d c=%.15s mo=%o dev=%lx sb=%lx ns=%lx' scripts/259_kgsl_node_lifetime_trace.py
          grep -q 'F259 op o=%d dr=%d nr=%d sb=%lx ino=%lu ns=%lx' scripts/259_kgsl_node_lifetime_trace.py
          grep -q 'F259 on mo=%o rdev=%lx ino=%lu sb=%lx' scripts/259_kgsl_node_lifetime_trace.py
          ! grep -q 'current->nsproxy->mnt_ns' scripts/259_kgsl_node_lifetime_trace.py
          git diff --check
          echo 'Phase259 corrected tracer materialized and verified'

      - name: Commit corrected tracer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/259_kgsl_node_lifetime_trace.py
          git commit -m "phase259: fix node lifetime tracer compile"
          git push origin HEAD:agent/a52-phase259-kgsl-node-lifetime-v1

      - name: Dispatch corrected fast build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run 257-fast-a52-kgsl-publication-rebuild.yml --ref agent/a52-phase259-kgsl-node-lifetime-v1
          echo 'Corrected Phase259 fast build dispatched'
