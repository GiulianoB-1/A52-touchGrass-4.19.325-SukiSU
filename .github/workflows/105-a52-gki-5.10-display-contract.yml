name: 105 - A52 GKI 5.10 display contract

run-name: Port exact TouchGrass display ABI to 5.10

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/105-a52-gki-5.10-display-contract.yml'
      - 'scripts/105_apply_a52xq_display_contract.py'
      - 'scripts/104_apply_a52xq_phase2_kernel_api.py'
      - 'scripts/103_apply_a52xq_phase1_compat.py'
      - 'scripts/a52xq_downstream_port_probe_v3.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-gki-5.10-display-contract-${{ github.ref }}
  cancel-in-progress: false

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_SHA: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  WORKFLOW99_ARTIFACT_ID: '8590238316'
  WORKFLOW100_ARTIFACT_ID: '8591698036'
  WORKFLOW104_ARTIFACT_ID: '8595757969'

jobs:
  display-contract:
    name: Apply downstream display ABI and recompile
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves device-tree-compiler
          python3 -m py_compile \
            scripts/a52xq_downstream_port_probe_v3.py \
            scripts/103_apply_a52xq_phase1_compat.py \
            scripts/104_apply_a52xq_phase2_kernel_api.py \
            scripts/105_apply_a52xq_display_contract.py

      - name: Restore pinned GKI source
        id: gki-cache
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}

      - name: Download verified baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          download() {
            local name="$1" id="$2"
            mkdir -p "${name}/extracted"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "${name}/artifact.zip"
            unzip -q "${name}/artifact.zip" -d "${name}/extracted"
            (cd "${name}/extracted" && sha256sum -c SHA256SUMS)
          }
          download workflow99 "${WORKFLOW99_ARTIFACT_ID}"
          download workflow100 "${WORKFLOW100_ARTIFACT_ID}"
          download workflow104 "${WORKFLOW104_ARTIFACT_ID}"
          test -s workflow99/extracted/full-integrated-rpmh-mode-abi-fix.patch
          test -s workflow100/extracted/preserved.dts
          test -s workflow104/extracted/config/final.config
          grep -Fq '"phase2_closed": true' workflow104/extracted/final-state.json
          grep -Fq '"compiler_error_count": 1611' workflow104/extracted/final-state.json

      - name: Replay hardware-tested Workflow 99 source
        run: |
          set -Eeuo pipefail
          test '${{ steps.gki-cache.outputs.cache-hit }}' = true
          git -C gki/common reset --hard "${GKI_COMMON_SHA}"
          git -C gki/common clean -fd
          PATCH="$PWD/workflow99/extracted/full-integrated-rpmh-mode-abi-fix.patch"
          git -C gki/common apply --check "$PATCH"
          git -C gki/common apply "$PATCH"

      - name: Fetch exact working TouchGrass source
        run: |
          set -Eeuo pipefail
          rm -rf touchgrass
          git init touchgrass
          git -C touchgrass remote add origin https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
          git -C touchgrass fetch --depth=1 origin "${TOUCHGRASS_SHA}"
          git -C touchgrass checkout --detach FETCH_HEAD
          test "$(git -C touchgrass rev-parse HEAD)" = "${TOUCHGRASS_SHA}"

      - name: Stage closed Phase 2 baseline
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-display-contract
          mkdir -p "$OUT/logs" "$OUT/stage" "$OUT/config" "$OUT/compile"
          python3 scripts/a52xq_downstream_port_probe_v3.py \
            --touchgrass touchgrass --gki gki/common \
            --dts workflow100/extracted/preserved.dts --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/stage-port.log"
          python3 scripts/103_apply_a52xq_phase1_compat.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/phase1-stage.log"
          python3 scripts/104_apply_a52xq_phase2_kernel_api.py \
            --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/phase2-stage.log"

      - name: Apply exact TouchGrass display contract
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-display-contract
          python3 scripts/105_apply_a52xq_display_contract.py \
            --touchgrass touchgrass --gki gki/common --output "$OUT/stage" \
            2>&1 | tee "$OUT/logs/display-contract-stage.log"
          test -s "$OUT/stage/phase3-display-contract-report.json"
          grep -Fq 'a52-display-contract-staged' \
            "$OUT/stage/phase3-display-contract-report.json"

      - name: Resolve display-contract configuration
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-5.10-display-contract"
          BUILD="$PWD/workspace/gki-display-contract-out"
          mkdir -p "$BUILD"
          cp workflow104/extracted/config/final.config "$BUILD/.config"
          cp "$BUILD/.config" "$OUT/config/before.config"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$OUT/logs/olddefconfig.log"
          cp "$BUILD/.config" "$OUT/config/final.config"

      - name: Compile complete downstream display contract
        run: |
          set -Eeuo pipefail
          OUT="$PWD/artifacts/a52xq-gki-5.10-display-contract"
          BUILD="$PWD/workspace/gki-display-contract-out"
          CLANG="$(readlink -f "$(command -v clang)")"
          export PATH="$(dirname "$CLANG"):$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          "$CLANG" --version | tee "$OUT/logs/toolchain.log"
          set +e
          make -k -C gki/common O="$BUILD" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
            KCFLAGS=-Wno-error=frame-larger-than Image > "$OUT/logs/port-compile.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/compile/make-return-code.txt"
          if test -s "$BUILD/arch/arm64/boot/Image"; then
            cp "$BUILD/arch/arm64/boot/Image" "$OUT/compile/Image-NON-FLASHABLE"
          fi

      - name: Measure display-contract closure
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-display-contract
          python3 - <<'PY'
          import collections, json, re
          from pathlib import Path
          root = Path('artifacts/a52xq-gki-5.10-display-contract')
          baseline = json.loads(Path('workflow104/extracted/compile/compile-incompatibilities.json').read_text())
          compiler = re.compile(r'^(?P<file>[^:\s][^:]*):(?P<line>\d+):(?P<column>\d+): (?P<kind>fatal error|error): (?P<message>.*)$')
          target = re.compile(r"private_flags|no member named 'vrefresh'|DRM_MODE_FLAG_(SEAMLESS|SUPPORTS_YUV)|drm_msm_event_resp|drm_msm_ext_hdr_metadata|sde_drm_scaler_v2|SDE_DRM_SEC_ONLY|drm_panel_hdr_properties|drm_bridge_funcs|field has incomplete type 'struct drm_bridge'|DRM_FORMAT_MOD_QCOM_(DX|TIGHT)|SDE_MAX_(DIM_LAYERS|DS_COUNT)|SDE_MODE_DPMS_LP[12]|DRM_EVENT_HISTOGRAM|enum fps|drm_panel_notifier|use of undeclared identifier 'FPS[0-9]+|'drm.h' file not found")
          entries=[]; sig=collections.Counter(); subs=collections.Counter(); residual=collections.Counter()
          def subsystem(path):
              if 'drivers/gpu/msm/' in path: return 'display-kgsl'
              if 'drivers/a52_display/' in path or 'techpack/display/' in path: return 'display-sde-dsi-panel'
              if 'drivers/a52_secure/' in path: return 'secure-qseecom'
              return 'kernel-integration'
          for line in (root/'logs/port-compile.log').read_text(errors='replace').splitlines():
              m=compiler.match(line)
              if not m: continue
              item=m.groupdict(); item['subsystem']=subsystem(item['file'])
              entries.append(item); sig[(item['subsystem'],item['message'])]+=1; subs[item['subsystem']]+=1
              if target.search(item['message']): residual[item['message']]+=1
          unique=[{'subsystem':k[0],'message':k[1],'count':v} for k,v in sig.most_common()]
          result={
              'status':'display-contract-compile-complete','flashable':False,'hardware_validated':False,
              'make_return_code':int((root/'compile/make-return-code.txt').read_text()),
              'baseline_compiler_error_count':baseline['compiler_error_count'],
              'compiler_error_count':len(entries),
              'error_reduction':baseline['compiler_error_count']-len(entries),
              'baseline_unique_error_signature_count':baseline['unique_error_signature_count'],
              'unique_error_signature_count':len(unique),
              'unique_signature_reduction':baseline['unique_error_signature_count']-len(unique),
              'residual_display_contract_error_count':sum(residual.values()),
              'residual_display_contract_signatures':dict(residual.most_common()),
              'display_contract_closed':not residual,
              'subsystem_counts':dict(subs),'unique_signatures':unique,'entries':entries[:1800],
          }
          (root/'compile/compile-incompatibilities.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          md=['# A52 Workflow 105 display-contract result','',f"- Baseline errors: **{baseline['compiler_error_count']}**",f"- Remaining errors: **{len(entries)}**",f"- Error reduction: **{result['error_reduction']}**",f"- Remaining unique signatures: **{len(unique)}**",f"- Display-contract residual errors: **{result['residual_display_contract_error_count']}**",f"- Display contract closed: **{result['display_contract_closed']}**",'', '## Remaining errors by subsystem','']
          md += [f'- `{k}`: {v}' for k,v in subs.most_common()]
          md += ['', '## Highest-frequency remaining incompatibilities','']
          md += [f"- `{x['subsystem']}` ×{x['count']}: {x['message']}" for x in unique[:140]]
          (root/'compile/DISPLAY-CONTRACT-RESULT.md').write_text('\n'.join(md)+'\n')
          PY

      - name: Finalize display-contract artifact
        if: always()
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-display-contract
          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 5G GKI 5.10 DOWNSTREAM DISPLAY CONTRACT

          This artifact is non-flashable and not hardware validated.
          Workflow 99 remains the hardware-tested storage baseline.
          Workflow 105 ports the exact TouchGrass MSM/SDE userspace ABI, display-mode
          private fields, panel notifier contract, Qualcomm format modifiers and bridge
          linkage into the 5.10 compile tree. It does not yet port IOMMU, DMA cache,
          clock or PM QoS semantics.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/a52xq-gki-5.10-display-contract')
          report=root/'compile/compile-incompatibilities.json'
          if report.is_file():
              r=json.loads(report.read_text())
              final={'status':'display-contract-migration-complete','flashable':False,'hardware_validated':False,'workflow99_baseline_preserved':True,'compiler_error_count':r['compiler_error_count'],'error_reduction':r['error_reduction'],'unique_error_signature_count':r['unique_error_signature_count'],'unique_signature_reduction':r['unique_signature_reduction'],'residual_display_contract_error_count':r['residual_display_contract_error_count'],'display_contract_closed':r['display_contract_closed']}
          else:
              final={'status':'display-contract-staging-failed','flashable':False,'hardware_validated':False,'workflow99_baseline_preserved':True}
          (root/'final-state.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload Workflow 105 display-contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-gki-5.10-display-contract-${{ github.run_number }}-NON-FLASHABLE
          path: artifacts/a52xq-gki-5.10-display-contract
          if-no-files-found: error
          retention-days: 14

      - name: Require targeted display-contract closure
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('artifacts/a52xq-gki-5.10-display-contract/final-state.json').read_text())
          if not state.get('display_contract_closed', False):
              raise SystemExit(f"Display contract still has {state.get('residual_display_contract_error_count', 'unknown')} classified errors")
          PY
