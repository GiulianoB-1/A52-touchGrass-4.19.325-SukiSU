name: 121 - A52 GKI 5.10 DT-backed expanded pmsg

run-name: Repack real-ION boot with authoritative ramoops DT sizing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/121-a52-gki-5.10-dtb-expanded-pmsg.yml'
      - 'scripts/76_repack_a52_boot_with_dtb.py'
      - 'scripts/38_repack_a52_p1_boot.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-dtb-expanded-pmsg-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKFLOW118_ARTIFACT_ID: '8619248709'
  WORKFLOW118_BOOT_SHA256: '4398c3ebcb9f99b7f5bddba9fd23292e784bb9e3f542769cfcc356158690ca4f'
  RAMOOPS_NODE: '/reserved-memory/a52-ramoops-reserved@b1b00000'

jobs:
  package:
    name: Package DT-backed expanded-pmsg boot image
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out diagnostic project
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates unzip python3 device-tree-compiler file
          python3 -m py_compile scripts/38_repack_a52_p1_boot.py
          python3 -m py_compile scripts/76_repack_a52_boot_with_dtb.py

      - name: Download and verify Workflow 118 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p workflow118/extracted
          curl --fail --location --retry 5 --retry-all-errors \
            --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WORKFLOW118_ARTIFACT_ID}/zip" \
            --output workflow118/artifact.zip
          unzip -q workflow118/artifact.zip -d workflow118/extracted
          (cd workflow118/extracted && sha256sum -c SHA256SUMS)
          test -s workflow118/extracted/boot.img
          echo "${WORKFLOW118_BOOT_SHA256}  workflow118/extracted/boot.img" | sha256sum -c -

      - name: Extract source DTB and validate reservation
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-dtb-expanded-pmsg
          mkdir -p "$OUT"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              'a52_boot_repack', 'scripts/38_repack_a52_p1_boot.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          boot = module.parse_boot(Path('workflow118/extracted/boot.img').read_bytes())
          if not boot['dtb']:
              raise SystemExit('Workflow 118 boot image has no DTB')
          Path('artifacts/a52xq-gki-5.10-dtb-expanded-pmsg/original.dtb').write_bytes(boot['dtb'])
          PY
          dtc -I dtb -O dtb -p 8192 \
            -o "$OUT/patched.dtb" "$OUT/original.dtb" \
            2> "$OUT/dtc-roundtrip-warnings.txt"
          test "$(fdtget -t x "$OUT/patched.dtb" "$RAMOOPS_NODE" reg)" = '0 b1b00000 0 100000'

      - name: Convert reserved node to authoritative ramoops layout
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-dtb-expanded-pmsg
          DTB="$OUT/patched.dtb"

          # The node was previously only a reservation. Make it the authoritative
          # ramoops platform device while preserving its exact 1 MiB physical range.
          fdtput -t s "$DTB" "$RAMOOPS_NODE" compatible ramoops
          fdtput -t x "$DTB" "$RAMOOPS_NODE" record-size 0x00010000
          fdtput -t x "$DTB" "$RAMOOPS_NODE" console-size 0x00030000
          fdtput -t x "$DTB" "$RAMOOPS_NODE" pmsg-size 0x000c0000
          fdtput -t x "$DTB" "$RAMOOPS_NODE" ftrace-size 0x00000000
          fdtput -t x "$DTB" "$RAMOOPS_NODE" ecc-size 0x00000000

          test "$(fdtget -t s "$DTB" "$RAMOOPS_NODE" compatible)" = ramoops
          test "$(fdtget -t x "$DTB" "$RAMOOPS_NODE" reg)" = '0 b1b00000 0 100000'
          test "$(fdtget -t x "$DTB" "$RAMOOPS_NODE" record-size)" = 10000
          test "$(fdtget -t x "$DTB" "$RAMOOPS_NODE" console-size)" = 30000
          test "$(fdtget -t x "$DTB" "$RAMOOPS_NODE" pmsg-size)" = c0000
          test "$(fdtget -t x "$DTB" "$RAMOOPS_NODE" ftrace-size)" = 0
          test "$(fdtget -t x "$DTB" "$RAMOOPS_NODE" ecc-size)" = 0

          dtc -I dtb -O dts -o "$OUT/patched.dts" "$DTB" \
            2> "$OUT/dtc-patched-warnings.txt"

      - name: Repack exact real-ION kernel with patched DTB
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-dtb-expanded-pmsg
          cp workflow118/extracted/Image.gz "$OUT/Image.gz"
          python3 scripts/76_repack_a52_boot_with_dtb.py \
            --source workflow118/extracted/boot.img \
            --kernel "$OUT/Image.gz" \
            --dtb "$OUT/patched.dtb" \
            --output "$OUT/boot.img" \
            --report "$OUT/repack-report.json"

      - name: Audit exact boot delta
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-dtb-expanded-pmsg
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              'a52_boot_repack', 'scripts/38_repack_a52_p1_boot.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          out = Path('artifacts/a52xq-gki-5.10-dtb-expanded-pmsg')
          source_bytes = Path('workflow118/extracted/boot.img').read_bytes()
          output_bytes = (out / 'boot.img').read_bytes()
          source = module.parse_boot(source_bytes)
          rebuilt = module.parse_boot(output_bytes)
          sha256 = lambda data: hashlib.sha256(data).hexdigest()

          checks = {
              'source_hash_pinned': sha256(source_bytes) == '4398c3ebcb9f99b7f5bddba9fd23292e784bb9e3f542769cfcc356158690ca4f',
              'partition_size_preserved': len(output_bytes) == len(source_bytes) == 100663296,
              'kernel_unchanged': rebuilt['kernel'] == source['kernel'],
              'ramdisk_unchanged': rebuilt['ramdisk'] == source['ramdisk'],
              'second_unchanged': rebuilt['second'] == source['second'],
              'recovery_dtbo_unchanged': rebuilt['recovery_dtbo'] == source['recovery_dtbo'],
              'cmdline_unchanged': rebuilt['cmdline'] == source['cmdline'],
              'header_version_preserved': rebuilt['header_version'] == source['header_version'] == 2,
              'page_size_preserved': rebuilt['page_size'] == source['page_size'] == 4096,
              'board_preserved': rebuilt['board'] == source['board'] == 'SRPTJ06A012',
              'dtb_changed': rebuilt['dtb'] != source['dtb'],
              'ramoops_node_preserved': b'a52-ramoops-reserved@b1b00000' in rebuilt['dtb'],
              'ramoops_compatible_added': b'ramoops\x00' in rebuilt['dtb'],
              'ufs_host_node_preserved': b'ufshc@1d84000' in rebuilt['dtb'],
              'ufs_phy_node_preserved': b'ufsphy_mem@1d87000' in rebuilt['dtb'],
              'legacy_gdsc_preserved': b'gcc_ufs_phy_gdsc' in rebuilt['dtb'],
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Workflow 121 audit failed: ' + ', '.join(failed))

          audit = {
              'status': 'dt-backed-expanded-pmsg-audited',
              'flashable_candidate': True,
              'hardware_validated': False,
              'source_workflow': 118,
              'source_boot_sha256': sha256(source_bytes),
              'output_boot_sha256': sha256(output_bytes),
              'output_boot_bytes': len(output_bytes),
              'ramoops': {
                  'physical_base': '0xB1B00000',
                  'total_bytes': 0x100000,
                  'record_bytes': 0x10000,
                  'console_bytes': 0x30000,
                  'pmsg_bytes': 0xC0000,
                  'ftrace_bytes': 0,
                  'ecc_bytes': 0,
              },
              'checks': checks,
          }
          (out / 'final-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Finalize diagnostic candidate
        run: |
          set -Eeuo pipefail
          OUT=artifacts/a52xq-gki-5.10-dtb-expanded-pmsg
          cat > "$OUT/README-FIRST.txt" <<'EOF'
          A52 5G GKI 5.10 DT-BACKED EXPANDED-PMSG DIAGNOSTIC

          This candidate keeps the exact Workflow 118 real-ION kernel, ROM ramdisk,
          recovery DTBO, command line, addresses and 96 MiB partition contract.

          Only the boot DTB ramoops node changes. The fixed 1 MiB reservation is split
          into 64 KiB panic record, 192 KiB console and 768 KiB Android pmsg. Ftrace
          and ECC zones are disabled. This is not hardware validated.
          EOF
          sed -i 's/^          //' "$OUT/README-FIRST.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload Workflow 121 candidate
        uses: actions/upload-artifact@v4
        with:
          name: a52xq-gki-5.10-dtb-expanded-pmsg-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: artifacts/a52xq-gki-5.10-dtb-expanded-pmsg
          if-no-files-found: error
          retention-days: 14

      - name: Require audited output
        run: |
          set -Eeuo pipefail
          test -s artifacts/a52xq-gki-5.10-dtb-expanded-pmsg/boot.img
          grep -Fq '"status": "dt-backed-expanded-pmsg-audited"' \
            artifacts/a52xq-gki-5.10-dtb-expanded-pmsg/final-audit.json
