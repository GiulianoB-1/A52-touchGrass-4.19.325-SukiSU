      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: packaging/AnyKernel3
          fetch-depth: 1

      - name: Package BT-P2C + GPU P5 + BBRv3 + FQ + Vulkan RE ZIP
        run: |
          set -Eeuo pipefail
          mkdir -p release
          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh

          sed -i "s/grep -Fxq '# CONFIG_KSU_SUSFS is not set'/grep -Fxq 'CONFIG_KSU_SUSFS=y'/" scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh
          sed -i 's/SUSFS must remain disabled for this package/Kernel config does not enable SUSFS core/' scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh")
          s = p.read_text()
          anchor = "dump_boot;\nwrite_boot;"
          if s.count(anchor) != 1:
              raise SystemExit(f"unexpected AnyKernel boot-write anchor count: {s.count(anchor)}")
          s = s.replace(
              anchor,
              'dump_boot;\n'
              'patch_cmdline "sched_eevdf" "sched_eevdf=1";\n'
              'patch_cmdline "sched_cass" "sched_cass=1";\n'
              'write_boot;',
              1,
          )
          p.write_text(s)
          PY

          python3 -m py_compile scripts/88_patch_anykernel_vulkan_renderengine.py
          python3 scripts/88_patch_anykernel_vulkan_renderengine.py scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh

          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + GPU P5 + BBRv3 + WiFi-RMNET-FQ + BT-P2C + Vulkan RE/' scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh
          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/ReSukiSU-v4.1.0-GPU-P5-BBR3-WIFI-RMNET-FQ-BT-P2C-VULKAN-RE-CLANG11.zip/' scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh
          chmod +x scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh

          ./scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh \
            4.19.206 \
            "$IMAGE" \
            packaging/AnyKernel3 \
            release

          rm -f scripts/.package-gpu-p5-bbr3-fq-vulkan-re.sh

      - name: Verify packaged BT-P2C + GPU P5 + BBRv3 + FQ + Vulkan RE
        run: |
          set -Eeuo pipefail
          ZIP="$(find release -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -s "$ZIP"
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=1";'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'install_vulkan_re_module;'
          unzip -p "$ZIP" anykernel.sh | grep -Fq '/data/adb/modules/touchgrass-vulkan-re'
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'debug.renderengine.backend=skiavkthreaded'
          ! unzip -p "$ZIP" anykernel.sh | grep -Fq 'ksud module install'
          ! unzip -p "$ZIP" anykernel.sh | grep -Fq 'initrc refresh'
          unzip -p "$ZIP" BUILD-INFO.txt | grep -Fxq 'surfaceflinger_renderengine=skiavkthreaded'
          unzip -p "$ZIP" BUILD-INFO.txt | grep -Fxq 'surfaceflinger_vulkan_integration=kernelsu-direct-system-prop'
          unzip -l "$ZIP" | tee artifacts/u17-uclamp-p2-package-list.txt
          sha256sum "$ZIP" | tee artifacts/u17-uclamp-p2-package-sha256.txt

      - name: Save compiler cache
        if: always() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: a52xq-bt-p2c-rxpm-${{ runner.os }}-v1

      - name: Record diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d workspace/touchgrass-a52xq/.git ]; then
            git -C workspace/touchgrass-a52xq status --short > artifacts/u17-uclamp-p2-kernel-status.txt || true
            git -C workspace/touchgrass-a52xq diff --check > artifacts/u17-uclamp-p2-diff-check.txt 2>&1 || true
          fi
          ccache --show-stats > artifacts/u17-uclamp-p2-ccache.txt 2>&1 || true

      - name: Upload BT-P2C + GPU P5 + BBRv3 + FQ + Vulkan RE ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-4.19.206-BT-P2C-GPU-P5-BBR3-WIFI-RMNET-FQ-VULKAN-RE-CLANG11-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14

