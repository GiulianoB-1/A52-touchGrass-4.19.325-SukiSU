name: Phase259 finalize raw C whitespace

on:
  push:
    branches:
      - agent/a52-phase259-kgsl-node-lifetime-v1
    paths:
      - .github/workflows/zz-259-fix-and-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a52-phase259-kgsl-node-lifetime-v1
          fetch-depth: 0

      - name: Convert raw C template tab escapes to whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/259_kgsl_node_lifetime_trace.py')
          s = p.read_text()
          literal_tab_escape = "\\t"
          actual_tab = "\t"
          total = 0

          for name in ('STATE_BLOCK', 'OPEN_HELPER'):
              marker = name + " = r'''"
              start = s.index(marker)
              end = s.index("\n'''", start)
              block = s[start:end]
              count = block.count(literal_tab_escape)
              if count == 0:
                  raise SystemExit(f'{name}: expected literal tab escapes, found none')
              fixed = block.replace(literal_tab_escape, actual_tab)
              if literal_tab_escape in fixed:
                  raise SystemExit(f'{name}: literal tab escape survived')
              s = s[:start] + fixed + s[end:]
              total += count

          if total < 20:
              raise SystemExit(f'Phase259: unexpectedly low tab-fix count {total}')

          p.write_text(s)
          compile(s, str(p), 'exec')
          print(f'Converted {total} raw-C literal tab escapes to real tabs')
          PY

          python3 -m py_compile scripts/259_kgsl_node_lifetime_trace.py
          python3 scripts/259_kgsl_node_lifetime_trace.py --self-test
          git diff --check
          grep -q 'return (unsigned long)current->nsproxy;' scripts/259_kgsl_node_lifetime_trace.py
          grep -q 'F259 op o=%d dr=%d nr=%d sb=%lx ino=%lu ns=%lx' scripts/259_kgsl_node_lifetime_trace.py
          grep -q 'F259 on mo=%o rdev=%lx ino=%lu sb=%lx' scripts/259_kgsl_node_lifetime_trace.py
          echo "Corrected tracer sha256=$(sha256sum scripts/259_kgsl_node_lifetime_trace.py | awk '{print $1}')"

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/259_kgsl_node_lifetime_trace.py
          git rm .github/workflows/zz-259-fix-and-dispatch.yml
          git commit -m "phase259: fix raw C template whitespace"
          git push origin HEAD:agent/a52-phase259-kgsl-node-lifetime-v1

      - name: Dispatch superseding fast build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run 257-fast-a52-kgsl-publication-rebuild.yml --ref agent/a52-phase259-kgsl-node-lifetime-v1
          echo 'Superseding corrected Phase259 build dispatched'
