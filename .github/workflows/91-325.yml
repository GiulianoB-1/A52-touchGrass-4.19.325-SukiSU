          cp scripts/09_package_a52xq_anykernel.sh scripts/.package-hybrid-rollback.sh

          for f in scripts/.package-hybrid-enabled.sh scripts/.package-hybrid-rollback.sh; do
            sed -i "s/grep -Fxq '# CONFIG_KSU_SUSFS is not set'/grep -Fxq 'CONFIG_KSU_SUSFS=y'/" "$f"
            sed -i 's/SUSFS must remain disabled for this package/Kernel config does not enable SUSFS core/' "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          for name, eevdf, cass in (
              ("scripts/.package-hybrid-enabled.sh", "1", "1"),
              ("scripts/.package-hybrid-rollback.sh", "0", "0"),
          ):
              p = Path(name)
              s = p.read_text()
              anchor = "dump_boot;\nwrite_boot;"
              if s.count(anchor) != 1:
                  raise SystemExit(
                      f"unexpected AnyKernel boot-write anchor count in {name}: {s.count(anchor)}"
                  )
              s = s.replace(
                  anchor,
                  f'dump_boot;\n'
                  f'patch_cmdline "sched_eevdf" "sched_eevdf={eevdf}";\n'
                  f'patch_cmdline "sched_cass" "sched_cass={cass}";\n'
                  f'patch_cmdline "rcu_nocbs" "rcu_nocbs=6-7";\n'
                  f'write_boot;',
                  1,
              )
              p.write_text(s)
          PY

          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + EEVDF77 CASS MGLRU DEFAULT RCU-CONTROL ZSMALLOC-CORRECTNESS ZRAM-SLOTLOCK SCAN-BOUNDS FUSE-PASSTHROUGH/' scripts/.package-hybrid-enabled.sh
          sed -i 's/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0/kernel.string=touchGrass A52xq Linux $TARGET_VERSION + ReSukiSU v4.1.0 + EEVDF77 CASS MGLRU DEFAULT RCU-CONTROL ZSMALLOC-CORRECTNESS ZRAM-SLOTLOCK SCAN-BOUNDS FUSE-PASSTHROUGH SCHED ROLLBACK/' scripts/.package-hybrid-rollback.sh

          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/Phase91-4.19.325.zip/' scripts/.package-hybrid-enabled.sh
          sed -i 's/ReSukiSU-v4.1.0-BUILD-VERIFIED-FLASHABLE.zip/Phase91-325-Rollback.zip/' scripts/.package-hybrid-rollback.sh

          chmod +x scripts/.package-hybrid-enabled.sh scripts/.package-hybrid-rollback.sh

          bash ./scripts/.package-hybrid-enabled.sh \
            4.19.325 \
            "artifacts/Image-${LABEL}" \
            packaging/AnyKernel3 \
            release-hybrid

          bash ./scripts/.package-hybrid-rollback.sh \
            4.19.325 \
            "artifacts/Image-${LABEL}" \
            packaging/AnyKernel3 \
            release-rollback

          rm -f scripts/.package-hybrid-enabled.sh scripts/.package-hybrid-rollback.sh

      - name: Verify packaged hybrid boot toggles
        run: |
          set -Eeuo pipefail
          HYBRID_ZIP="$(find release-hybrid -maxdepth 1 -name '*.zip' -type f | head -1)"
          ROLLBACK_ZIP="$(find release-rollback -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -s "$HYBRID_ZIP"
          test -s "$ROLLBACK_ZIP"

          unzip -p "$HYBRID_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=1";'
          unzip -p "$HYBRID_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=1";'
          unzip -p "$HYBRID_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "rcu_nocbs" "rcu_nocbs=6-7";'
          unzip -p "$ROLLBACK_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_eevdf" "sched_eevdf=0";'
          unzip -p "$ROLLBACK_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "sched_cass" "sched_cass=0";'
          unzip -p "$ROLLBACK_ZIP" anykernel.sh | grep -Fq 'patch_cmdline "rcu_nocbs" "rcu_nocbs=6-7";'

          {
            echo 'hardware_test_package=passed'
            echo 'hybrid_cmdline=sched_eevdf=1 sched_cass=1'
            echo 'rollback_cmdline=sched_eevdf=0 sched_cass=0'
            echo 'eevdf=phase77-lifecycle-correctness'
            echo 'cass=phase1b-walt-safe'
            echo 'mglru=compiled-default-on'
            echo 'mglru_default=on'
            echo 'rcu_fast_no_hz=on'
            echo 'rcu_nocbs=6-7'
            echo 'rcu_lazy=not-used'
            echo 'zram_slot_lock=wait-on-bit-sleepable'
            echo 'zcomp=samsung-original-get_cpu_ptr'
            echo 'zsmalloc_correctness=barrier-plus-lock_zspage-race-fix'
            echo 'zram_scan_bounds=writeback-plus-block_state-fixed'
            echo 'fuse_passthrough=android-v2-ioctl-126-enabled'
            echo 'fuse_feature_probe=/sys/fs/fuse/features/fuse_passthrough'
          } | tee artifacts/eevdf77-cass-phase86-zram-scan-bounds-package-audit.txt

          cat > artifacts/mglru-first-boot-test.txt <<'EOF'
          Phase91 first-boot policy:
          - CONFIG_LRU_GEN=y and CONFIG_LRU_GEN_ENABLED=y.
          - MGLRU starts enabled by the kernel itself.
          - CONFIG_RCU_FAST_NO_HZ=y for lower idle callback wakeups.
          - CONFIG_RCU_NOCB_CPU=y and boot cmdline rcu_nocbs=6-7.
          - RCU_LAZY is intentionally not used.
          - ZRAM slot locking uses wait_on_bit_lock/clear_and_wake_up_bit.
          - Zcomp remains exactly on Samsung's proven get_cpu_ptr()/put_cpu_ptr() model.
          - Only two zsmalloc correctness fixes are added: isolated-pages barrier and lock_zspage migration serialization.
          - August 2026 ZRAM writeback/block_state stale scan-bound races are fixed.
          - Runtime MGLRU kill switch remains /sys/kernel/mm/lru_gen/enabled.
          - Android FUSE passthrough is compiled in and advertised during FUSE_INIT.
          - Kernel feature marker is /sys/fs/fuse/features/fuse_passthrough.
          - Runtime userspace proof: logcat should contain 'FuseDaemon: Using FUSE passthrough' when MediaProvider enables it.
          EOF

      - name: Record diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d workspace/touchgrass-a52xq/.git ]; then
            git -C workspace/touchgrass-a52xq status --short > artifacts/kernel-source-status.txt || true
            git -C workspace/touchgrass-a52xq diff --stat > artifacts/kernel-source-diff.stat.txt || true
            git -C workspace/touchgrass-a52xq diff --check > artifacts/kernel-source-diff-check.txt 2>&1 || true
          fi
          ccache --show-stats > artifacts/ccache-final.txt 2>&1 || true

      - name: Upload Phase91
        uses: actions/upload-artifact@v4
        with:
          name: phase91-325-${{ github.run_number }}
          path: release-hybrid/
          if-no-files-found: error
          retention-days: 14

      - name: Upload rollback
        uses: actions/upload-artifact@v4
        with:
          name: phase91-rollback-${{ github.run_number }}
          path: release-rollback/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase91-diag-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
