# Exact user-selected baseline:
# P150 run 36054686392 / 763a272cba83463fc495b3787812a1e78157250f
#
# P152 carries forward P150, reapplies boot-tested P151, then adds:
# - async SX9364/SX9360 grip sensor
# - async Samsung DC vibrator
#
# Still synchronous: UFS, display, PMIC/SPMI, clocks, regulators,
# interconnect, IOMMU/SMMU, CPUfreq/devfreq, eSE, thermal, Bluetooth,
# audio, touchscreen and camera core.

# Clang22 + LLD22 ThinLTO experiment:
# - Exact P152 source reconstruction is pinned to PHASE_SOURCE_SHA.
# - AOSP clang-r596125 is pinned to AOSP_CLANG_COMMIT.
# - ThinLTO and LLD are intentionally enabled; CFI remains disabled.
# - P156 repairs the legacy 4.19 initcall-order generator for modern llvm-nm.

# P161: Samsung-safe ZRAM multi-compressor/recompression backport.
# - Base: boot-proven P160 (O2 + Clang22 + ThinLTO25 + ZRAM writeback + Zstd).
# - Primary compressor remains lzo-rle.
# - Secondary compressor defaults to zstd and is created during disksize init.
# - Adds recomp_algorithm, recompress and recomp_stat sysfs ABI.
# - Runtime recompression refuses CONFIG_ZRAM_DEDUP active mode to avoid shared-entry corruption.
# - Recompressed objects are excluded from Samsung compressed writeback because its legacy
#   backing format carries size/index but no compressor identifier.

# P162 integrated security/stability/efficiency bundle.
# - Baseline: boot-tested P161 commit a8389945c3dc63ec401287b92293f33d6ffa3d65.
# - A1 exact F2FS stable FMODE_WRITE hardening plus requested A6/B2/C1/C2/C4/C5/C7/D5/D6/D7/D9.
# - C7 is audit-only because the imported Samsung/TouchGrass uclamp already has the upstream inactive guard.
# - C3 remains unchanged and reserved for its separately agreed queued/running-state refinement.
# - P159 teardown/retention audits and P160/P161 ZRAM audits remain mandatory.

# P165:
# - starts from the same P162 reconstruction the user boot-tested.
# - intentionally reverts P162 D6 after runtime FUSE write -EFAULT isolation.
# - adds A2 BPF ringbuf hardening, verified F2FS stable cleanup,
#   B1/B4/B5 MGLRU correctness, D2 ZRAM scan semantics, and A5 TCP pacing math.
# - scheduler and GPU policy remain identical to P162.
# - E1 is deliberately omitted; the production -w build policy remains unchanged.
# - E2/E3 are retained as artifact/provenance improvements only.

# P166:
# - starts from the successful P165 reconstruction and preserves all P165 fixes.
# - experimental FUSE arbitration: WRITEBACK_CACHE is offered again, while
#   modern >=7.40 upstream passthrough clears fc->writeback_cache and wins.
# - legacy <7.36 Android passthrough is unchanged.
# - hand-ports stable F2FS 4d9c9b7 and 72c6b13.
# - B3 and D3 are audited as already satisfied; B6 stays deferred.
# - no scheduler/GPU/UFS/display/AOD runtime changes.

# P166 cache v2:
# - exact P165 source+artifact snapshot cache skips replay through P165 on P166 edits.
# - exact P166 source+artifact snapshot cache is keyed by the P166 patcher SHA256.
# - Clang toolchain, ccache, ThinLTO, P134 source, and final built-output caches remain enabled.
# - post-build D3 audit checks executable source behavior, not teardown-removable marker comments.

# P167:
# - baseline: P166 booted and passed /sdcard text + 1 MiB FUSE writes.
# - MGLRU read-side hardening clamps transient negative per-zone generation sizes only while summing get_nr_evictable().
# - adds remaining stable F2FS correctness ports 2d291651, 24dfe070, eb926232.
# - restores and reuses the exact P166 source snapshot cache, plus a P167 snapshot cache.
# - no FUSE negotiation, scheduler, GPU, UFS, display, or AOD runtime changes.

# P167 cache-idempotency:
# - ThinLTO Makefile and llvm-nm compatibility setup accept either pristine or already-patched cached source.
# - required environment variables are still refreshed on every run.

# P168:
# - runtime baseline: P167 booted and passed /sdcard FUSE write.
# - seven code changes: fscrypt encrypted-symlink getattr dependency,
#   four remaining F2FS stable correctness ports, ZRAM block_state bounds,
#   and zsmalloc concurrent compaction accounting.
# - closes the remaining P118 skipped-F2FS set by structural audit.
# - exact P167 source snapshot is reused; P168 gets its own content-keyed source cache.
# - rejected MGLRU mm_state.wait remains absent.
# - no scheduler, GPU, FUSE, UFS, display, or AOD behavior changes.


# P169:
# - runtime baseline is the P168 kernel that booted successfully but later hit
#   deterministic netbpfload/bpfloader-failed reboot loops after Tethering APEX activation.
# - keeps P168 behavior intact outside BPF networking.
# - changes no BPF/network configuration.
# - adds netbpfload/bpfloader verifier/syscall/ARM64-JIT diagnostics after P159 teardown.
# - traces access() checks for /sys/fs/bpf paths to identify pre-existing-pin failures.
#   so the markers survive into the packaged kernel and previous production diagnostics stay removed.
# - does not bypass Android's bpfloader-failed safety reboot and does not spoof kernel version.
