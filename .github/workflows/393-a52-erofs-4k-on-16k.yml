# Phase392 hardware proof:
# - Scudo fixed-commit bridge succeeds repeatedly.
# - Android first-stage init then reaches /system.
# - EROFS on dm-0 reports "blksize 4096 isn't supported".
# - mount(/dev/block/dm-0,/system,erofs) returns -EINVAL.
# - 4K recovery mounts the same EROFS logical partition successfully.
#
# Phase393-v2:
# - import pinned Android-4.19 EROFS subpage-capable implementation from
#   EndCredits/kernel_xiaomi_sm7250@a264aed3fde518b43ab15ba530556e396502031f
# - adapt only modern ->readahead entrypoint back to TouchGrass ->readpages
# - retain 4 KiB EROFS block size while Linux PAGE_SIZE is 16 KiB
# - support compressed pclusters smaller than native PAGE_SIZE
# - runtime proof markers: P393 EROFS_SB and P393 EROFS_ZIP
# - provenance manifest: fs/erofs/A52_PHASE393_REFERENCE.txt
