          python3 -m py_compile /tmp/162_apply_f2fs_atomic_fmode_write_fix.py
          python3 /tmp/162_apply_f2fs_atomic_fmode_write_fix.py "$KERNEL" \
            | tee artifacts/p162-f2fs-atomic-fmode-apply.txt

          FILE="$KERNEL/fs/f2fs/file.c"
          for fn in \
            f2fs_ioc_start_atomic_write \
            f2fs_ioc_commit_atomic_write \
            f2fs_ioc_start_volatile_write \
            f2fs_ioc_release_volatile_write \
            f2fs_ioc_abort_volatile_write; do
            python3 - "$FILE" "$fn" <<'PY'
          import sys
          from pathlib import Path
          p, name = Path(sys.argv[1]), sys.argv[2]
          s = p.read_text()
          sig = f"static int {name}(struct file *filp)"
          start = s.index(sig)
          brace = s.index("{", start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit(f"{name}: unterminated function")
          block = s[start:end]
          guard = "if (!(filp->f_mode & FMODE_WRITE))\n\t\treturn -EBADF;"
          if block.count(guard) != 1:
              raise SystemExit(f"{name}: expected exactly one FMODE_WRITE/-EBADF guard")
          if block.index(guard) > block.index("if (!inode_owner_or_capable(inode))"):
              raise SystemExit(f"{name}: guard is after ownership check")
          PY
          done

