name: Mangrove P452 workflow validation gate
on:
  push:
    branches:
      - agent/p452-scm-h1-staging
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python generator syntax
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/452_h0_sm5714_conservative.py scripts/449f_chg_ntc_guard.py
      - name: Validate full kernel workflow offline
        run: |
          set -Eeuo pipefail
          cp diagnostics/P452-original-build-workflow.yml.txt /tmp/P452-full.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= /tmp/P452-full.yml
