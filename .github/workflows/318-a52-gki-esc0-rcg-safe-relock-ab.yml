name: 318 - A52 GKI ESC0 RCG safe relock A-B
run-name: Phase 318 - ESC0-only Golden RCG relock A-B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase318-gki-esc0-rcg-safe-relock-ab-v1
    paths:
      - .github/workflows/318-a52-gki-esc0-rcg-safe-relock-ab.yml
      - scripts/318_apply_esc0_rcg_safe_relock.py
      - scripts/318_ci_build.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: a52-phase318-esc0-rcg-relock-${{ github.ref }}
  cancel-in-progress: true

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'

jobs:
  build:
    name: Build Phase318 ESC0-only RCG relock
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip make gcc g++ python3 bc bison flex \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
          python3 -m py_compile scripts/318_apply_esc0_rcg_safe_relock.py
          bash -n scripts/318_ci_build.sh
          bash -n scripts/316_ci_build.sh
      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true
      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}
      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD
      - name: Build and audit Phase318
        run: bash scripts/318_ci_build.sh
      - name: Upload complete Phase318 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase318-GKI-ESC0-RCG-RELOCK-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase318-gki-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Upload Phase318 boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase318-GKI-ESC0-RCG-RELOCK-${{ github.run_number }}-BOOT-IMG
          path: phase318-gki-out/package/boot.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase318-GKI-ESC0-RCG-RELOCK-${{ github.run_number }}-FAILED
          path: phase318-gki-failure/
          if-no-files-found: warn
          retention-days: 30
