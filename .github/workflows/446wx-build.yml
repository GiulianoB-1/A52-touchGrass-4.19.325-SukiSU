            verify_g_marker 'P451 ADSP PROBE manual_start=1 auto_boot=0'
            verify_g_marker 'P448 AOSS probe rc=0'
            verify_g_marker 'P451 ADSP RAILS lcx=384 lmx=384 rc=0'
            verify_g_marker 'P452 H0 ENABLE cur=500'
