name: Phase446 source microscope
run-name: Phase446 source microscope

on:
  push:
    branches: [agent/a52-phase445-recovery-ladder-v1]
    paths: [.github/workflows/445-pll-helper-inspect.yml]

env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore reconstructed GKI tree
        id: p429
        uses: actions/cache/restore@v4
        with:
          path: |
            gki/common
            workspace/gki-phase199-out
            phase429-gki-out
          key: a52xq-phase429-reconstructed-v1-${{ runner.os }}-${{ env.GKI_COMMON_SHA }}-6f6e3fa9

      - name: Inspect Phase446 anchors
        run: |
          set -Eeuo pipefail
          test "${{ steps.p429.outputs.cache-hit }}" = "true"
          R="$PWD/gki/common"
          echo '=== MSM DRM BIND ==='
          grep -Rns -A180 -B30 -E 'static int msm_drm_bind|int msm_drm_init|msm_component_bind_all|drm_irq_install|cont_splash' "$R/drivers/a52_display/msm" 2>/dev/null | head -1200 || true
          echo '=== SDE KMS HW INIT / IRQ / VBIF / RSC ==='
          grep -Rns -A160 -B30 -E 'sde_kms_hw_init|_sde_kms_mmu_init|sde_core_irq_preinstall|irq_preinstall|vbif|sde_rsc_init|sde_power_resource_init' "$R/drivers/a52_display/msm" 2>/dev/null | head -1800 || true
          echo '=== SMMU DEFAULT DOMAIN / ATTACH ==='
          grep -Rns -A100 -B25 -E 'iommu_probe_device|iommu_group_add_device|attach_dev|default_domain|arm_smmu.*probe|skip_init|handoff' "$R/drivers/iommu" 2>/dev/null | head -2200 || true
          echo '=== A52 PORT SMMU / EARLYMAP ==='
          grep -Rns -A120 -B30 -E 'earlymap|0x800|handoff_cbs|a52.*smmu|splash.*map|cont.*splash' "$R/drivers" 2>/dev/null | head -1800 || true
          echo '=== GDSC / GCC / DISPCC ADDRESSES ==='
          grep -Rns -A40 -B20 -E 'disp.*gdsc|mdss.*gdsc|GDSCR|gcc_disp_(ahb|axi)_clk|dispcc.*reg' "$R/drivers/clk/qcom" "$R/arch/arm64/boot/dts/qcom/lagoon"* 2>/dev/null | head -1500 || true
          echo '=== PP / INTF REGISTER DEFINES ==='
          grep -Rns -A80 -B20 -E 'AUTOREFRESH|FRAME_COUNT|TEAR_INT_COUNT|LINE_COUNT|PP_.*LINE|PINGPONG.*AUTO' "$R/drivers/a52_display/msm" 2>/dev/null | head -1600 || true
          echo '=== EXISTING ACK RECORDER API ==='
          grep -Rns -A80 -B20 -E 'a52_ackfr_record|A52_PHASE440|a52_p440_event' "$R/include" "$R/drivers/a52_secure" "$R/drivers/a52_display/msm" 2>/dev/null | head -1600 || true
