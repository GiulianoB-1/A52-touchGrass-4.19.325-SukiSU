name: TouchGrass GPU reference recorder

run-name: Build TouchGrass 4.19.200 ReSukiSU-safe GPU reference recorder

on:
  workflow_dispatch:
  push:
    branches:
      - agent/touchgrass-gpu-reference-recorder-v1
    paths:
      - .github/workflows/touchgrass-gpu-reference-recorder.yml
      - scripts/touchgrass_gpu_reference_overlay.py
      - scripts/touchgrass_gpu_reference_resukisu_wrapper.py
      - scripts/touchgrass_gpu_reference_design.md
      - scripts/05a_diagnose_linux_checkpoint.sh
      - scripts/07_patch_resukisu_exec_hook.sh
      - scripts/08_build_linux_4.19.153_resukisu_safe.sh
      - scripts/08_build_resukisu_safe_checkpoint.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: touchgrass-gpu-reference-recorder-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  TOUCHGRASS_COMMIT: '6bf351bdf18bdb228db79e66f14a7a9c0178e5d7'
  TOUCHGRASS_CACHE_KEY: 'a52xq-touchgrass-linux-4.19.200-main-v2-Linux-6bf351bdf18bdb228db79e66f14a7a9c0178e5d7'
  RECORDER_CCACHE_KEY: 'touchgrass-gpu-reference-resukisu-safe-ccache-v1-Linux'
  BOOT_SOURCE_ASSET_ID: '478920392'
  BOOT_SOURCE_SHA256: '41ae3b24771c70747c26aa17a18d254ffcb1c0d742b96f4f1f1fff20a6638554'

jobs:
  build-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out recorder branch
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils gzip zip unzip make gcc g++ bc bison flex ccache patch \
            libssl-dev libelf-dev python3 rsync cpio lz4 binutils file tar

      - name: Restore compiler cache
        id: recorder-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ env.RECORDER_CCACHE_KEY }}
          restore-keys: |
            touchgrass-gpu-reference-resukisu-safe-ccache-v1-${{ runner.os }}-
            a52xq-linux-4.19.200-susfs-minimal-ccache-${{ runner.os }}-
            a52xq-linux-4.19.200-ccache-${{ runner.os }}-

      - name: Hydrate checksum-locked repack helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p scripts projects/a52-p1-boot-image artifacts
          fetch_file() {
            local ref="$1"
            local path="$2"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$path"
            test -s "$path"
          }
          fetch_file main scripts/37_validate_a52_p1_boot_source.py
          fetch_file main scripts/38_repack_a52_p1_boot.py
          fetch_file main projects/a52-p1-boot-image/boot-source.lock
          chmod +x scripts/37_validate_a52_p1_boot_source.py scripts/38_repack_a52_p1_boot.py

      - name: Restore cached exact TouchGrass Linux 4.19.200 source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: ${{ env.TOUCHGRASS_CACHE_KEY }}

      - name: Reconstruct exact TouchGrass Linux 4.19.200 source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/01_prepare_source.sh
          ./scripts/03_apply_linux_4.19.153.sh
          ./scripts/04_apply_linux_4.19.154.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.154 4.19.159
          ./scripts/checkpoint_resolve_linux_4.19.159.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.159 4.19.164
          ./scripts/checkpoint_resolve_linux_4.19.164.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.164 4.19.180
          ./scripts/checkpoint_resolve_linux_4.19.180.sh
          ./scripts/05a_diagnose_linux_checkpoint.sh 4.19.180 4.19.200
          ./scripts/checkpoint_resolve_linux_4.19.200.sh

      - name: Validate exact TouchGrass Linux 4.19.200 source
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          test -d workspace/touchgrass-a52xq/.git
          test "$(git -C workspace/touchgrass-a52xq rev-parse HEAD)" = "$TOUCHGRASS_COMMIT"
          test "$(make -s -C workspace/touchgrass-a52xq kernelversion)" = 4.19.200
          test -x workspace/touchgrass-a52xq/toolchain/clang/host/linux-x86/clang-r383902/bin/clang
          test -x workspace/touchgrass-a52xq/toolchain/toolchains-gcc-10.3.0/bin/aarch64-buildroot-linux-gnu-gcc

      - name: Save validated plain 4.19.200 source cache
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workspace/touchgrass-a52xq
          key: ${{ env.TOUCHGRASS_CACHE_KEY }}

      - name: Prepare exact ReSukiSU safe integration with recorder injection
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/07_patch_resukisu_exec_hook.sh
          python3 scripts/touchgrass_gpu_reference_resukisu_wrapper.py \
            scripts/08_build_linux_4.19.153_resukisu_safe.sh
          bash -n scripts/08_build_linux_4.19.153_resukisu_safe.sh

      - name: Integrate ReSukiSU safe profile and build recorder kernel
        run: |
          set -Eeuo pipefail
          ./scripts/08_build_resukisu_safe_checkpoint.sh 4.19.200 safe \
            2>&1 | tee artifacts/touchgrass-gpu-reference-resukisu-safe-build.log

      - name: Save compiler cache after successful kernel build
        if: steps.recorder-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ env.RECORDER_CCACHE_KEY }}

      - name: Audit exact reference config and embedded recorder markers
        run: |
          set -Eeuo pipefail
          CFG=artifacts/config-touchgrass-4.19.200-resukisu-v4.1.0-safe
          IMG=artifacts/Image-touchgrass-4.19.200-resukisu-v4.1.0-safe
          test -s "$CFG"
          test -s "$IMG"

          failed=0
          for expected in \
            CONFIG_ARCH_LAGOON=y \
            CONFIG_SDM_GCC_LAGOON=y \
            CONFIG_SDM_GPUCC_LAGOON=y \
            CONFIG_ARM_SMMU=y \
            CONFIG_QCOM_KGSL=y \
            CONFIG_QCOM_KGSL_IOMMU=y \
            CONFIG_QCOM_GDSC=y \
            CONFIG_COMMON_CLK_QCOM=y \
            CONFIG_KSU=y \
            '# CONFIG_KSU_DEBUG is not set' \
            '# CONFIG_KSU_TOOLKIT_SUPPORT is not set' \
            CONFIG_KSU_MULTI_MANAGER_SUPPORT=y \
            '# CONFIG_KSU_TRACEPOINT_HOOK is not set' \
            CONFIG_KSU_MANUAL_HOOK=y \
            '# CONFIG_KSU_SUSFS is not set' \
            CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y \
            CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y \
            CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y \
            CONFIG_PROC_FS=y; do
            if [[ "$expected" == '# '* ]]; then
              symbol="${expected#\# }"
              symbol="${symbol% is not set}"
            else
              symbol="${expected%%=*}"
            fi
            actual="$(grep -E "^${symbol}=|^# ${symbol} is not set$" "$CFG" || true)"
            printf 'FINAL_REFERENCE_CONFIG expected=%s actual=%s\n' "$expected" "${actual:-<absent>}"
            if test "$actual" != "$expected"; then
              failed=1
            fi
          done
          test "$failed" -eq 0

          for marker in \
            touchgrass_gpu_reference_v1 \
            SMMU:CEN_POST \
            GMU:ATT_POST \
            KGSLI:ATT_POST \
            HFI:CMD \
            ADRENO:PROBE \
            A6XX:INIT \
            KGSL:PLAT_PROBE; do
            printf 'MARKER_AUDIT %s\n' "$marker"
            grep -aFq "$marker" "$IMG"
          done

      - name: Download exact known-good 96 MiB boot source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p intake artifacts/touchgrass-gpu-reference-recorder
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${BOOT_SOURCE_ASSET_ID}" \
            --output intake/boot.img
          test "$(stat -c %s intake/boot.img)" = 100663296
          printf '%s  %s\n' "$BOOT_SOURCE_SHA256" intake/boot.img | sha256sum -c -
          python3 scripts/37_validate_a52_p1_boot_source.py intake/boot.img \
            --lock projects/a52-p1-boot-image/boot-source.lock \
            --output artifacts/touchgrass-gpu-reference-recorder/source-validation.json

      - name: Repack exact boot layout with recorder kernel
        run: |
          set -Eeuo pipefail
          OUT=artifacts/touchgrass-gpu-reference-recorder
          IMG=artifacts/Image-touchgrass-4.19.200-resukisu-v4.1.0-safe
          gzip -n -9 -c "$IMG" > "$OUT/Image.gz"

          python3 scripts/38_repack_a52_p1_boot.py \
            --source intake/boot.img \
            --kernel "$OUT/Image.gz" \
            --output "$OUT/boot.img" \
            --report "$OUT/repack-report.json"

          test -s "$OUT/boot.img"
          test "$(stat -c %s "$OUT/boot.img")" = 100663296
          cp artifacts/config-touchgrass-4.19.200-resukisu-v4.1.0-safe "$OUT/final.config"
          cp workspace/touchgrass-a52xq/out/System.map "$OUT/System.map"
          cp scripts/touchgrass_gpu_reference_overlay.py "$OUT/"
          cp scripts/touchgrass_gpu_reference_resukisu_wrapper.py "$OUT/"
          cp scripts/touchgrass_gpu_reference_design.md "$OUT/"
          cp artifacts/touchgrass-gpu-reference-prebuild.config "$OUT/prebuild.config"
          cp artifacts/linux-4.19.200-resukisu-safe.txt "$OUT/resukisu-build-report.txt"

      - name: Create Windows trace collector
        run: |
          set -Eeuo pipefail
          OUT=artifacts/touchgrass-gpu-reference-recorder
          cat > "$OUT/COLLECT_TOUCHGRASS_GPU_REFERENCE.bat" <<'BAT'
          @echo off
          setlocal EnableExtensions
          title TouchGrass GPU Reference Trace Collector
          where adb >nul 2>&1 || (echo [ERROR] adb.exe not found & pause & exit /b 1)
          for /f %%A in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "STAMP=%%A"
          set "OUT=TOUCHGRASS_GPU_TRACE_%STAMP%"
          set "ZIP=%OUT%.zip"
          mkdir "%OUT%" >nul 2>&1
          echo [1/5] Checking device...
          adb wait-for-device
          adb shell su -c "id -u" > "%OUT%\root-check.txt" 2>&1
          echo [2/5] Collecting retained GPU reference trace...
          adb shell su -c "cat /proc/tg_gpu_reference" > "%OUT%\tg_gpu_reference.txt" 2>&1
          echo [3/5] Collecting identity and late diagnostics...
          adb shell uname -a > "%OUT%\uname.txt" 2>&1
          adb shell cat /proc/version > "%OUT%\proc_version.txt" 2>&1
          adb shell su -c "dmesg" > "%OUT%\dmesg.txt" 2>&1
          adb exec-out su -c "cat /proc/config.gz" > "%OUT%\config.gz"
          echo [4/5] Calculating hashes...
          powershell -NoProfile -Command "Get-ChildItem -LiteralPath '%OUT%' -File | ForEach-Object { $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower(); '{0}  {1}' -f $h,$_.Name } | Set-Content -Encoding ASCII -LiteralPath '%OUT%\SHA256SUMS.txt'"
          echo [5/5] Creating ZIP...
          powershell -NoProfile -Command "Compress-Archive -LiteralPath '%OUT%' -DestinationPath '%ZIP%' -Force"
          echo.
          echo Upload this file to ChatGPT:
          echo   %CD%\%ZIP%
          explorer /select,"%CD%\%ZIP%" >nul 2>&1
          pause
          endlocal
          BAT
          sed -i 's/^          //' "$OUT/COLLECT_TOUCHGRASS_GPU_REFERENCE.bat"

      - name: Final package audit
        run: |
          set -Eeuo pipefail
          OUT=artifacts/touchgrass-gpu-reference-recorder
          cat > "$OUT/README_FIRST.txt" <<'EOF'
          TOUCHGRASS GPU REFERENCE RECORDER V1

          Purpose:
            Capture the complete successful TouchGrass GPU initialization path for
            direct comparison against the ACK kernel.

          Reference profile:
            Linux 4.19.200 TouchGrass + pinned ReSukiSU v4.1.0 safe integration.
            This matches the dumped reference policy: CONFIG_KSU=y,
            CONFIG_KSU_MANUAL_HOOK=y, and CONFIG_KSU_SUSFS disabled.

          Boot packaging:
            Repacked into the exact checksum-locked 96 MiB boot image whose SHA-256
            is 41ae3b24771c70747c26aa17a18d254ffcb1c0d742b96f4f1f1fff20a6638554.
            Ramdisk, DTB, command line, header and partition layout are preserved.

          Behavior policy:
            Observation only. No DT, SID, clock, regulator, GDSC, IOMMU, KGSL, GMU,
            HFI, Adreno return value, or power-sequencing behavior is intentionally changed.

          Hardware test:
            1. Flash only boot.img.
            2. Leave DTBO, vendor_boot, vendor, system and vbmeta unchanged.
            3. Boot Android normally and confirm rendering works.
            4. Run COLLECT_TOUCHGRASS_GPU_REFERENCE.bat with rooted ADB.
            5. Upload the produced TOUCHGRASS_GPU_TRACE_*.zip.

          Recorder:
            /proc/tg_gpu_reference
            8192 fixed records, earliest records retained permanently until reboot.
          EOF
          sed -i 's/^          //' "$OUT/README_FIRST.txt"

          (
            cd "$OUT"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          test -s "$OUT/SHA256SUMS"
          test -s "$OUT/COLLECT_TOUCHGRASS_GPU_REFERENCE.bat"
          test -s "$OUT/README_FIRST.txt"

      - name: Upload hardware-test package
        uses: actions/upload-artifact@v4
        with:
          name: TouchGrass-GPU-Reference-Recorder-${{ github.run_number }}
          path: artifacts/touchgrass-gpu-reference-recorder
          if-no-files-found: error
          retention-days: 14
