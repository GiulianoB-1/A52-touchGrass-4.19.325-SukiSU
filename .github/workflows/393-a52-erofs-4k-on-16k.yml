          A52 PHASE 393 V2 - ANDROID-4.19 EROFS SUBPAGE BACKPORT

          Baseline: P152 / run 36058491006.
          Kernel: native ARM64 16 KiB pages, PAGE_SHIFT=14, VA_BITS=47.
          IncFS: Android 16K compatibility backport applied.
          Userspace/UN1CA: unchanged and still expected to advertise 4K initially.

          Phase 380 CMA/pageblock compatibility is retained.

          Phase 381 separates the Qualcomm fast-SMMU hardware granule (4 KiB)
          from the Linux CPU page size (16 KiB). IOVA/PTE math remains 4 KiB,
          while CPU backing allocation/remap/free counts use PAGE_SIZE.

          Phase 382 fixes the second half of that boundary: each hardware PTE
          table still contains 512 x 8-byte entries, but alloc_page() now gives
          it a 16 KiB Linux backing page. The direct software lookup therefore
          advances between tables using PAGE_SIZE while keeping 4 KiB PTE
          indexing inside each table.

          Phase 383 adds a 16K-safe dual persistent transport for the current
          /init ELF failure. Every P383 census record is emitted to printk
          (ramoops/pstore) and to the last 2 MiB of the Samsung debug partition
          starting at +0x800000. Raw partition writes are late-armed and use
          PAGE_SIZE-sized BIOs; the on-disk header remains 4 KiB and records
          remain fixed at 128 bytes.

          The decoder is included as decode_phase383_16k_dual.py.

          Phase 384 keeps the Phase383 transport unchanged and records every
          PID1 PT_LOAD before mapping. It computes both legacy 4 KiB and native
          16 KiB file-map ranges, reports adjacent-segment overlaps and reports
          whether merging permissions would create a writable+executable page.
          Phase 384 is diagnostic only: ELF mapping behavior is unchanged.

          Phase 385 is the first actual /init compatibility fix. For the exact
          Phase384-captured /init fingerprint only, the kernel reserves the
          full image as anonymous native-16K memory, copies each legacy 4K
          PT_LOAD from the file into its exact virtual address, preserves BSS
          zeroing, and uses RWX compatibility permissions for the image.

          This mirrors Android 16's own 16K app-compat fallback strategy when
          an RX/RW boundary cannot be represented at native-page granularity.
          The workaround is intentionally restricted to PID1 /init and should
          ultimately be replaced by a properly 16K-linked first-stage init.

          Phase 386 fixes an ARM64 requirement in the Phase385 anonymous-copy
          loader: after executable bytes are written through copy_to_user(),
          the userspace D/I caches are synchronized before start_thread().
          It also persists PID1 exit_group/do_exit code and user PC/LR/SP
          through the Phase383 Samsung-debug + ramoops recorder.

          Phase 387 keeps all Phase386 behavior and adds a 32-entry in-RAM
          syscall ring for PID1. The syscall hot path performs no disk I/O.
          If PID1 exits, the ring is emitted once through the Phase383 dual
          recorder and critical-flushed. This is intended to distinguish a
          Bionic stack-protector failure from other explicit exit(127) paths.

          Phase 388 extends the RAM-only syscall ring with x2/x3 and captures
          up to four PID1 writev(fd=2) payloads before the syscall executes.
          Because stderr is closed on this boot, the writes still fail with
          EBADF, but the fatal Bionic text is preserved in RAM and dumped only
          when PID1 exits. No new compatibility behavior is introduced.

          Phase 389 is an actual compatibility fix for the fatal proven by
          Phase388. The current 4 KiB-built Bionic WriteProtected object calls
          mprotect(0x373000, 0x1000, PROT_READ), which is invalid on native
          16 KiB pages. For the exact Phase384/385 PID1 image fingerprint only,
          this one 4 KiB WriteProtected cell (and its RW mutation form) returns
          success while the enclosing Phase385 anonymous page remains RWX.
          Other mprotect calls retain normal kernel semantics. Any other
          misaligned PID1 mprotect is recorded as P389 OTHER and still fails.

          Phase 390 fixes the next Phase389 hardware-proven Bionic mismatch:
          __allocate_thread_mapping() creates a legacy 20 KiB PROT_NONE mapping
          and asks mprotect(base+4 KiB, 12 KiB, RW). Native 16 KiB Linux cannot
          represent that leading 4 KiB guard. For the exact PID1 bootstrap mm
          only, Phase390 expands that RW request to the first native 16 KiB
          page. The second native page remains PROT_NONE as a trailing guard.
          The protection change is real; this is not a fake-success shim.

          Phase 391 addresses an independent boot-environment contamination
          exposed only after the userspace fixes progressed far enough. The
          current boot DT contains both ramoops@B1B00000 and the old GKI
          diagnostic alias a52-ramoops-reserved@b1b00000 for the exact same
          1 MiB range. Samsung's late reserved-memory sanity check therefore
          panics at ~37 s. Phase391 ignores only that exact same-base/same-size
          alias pair. Every other reserved-memory overlap remains fatal.

          Phase 392 fixes the next hardware-proven PID1 blocker. Scudo first
          reserves a large PROT_NONE arena, then commits a fixed anonymous RW
          subrange at a 4 KiB-aligned address. On native 16 KiB Linux that
          MAP_FIXED address is rejected with EINVAL. Phase392 only adapts such
          a request when its entire native-rounded range is already contained
          in one anonymous PROT_NONE VMA belonging to the exact PID1 /init mm.
          It maps the native-rounded range but returns Scudo's original legacy
          address. Other mmap calls retain normal kernel semantics.

          Phase 393 fixes the next hardware-proven blocker: Android first-stage
          init reaches /system, but legacy EROFS rejects the 4 KiB on-disk
          filesystem because it hard-wires filesystem block size to PAGE_SIZE.
          Phase393 keeps EROFS logical blocks at 4 KiB while Linux page-cache
          pages stay native 16 KiB. Metadata/compressed blocks use native-page
          containers with 4 KiB BIOs; raw pages aggregate multiple filesystem
          blocks; compressed pcluster/workgroup geometry uses 4 KiB units;
          sub-page compressed in-place I/O is disabled; and LZ4/shifted input
          paths are adapted to the sub-page layout.

          Phase 379 exec/ELF census diagnostics and the ~12 second snapshot are
          retained. UN1CA/userspace remains untouched. Keep the known-good P152
          package available for rollback.
          EOF

