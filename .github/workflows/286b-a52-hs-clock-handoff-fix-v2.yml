name: 286B - A52 HS clock handoff fix CI audit repair
run-name: Phase 286B - corrected HS clock handoff build audit
on:
  workflow_dispatch:
  push:
    branches:
      - agent/a52-phase286b-hs-clock-handoff-fix-v2
    paths:
      - .github/workflows/286b-a52-hs-clock-handoff-fix-v2.yml
      - scripts/286b_ci_build.sh
      - scripts/286_ci_build.sh
      - scripts/286_apply_hs_clock_handoff_fix.py
permissions:
  contents: read
  actions: read
  statuses: write
concurrency:
  group: a52-phase286b-hs-clock-handoff-${{ github.ref }}
  cancel-in-progress: true
env:
  GKI_COMMON_SHA: f960ed27302b1ff8e61e152fc202554d778deccd
  TOUCHGRASS_COMMIT: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
  TOUCHGRASS_REPO: https://github.com/micr0softstore/samsung_android_kernel_a52xq.git
  PHASE227_SEED_ARTIFACT_ID: '9160764832'
jobs:
  build:
    name: Rebuild Phase286 with corrected post-build audit
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Phase286B branch
        uses: actions/checkout@v4
      - name: Publish Phase286B run beacon
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > /tmp/p286b-status.json
          import json, os
          print(json.dumps({
              'state': 'pending',
              'context': 'phase286b-build',
              'description': 'Phase286B corrected build running',
              'target_url': os.environ['RUN_URL'],
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/p286b-status.json
      - name: Prepare runner
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates unzip make gcc g++ python3 bc bison flex clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libelf-dev rsync cpio gzip lz4 file dwarves
      - name: Restore pinned GKI source
        uses: actions/cache/restore@v4
        with:
          path: gki
          key: android12-5.10-gki-source-v1-${{ runner.os }}-android12-5.10-2026-04_r1-${{ env.GKI_COMMON_SHA }}
          fail-on-cache-miss: true
      - name: Restore exact TouchGrass source
        id: touchgrass-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/touchgrass-a52xq
          key: a52xq-touchgrass-linux-4.19.200-main-v2-${{ runner.os }}-${{ env.TOUCHGRASS_COMMIT }}
      - name: Clone exact TouchGrass source on cache miss
        if: steps.touchgrass-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf workspace/touchgrass-a52xq
          mkdir -p workspace/touchgrass-a52xq
          git -C workspace/touchgrass-a52xq init
          git -C workspace/touchgrass-a52xq remote add origin "$TOUCHGRASS_REPO"
          git -C workspace/touchgrass-a52xq fetch --depth=1 origin "$TOUCHGRASS_COMMIT"
          git -C workspace/touchgrass-a52xq checkout --detach FETCH_HEAD
      - name: Build corrected Phase286 candidate
        run: bash scripts/286b_ci_build.sh
      - name: Upload Phase286B candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase286B-HS-CLOCK-HANDOFF-FIX-${{ github.run_number }}-NOT-HARDWARE-VALIDATED
          path: phase286-out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A52XQ-Phase286B-HS-CLOCK-HANDOFF-FAILURE-${{ github.run_number }}
          path: phase286-failure/
          if-no-files-found: warn
          retention-days: 30
      - name: Finalize Phase286B run beacon
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/p286b-final-status.json
          import json, os
          ok = os.environ.get('JOB_STATUS') == 'success'
          print(json.dumps({
              'state': 'success' if ok else 'failure',
              'context': 'phase286b-build',
              'description': 'Phase286B build passed' if ok else 'Phase286B build failed',
              'target_url': os.environ['RUN_URL'],
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/p286b-final-status.json || true
